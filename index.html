<script>
// ============================================================
// ⚠️ PENDIENTE: reemplaza estos dos valores con los de TU proyecto
// de Supabase nuevo (Project Settings > API > Project URL / anon public key).
// No uses el mismo proyecto de la cafetería.
// ============================================================
const SUPABASE_URL = "https://eovlqcognikomdiwibuo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvdmxxY29nbmlrb21kaXdpYnVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTkxMjMsImV4cCI6MjEwMzUzNTEyM30.YBj1IyMm_o6fEg_m8rOg1-4Z_lbXwYcGn-i1L4dn7_s";
// La sesión se guarda en sessionStorage (no localStorage): al cerrar la
// pestaña o el navegador, el propio navegador borra ese almacenamiento y
// la sesión queda cerrada automáticamente — hay que volver a iniciar sesión.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    storage: window.sessionStorage,
    persistSession: true,
    autoRefreshToken: true,
  },

// Módulos del sistema y qué roles pueden verlos.
// Los marcados "construido: false" muestran un placeholder por ahora.
const MENU = [
  { id: "inicio", label: "Inicio", roles: ["Administrador", "Director", "Secretaria", "Profesor"], construido: true },
  { id: "alumnos", label: "Alumnos y Grupos", roles: ["Administrador", "Director", "Secretaria"], construido: true },
  { id: "oficios", label: "Oficios y Documentos", roles: ["Administrador", "Director", "Secretaria"], construido: true },

  { id: "catedraticos", label: "Catedráticos", roles: ["Administrador", "Director"], construido: true },

  { id: "asistencia", label: "Asistencia", roles: ["Administrador", "Director", "Profesor"], construido: true },
  { id: "pagos", label: "Pagos y Colegiaturas", roles: ["Administrador", "Secretaria"], construido: false },

];

const state = {
  sesion: null,   // sesión de Supabase Auth
  perfil: null,   // fila de la tabla perfiles (nombre_completo, rol)
  seccion: "inicio",
};

const app = document.getElementById("app");

// ============================================================
// Cierre de sesión por inactividad
// ============================================================
// ⚠️ CONFIGURABLE: cambia este número para ajustar los minutos de inactividad
// permitidos antes de cerrar la sesión automáticamente.
const INACTIVIDAD_MINUTOS = 20;

let inactividadTimer = null;
let monitorInactividadIniciado = false;

function iniciarMonitorInactividad() {
  if (monitorInactividadIniciado) return;
  monitorInactividadIniciado = true;

  const eventosActividad = ["mousemove", "keydown", "click", "touchstart", "scroll"];
  eventosActividad.forEach(ev => document.addEventListener(ev, reiniciarTimerInactividad));

  // El conteo se pausa mientras la pestaña no está visible (cambiaste de app
  // o de pestaña) y se reinicia al volver — así revisar un oficio en otra
  // aplicación no cuenta como inactividad.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      reiniciarTimerInactividad();
    } else if (inactividadTimer) {
      clearTimeout(inactividadTimer);
    }
  });

  reiniciarTimerInactividad();
}

function reiniciarTimerInactividad() {
  if (document.visibilityState !== "visible") return;
  if (inactividadTimer) clearTimeout(inactividadTimer);
  inactividadTimer = setTimeout(async () => {
    await sb.auth.signOut();
    state.perfil = null;
    renderLogin(errBox(`Tu sesión se cerró automáticamente por ${INACTIVIDAD_MINUTOS} minutos de inactividad.`));
  }, INACTIVIDAD_MINUTOS * 60 * 1000);
}

function detenerMonitorInactividad() {
  if (inactividadTimer) clearTimeout(inactividadTimer);
  inactividadTimer = null;
  monitorInactividadIniciado = false;
}

function mesAnio(fechaISO) {
  if (!fechaISO) return "";
  const [a, m] = String(fechaISO).split("-").map(Number);
  const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  return `${meses[m - 1]} ${a}`;
}
function errBox(texto) {
  return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${texto}</div>`;
}
function okBox(texto) {
  return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">${texto}</div>`;
}

// Valida la estructura oficial de una CURP mexicana (18 caracteres)
function validarCurp(curp) {
  const regex = /^[A-Z][AEIOUX][A-Z]{2}\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])[HM](AS|BC|BS|CC|CS|CH|CL|CM|DF|DG|GT|GR|HG|JC|MC|MN|MS|NT|NL|OC|PL|QO|QR|SP|SL|SR|TC|TS|TL|VZ|YN|ZS|NE)[B-DF-HJ-NP-TV-Z]{3}[A-Z0-9]\d$/;
  return regex.test(curp);
}

// Valida un formato de correo electrónico razonable
function validarCorreo(correo) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);
}

// ============================================================
// Arranque: revisa si ya hay sesión activa de Supabase Auth
// ============================================================
async function init() {
  // Si la liga viene de un correo de recuperación de contraseña, Supabase la marca
  // con "type=recovery" (en el hash o en los parámetros de la URL, según el caso).
  // Hay que registrar el listener y detectarlo ANTES de revisar la sesión normal,
  // porque si no, la app entra de una vez como si fuera un login común.
  const parametrosURL = window.location.hash + window.location.search;
  const esRecuperacion = parametrosURL.includes("type=recovery");

  sb.auth.onAuthStateChange((_event, session) => {
    state.sesion = session;
    if (_event === "PASSWORD_RECOVERY") {
      renderRestablecerPassword();
      return;
    }
    if (!session) {
      state.perfil = null;
      detenerMonitorInactividad();
      renderLogin();
    }
  });

  if (esRecuperacion) {
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-5"><p class="text-sm" style="color:#6C7B8A">Cargando…</p></div>`;
    return; // esperamos a que dispare el evento PASSWORD_RECOVERY de arriba
  }

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.sesion = session;
    await cargarPerfil();
  } else {
    renderLogin();
  }
}

async function cargarPerfil() {
  const { data, error } = await sb
    .from("perfiles")
    .select("id, nombre_completo, rol, activo")
    .eq("id", state.sesion.user.id)
    .single();

  if (error || !data) {
    renderLogin(errBox("No se encontró tu perfil en el sistema. Contacta al Administrador."));
    return;
  }
  if (!data.activo) {
    await sb.auth.signOut();
    renderLogin(errBox("Tu cuenta está desactivada. Contacta al Administrador."));
    return;
  }
  state.perfil = data;
  renderApp();
}

        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Correo</label>
        <input id="olvideCorreo" type="email" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
        <div id="olvideMsg"></div>
        <button id="olvideEnviarBtn" class="w-full py-2.5 rounded-lg text-sm font-bold mb-2" style="background:#1E3A8A; color:#F4F1EB">Enviar link de recuperación</button>
        <button id="olvideVolverBtn" type="button" class="w-full py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Volver al inicio de sesión</button>
      </div>
    </div>`;

  document.getElementById("olvideVolverBtn").addEventListener("click", () => renderLogin());

  document.getElementById("olvideEnviarBtn").addEventListener("click", async () => {
    const correo = document.getElementById("olvideCorreo").value.trim();
    const msg = document.getElementById("olvideMsg");
    msg.innerHTML = "";
    if (!correo) { msg.innerHTML = errBox("Escribe tu correo."); return; }
    const { error } = await sb.auth.resetPasswordForEmail(correo, {
      redirectTo: window.location.origin + window.location.pathname,
    });
    if (error) { msg.innerHTML = errBox(error.message); return; }
    msg.innerHTML = okBox("Si ese correo está registrado, te llegará un link para restablecer tu contraseña. Revisa también spam.");
  });
}

function renderRestablecerPassword() {
  app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-5">
      <div class="w-full max-w-sm p-6 rounded-2xl bg-white border" style="border-color:#E1DED5">
        <div class="text-center mb-6">
          <div class="ib-brand text-lg font-semibold" style="color:#1E3A8A">Crear nueva contraseña</div>
        </div>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nueva contraseña</label>
        <input id="restNueva" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Confirmar contraseña</label>
        <input id="restConfirmar" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-4 outline-none border" style="border-color:#E1DED5" />
        <div id="restMsg"></div>
        <button id="restGuardarBtn" class="w-full py-2.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#F4F1EB">Guardar nueva contraseña</button>
      </div>
    </div>`;

  document.getElementById("restGuardarBtn").addEventListener("click", async () => {
    const nueva = document.getElementById("restNueva").value;
    const confirmar = document.getElementById("restConfirmar").value;
    const msg = document.getElementById("restMsg");
    msg.innerHTML = "";
    if (!nueva || nueva.length < 6) { msg.innerHTML = errBox("La contraseña debe tener al menos 6 caracteres."); return; }
    if (nueva !== confirmar) { msg.innerHTML = errBox("Las contraseñas no coinciden."); return; }

    const { error } = await sb.auth.updateUser({ password: nueva });
    if (error) { msg.innerHTML = errBox(error.message); return; }

    msg.innerHTML = okBox("Contraseña actualizada. Entrando…");
    setTimeout(async () => { await cargarPerfil(); }, 1200);
  });
}

async function iniciarSesion() {
  const correo = document.getElementById("loginCorreo").value.trim();
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMsg");
  msg.innerHTML = "";

  if (!correo || !password) { msg.innerHTML = errBox("Escribe tu correo y contraseña."); return; }

  const btn = document.getElementById("loginBtn");
  if (btn.disabled) return;
  function restaurar() {
    btn.disabled = false;
    btn.style.opacity = "1";
    btn.textContent = "Entrar";
  }
  btn.disabled = true;
  btn.style.opacity = "0.7";
  btn.textContent = "Iniciando sesión…";
  msg.innerHTML = `<div class="mb-3"><p class="text-xs mb-1" style="color:#1E3A8A">Iniciando sesión, un momento…</p><div class="ib-barra"><div></div></div></div>`;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email: correo, password });
    if (error) { msg.innerHTML = errBox("Correo o contraseña incorrectos."); restaurar(); return; }
    state.sesion = data.session;
    msg.innerHTML = `<div class="mb-3"><p class="text-xs mb-1" style="color:#1E3A8A">Cargando tu información…</p><div class="ib-barra"><div></div></div></div>`;
    await cargarPerfil();
  } catch (e) {
    msg.innerHTML = errBox("No se pudo iniciar sesión. Revisa tu conexión a internet e inténtalo de nuevo.");
    restaurar();
  }
}

async function cerrarSesion() {
  await sb.auth.signOut();
  state.perfil = null;
  detenerMonitorInactividad();
  renderLogin();
}

  renderSeccion();
}

function abrirModalCambiarPassword() {
  const modal = document.createElement("div");
  modal.className = "fixed inset-0 z-50 flex items-center justify-center p-4";
  modal.style.background = "rgba(28,43,58,0.6)";
  modal.innerHTML = `
    <div class="rounded-2xl p-5 bg-white w-full max-w-sm">
      <p class="text-sm font-semibold mb-3" style="color:#1E3A8A">Cambiar mi contraseña</p>
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nueva contraseña</label>
      <input id="cpNueva" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Confirmar contraseña</label>
      <input id="cpConfirmar" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
      <div id="cpMsg"></div>
      <div class="flex gap-2">
        <button id="cpCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Cancelar</button>
        <button id="cpGuardar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  document.getElementById("cpCancelar").addEventListener("click", () => modal.remove());

  document.getElementById("cpGuardar").addEventListener("click", async () => {
    const nueva = document.getElementById("cpNueva").value;
    const confirmar = document.getElementById("cpConfirmar").value;
    const msg = document.getElementById("cpMsg");
    msg.innerHTML = "";
    if (!nueva || nueva.length < 6) { msg.innerHTML = errBox("La contraseña debe tener al menos 6 caracteres."); return; }
    if (nueva !== confirmar) { msg.innerHTML = errBox("Las contraseñas no coinciden."); return; }

    const { error } = await sb.auth.updateUser({ password: nueva });
    if (error) { msg.innerHTML = errBox(error.message); return; }
    msg.innerHTML = okBox("Contraseña actualizada correctamente.");
    setTimeout(() => modal.remove(), 1500);
  });
}

function renderSeccion() {
  const main = document.getElementById("main");
  if (typeof detenerCamara === "function") detenerCamara();
  if (typeof limpiarTodosTimersReporte === "function") limpiarTodosTimersReporte();
  if (state.seccion === "inicio") return renderInicio(main);
  if (state.seccion === "mobiliario") return renderMobiliario(main);
  if (state.seccion === "alumnos") return renderAlumnos(main);
  if (state.seccion === "accesos") return renderAccesos(main);
  if (state.seccion === "catedraticos") return renderCatedraticos(main);
  if (state.seccion === "privacidad") return renderAvisoPrivacidad(main);
  if (state.seccion === "calificaciones") return renderCalificaciones(main);
  if (state.seccion === "asistencia") return renderAsistencia(main);
  if (state.seccion === "bitacora") return renderBitacora(main);
  if (state.seccion === "boletas") return renderBoletas(main);
  if (state.seccion === "oficios") return renderOficios(main);
  if (state.seccion === "disciplina") return renderDisciplina(main);
  if (state.seccion === "avisos") return renderAvisos(main);

  const modulo = MENU.find(m => m.id === state.seccion);
  if (modulo && !modulo.construido) return renderEnConstruccion(main, modulo.label);
}

const ESTADOS_MOBILIARIO = ["Bueno", "Regular", "Malo", "Fuera de servicio"];

function renderMobiliario(main) {
  let tabActivo = "categorias";
  let categoriaSeleccionada = null;

  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1E3A8A">Inventario / Mobiliario</h2>
    <div class="flex gap-1 mb-4">
      <button class="mobTabBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="categorias">Categorías</button>
      <button class="mobTabBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="articulos">Artículos</button>
    </div>
    <div id="mobContenido"></div>`;

  function pintarTabs() {
    document.querySelectorAll(".mobTabBtn").forEach(b => {
      const activo = b.dataset.tab === tabActivo;
      b.style.background = activo ? "#1E3A8A" : "#F4F1EB";
      b.style.color = activo ? "#fff" : "#1E3A8A";
    });
  }
  document.querySelectorAll(".mobTabBtn").forEach(b => b.addEventListener("click", () => {
    tabActivo = b.dataset.tab;
    pintarTabs();
    cargarTab();
  }));
  pintarTabs();
  cargarTab();

  function cargarTab() {
    const cont = document.getElementById("mobContenido");
    if (tabActivo === "categorias") return renderCategorias(cont);
    if (tabActivo === "articulos") return renderArticulos(cont);
  }

  // ---------- Categorías ----------
  async function renderCategorias(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const { data, error } = await sb.from("categorias_mobiliario").select("*").order("nombre");
    if (error) { cont.innerHTML = errBox(error.message); return; }
    const categorias = data || [];

    cont.innerHTML = `
      <div class="max-w-lg">
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Nueva categoría</p>
          <div class="grid grid-cols-3 gap-2">
            <input id="catNombre" placeholder="Ej. Butaca" class="col-span-2 px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="catPrefijo" placeholder="Prefijo (ej. BUT)" maxlength="5" class="px-2 py-1.5 rounded-lg text-sm outline-none border uppercase" style="border-color:#E1DED5" />
          </div>
          <p class="text-xs mt-1" style="color:#6C7B8A">El prefijo se usa para el ID de cada artículo (ej. BUT-001, BUT-002…).</p>
          <div id="catMsg" class="mt-2"></div>
          <button id="catGuardar" class="mt-2 px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Agregar categoría</button>
        </div>

        <div class="space-y-2">
          ${categorias.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Aún no hay categorías capturadas.</p>` : categorias.map(c => `
            <div class="p-3 rounded-xl bg-white border flex items-center justify-between" style="border-color:#E1DED5">
              <div>
                <p class="text-sm font-semibold" style="color:#1E3A8A">${c.nombre}</p>
                <p class="text-xs" style="color:#6C7B8A">Prefijo: ${c.prefijo} · Siguiente ID: ${c.prefijo}-${String(c.siguiente_numero).padStart(3, "0")}</p>
              </div>
            </div>`).join("")}
        </div>
      </div>`;

    document.getElementById("catPrefijo").addEventListener("input", (e) => { e.target.value = e.target.value.toUpperCase(); });

    document.getElementById("catGuardar").addEventListener("click", async () => {
      const nombre = document.getElementById("catNombre").value.trim();
      const prefijo = document.getElementById("catPrefijo").value.trim().toUpperCase();
      const msg = document.getElementById("catMsg");
      msg.innerHTML = "";
      if (!nombre || !prefijo) { msg.innerHTML = errBox("Escribe el nombre y el prefijo de la categoría."); return; }
      if (!/^[A-Z]{2,5}$/.test(prefijo)) { msg.innerHTML = errBox("El prefijo debe ser solo letras, de 2 a 5 caracteres."); return; }
      const { error } = await sb.from("categorias_mobiliario").insert({ nombre, prefijo });
      if (error) { msg.innerHTML = errBox(error.message); return; }
      renderCategorias(cont);

  // ---------- Artículos ----------
  async function renderArticulos(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando categorías…</p>`;
    const { data: categorias, error } = await sb.from("categorias_mobiliario").select("*").order("nombre");
    if (error) { cont.innerHTML = errBox(error.message); return; }
    if (!categorias || categorias.length === 0) {
      cont.innerHTML = `<p class="text-sm" style="color:#6C7B8A">Primero crea una categoría en la pestaña "Categorías".</p>`;
      return;
    }
    if (!categoriaSeleccionada) categoriaSeleccionada = categorias[0].id;

    async function pintar() {
      const categoria = categorias.find(c => c.id === categoriaSeleccionada);
      const { data: items, error: errItems } = await sb.from("mobiliario").select("*").eq("categoria_id", categoriaSeleccionada).order("id_etiqueta");
      if (errItems) { cont.innerHTML = errBox(errItems.message); return; }

      cont.innerHTML = `
        <div class="max-w-2xl">
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Categoría</label>
          <select id="artCategoriaSel" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${categorias.map(c => `<option value="${c.id}" ${c.id === categoriaSeleccionada ? "selected" : ""}>${c.nombre} (${c.prefijo})</option>`).join("")}
          </select>

          <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
            <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Agregar ${categoria.nombre.toLowerCase()}(s)</p>
            <div class="grid grid-cols-3 gap-2 mb-2">
              <input id="artCantidad" type="number" min="1" value="1" placeholder="Cantidad" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
              <input id="artUbicacion" placeholder="Ubicación (ej. Aula 3B)" class="col-span-2 px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <input id="artDescripcion" placeholder="Descripción (opcional)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
              <select id="artEstado" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                ${ESTADOS_MOBILIARIO.map(e => `<option value="${e}">${e}</option>`).join("")}
              </select>
            </div>
            <div id="artAltaMsg"></div>
            <button id="artAltaBtn" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Agregar</button>
          </div>

          <div id="artLoteResultado"></div>

          <div class="space-y-2">
            ${items.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin artículos en esta categoría todavía.</p>` : items.map(it => `
              <div class="p-3 rounded-xl bg-white border flex items-center justify-between gap-2" style="border-color:#E1DED5; ${!it.activo ? "opacity:0.5" : ""}">
                <div class="flex-1">
                  <p class="text-sm font-semibold" style="color:#1E3A8A">${it.id_etiqueta}${it.descripcion ? " — " + it.descripcion : ""}</p>
                  <p class="text-xs" style="color:#6C7B8A">${it.ubicacion || "Sin ubicación"} · Estado: ${it.estado}${!it.activo ? " · DADO DE BAJA" : ""}</p>
                </div>
                <div class="flex gap-1">
                  <button class="artImprimirBtn px-2 py-1 rounded-lg text-xs font-semibold" data-id="${it.id}" style="background:#F4F1EB; color:#1E3A8A">🖨️</button>
                  <button class="artEditarBtn px-2 py-1 rounded-lg text-xs font-semibold" data-id="${it.id}" style="background:#F4F1EB; color:#1E3A8A">Editar</button>
                  <button class="artBajaBtn px-2 py-1 rounded-lg text-xs font-semibold" data-id="${it.id}" data-activo="${it.activo}" style="background:${it.activo ? "#F5E4E1" : "#E6F0EA"}; color:${it.activo ? "#B5453A" : "#3F7A5E"}">${it.activo ? "Dar de baja" : "Reactivar"}</button>
                </div>
              </div>`).join("")}
          </div>
          <div id="mobEtiquetaWrap"></div>
        </div>`;

      document.getElementById("artCategoriaSel").addEventListener("change", (e) => {
        categoriaSeleccionada = e.target.value;
        pintar();
      });

      document.getElementById("artAltaBtn").addEventListener("click", async () => {
        const cantidad = Number(document.getElementById("artCantidad").value) || 1;
        const msg = document.getElementById("artAltaMsg");
        msg.innerHTML = "";
        if (cantidad < 1 || cantidad > 200) { msg.innerHTML = errBox("La cantidad debe ser entre 1 y 200."); return; }

        const { data: nuevos, error: errAlta } = await sb.rpc("mobiliario_alta_lote", {
          p_categoria_id: categoriaSeleccionada,
          p_cantidad: cantidad,
          p_descripcion: document.getElementById("artDescripcion").value.trim() || null,
          p_ubicacion: document.getElementById("artUbicacion").value.trim() || null,
          p_estado: document.getElementById("artEstado").value,
        });
        if (errAlta) { msg.innerHTML = errBox(errAlta.message); return; }

          <button id="imprimirLoteBtn" class="mb-3 px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:#1E3A8A">🖨️ Imprimir etiquetas de este lote</button>`;

        document.getElementById("imprimirLoteBtn").addEventListener("click", () => {
          mostrarEtiquetas(nuevos.map(n => ({ id_etiqueta: n.id_etiqueta, categoria_nombre: categoria.nombre })));

        pintar();

      cont.querySelectorAll(".artEditarBtn").forEach(b => b.addEventListener("click", () => mostrarFormularioArticulo(items.find(it => it.id === b.dataset.id))));

        const { error: errBaja } = await sb.from("mobiliario").update({ activo: !activo }).eq("id", b.dataset.id);

        pintar();
      }));

      cont.querySelectorAll(".artImprimirBtn").forEach(b => b.addEventListener("click", () => {

          <input id="editDescripcion" value="${item.descripcion || ""}" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Ubicación</label>
          <input id="editUbicacion" value="${item.ubicacion || ""}" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Estado</label>
          <select id="editEstado" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${ESTADOS_MOBILIARIO.map(e => `<option value="${e}" ${item.estado === e ? "selected" : ""}>${e}</option>`).join("")}
          </select>
          <div class="grid grid-cols-2 gap-2 mb-3">
            <div>
              <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Número de serie</label>
              <input id="editSerie" value="${item.numero_serie || ""}" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />

              <input id="editFecha" type="date" value="${item.fecha_adquisicion || ""}" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />

          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Costo</label>
          <input id="editCosto" type="number" step="0.01" value="${item.costo ?? ""}" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />

          <textarea id="editObservaciones" rows="2" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">${item.observaciones || ""}</textarea>
          <div id="editMsg"></div>
          <div class="flex gap-2">
            <button id="editCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Cancelar</button>
            <button id="editGuardar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar</button>

      document.getElementById("editCancelar").addEventListener("click", () => { wrap.innerHTML = ""; });

      document.getElementById("editGuardar").addEventListener("click", async () => {
        const msg = document.getElementById("editMsg");
        const { error: errUpd } = await sb.from("mobiliario").update({
          descripcion: document.getElementById("editDescripcion").value.trim() || null,
          ubicacion: document.getElementById("editUbicacion").value.trim() || null,
          estado: document.getElementById("editEstado").value,
          numero_serie: document.getElementById("editSerie").value.trim() || null,
          fecha_adquisicion: document.getElementById("editFecha").value || null,
          costo: document.getElementById("editCosto").value ? Number(document.getElementById("editCosto").value) : null,
          observaciones: document.getElementById("editObservaciones").value.trim() || null,
        }).eq("id", item.id);
        if (errUpd) { msg.innerHTML = errBox(errUpd.message); return; }
        wrap.innerHTML = "";
        pintar();

  function mostrarEtiquetas(lista) {
    const modal = document.createElement("div");
    modal.className = "fixed inset-0 z-50 flex items-center justify-center p-4";
    modal.style.background = "rgba(28,43,58,0.7)";
    modal.innerHTML = `
      <div class="bg-white rounded-xl p-4 max-w-lg w-full max-h-[80vh] overflow-y-auto">
        <div id="ibEtiquetasImprimibles" class="ib-imprimible grid grid-cols-2 gap-2">
          ${lista.map(it => `

              <p class="text-xs" style="color:#1E3A8A">${it.categoria_nombre}</p>

          <button id="etiquetasCerrar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Cerrar</button>
          <button id="etiquetasImprimir" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Imprimir</button>

    document.getElementById("etiquetasImprimir").addEventListener("click", () => window.print());

function renderAlumnos(main) {
  let tabActivo = "ciclos";

  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1E3A8A">Alumnos y Grupos</h2>
    <div class="flex gap-1 mb-4">
      <button class="alTabBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="ciclos">Ciclos Escolares</button>
      <button class="alTabBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="grupos">Grupos</button>
      <button class="alTabBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="alumnos">Alumnos</button>
    </div>
    <div id="alContenido"></div>`;

  function pintarTabs() {
    document.querySelectorAll(".alTabBtn").forEach(b => {
      const activo = b.dataset.tab === tabActivo;
      b.style.background = activo ? "#1E3A8A" : "#F4F1EB";
      b.style.color = activo ? "#fff" : "#1E3A8A";
    });
  }

  document.querySelectorAll(".alTabBtn").forEach(b => b.addEventListener("click", () => {
    tabActivo = b.dataset.tab;
    pintarTabs();
    cargarTab();
  }));

  pintarTabs();
  cargarTab();

  function cargarTab() {
    const cont = document.getElementById("alContenido");
    if (tabActivo === "ciclos") return renderCiclos(cont);
    if (tabActivo === "grupos") return renderGrupos(cont);
    if (tabActivo === "alumnos") return renderAlumnosTab(cont);
  }

  // ---------- Ciclos Escolares ----------
  async function renderCiclos(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const { data, error } = await sb.from("ciclos_escolares").select("*").order("fecha_inicio", { ascending: false });
    if (error) { cont.innerHTML = errBox(error.message); return; }

    const ciclos = data || [];
    const porNivel = { Secundaria: ciclos.filter(c => c.nivel === "Secundaria"), Preparatoria: ciclos.filter(c => c.nivel === "Preparatoria") };

    function listaCiclosHtml(nivel) {
      const lista = porNivel[nivel];
      return lista.length === 0
        ? `<p class="text-sm" style="color:#6C7B8A">Sin ciclos capturados.</p>`
        : lista.map(c => `
          <div class="p-3 rounded-xl bg-white border flex items-center justify-between mb-2" style="border-color:#E1DED5">
            <div>
              <p class="text-sm font-semibold" style="color:#1E3A8A">${c.nombre} ${c.activo ? '<span class="text-xs font-normal" style="color:#3F7A5E">(Activo)</span>' : ""}</p>
              <p class="text-xs" style="color:#6C7B8A">${mesAnio(c.fecha_inicio)} a ${mesAnio(c.fecha_fin)}</p>
            </div>
            ${!c.activo ? `<button class="ccActivarBtn px-2 py-1 rounded-lg text-xs font-semibold" data-id="${c.id}" data-nivel="${nivel}" style="background:#F4F1EB; color:#1E3A8A">Marcar activo</button>` : ""}
          </div>`).join("");
    }

    cont.innerHTML = `
      <div class="max-w-2xl">
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Nuevo ciclo escolar</p>
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nivel</label>
          <select id="ccNivel" class="w-full px-2 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">
            <option value="Secundaria">Secundaria (anual)</option>
            <option value="Preparatoria">Preparatoria (semestral)</option>
          </select>
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nombre del ciclo</label>
          <input id="ccNombre" placeholder="Ej. 2026-2027 o 2026-2027 Sem 1" class="w-full px-2 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
          ${[["ccIni", "Inicio del ciclo"], ["ccFin", "Fin del ciclo"]].map(([p, rot]) => { const anioBase = new Date().getFullYear(); return `
          <div class="p-2 rounded-lg mb-2" style="background:#F7F5EF">
            <p class="text-xs font-semibold mb-1" style="color:#1E3A8A">${rot}</p>
            <div class="grid grid-cols-2 gap-2">
              <select id="${p}Mes" class="w-full px-2 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5; background:#fff"><option value="">Mes</option>${["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"].map((m, i) => `<option value="${String(i + 1).padStart(2, "0")}">${m}</option>`).join("")}</select>
              <select id="${p}Anio" class="w-full px-2 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5; background:#fff"><option value="">Año</option>${[-1, 0, 1, 2, 3].map(d => `<option value="${anioBase + d}">${anioBase + d}</option>`).join("")}</select>
            </div>
          </div>`; }).join("")}
          <div id="ccMsg"></div>
          <button id="ccGuardar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Agregar</button>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Secundaria</p>
            ${listaCiclosHtml("Secundaria")}
          </div>
          <div>
            <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Preparatoria</p>
            ${listaCiclosHtml("Preparatoria")}
          </div>
        </div>
      </div>`;

    document.getElementById("ccGuardar").addEventListener("click", async () => {
      const nivel = document.getElementById("ccNivel").value;
      const nombre = document.getElementById("ccNombre").value.trim();
      const ini = [document.getElementById("ccIniAnio").value, document.getElementById("ccIniMes").value];
      const fi = [document.getElementById("ccFinAnio").value, document.getElementById("ccFinMes").value];
      const inicio = ini[0] && ini[1] ? ini.join("-") : "";
      const fin = fi[0] && fi[1] ? fi.join("-") : "";
      const msg = document.getElementById("ccMsg");
      msg.innerHTML = "";
      if (!nombre || !inicio || !fin) { msg.innerHTML = errBox("Completa el nombre y el mes y año de inicio y de fin."); return; }
      if (fin < inicio) { msg.innerHTML = errBox("El mes de fin no puede ser anterior al de inicio."); return; }
      // Se guarda el primer día del mes de inicio y el último día del mes de fin.
      const [anioFin, mesFin] = fin.split("-").map(Number);
      const ultimoDia = new Date(anioFin, mesFin, 0).getDate();
      const { error } = await sb.from("ciclos_escolares").insert({ nivel, nombre, fecha_inicio: inicio + "-01", fecha_fin: `${fin}-${String(ultimoDia).padStart(2, "0")}` });
      if (error) { msg.innerHTML = errBox(error.message); return; }
      renderCiclos(cont);
    });

    cont.querySelectorAll(".ccActivarBtn").forEach(b => b.addEventListener("click", async () => {
      // Solo se desactivan los ciclos del MISMO nivel — Secundaria y Preparatoria
      // llevan cada quien su propio ciclo activo, sin pisarse entre sí.
      await sb.from("ciclos_escolares").update({ activo: false }).eq("nivel", b.dataset.nivel);
      await sb.from("ciclos_escolares").update({ activo: true }).eq("id", b.dataset.id);
      renderCiclos(cont);
    }));
  }

  // ---------- Grupos ----------
  async function renderGrupos(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const [ciclosRes, gradosRes, profesRes] = await Promise.all([
      sb.from("ciclos_escolares").select("*").order("fecha_inicio", { ascending: false }),
      sb.from("grados").select("*").order("nivel").order("numero"),
      sb.from("perfiles").select("id, nombre_completo").or("rol.eq.Profesor,es_catedratico.eq.true").eq("activo", true).order("nombre_completo"),
    ]);
    if (ciclosRes.error) { cont.innerHTML = errBox(ciclosRes.error.message); return; }

    const todosCiclos = ciclosRes.data || [];
    const todosGrados = gradosRes.data || [];
    const profesores = profesRes.data || [];

    if (todosGrados.length === 0) {
      cont.innerHTML = `<p class="text-sm" style="color:#6C7B8A">No hay grados capturados. Corre el SQL de grados que te compartimos.</p>`;
      return;
    }

    let nivelSeleccionado = "Secundaria";
    let cicloSeleccionado = null;

    function ciclosDelNivel() { return todosCiclos.filter(c => c.nivel === nivelSeleccionado); }
    function gradosDelNivel() { return todosGrados.filter(g => g.nivel === nivelSeleccionado); }

    async function pintarGrupos() {
      const ciclos = ciclosDelNivel();
      const grados = gradosDelNivel();
      const cicloActivo = ciclos.find(c => c.activo) || ciclos[0];
      if (!cicloSeleccionado || !ciclos.find(c => c.id === cicloSeleccionado)) {
        cicloSeleccionado = cicloActivo ? cicloActivo.id : null;
      }

      if (!cicloSeleccionado) {
        cont.innerHTML = `
          <div class="max-w-lg">
            ${selectorNivelHtml()}
            <p class="text-sm mt-3" style="color:#6C7B8A">No hay ningún ciclo escolar de ${nivelSeleccionado} capturado. Créalo primero en la pestaña "Ciclos Escolares".</p>
          </div>`;
        document.getElementById("grNivelSel").addEventListener("change", (e) => { nivelSeleccionado = e.target.value; cicloSeleccionado = null; pintarGrupos(); });
        return;
      }

      const { data, error } = await sb
        .from("grupos")
        .select("id, letra, grado_id, profesor_titular_id, grados(nombre, nivel), perfiles(nombre_completo)")
        .eq("ciclo_escolar_id", cicloSeleccionado)
        .order("letra");
      if (error) { cont.innerHTML = errBox(error.message); return; }

      cont.innerHTML = `
        <div class="max-w-lg">
          ${selectorNivelHtml()}

          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Ciclo escolar (${nivelSeleccionado})</label>
          <select id="grCicloSel" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${ciclos.map(c => `<option value="${c.id}" ${c.id === cicloSeleccionado ? "selected" : ""}>${c.nombre}${c.activo ? " (Activo)" : ""}</option>`).join("")}
          </select>

          <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
            <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Nuevo grupo de ${nivelSeleccionado}</p>
            <div class="grid grid-cols-3 gap-2 mb-2">
              <select id="grGradoSel" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                ${grados.map(g => `<option value="${g.id}">${g.nombre}</option>`).join("")}
              </select>
              <input id="grLetra" placeholder="Letra (A, B…)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
              <select id="grProfesorSel" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                <option value="">Sin profesor titular</option>
                ${profesores.map(p => `<option value="${p.id}">${p.nombre_completo}</option>`).join("")}
              </select>
            </div>
            <div id="grMsg"></div>
            <button id="grGuardar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Agregar grupo</button>
          </div>

          <div class="space-y-2">
            ${(data || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin grupos capturados para este ciclo.</p>` : data.map(g => `
              <div class="p-3 rounded-xl bg-white border" style="border-color:#E1DED5">
                <p class="text-sm font-semibold" style="color:#1E3A8A">${g.grados.nombre} "${g.letra}"</p>
                <p class="text-xs" style="color:#6C7B8A">Titular: ${g.perfiles?.nombre_completo || "Sin asignar"}</p>
              </div>`).join("")}
          </div>
        </div>`;

      document.getElementById("grNivelSel").addEventListener("change", (e) => { nivelSeleccionado = e.target.value; cicloSeleccionado = null; pintarGrupos(); });

      document.getElementById("grCicloSel").addEventListener("change", (e) => {
        cicloSeleccionado = e.target.value;
        pintarGrupos();
      });

      document.getElementById("grGuardar").addEventListener("click", async () => {
        const grado_id = document.getElementById("grGradoSel").value;
        const letra = document.getElementById("grLetra").value.trim().toUpperCase();
        const profesor_titular_id = document.getElementById("grProfesorSel").value || null;
        const msg = document.getElementById("grMsg");
        msg.innerHTML = "";
        if (!letra) { msg.innerHTML = errBox("Escribe la letra del grupo."); return; }
        const { error } = await sb.from("grupos").insert({ ciclo_escolar_id: cicloSeleccionado, grado_id, letra, profesor_titular_id });
        if (error) { msg.innerHTML = errBox(error.message); return; }
        pintarGrupos();
      });
    }

    function selectorNivelHtml() {
      return `
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nivel</label>
        <select id="grNivelSel" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
          <option value="Secundaria" ${nivelSeleccionado === "Secundaria" ? "selected" : ""}>Secundaria</option>
          <option value="Preparatoria" ${nivelSeleccionado === "Preparatoria" ? "selected" : ""}>Preparatoria</option>
        </select>`;
    }

    pintarGrupos();
  }

  // ---------- Alumnos ----------
  async function renderAlumnosTab(cont) {
    cont.innerHTML = `
      <div class="max-w-2xl">
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <div class="flex gap-2">
            <input id="alBuscarInput" placeholder="Buscar por nombre o matrícula…" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <button id="alBuscarBtn" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Buscar</button>
            <button id="alNuevoBtn" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">+ Nuevo alumno</button>
          </div>
        </div>
        <div id="alFormWrap"></div>
        <div id="alListaResultados"></div>
      </div>`;

    document.getElementById("alBuscarBtn").addEventListener("click", buscarAlumnos);
    document.getElementById("alBuscarInput").addEventListener("keydown", e => { if (e.key === "Enter") buscarAlumnos(); });
    document.getElementById("alNuevoBtn").addEventListener("click", () => mostrarFormularioAlumno(null));

    buscarAlumnos();

    async function buscarAlumnos() {
      const criterio = document.getElementById("alBuscarInput").value.trim();
      const lista = document.getElementById("alListaResultados");
      lista.innerHTML = `<p class="text-xs mt-2" style="color:#6C7B8A">Buscando…</p>`;

      let query = sb.from("alumnos").select("*").order("apellido_paterno");
      if (criterio) {
        query = query.or(`nombres.ilike.%${criterio}%,apellido_paterno.ilike.%${criterio}%,apellido_materno.ilike.%${criterio}%,matricula.ilike.%${criterio}%`);
      }
      const { data, error } = await query;
      if (error) { lista.innerHTML = errBox(error.message); return; }

      lista.innerHTML = (!data || data.length === 0)
        ? `<p class="text-sm mt-3" style="color:#6C7B8A">Sin resultados.</p>`
        : `<div class="mt-3 space-y-2">${data.map((a, i) => `
            <button class="alEditarBtn w-full text-left p-3 rounded-xl bg-white border" data-idx="${i}" style="border-color:#E1DED5; ${!a.activo ? "opacity:0.5" : ""}">
              <p class="text-sm font-semibold" style="color:#1E3A8A">${a.nombres} ${a.apellido_paterno} ${a.apellido_materno || ""} <span class="text-xs font-normal" style="color:#6C7B8A">(${a.matricula})</span></p>
              <p class="text-xs" style="color:#6C7B8A">${a.curp || "Sin CURP"} · Ingreso: ${a.fecha_ingreso}${!a.activo ? " · INACTIVO" : ""}</p>
            </button>`).join("")}</div>`;

      lista.querySelectorAll(".alEditarBtn").forEach(b => b.addEventListener("click", () => mostrarFormularioAlumno(data[Number(b.dataset.idx)])));
    }

    async function mostrarFormularioAlumno(alumnoExistente) {
      const wrap = document.getElementById("alFormWrap");
      const esEdicion = !!alumnoExistente;
      wrap.innerHTML = `<p class="text-xs mt-2" style="color:#6C7B8A">Cargando…</p>`;

      let tutorExistente = null;
      let tutor2Existente = null;
      let inscripcionExistente = null;

      if (esEdicion) {
        const [tutorRes, inscRes] = await Promise.all([
          sb.from("alumno_tutores").select("tutor_id, es_contacto_principal, tutores(*)").eq("alumno_id", alumnoExistente.id).order("es_contacto_principal", { ascending: false }),
          sb.from("inscripciones").select("*, grupos(letra, grado_id, grados(nivel))").eq("alumno_id", alumnoExistente.id).order("fecha_inscripcion", { ascending: false }).limit(1).maybeSingle(),
        ]);
        const listaTut = (tutorRes.data || []).map(t => t.tutores).filter(Boolean);
        tutorExistente = listaTut[0] || null;
        tutor2Existente = listaTut[1] || null;
        inscripcionExistente = inscRes.data || null;
      }

      const nivelInicial = inscripcionExistente?.grupos?.grados?.nivel || "Secundaria";

      wrap.innerHTML = `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <div class="flex items-center justify-between mb-3">
            <p class="text-sm font-semibold" style="color:#1E3A8A">${esEdicion ? "Editar alumno: " + alumnoExistente.matricula : "Nuevo alumno"}</p>
            ${esEdicion ? `<label class="flex items-center gap-1 text-xs" style="color:#1E3A8A"><input type="checkbox" id="naActivo" ${alumnoExistente.activo ? "checked" : ""} /> Activo</label>` : ""}
          </div>

          <div class="grid grid-cols-3 gap-2 mb-3">
            <input id="naNombres" placeholder="Nombre(s)" value="${alumnoExistente?.nombres || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="naApPat" placeholder="Apellido paterno" value="${alumnoExistente?.apellido_paterno || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="naApMat" placeholder="Apellido materno" value="${alumnoExistente?.apellido_materno || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          </div>

          <div class="grid grid-cols-3 gap-2 mb-3">
            <input id="naCurp" placeholder="CURP (18 caracteres, opcional)" maxlength="18" value="${alumnoExistente?.curp || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="naFechaNac" type="date" value="${alumnoExistente?.fecha_nacimiento || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <select id="naSexo" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
              <option value="">Sexo</option>
              <option value="Femenino" ${alumnoExistente?.sexo === "Femenino" ? "selected" : ""}>Femenino</option>
              <option value="Masculino" ${alumnoExistente?.sexo === "Masculino" ? "selected" : ""}>Masculino</option>
            </select>
          </div>

          <p class="text-xs font-semibold mt-3 mb-1" style="color:#6C7B8A">Padre, madre o tutor (contacto principal) *</p>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <input id="naTutorNombre" placeholder="Nombre completo *" value="${escHtml(tutorExistente?.nombre_completo || "")}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="naTutorParentesco" placeholder="Parentesco (Madre, Padre…) *" value="${escHtml(tutorExistente?.parentesco || "")}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          </div>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <input id="naTutorTelefono" type="tel" inputmode="numeric" placeholder="Celular / WhatsApp (10 dígitos) *" value="${escHtml(tutorExistente?.telefono || "")}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="naTutorCorreo" placeholder="Correo (opcional)" value="${escHtml(tutorExistente?.correo || "")}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          </div>
          <input id="naTutorDireccion" placeholder="Domicilio (opcional)" value="${escHtml(tutorExistente?.direccion || "")}" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border mb-2" style="border-color:#E1DED5" />

          <details class="mb-3" ${tutor2Existente ? "open" : ""}>
            <summary class="text-xs font-semibold cursor-pointer" style="color:#1E3A8A">Segundo tutor (opcional)</summary>
            <div class="grid grid-cols-2 gap-2 my-2">
              <input id="naTutor2Nombre" placeholder="Nombre completo" value="${escHtml(tutor2Existente?.nombre_completo || "")}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
              <input id="naTutor2Parentesco" placeholder="Parentesco" value="${escHtml(tutor2Existente?.parentesco || "")}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input id="naTutor2Telefono" type="tel" inputmode="numeric" placeholder="Celular / WhatsApp (10 dígitos)" value="${escHtml(tutor2Existente?.telefono || "")}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
              <input id="naTutor2Correo" placeholder="Correo (opcional)" value="${escHtml(tutor2Existente?.correo || "")}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            </div>
          </details>

          <p class="text-xs font-semibold mt-3 mb-1" style="color:#6C7B8A">Inscripción</p>
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nivel</label>
          <select id="naNivelSel" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">
            <option value="Secundaria" ${nivelInicial === "Secundaria" ? "selected" : ""}>Secundaria</option>
            <option value="Preparatoria" ${nivelInicial === "Preparatoria" ? "selected" : ""}>Preparatoria</option>
          </select>
          <div id="naGrupoSelWrap" class="mb-3"><p class="text-xs" style="color:#6C7B8A">Cargando grupos…</p></div>
          ${esEdicion && inscripcionExistente ? `<p class="text-xs mb-3" style="color:#6C7B8A">Inscripción actual: ${inscripcionExistente.grupos.grados.nombre || ""} "${inscripcionExistente.grupos.letra}" — si cambias el grupo arriba, se actualizará esta inscripción.</p>` : ""}

          <div id="naMsg"></div>
          <div class="flex gap-2">
            <button id="naCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Cancelar</button>
            ${esEdicion ? `<button id="naConsentBtn" type="button" class="flex-1 py-2 rounded-lg text-xs font-semibold" style="background:#EEF2FB; color:#1E3A8A">Imprimir aviso de privacidad (escaneo facial)</button>` : ""}
            <button id="naGuardar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">${esEdicion ? "Guardar cambios" : "Guardar alumno"}</button>
          </div>
        </div>`;

      cargarGruposParaInscripcion(nivelInicial, inscripcionExistente?.grupo_id);
      document.getElementById("naNivelSel").addEventListener("change", (e) => cargarGruposParaInscripcion(e.target.value));

      // Candados de formato: nombres y CURP siempre en mayúsculas mientras se escriben
      ["naNombres", "naApPat", "naApMat", "naCurp", "naTutorNombre"].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener("input", () => {
          const cursor = el.selectionStart;
          el.value = el.value.toUpperCase();
          el.setSelectionRange(cursor, cursor);
        });
      });

      document.getElementById("naCancelar").addEventListener("click", () => { wrap.innerHTML = ""; });
      const btnConsent = document.getElementById("naConsentBtn");
      if (btnConsent) btnConsent.addEventListener("click", () => {
        if (!tutorExistente) { document.getElementById("naMsg").innerHTML = errBox("Primero captura y guarda los datos del tutor."); return; }
        const g = inscripcionExistente?.grupos;
        mostrarConsentimientoFacial(wrap, {
          alumnoNombre: nombreCompletoAlumno(alumnoExistente), matricula: alumnoExistente.matricula || "",
          grupoTxt: g ? `${g.grados?.nombre || ""} "${g.letra}" (${g.grados?.nivel || ""})` : "", nivel: g?.grados?.nivel || "",
          tutorNombre: tutorExistente.nombre_completo, tutorParentesco: tutorExistente.parentesco,
        }, () => mostrarFormularioAlumno(alumnoExistente));
      });

      document.getElementById("naGuardar").addEventListener("click", async () => {
        const msg = document.getElementById("naMsg");
        const btnG = document.getElementById("naGuardar");
        if (btnG.dataset.busy === "1") return;   // evita guardar dos veces por doble toque
        btnG.dataset.busy = "1";
        setTimeout(() => { delete btnG.dataset.busy; }, 3000);
        msg.innerHTML = "";
        const nombres = document.getElementById("naNombres").value.trim();
        const apPat = document.getElementById("naApPat").value.trim();
        if (!nombres || !apPat) { msg.innerHTML = errBox("Nombre(s) y apellido paterno son obligatorios."); return; }

        const curp = document.getElementById("naCurp").value.trim();
        if (curp && !validarCurp(curp)) {
          msg.innerHTML = errBox("El CURP no tiene un formato válido (deben ser 18 caracteres con la estructura oficial: ej. ABCD123456HDFXYZ01).");
          return;
        }

        const leerTutor = pref => ({
          nombre_completo: document.getElementById(`na${pref}Nombre`).value.trim(),
          parentesco: document.getElementById(`na${pref}Parentesco`).value.trim(),
          telefono: document.getElementById(`na${pref}Telefono`).value.replace(/\D/g, ""),
          correo: document.getElementById(`na${pref}Correo`).value.trim(),
        });
        const t1 = leerTutor("Tutor");
        t1.direccion = document.getElementById("naTutorDireccion").value.trim();
        const t2 = leerTutor("Tutor2");
        const t2Capturado = !!(t2.nombre_completo || t2.parentesco || t2.telefono || t2.correo);

        if (!t1.nombre_completo || !t1.parentesco) { msg.innerHTML = errBox("Captura el nombre y el parentesco del padre, madre o tutor."); return; }
        if (t1.telefono.length !== 10) { msg.innerHTML = errBox("El celular del tutor debe tener 10 dígitos (es el que se usa para WhatsApp)."); return; }
        if (t1.correo && !validarCorreo(t1.correo)) { msg.innerHTML = errBox("El correo del tutor no tiene un formato válido."); return; }
        if (t2Capturado) {
          if (!t2.nombre_completo) { msg.innerHTML = errBox("Captura el nombre del segundo tutor o borra sus datos."); return; }
          if (t2.telefono && t2.telefono.length !== 10) { msg.innerHTML = errBox("El celular del segundo tutor debe tener 10 dígitos."); return; }
          if (t2.correo && !validarCorreo(t2.correo)) { msg.innerHTML = errBox("El correo del segundo tutor no tiene un formato válido."); return; }
        }

        const datosAlumno = {
          nombres,
          apellido_paterno: apPat,
          apellido_materno: document.getElementById("naApMat").value.trim() || null,
          curp: document.getElementById("naCurp").value.trim() || null,
          fecha_nacimiento: document.getElementById("naFechaNac").value || null,
          sexo: document.getElementById("naSexo").value || null,
        };

        let alumnoId;
        let matriculaNueva = "";
        if (esEdicion) {
          datosAlumno.activo = document.getElementById("naActivo").checked;
          const { error: errUpd } = await sb.from("alumnos").update(datosAlumno).eq("id", alumnoExistente.id);
          if (errUpd) { msg.innerHTML = errBox(errUpd.message); return; }
          alumnoId = alumnoExistente.id;
        } else {
          const { data: alumnoData, error: alumnoError } = await sb.from("alumnos").insert(datosAlumno).select().single();
          if (alumnoError) { msg.innerHTML = errBox(alumnoError.message); return; }
          alumnoId = alumnoData.id;
          matriculaNueva = alumnoData.matricula || "";
        }

        // Guarda (o actualiza) cada tutor y lo liga al alumno. El primero queda como contacto principal.
        async function guardarTutor(datos, existente, principal) {
          const fila = {
            nombre_completo: datos.nombre_completo, parentesco: datos.parentesco || null,
            telefono: datos.telefono || null, correo: datos.correo || null, direccion: datos.direccion || null,
          };
          if (existente) {
            const { error: eU } = await sb.from("tutores").update(fila).eq("id", existente.id);
            return eU;
          }
          const { data: tNuevo, error: eT } = await sb.from("tutores").insert(fila).select().single();
          if (eT) return eT;
          const { error: eR } = await sb.from("alumno_tutores").insert({ alumno_id: alumnoId, tutor_id: tNuevo.id, es_contacto_principal: principal });
          return eR;
        }
        const errT1 = await guardarTutor(t1, tutorExistente, true);
        if (errT1) { msg.innerHTML = errBox("El alumno se guardó, pero no se pudieron guardar los datos del tutor: " + escHtml(errT1.message)); return; }
        if (t2Capturado) {
          const errT2 = await guardarTutor(t2, tutor2Existente, false);
          if (errT2) { msg.innerHTML = errBox("No se pudo guardar el segundo tutor: " + escHtml(errT2.message)); return; }
        }

        const grupoSel = document.getElementById("naGrupoSel");
        if (grupoSel && grupoSel.value) {
          const cicloId = grupoSel.dataset.ciclo;
          const { data: existeInsc } = await sb.from("inscripciones").select("id").eq("alumno_id", alumnoId).eq("ciclo_escolar_id", cicloId).maybeSingle();
          if (existeInsc) {
            await sb.from("inscripciones").update({ grupo_id: grupoSel.value }).eq("id", existeInsc.id);
          } else {
            await sb.from("inscripciones").insert({ alumno_id: alumnoId, ciclo_escolar_id: cicloId, grupo_id: grupoSel.value });
          }
        }

        if (!esEdicion) {
          const opcGrupo = grupoSel && grupoSel.value ? grupoSel.options[grupoSel.selectedIndex].text : "";
          const nivelTxt = document.getElementById("naNivelSel")?.value || "";
          buscarAlumnos();
          await mostrarConsentimientoFacial(wrap, {
            alumnoNombre: nombreCompletoAlumno({ nombres, apellido_paterno: apPat, apellido_materno: datosAlumno.apellido_materno }),
            matricula: matriculaNueva,
            grupoTxt: opcGrupo ? `${opcGrupo}${nivelTxt ? " (" + nivelTxt + ")" : ""}` : "", nivel: nivelTxt,
            tutorNombre: t1.nombre_completo, tutorParentesco: t1.parentesco,
          });
          return;
        }
        wrap.innerHTML = "";
        buscarAlumnos();
      });
    }

    async function cargarGruposParaInscripcion(nivel, grupoIdPreseleccionar) {
      const wrapSel = document.getElementById("naGrupoSelWrap");
      wrapSel.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando grupos…</p>`;
      const { data: ciclos } = await sb.from("ciclos_escolares").select("*").eq("activo", true).eq("nivel", nivel).limit(1);
      const cicloActivo = ciclos && ciclos[0];
      if (!cicloActivo) {
        wrapSel.innerHTML = `<p class="text-xs" style="color:#6C7B8A">No hay un ciclo escolar activo de ${nivel} — puedes inscribirlo después desde la pestaña Grupos.</p>`;
        return;
      }
      const { data: grupos } = await sb
        .from("grupos")
        .select("id, letra, grados(nombre)")
        .eq("ciclo_escolar_id", cicloActivo.id)
        .order("letra");

      wrapSel.innerHTML = `
        <select id="naGrupoSel" data-ciclo="${cicloActivo.id}" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
          <option value="">Sin asignar por ahora</option>
          ${(grupos || []).map(g => `<option value="${g.id}" ${g.id === grupoIdPreseleccionar ? "selected" : ""}>${g.grados.nombre} "${g.letra}"</option>`).join("")}
        </select>`;
    }
  }
}

// ============================================================
// Módulo Entradas y Salidas (reconocimiento facial)
// Alumnos y personal. El reconocimiento se hace en el navegador con
// face-api; en la base solo se guarda una representación numérica del
// rostro (128 números por muestra), nunca la fotografía.
// ============================================================

// ⚠️ CONFIGURABLE ─ ajustes del reconocimiento
const FACE_LIB_URLS = [
  "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js",
  "https://unpkg.com/@vladmandic/face-api/dist/face-api.js",
];
const FACE_MODEL_URLS = [
  "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/",
  "https://vladmandic.github.io/face-api/model/",
];
const FACE_DIST_UMBRAL = 0.5;          // más bajo = más estricto (0.45–0.55 es un rango razonable)
const FACE_FRAMES_CONFIRMACION = 3;    // cuadros seguidos con la misma persona antes de registrar
const FACE_MIN_ANCHO = 0.2;            // el rostro debe ocupar al menos este % del ancho de la imagen
const FACE_MUESTRAS_REGISTRO = 5;      // muestras que se guardan por persona
const FACE_BLOQUEO_MIN_MS = 15000;     // tiempo mínimo antes de poder registrar otra vez a la misma persona
const FACE_BLOQUEO_AUSENCIA_MS = 5000; // y debe haber salido de la imagen al menos este tiempo
const FACE_RECARGA_MS = 5 * 60 * 1000; // cada cuánto se vuelven a leer los rostros registrados

let faceListo = null;
let camStream = null;
let kioskSesion = 0;
let wakeLockRef = null;
let cachePersonalAcceso = null;

function escHtml(texto) {
  return String(texto ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function normalizarTexto(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}
function esperar(ms) { return new Promise(r => setTimeout(r, ms)); }

function detenerCamara() {
  kioskSesion++;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  if (wakeLockRef) { try { wakeLockRef.release(); } catch (e) {} wakeLockRef = null; }
}

async function mantenerPantallaEncendida() {
  try { if (navigator.wakeLock) wakeLockRef = await navigator.wakeLock.request("screen"); } catch (e) {}
}

async function iniciarCamara(videoEl) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Este navegador no permite usar la cámara (se requiere conexión segura https).");
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false,
  });
  camStream = stream;
  videoEl.srcObject = stream;
  await videoEl.play();
}

function cargarScriptExterno(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error("No se pudo cargar " + src)); };
    document.head.appendChild(s);
  });
}

// Carga la librería y los modelos solo la primera vez que se necesitan.
async function cargarReconocimientoFacial() {
  if (faceListo) return faceListo;
  faceListo = (async () => {
    if (!window.faceapi) {
      let ok = false;
      for (const url of FACE_LIB_URLS) {
        try { await cargarScriptExterno(url); if (window.faceapi) { ok = true; break; } } catch (e) {}
      }
      if (!ok) throw new Error("No se pudo cargar la librería de reconocimiento facial. Revisa la conexión a internet.");
    }
    let cargados = false;
    for (const base of FACE_MODEL_URLS) {
      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(base),
          faceapi.nets.faceLandmark68Net.loadFromUri(base),
          faceapi.nets.faceRecognitionNet.loadFromUri(base),
        ]);
        cargados = true;
        break;
      } catch (e) {}
    }
    if (!cargados) throw new Error("No se pudieron cargar los modelos de reconocimiento facial. Revisa la conexión a internet.");
  })();
  faceListo.catch(() => { faceListo = null; });
  return faceListo;
}

function opcionesDetector() {
  return new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
}

// El personal se consulta por una función de la base: así la Secretaria puede
// ver nombres sin tener acceso al resto de los datos de los perfiles.
async function cargarPersonalAcceso(forzar) {
  if (cachePersonalAcceso && !forzar) return cachePersonalAcceso;
  const { data, error } = await sb.rpc("personal_para_acceso");
  if (error) throw error;
  cachePersonalAcceso = data || [];
  return cachePersonalAcceso;
}

function nombreAlumno(a) {
  return `${a.nombres} ${a.apellido_paterno} ${a.apellido_materno || ""}`.trim();
}

// Lee los rostros registrados de alumnos y personal activos.
async function cargarRostros() {
  const [rostrosRes, personal] = await Promise.all([
    sb.from("rostros").select("id, tipo_persona, alumno_id, perfil_id, descriptores, alumnos(nombres, apellido_paterno, apellido_materno, matricula, activo)"),
    cargarPersonalAcceso(true),
  ]);
  if (rostrosRes.error) throw rostrosRes.error;
  const mapaPersonal = new Map(personal.map(p => [p.id, p]));
  const personas = [];
  (rostrosRes.data || []).forEach(r => {
    const esAlumno = r.tipo_persona === "Alumno";
    const info = esAlumno ? r.alumnos : mapaPersonal.get(r.perfil_id);
    if (!info || info.activo === false) return;
    personas.push({
      clave: esAlumno ? "A:" + r.alumno_id : "P:" + r.perfil_id,
      tipo: r.tipo_persona,
      alumno_id: r.alumno_id,
      perfil_id: r.perfil_id,
      nombre: esAlumno ? nombreAlumno(info) : info.nombre_completo,
      detalle: esAlumno ? info.matricula : info.rol,
      descriptores: (r.descriptores || []).map(d => new Float32Array(d)),
    });
  });
  return personas;
}

function crearMatcher(personas) {
  const validas = personas.filter(p => p.descriptores.length > 0);
  if (validas.length === 0) return null;
  return new faceapi.FaceMatcher(
    validas.map(p => new faceapi.LabeledFaceDescriptors(p.clave, p.descriptores)),
    FACE_DIST_UMBRAL
  );
}

// Registra la siguiente marca de la persona: Entrada si no tiene una entrada hoy,
// Salida si ya entró hoy. Si su último movimiento es de un día anterior, empieza con Entrada.
async function registrarMovimiento(persona, metodo, distancia, modo) {
  const esAlumno = persona.tipo === "Alumno";
  const inicioDia = new Date();
  inicioDia.setHours(0, 0, 0, 0);

  const { data: ultimo, error: errUltimo } = await sb
    .from("registros_acceso")
    .select("tipo_evento, fecha_hora")
    .eq(esAlumno ? "alumno_id" : "perfil_id", esAlumno ? persona.alumno_id : persona.perfil_id)
    .gte("fecha_hora", inicioDia.toISOString())
    .order("fecha_hora", { ascending: false })
    .limit(1)
    .maybeSingle();
  if (errUltimo) throw errUltimo;

  // El tipo de lectura lo elige el usuario (Entrada o Salida). Si el último movimiento de hoy
  // ya es del mismo tipo, es un duplicado y NO se registra.
  const evento = modo === "Salida" ? "Salida" : "Entrada";
  if (ultimo && ultimo.tipo_evento === evento) {
    return { evento, duplicado: true, hora: ultimo.fecha_hora, sinEntrada: false };
  }
  const sinEntrada = evento === "Salida" && !ultimo;

  const { error } = await sb.from("registros_acceso").insert({
    tipo_persona: persona.tipo,
    alumno_id: esAlumno ? persona.alumno_id : null,
    perfil_id: esAlumno ? null : persona.perfil_id,
    tipo_evento: evento,
    registrado_por: state.perfil.id,
    metodo,
    distancia: distancia != null ? Number(distancia.toFixed(3)) : null,
  });
  if (error) throw error;
  return { evento, duplicado: false, hora: new Date().toISOString(), sinEntrada };
}
