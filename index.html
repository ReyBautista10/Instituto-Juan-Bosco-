    if (!lista.length) { caja.innerHTML = errBox("Este alumno no tiene inscripción a ningún ciclo."); return; }
    const insc = lista.find(i => i.ciclo_escolar_id === cicloIdElegido) || lista[0];
    const ciclo = insc.ciclos_escolares;
    // Aplica los recargos que correspondan (cargos vencidos sin pagar) antes de mostrar el estado de cuenta.
    try { const rr = await sb.rpc("aplicar_recargos", { p_alumno: alumno.id }); if (rr && rr.error) await sb.rpc("aplicar_recargos"); } catch (e) { /* si la función aún no está actualizada, se ignora */ }

    const [cargosRes, planRes, exs, tarifas, membrete, tutRes] = await Promise.all([
      sb.from("cargos_saldo").select("*").eq("alumno_id", alumno.id).eq("ciclo_escolar_id", ciclo.id).eq("cancelado", false).order("orden").order("fecha_vencimiento"),
      sb.from("planes_pago").select("modalidad").eq("alumno_id", alumno.id).eq("ciclo_escolar_id", ciclo.id).maybeSingle(),
      exencionesDeAlumno(alumno.id), tarifasDeCiclo(ciclo.id), cargarMembrete(ciclo.nivel),
      sb.from("alumno_tutores").select("es_contacto_principal, tutores(nombre_completo, parentesco)").eq("alumno_id", alumno.id).order("es_contacto_principal", { ascending: false }).limit(1),
    ]);
    tutorRecibo = tutRes.data?.[0]?.tutores || null;
    if (cargosRes.error) { caja.innerHTML = errBox(escHtml(cargosRes.error.message)); return; }
    const cargos = cargosRes.data || [];
    const modalidad = planRes.data?.modalidad || "Mensual";
    const hoy = fechaLocalISO(new Date());
    const grupoTxt = insc.grupos ? `${insc.grupos.grados?.nombre || ""} "${insc.grupos.letra}"` : "";
    const exAplica = exs.filter(e => !e.ciclo_escolar_id || e.ciclo_escolar_id === ciclo.id);
    const totalSaldo = cargos.reduce((t, c) => t + Number(c.saldo), 0);

    const estado = c => {
      if (Number(c.monto) === 0) return ["Exento", "#3F7A5E"];
      if (Number(c.saldo) <= 0.004) return [Number(c.condonado) > 0 ? "Condonado" : (c.recargo_condonado ? "Pagado (recargo condonado)" : "Pagado"), "#3F7A5E"];
      if (c.fecha_vencimiento < hoy) return [Number(c.pagado) > 0 ? "Parcial vencido" : "Vencido", "#B5453A"];
      return [Number(c.pagado) > 0 ? "Parcial" : "Pendiente", "#B7791F"];
    };

    caja.innerHTML = `
      <div id="coEdoImprimible" class="ib-imprimible p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5; color:#1C2B3A">
        <div class="flex justify-between flex-wrap gap-2 mb-2">
          <div>
            <p class="text-base font-bold" style="color:#1E3A8A">${escHtml(nombreCompletoAlumno(alumno))}</p>
            <p class="text-xs" style="color:#6C7B8A">${escHtml(alumno.matricula || "")} · ${escHtml(grupoTxt)} · ${escHtml(membrete.nombre)}</p>
          </div>
          <div class="no-print">
            ${lista.length > 1 ? `<select id="coCicloSel" class="px-2 py-1 rounded-lg text-xs border" style="border-color:#E1DED5">${lista.map(i => `<option value="${i.ciclo_escolar_id}" ${i.ciclo_escolar_id === ciclo.id ? "selected" : ""}>${escHtml(nombreCiclo(i.ciclos_escolares))}</option>`).join("")}</select>` : `<p class="text-xs" style="color:#6C7B8A">Ciclo: ${escHtml(nombreCiclo(ciclo))}</p>`}
          </div>
        </div>
        ${exAplica.length ? `<div class="p-2 rounded-lg text-xs mb-2" style="background:#E6F0EA; color:#2F5E48">Exención vigente: ${exAplica.map(e => `${Number(e.porcentaje)}% en ${escHtml(e.concepto || "todos los cobros")} — ${escHtml(e.motivo)}`).join("; ")}</div>` : ""}
        ${cargos.length === 0 ? `
          <div class="no-print">
            <p class="text-sm mb-2" style="color:#6C7B8A">Aún no hay cargos para este ciclo.</p>
            <div class="flex gap-2 items-center flex-wrap">
              <label class="text-xs" style="color:#6C7B8A">Modalidad de pago de colegiatura</label>
              <select id="coModalidad" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5">
                ${["Mensual", "Bimestral", "Ciclo completo"].map(m => `<option ${m === modalidad ? "selected" : ""}>${m}</option>`).join("")}
              </select>
              <button id="coGenerar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Generar cargos</button>
            </div>
            ${Object.keys(tarifas).length === 0 ? `<p class="text-xs mt-2" style="color:#B5453A">Este ciclo no tiene tarifas. Captúralas en la pestaña Tarifas.</p>` : ""}
            <div id="coGenMsg" class="mt-2"></div>
          </div>` : `
          <p class="text-xs mb-2" style="color:#6C7B8A">Modalidad: <strong>${escHtml(modalidad)}</strong></p>
          <div style="overflow-x:auto"><table class="w-full text-xs" style="border-collapse:collapse">
            <thead><tr style="background:#F4F1EB; text-align:left"><th class="p-1.5">Concepto</th><th class="p-1.5">Vence</th><th class="p-1.5 text-right">Monto</th><th class="p-1.5 text-right">Pagado</th><th class="p-1.5 text-right">Saldo</th><th class="p-1.5">Estado</th><th class="p-1.5 no-print"></th></tr></thead>
            <tbody>
            ${cargos.map(c => { const [e, col] = estado(c); return `<tr style="border-top:1px solid #E1DED5">
              <td class="p-1.5">${escHtml(c.descripcion)}</td>
              <td class="p-1.5">${fechaLarga(c.fecha_vencimiento + "T12:00:00")}</td>
              <td class="p-1.5 text-right">${Number(c.descuento) > 0 ? `<span style="text-decoration:line-through; color:#6C7B8A">${mxn(c.monto_original)}</span><br>` : ""}${mxn(c.monto)}${Number(c.recargo) > 0 ? `<br><span style="color:#B5453A">+ recargo por morosidad ${mxn(c.recargo)}</span>` : ""}${c.recargo_condonado ? `<br><span style="color:#3F7A5E">recargo condonado</span>` : ""}${Number(c.condonado) > 0 ? `<br><span style="color:#3F7A5E">condonado ${mxn(c.condonado)}</span>` : ""}</td>
              <td class="p-1.5 text-right">${mxn(c.pagado)}</td>
              <td class="p-1.5 text-right font-semibold">${mxn(c.saldo)}</td>
              <td class="p-1.5" style="color:${col}; font-weight:600">${e}</td>
              <td class="p-1.5 no-print" style="white-space:nowrap">${Number(c.saldo) > 0.004 ? `<button class="coPagar px-2 py-1 rounded-lg text-xs font-bold" data-id="${c.id}" style="background:#3F7A5E; color:#fff">Cobrar</button>${puedeCondonar && !c.recargo_condonado && !(Number(c.condonado) > 0) ? ` <button class="coCondonar px-2 py-1 rounded-lg text-xs font-bold" data-id="${c.id}" style="background:#FBEAE8; color:#B5453A">Condonar</button>` : ""}` : ""}</td>
            </tr>`; }).join("")}
            </tbody>
          </table></div>
          <p class="text-sm font-bold text-right mt-2" style="color:#1E3A8A">Saldo pendiente total: ${mxn(totalSaldo)}</p>`}
      </div>
      <div id="coAcciones" class="flex gap-2 flex-wrap mb-3">
        ${cargos.length ? `<button id="coImprimirEdo" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:#1E3A8A">Imprimir estado de cuenta</button>` : ""}
        <button id="coAddCargo" class="px-3 py-1.5 rounded-lg text-xs font-bold" style="background:#1E3A8A; color:#fff">+ Agregar concepto (uniformes, libros, otros…)</button>
        ${cargos.length && exAplica.length ? `<button id="coReexentar" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:#1E3A8A">Aplicar exenciones a cargos sin pagos</button>` : ""}
      </div>
      <div id="coForm"></div>
      <div id="coPagosHist"></div>
      <div id="coRecibo"></div>`;

    const recargar = () => cargarCuenta(alumno, ciclo.id);
    const sel = $("coCicloSel");
    if (sel) sel.addEventListener("change", () => cargarCuenta(alumno, sel.value));

    const gen = $("coGenerar");
    if (gen) gen.addEventListener("click", async () => {
      const mod = $("coModalidad").value;
      if (Object.keys(tarifas).length === 0) { $("coGenMsg").innerHTML = errBox("Primero captura las tarifas del ciclo."); return; }
      gen.disabled = true;
      const filas = colConstruirCargos(alumno.id, ciclo, mod, tarifas, exs);
      if (!filas.length) { gen.disabled = false; $("coGenMsg").innerHTML = errBox("Ninguna tarifa aplica para esta modalidad."); return; }
      const { error: e1 } = await sb.from("planes_pago").upsert({ alumno_id: alumno.id, ciclo_escolar_id: ciclo.id, modalidad: mod }, { onConflict: "alumno_id,ciclo_escolar_id" });
      if (e1) { gen.disabled = false; $("coGenMsg").innerHTML = errBox(escHtml(e1.message)); return; }
      const { error: e2 } = await sb.from("cargos").insert(filas);
      if (e2) { gen.disabled = false; $("coGenMsg").innerHTML = errBox(escHtml(e2.message)); return; }
      recargar();
    });

    caja.querySelectorAll(".coCondonar").forEach(b => b.addEventListener("click", () => {
      const c = cargos.find(x => x.id === b.dataset.id);
      const hayRecargo = Number(c.recargo) > 0;
      $("coForm").innerHTML = `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Condonar: ${escHtml(c.descripcion)}</p>
          <label class="flex items-start gap-2 text-sm mb-1" style="${hayRecargo ? "" : "opacity:.5"}"><input type="radio" name="cdAlc" value="recargo" ${hayRecargo ? "checked" : "disabled"} class="mt-1" /> <span>Solo el <strong>recargo por atraso</strong> (${mxn(c.recargo)})${hayRecargo ? ` — el concepto sigue activo con saldo de <strong>${mxn(Math.max(0, Number(c.saldo) - Number(c.recargo)))}</strong>, ya sin recargo` : " — este cargo no tiene recargo"}</span></label>
          <label class="flex items-start gap-2 text-sm mb-2"><input type="radio" name="cdAlc" value="total" ${hayRecargo ? "" : "checked"} class="mt-1" /> <span>Todo el saldo de este concepto (<strong>${mxn(c.saldo)}</strong>)</span></label>
          <input id="cdMotivo" placeholder="Motivo (obligatorio)" class="w-full px-3 py-2 rounded-lg text-sm border outline-none mb-2" style="border-color:#E1DED5" />
          <div id="cdMsg"></div>
          <div class="flex gap-2">
            <button id="cdCancelar" class="px-3 py-1.5 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Cancelar</button>
            <button id="cdOk" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#B5453A; color:#fff">Confirmar condonación</button>
          </div>
        </div>`;
      $("coForm").scrollIntoView({ behavior: "smooth" });
      $("cdCancelar").addEventListener("click", () => { $("coForm").innerHTML = ""; });
      $("cdOk").addEventListener("click", async () => {
        const motivo = $("cdMotivo").value.trim();
        if (!motivo) { $("cdMsg").innerHTML = errBox("Escribe el motivo de la condonación."); return; }
        const alc = document.querySelector('input[name="cdAlc"]:checked').value;
        if (!confirm(alc === "total" ? `¿Condonar TODO el saldo (${mxn(c.saldo)}) de "${c.descripcion}"?` : `¿Condonar solo el recargo (${mxn(c.recargo)}) de "${c.descripcion}"? El concepto seguirá con saldo de ${mxn(Math.max(0, Number(c.saldo) - Number(c.recargo)))}.`)) return;
        $("cdOk").disabled = true;
        const { error: e } = await sb.rpc("condonar_cargo", { p_cargo: c.id, p_alcance: alc, p_motivo: motivo });
        if (e) { $("cdOk").disabled = false; $("cdMsg").innerHTML = errBox(escHtml(e.message)); return; }
        recargar();
      });
    }));

    const imp = $("coImprimirEdo");
    if (imp) imp.addEventListener("click", () => imprimirSolo("coEdoImprimible"));

    const reex = $("coReexentar");
    if (reex) reex.addEventListener("click", async () => {
      reex.disabled = true;
      const r = await colAplicarExenciones(alumno.id, ciclo.id);
      if (r.error) { $("coForm").innerHTML = errBox(escHtml(r.error)); reex.disabled = false; return; }
      recargar();
    });

    $("coAddCargo").addEventListener("click", async () => {
      $("coForm").innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando conceptos…</p>`;
      let catalogo = [];
      try { const r = await sb.from("conceptos_pago").select("id, nombre, precio").eq("activo", true).order("nombre"); catalogo = r.data || []; } catch (e) { /* catálogo aún no creado */ }
      $("coForm").innerHTML = `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-1" style="color:#1E3A8A">Agregar concepto de pago</p>
          <p class="text-xs mb-2" style="color:#6C7B8A">Elige un concepto del catálogo (se administra en la pestaña Tarifas) o escribe uno distinto. No genera recargo por atraso.</p>
          <div class="grid grid-cols-3 gap-2 mb-2">
            <select id="cgConcepto" class="col-span-3 px-3 py-2 rounded-lg text-sm border" style="border-color:#E1DED5">
              ${catalogo.map(c => `<option value="${c.id}">${escHtml(c.nombre)}${Number(c.precio) > 0 ? " — " + mxn(c.precio) : ""}</option>`).join("")}
              <option value="">Otro (escribir descripción)</option>
            </select>
            <input id="cgDesc" placeholder="Descripción del concepto" class="col-span-3 px-3 py-2 rounded-lg text-sm border outline-none" style="border-color:#E1DED5; ${catalogo.length ? "display:none" : ""}" />
            <div><label class="block text-xs" style="color:#6C7B8A">Cantidad</label><input id="cgCant" type="number" min="1" step="1" value="1" class="w-full px-3 py-2 rounded-lg text-sm border outline-none" style="border-color:#E1DED5" /></div>
            <div><label class="block text-xs" style="color:#6C7B8A">Monto total</label><input id="cgMonto" type="number" min="0" step="0.01" placeholder="Monto" class="w-full px-3 py-2 rounded-lg text-sm border outline-none" style="border-color:#E1DED5" /></div>
            <div><label class="block text-xs" style="color:#6C7B8A">Vence</label><input id="cgVenc" type="date" value="${hoy}" class="w-full px-3 py-2 rounded-lg text-sm border outline-none" style="border-color:#E1DED5" /></div>
            <input id="cgNota" placeholder="Nota (talla, título del libro…)" class="col-span-3 px-3 py-2 rounded-lg text-sm border outline-none" style="border-color:#E1DED5" />
          </div>
          <div id="cgMsg"></div>
          <button id="cgOk" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar cargo</button>
        </div>`;
      const sel = $("cgConcepto");
      const actualizar = () => {
        const c = catalogo.find(x => x.id === sel.value);
        $("cgDesc").style.display = c ? "none" : "";
        if (c && Number(c.precio) > 0) $("cgMonto").value = (Number(c.precio) * (Number($("cgCant").value) || 1)).toFixed(2);
      };
      sel.addEventListener("change", actualizar); $("cgCant").addEventListener("input", actualizar); actualizar();
      $("coForm").scrollIntoView({ behavior: "smooth" });
      $("cgOk").addEventListener("click", async () => {
        const c = catalogo.find(x => x.id === sel.value);
        const cant = Math.max(1, Math.floor(Number($("cgCant").value) || 1));
        const base = c ? c.nombre : $("cgDesc").value.trim();
        const nota = $("cgNota").value.trim();
        const desc = `${base}${cant > 1 ? " (x" + cant + ")" : ""}${nota ? " — " + nota : ""}`;
        const monto = Number($("cgMonto").value), venc = $("cgVenc").value;
        if (!base || !(monto > 0) || !venc) { $("cgMsg").innerHTML = errBox("Captura el concepto, el monto y la fecha."); return; }
        $("cgOk").disabled = true;
        const { error: e } = await sb.from("cargos").insert({ alumno_id: alumno.id, ciclo_escolar_id: ciclo.id, concepto: "Otro", descripcion: desc, orden: 90, fecha_vencimiento: venc, monto_original: monto, descuento: 0, monto });
        if (e) { $("cgOk").disabled = false; $("cgMsg").innerHTML = errBox(escHtml(e.message)); return; }
        recargar();
      });
    });

    caja.querySelectorAll(".coPagar").forEach(b => b.addEventListener("click", () => {
      const c = cargos.find(x => x.id === b.dataset.id);
      $("coForm").innerHTML = `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-1" style="color:#1E3A8A">Cobrar: ${escHtml(c.descripcion)}</p>
          <p class="text-xs mb-2" style="color:#6C7B8A">Saldo: ${mxn(c.saldo)}. Puedes registrar un abono menor.</p>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <input id="pgMonto" type="number" min="0.01" step="0.01" value="${Number(c.saldo).toFixed(2)}" class="px-3 py-2 rounded-lg text-sm border outline-none" style="border-color:#E1DED5" />
            <select id="pgForma" class="px-3 py-2 rounded-lg text-sm border" style="border-color:#E1DED5">${COL_FORMAS.map(f => `<option>${f}</option>`).join("")}</select>
            <input id="pgRef" placeholder="Referencia / folio de transferencia (opcional)" class="col-span-2 px-3 py-2 rounded-lg text-sm border outline-none" style="border-color:#E1DED5" />
          </div>
          <div id="pgMsg"></div>
          <button id="pgOk" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#3F7A5E; color:#fff">Registrar pago</button>
        </div>`;
      $("coForm").scrollIntoView({ behavior: "smooth" });
      $("pgOk").addEventListener("click", async () => {
        const monto = Math.round(Number($("pgMonto").value) * 100) / 100;
        if (!(monto > 0)) { $("pgMsg").innerHTML = errBox("Captura un monto válido."); return; }
        if (monto > Number(c.saldo) + 0.004) { $("pgMsg").innerHTML = errBox("El monto excede el saldo del cargo."); return; }
        $("pgOk").disabled = true;
        const { data: pago, error: e } = await sb.from("pagos").insert({
          cargo_id: c.id, alumno_id: alumno.id, monto, fecha: hoy, forma_pago: $("pgForma").value,
          referencia: $("pgRef").value.trim() || null, registrado_por: state.perfil.id,
        }).select().single();
        if (e) { $("pgOk").disabled = false; $("pgMsg").innerHTML = errBox(escHtml(e.message)); return; }
        await cargarCuenta(alumno, ciclo.id);
        mostrarRecibo(pago, c, alumno, membrete, ciclo, Number(c.saldo) - monto);
      });
    }));

    // Historial de pagos
    const cargoIds = cargos.map(c => c.id);
    if (cargoIds.length) {
      const { data: pagos } = await sb.from("pagos").select("*").in("cargo_id", cargoIds).order("folio", { ascending: false });
      const porCargo = new Map(cargos.map(c => [c.id, c]));
      $("coPagosHist").innerHTML = (pagos || []).length ? `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Pagos registrados</p>
          ${pagos.map(p => `<div class="flex items-center justify-between gap-2 text-xs py-1.5" style="border-top:1px solid #F0EDE6; ${p.cancelado ? "opacity:.55; text-decoration:line-through" : ""}">
            <span>REC-${String(p.folio).padStart(5, "0")} · ${fechaLarga(p.fecha + "T12:00:00")} · ${escHtml(porCargo.get(p.cargo_id)?.descripcion || "")} · ${escHtml(p.forma_pago)}${p.cancelado ? " · CANCELADO" : ""}</span>
            <span class="flex gap-1 items-center"><strong>${mxn(p.monto)}</strong>
              ${p.cancelado ? "" : `<button class="coRec px-2 py-1 rounded-lg text-xs" data-id="${p.id}" style="background:#F4F1EB; color:#1E3A8A">Recibo</button>${esAdmin ? `<button class="coCanc px-2 py-1 rounded-lg text-xs" data-id="${p.id}" style="background:#FBEAE8; color:#B5453A">Cancelar</button>` : ""}`}
            </span></div>`).join("")}
        </div>` : "";
      $("coPagosHist").querySelectorAll(".coRec").forEach(b => b.addEventListener("click", () => {
        const p = pagos.find(x => x.id === b.dataset.id);
        const c = porCargo.get(p.cargo_id);
        mostrarRecibo(p, c, alumno, membrete, ciclo, Number(c.saldo));
      }));
      $("coPagosHist").querySelectorAll(".coCanc").forEach(b => b.addEventListener("click", async () => {
        const motivo = prompt("Motivo de la cancelación del pago (obligatorio):");
        if (!motivo || !motivo.trim()) return;
        const { error: e } = await sb.from("pagos").update({ cancelado: true, motivo_cancelacion: motivo.trim(), cancelado_por: state.perfil.id }).eq("id", b.dataset.id);
        if (e) { $("coForm").innerHTML = errBox(escHtml(e.message)); return; }
        recargar();
      }));
    }
  }

  function mostrarRecibo(pago, cargo, alumno, membrete, ciclo, saldoRestante) {
    const caja = $("coRecibo");
    if (!caja) return;
    caja.innerHTML = `
      <div id="coReciboImp" class="ib-imprimible p-5 rounded-xl bg-white border mb-2" style="border-color:#E1DED5; color:#1C2B3A; max-width:640px">
        ${membreteHtml(membrete)}
        <div class="flex justify-between items-baseline mb-3">
          <h3 class="text-sm font-bold" style="color:#1E3A8A">RECIBO DE PAGO</h3>
          <span class="text-sm font-bold">REC-${String(pago.folio).padStart(5, "0")}</span>
        </div>

  async function colAplicarExenciones(alumnoId, cicloId) {
    const exs = await exencionesDeAlumno(alumnoId);
    const { data: cargos, error } = await sb.from("cargos_saldo").select("*").eq("alumno_id", alumnoId).eq("ciclo_escolar_id", cicloId).eq("cancelado", false);
    if (error) return { error: error.message };
    for (const c of cargos || []) {
      if (Number(c.pagado) > 0 || c.concepto === "Otro") continue;
      const pct = colPorcentaje(exs, c.concepto, cicloId);
      const desc = Math.round(Number(c.monto_original) * pct) / 100;
      const monto = Math.round((Number(c.monto_original) - desc) * 100) / 100;
      if (desc === Number(c.descuento) && monto === Number(c.monto)) continue;
      const { error: e } = await sb.from("cargos").update({ descuento: desc, monto }).eq("id", c.id);
      if (e) return { error: e.message };
    }
    return {};
  }

        const [inscs, existentes, planes, exAll] = await Promise.all([
          colTraerTodo(() => sb.from("inscripciones").select("id, alumno_id").eq("ciclo_escolar_id", ciclo.id).eq("estado", "Inscrito").order("id")),

          colTraerTodo(() => sb.from("planes_pago").select("id, alumno_id, modalidad").eq("ciclo_escolar_id", ciclo.id).order("id")),
          colTraerTodo(() => sb.from("exenciones").select("*").eq("activo", true).order("id")),
        ]);
        const conCargos = new Set(existentes.map(c => c.alumno_id));
        const planDe = new Map(planes.map(p => [p.alumno_id, p.modalidad]));
        const pendientes = [...new Set(inscs.map(i => i.alumno_id))].filter(id => !conCargos.has(id));
        const filas = [], nuevosPlanes = [];

          const mod = planDe.get(id) || modDef;
          if (!planDe.has(id)) nuevosPlanes.push({ alumno_id: id, ciclo_escolar_id: ciclo.id, modalidad: mod });
          filas.push(...colConstruirCargos(id, ciclo, mod, tarifas, exAll.filter(e => e.alumno_id === id)));
        });
        for (let i = 0; i < nuevosPlanes.length; i += 500) {
          const { error } = await sb.from("planes_pago").upsert(nuevosPlanes.slice(i, i + 500), { onConflict: "alumno_id,ciclo_escolar_id" });

    });

// Módulo Calificaciones y Evaluación

// Calificación del criterio "Asistencia": 10 × asistencias ÷ clases impartidas en el rango.
// Regla: justificada = no cuenta; sin entrada a la escuela ese día = inasistencia aunque el profesor lo marque presente.
async function calcularAsistenciaClase(asignacion, alumnos, desde, hasta) {
  const ids = alumnos.map(a => a.id);
  const [clases, sesiones] = await Promise.all([
    colTraerTodo(() => sb.from("asistencia_clase").select("id, alumno_id, fecha").eq("asignacion_id", asignacion.id).gte("fecha", desde).lte("fecha", hasta).order("id")),
    colTraerTodo(() => sb.from("asistencia_sesiones").select("id, fecha").eq("asignacion_id", asignacion.id).gte("fecha", desde).lte("fecha", hasta).order("id")).catch(() => []),
  ]);
  const fechas = new Set([...clases.map(c => c.fecha), ...sesiones.map(s => s.fecha)]);
  const presentes = new Set(clases.map(c => c.alumno_id + "|" + c.fecha));
  const puerta = new Map(); // alumno|fecha -> { entro, justificada }
  const entroAlguien = new Set();
  for (let i = 0; i < ids.length; i += 100) {
    const rows = await colTraerTodo(() => sb.rpc("asistencia_dia_alumnos", { p_alumnos: ids.slice(i, i + 100), p_desde: desde, p_hasta: hasta }));
    rows.forEach(r => { puerta.set(r.alumno_id + "|" + r.fecha, r); if (r.entro) entroAlguien.add(r.fecha); });
  }
  const filas = alumnos.map(a => {
    let asist = 0, faltas = 0, just = 0;
    fechas.forEach(f => {
      if (a._desde && f < a._desde) return;   // aún no estaba dado de alta ese día
      const p = puerta.get(a.id + "|" + f);
      const marcado = presentes.has(a.id + "|" + f);
      // Sin registro de entrada en la escuela ese día = inasistencia (aunque el profesor lo haya marcado presente),
      // salvo que Dirección/Administración la haya justificado. Con entrada: cuenta si el profesor lo marcó presente.
      if (p?.entro) { marcado ? asist++ : faltas++; }
      else { if (p?.justificada) just++; else faltas++; }
    });
    const base = asist + faltas;
    return { alumno_id: a.id, nombre: `${a.apellido_paterno} ${a.apellido_materno || ""} ${a.nombres}`.replace(/\s+/g, " ").trim(), asistencias: asist, faltas, justificadas: just,
      calif: base > 0 ? calOficial(10 * asist / base) : null };
  }).sort((x, y) => x.nombre.localeCompare(y.nombre, "es"));
  return { sesiones: fechas.size, filas };
}

// Normatividad: no se asientan calificaciones menores a 5 ni con decimales.
// Calificación calculada automáticamente: 0 a 5.99 => 5; desde 6, decimal < .6 baja y decimal >= .6 sube.
function calOficial(x) {
  if (x == null || isNaN(Number(x))) return null;
  const v = Math.round(Number(x) * 100) / 100;
  if (v < 6) return 5;
  const base = Math.floor(v), dec = Math.round((v - base) * 100) / 100;
  return Math.min(10, dec >= 0.6 ? base + 1 : base);
}

  async function cargarAsignaciones() {
    // Solo las clases a nombre de la persona que tiene la sesión activa.
    const { data, error } = await sb.from("profesor_materias_grupos").select("id, profesor_id, grupo_id, ciclo_escolar_id, materias(nombre), grupos(letra, grados(nombre, nivel)), ciclos_escolares(nombre)").eq("profesor_id", state.perfil.id);
    const sel = document.getElementById("calAsigSel");
    if (error) { sel.innerHTML = `<option>Error al cargar</option>`; return; }
    // Filtramos cualquier fila con datos incompletos (ej. por permisos faltantes
    // en alguna tabla relacionada), para no tronar al construir la lista.
    const asignaciones = (data || []).filter(a => a.materias && a.grupos && a.grupos.grados && a.ciclos_escolares);
    nClases = asignaciones.length;
    if (asignaciones.length === 0) {
      if (esProfesor) sel.innerHTML = `<option value="">Sin clases asignadas</option>`;
      else document.getElementById("calSelWrap").innerHTML = "";
      return;
    }
    // Etiqueta: "Materia — Nivel". Solo si se repite se agrega grado/grupo (y ciclo) para distinguirlas.
    const base = a => `${a.materias.nombre} — ${a.grupos.grados.nivel}`;
    const cuentaBase = {}; asignaciones.forEach(a => { cuentaBase[base(a)] = (cuentaBase[base(a)] || 0) + 1; });
    const conGrupo = a => `${base(a)} · ${a.grupos.grados.nombre} "${a.grupos.letra}"`;
    const cuentaGrupo = {}; asignaciones.forEach(a => { cuentaGrupo[conGrupo(a)] = (cuentaGrupo[conGrupo(a)] || 0) + 1; });
    const etiqueta = a => cuentaBase[base(a)] === 1 ? base(a) : cuentaGrupo[conGrupo(a)] === 1 ? conGrupo(a) : `${conGrupo(a)} · ${a.ciclos_escolares.nombre}`;
    sel.innerHTML = `<option value="">Selecciona…</option>` + asignaciones.map(a => `
      <option value="${a.id}">${escHtml(etiqueta(a))}</option>
    `).join("");
    sel.addEventListener("change", () => {
      const asignacion = asignaciones.find(a => a.id === sel.value);
      if (asignacion) cargarClase(asignacion); else document.getElementById("calContenido").innerHTML = "";
    });
  }

  async function cargarClase(asignacion) {
    const cont = document.getElementById("calContenido");
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;

    // Solo quien imparte la clase captura criterios y calificaciones; los demás roles solo consultan.
    const puedeEditar = asignacion.profesor_id === state.perfil.id;

    const [criteriosRes, alumnosRes] = await Promise.all([
      sb.from("criterios_evaluacion").select("*").eq("asignacion_id", asignacion.id).order("periodo").order("orden"),
      sb.from("inscripciones").select("alumno_id, fecha_inscripcion, alumnos(id, nombres, apellido_paterno, apellido_materno, matricula, fecha_ingreso)").eq("grupo_id", asignacion.grupo_id).eq("ciclo_escolar_id", asignacion.ciclo_escolar_id).eq("estado", "Inscrito"),
    ]);

    if (criteriosRes.error) { cont.innerHTML = errBox(criteriosRes.error.message); return; }
    const [periodosRes, solRes] = await Promise.all([
      sb.from("periodos_criterios").select("periodo, estado").eq("asignacion_id", asignacion.id),
      sb.from("solicitudes_criterios").select("periodo").eq("asignacion_id", asignacion.id).eq("estado", "Pendiente"),
    ]);
    const estadosPeriodo = {};
    (periodosRes.data || []).forEach(p => { estadosPeriodo[p.periodo] = p.estado; });
    const solicitudesPend = new Set((solRes.data || []).map(r => r.periodo));
    // Solicitudes de modificación de calificaciones por alumno (clave "periodo|alumno")
    const solCalPend = new Set(), solCalAut = new Map();
    {
      const r = await sb.from("solicitudes_calificaciones").select("id, periodo, alumno_id, estado").eq("asignacion_id", asignacion.id).in("estado", ["Pendiente", "Autorizada"]);
      (r.data || []).forEach(x => { if (x.estado === "Pendiente") solCalPend.add(x.periodo + "|" + x.alumno_id); else solCalAut.set(x.periodo + "|" + x.alumno_id, x.id); });
    }
    const criterios = criteriosRes.data || [];
    const alumnos = (alumnosRes.data || []).map(i => i.alumnos ? { ...i.alumnos, _desde: fechaDesdeAlumno(i) } : null).filter(Boolean).sort((a, b) => a.apellido_paterno.localeCompare(b.apellido_paterno));

    const idsCriterios = criterios.map(c => c.id);
    const valoresCache = {};
    const guardadasBD = new Set(); // calificaciones ya guardadas: quedan bloqueadas salvo autorización del director
    if (idsCriterios.length > 0) {
      const { data: calsExistentes } = await sb.from("calificaciones").select("alumno_id, criterio_id, valor").in("criterio_id", idsCriterios);
      (calsExistentes || []).forEach(c => {
        valoresCache[c.alumno_id] = valoresCache[c.alumno_id] || {};
        valoresCache[c.alumno_id][c.criterio_id] = Number(c.valor);
        guardadasBD.add(c.alumno_id + "|" + c.criterio_id);
      });
    }

    function estaBloqueada(alumnoId, criterioId) {
      const c = criterios.find(x => x.id === criterioId);
      return guardadasBD.has(alumnoId + "|" + criterioId) && !(c && solCalAut.has(c.periodo + "|" + alumnoId));
    }

    function obtenerValor(alumnoId, criterioId) {
      return valoresCache[alumnoId]?.[criterioId] ?? null;
    }
    // Calificación final del periodo para mostrar: entera (regla oficial); "—" si aún no hay nada capturado.
    function finalMostrar(alumnoId, criteriosPeriodo) {
      const hay = criteriosPeriodo.some(c => valoresCache[alumnoId]?.[c.id] != null);
      return hay ? String(calOficial(calcularFinal(alumnoId, criteriosPeriodo))) : "—";
    }
    function calcularFinal(alumnoId, criteriosPeriodo) {
      let total = 0;
      criteriosPeriodo.forEach(c => {
        const v = valoresCache[alumnoId]?.[c.id];
        if (v != null) total += v * (Number(c.ponderacion) / 100);
      });
      return total;
    }

    // Secundaria: 5 parciales. Preparatoria: 5 bimestres. (Se conservan periodos antiguos con otro nombre.)
    const nivelClase = asignacion.grupos?.grados?.nivel;
    const prefijoPeriodo = nivelClase === "Preparatoria" ? "Bimestre" : "Parcial";
    const periodos = [...new Set([
      ...[1, 2, 3, 4, 5].map(n => `${prefijoPeriodo} ${n}`),
      ...criterios.map(c => c.periodo),
    ])];
    let periodoActivo = periodos[0] || null;
    let guardandoCriterio = false;

    function pintar() {
      const criteriosPeriodo = criterios.filter(c => c.periodo === periodoActivo);
      const sumaPonderacion = criteriosPeriodo.reduce((s, c) => s + Number(c.ponderacion), 0);
      const confirmado = estadosPeriodo[periodoActivo] === "Confirmado";
      const puedeEditarCriterios = puedeEditar && !confirmado;
      const puedeCapturar = puedeEditar && confirmado;

      cont.innerHTML = `
        ${!puedeEditar ? `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#EEF2FB; color:#1E3A8A">Solo consulta: los criterios y las calificaciones los captura el profesor de la clase.${confirmado ? "" : " Los criterios de este periodo aún no están confirmados."}</div>` : ""}
        <div class="flex gap-1 mb-3 flex-wrap">
          ${periodos.map(p => `<button class="calPeriodoBtn px-3 py-1.5 rounded-lg text-xs font-semibold" data-p="${p}" style="background:${p === periodoActivo ? "#1E3A8A" : "#F4F1EB"}; color:${p === periodoActivo ? "#fff" : "#1E3A8A"}">${p}</button>`).join("")}
        </div>

        ${periodoActivo ? `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <div class="flex items-center justify-between mb-2">
            <p class="text-sm font-semibold" style="color:#1E3A8A">Criterios de ${periodoActivo}</p>
            <span class="text-xs font-semibold" style="color:${sumaPonderacion === 100 ? "#3F7A5E" : "#B5453A"}">Suma: ${sumaPonderacion}%</span>
          </div>
          ${criteriosPeriodo.map(c => `<div class="flex justify-between text-sm py-1" style="color:#1C2B3A"><span>${c.nombre}</span><span>${c.ponderacion}%${puedeEditarCriterios ? ` <button class="calDelCriterio ml-2 font-bold" data-id="${c.id}" style="color:#B5453A" title="Quitar">✕</button>` : ""}</span></div>`).join("") || `<p class="text-xs" style="color:#6C7B8A">Sin criterios aún.</p>`}
          ${puedeEditarCriterios ? `
          <div class="flex gap-2 mt-2">
            <input id="calCriterioNombre" placeholder="Nombre (ej. Examen)" class="flex-1 px-2 py-1.5 rounded-lg text-xs outline-none border" style="border-color:#E1DED5" />
            <input id="calCriterioPond" type="number" min="1" max="100" placeholder="%" class="w-16 px-2 py-1.5 rounded-lg text-xs outline-none border" style="border-color:#E1DED5" />
            <button id="calAgregarCriterioBtn" class="px-2 py-1.5 rounded-lg text-xs font-semibold" style="background:#1E3A8A; color:#fff">+</button>
          </div>
          <div id="calCriterioMsg" class="mt-1"></div>
          ${puedeEditar && criteriosPeriodo.length > 0 ? `
          <button id="calConfirmarBtn" class="mt-2 px-3 py-1.5 rounded-lg text-xs font-bold" style="background:#3F7A5E; color:#fff">Confirmar criterios</button>
          <p class="text-xs mt-1" style="color:#6C7B8A">Debes confirmar los criterios (suma 100%) para capturar calificaciones. Después solo se pueden cambiar con autorización de un supervisor.</p>` : ""}` : (puedeEditar ? `
          <div class="mt-2 p-2 rounded-lg text-xs" style="background:#F4F1EB; color:#1E3A8A">
            🔒 Criterios confirmados.
            ${solicitudesPend.has(periodoActivo) ? "Hay una solicitud de modificación pendiente de autorización." : `<button id="calSolicitarBtn" class="ml-1 px-2 py-1 rounded-lg font-semibold" style="background:#1E3A8A; color:#fff">Solicitar modificación</button>`}
          </div>
          <div id="calCriterioMsg" class="mt-1"></div>` : "")}
        </div>

        ${criteriosPeriodo.length > 0 && alumnos.length > 0 ? `
        <div class="p-4 rounded-xl bg-white border overflow-x-auto" style="border-color:#E1DED5">
          <div class="text-xs mb-3 p-2 rounded-lg" style="background:#EEF2FB; color:#1E3A8A">
            <strong>¿Cómo capturar?</strong> Escribe la calificación que obtuvo el alumno en cada criterio, <strong>número entero del 5 al 10</strong> (por normatividad no se asienta menos de 5; si capturas un decimal, el sistema te preguntará cuál es la correcta).
            El sistema aplica automáticamente el porcentaje de cada criterio y calcula la calificación final del periodo.
            Ejemplo: si en "Examen" (40%) el alumno sacó 8, aporta 3.2 puntos a la final.
          </div>
          ${puedeCapturar && criteriosPeriodo.some(c => normalizarTexto(c.nombre).includes("asistencia")) ? `
          <div class="mb-3">
            <button id="calAsisBtn" type="button" class="px-3 py-2 rounded-lg text-xs font-bold" style="background:#3F7A5E; color:#fff">Calcular calificación en el criterio Asistencia</button>
            <div id="calAsisPanel" class="mt-2"></div>
          </div>` : ""}
          <table class="text-sm w-full">
            <thead>
              <tr style="color:#6C7B8A">
                <th class="text-left pb-2">Alumno</th>
                ${criteriosPeriodo.map(c => `<th class="text-center pb-2 px-1">${c.nombre}<br><span class="text-xs font-normal">(${c.ponderacion}%)</span></th>`).join("")}
                ${puedeCapturar ? `<th class="text-center pb-2 px-1">Modificar</th>` : ""}
                <th class="text-center pb-2">Final</th>
              </tr>
            </thead>
            <tbody>
              ${alumnos.map(a => `
                <tr style="color:#1C2B3A">
                  <td class="py-1 pr-2">${a.nombres} ${a.apellido_paterno}</td>
                  ${criteriosPeriodo.map(c => `<td class="text-center py-1"><input type="number" inputmode="decimal" min="0" max="10" step="any" class="calValorInput w-14 px-1 py-1 rounded text-xs border text-center" data-alumno="${a.id}" data-criterio="${c.id}" value="${obtenerValor(a.id, c.id) ?? ""}" ${puedeCapturar && !estaBloqueada(a.id, c.id) ? "" : "disabled"} ${puedeCapturar && estaBloqueada(a.id, c.id) ? 'title="Calificación guardada: solo se modifica con autorización del director" style="background:#F4F1EB"' : ""} /></td>`).join("")}
                  ${puedeCapturar ? `<td class="text-center py-1">${(() => {
                    const k = periodoActivo + "|" + a.id;
                    const tieneGuardadas = criteriosPeriodo.some(c => guardadasBD.has(a.id + "|" + c.id));
                    if (solCalAut.has(k)) return `<span class="text-xs font-semibold" style="color:#3F7A5E">Autorizado: edita y guarda</span>`;
                    if (solCalPend.has(k)) return `<span class="text-xs" style="color:#B8860B">Solicitud pendiente</span>`;
                    if (tieneGuardadas) return `<button type="button" class="calModBtn px-2 py-1 rounded-lg text-xs font-semibold" data-alumno="${a.id}" style="background:#EEF2FB; color:#1E3A8A">Modificar</button>`;
                    return "";
                  })()}</td>` : ""}
                  <td class="text-center font-semibold" id="calFinal_${a.id}">${finalMostrar(a.id, criteriosPeriodo)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
          ${puedeCapturar ? `<div id="calGuardarMsg" class="mt-2"></div><button id="calGuardarBtn" class="mt-3 px-4 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar calificaciones</button>` : (puedeEditar ? `<p class="text-xs mt-2" style="color:#B5453A">Confirma los criterios de este periodo para poder capturar calificaciones.</p>` : "")}
        </div>` : criteriosPeriodo.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Agrega al menos un criterio para poder capturar calificaciones.</p>` : `<p class="text-sm" style="color:#6C7B8A">No hay alumnos inscritos en este grupo.</p>`}
        ` : `<p class="text-sm" style="color:#6C7B8A">${puedeEditar ? 'Crea un periodo para empezar (ej. "Parcial 1").' : "Aún no hay periodos capturados para esta clase."}</p>`}
      `;

      document.querySelectorAll(".calPeriodoBtn").forEach(b => b.addEventListener("click", () => { periodoActivo = b.dataset.p; pintar(); }));

      document.querySelectorAll(".calModBtn").forEach(b => b.addEventListener("click", async () => {
        const al = alumnos.find(x => x.id === b.dataset.alumno);
        const motivo = prompt(`Las calificaciones de ${al ? al.nombres + " " + al.apellido_paterno : "este alumno"} ya están guardadas. Escribe la razón por la cual deseas modificarlas; se enviará la solicitud al director para su autorización:`);
        if (!motivo || !motivo.trim()) return;
        b.disabled = true;
        const { error } = await sb.from("solicitudes_calificaciones").insert({ asignacion_id: asignacion.id, periodo: periodoActivo, alumno_id: b.dataset.alumno, motivo: motivo.trim() });
        if (error) { b.disabled = false; const m = document.getElementById("calGuardarMsg"); if (m) m.innerHTML = errBox(escHtml(error.message)); return; }
        solCalPend.add(periodoActivo + "|" + b.dataset.alumno);
        pintar();
        const m = document.getElementById("calGuardarMsg"); if (m) m.innerHTML = okBox("Solicitud enviada al director. Cuando la autorice podrás modificar las calificaciones de ese alumno.");
      }));

      if (puedeEditar && periodoActivo) {
        const btnAgregar = document.getElementById("calAgregarCriterioBtn");
        if (btnAgregar) btnAgregar.addEventListener("click", async () => {
          const nombre = document.getElementById("calCriterioNombre").value.trim();
          const pond = Number(document.getElementById("calCriterioPond").value);
          const msg = document.getElementById("calCriterioMsg");
          msg.innerHTML = "";
          if (guardandoCriterio) return;
          if (!nombre || !pond || pond <= 0 || pond > 100) { msg.innerHTML = errBox("Escribe un nombre y un porcentaje válido (1-100)."); return; }
          if (criteriosPeriodo.some(c => c.nombre.trim().toLowerCase() === nombre.toLowerCase())) {
            msg.innerHTML = errBox(`Ya existe un criterio llamado "${escHtml(nombre)}" en este periodo.`); return;
          }
          if (sumaPonderacion + pond > 100) {
            msg.innerHTML = errBox(`No se puede agregar: la suma sería ${sumaPonderacion + pond}% y el máximo es 100%. Solo quedan ${100 - sumaPonderacion}% disponibles.`); return;
          }
          guardandoCriterio = true;
          btnAgregar.disabled = true;
          btnAgregar.style.opacity = "0.5";
          const { data, error } = await sb.from("criterios_evaluacion").insert({
            asignacion_id: asignacion.id, periodo: periodoActivo, nombre, ponderacion: pond, orden: criteriosPeriodo.length,
          }).select().single();
          guardandoCriterio = false;
          if (error) { btnAgregar.disabled = false; btnAgregar.style.opacity = "1"; msg.innerHTML = errBox(escHtml(error.message)); return; }
          criterios.push(data);
          pintar();
        });

        document.querySelectorAll(".calDelCriterio").forEach(b => b.addEventListener("click", async () => {
          if (!confirm("¿Quitar este criterio?")) return;
          const { error } = await sb.from("criterios_evaluacion").delete().eq("id", b.dataset.id);
          if (error) { document.getElementById("calCriterioMsg").innerHTML = errBox(error.message); return; }
          const i = criterios.findIndex(c => c.id === b.dataset.id);
          if (i >= 0) criterios.splice(i, 1);
          pintar();
        }));

        const btnSolicitar = document.getElementById("calSolicitarBtn");
        if (btnSolicitar) btnSolicitar.addEventListener("click", async () => {
          const motivo = prompt("Explica por qué necesitas modificar los criterios de " + periodoActivo + ":");
          if (!motivo || !motivo.trim()) return;
          const { error } = await sb.from("solicitudes_criterios").insert({ asignacion_id: asignacion.id, periodo: periodoActivo, motivo: motivo.trim() });
          if (error) { document.getElementById("calCriterioMsg").innerHTML = errBox(error.message); return; }
          solicitudesPend.add(periodoActivo);
          pintar();
        });

        const btnConfirmar = document.getElementById("calConfirmarBtn");
        if (btnConfirmar) btnConfirmar.addEventListener("click", async () => {
          const msg = document.getElementById("calCriterioMsg");
          if (sumaPonderacion !== 100) { msg.innerHTML = errBox("Los criterios deben sumar exactamente 100% para confirmarlos."); return; }
          if (!confirm(`¿Confirmar los criterios de ${periodoActivo}? Ya no podrás modificarlos sin autorización de un supervisor.`)) return;
          const { error } = await sb.from("periodos_criterios").upsert(
            { asignacion_id: asignacion.id, periodo: periodoActivo, estado: "Confirmado", confirmado_en: new Date().toISOString() },
            { onConflict: "asignacion_id,periodo" });
          if (error) { msg.innerHTML = errBox(error.message); return; }
          estadosPeriodo[periodoActivo] = "Confirmado";
          pintar();
        });

        const btnAsis = document.getElementById("calAsisBtn");
        if (btnAsis) btnAsis.addEventListener("click", async () => {
          const crit = criteriosPeriodo.find(c => normalizarTexto(c.nombre).includes("asistencia"));
          const panel = document.getElementById("calAsisPanel");
          const hoyISO = fechaLocalISO(new Date());
          const ini = new Date(); ini.setDate(ini.getDate() - 30);
          let per = null;
          try { const r = await sb.from("periodos_evaluacion").select("fecha_inicio, fecha_fin").eq("ciclo_escolar_id", asignacion.ciclo_escolar_id).eq("periodo", periodoActivo).maybeSingle(); per = r.data; } catch (e) { /* sin fechas definidas */ }
          panel.innerHTML = `
            <div class="p-3 rounded-lg" style="background:#F4F1EB">
              <p class="text-xs mb-2" style="color:#1C2B3A">${per ? `Fechas de <strong>${escHtml(periodoActivo)}</strong> definidas por la Dirección.` : `Elige las fechas que abarca <strong>${escHtml(periodoActivo)}</strong> (la Dirección aún no las define en Alumnos y Grupos → Periodos de evaluación).`} La calificación será <strong>10 × asistencias ÷ clases impartidas</strong> en ese rango. Las ausencias justificadas no cuentan; si el alumno no pasó por la entrada de la escuela ese día, cuenta como inasistencia aunque el profesor lo haya marcado presente.</p>
              <div class="flex gap-2 flex-wrap items-end mb-2">
                <div><label class="block text-xs" style="color:#6C7B8A">Desde</label><input id="asDesde" type="date" value="${per ? per.fecha_inicio : fechaLocalISO(ini)}" ${per ? "readonly" : ""} class="px-2 py-1 rounded-lg text-xs border" style="border-color:#E1DED5" /></div>
                <div><label class="block text-xs" style="color:#6C7B8A">Hasta</label><input id="asHasta" type="date" value="${per ? per.fecha_fin : hoyISO}" ${per ? "readonly" : ""} class="px-2 py-1 rounded-lg text-xs border" style="border-color:#E1DED5" /></div>
                <button id="asCalcular" type="button" class="px-3 py-1.5 rounded-lg text-xs font-bold" style="background:#1E3A8A; color:#fff">Calcular</button>
              </div>
              <div id="asResultado"></div>
            </div>`;
          document.getElementById("asCalcular").addEventListener("click", async () => {
            const res = document.getElementById("asResultado");
            const desde = document.getElementById("asDesde").value, hasta = document.getElementById("asHasta").value;
            if (!desde || !hasta || desde > hasta) { res.innerHTML = errBox("Revisa las fechas."); return; }
            res.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Calculando…</p>`;
            try {
              const r = await calcularAsistenciaClase(asignacion, alumnos, desde, hasta);
              if (r.sesiones === 0) { res.innerHTML = errBox("No hay clases con asistencia guardada en ese rango."); return; }
              res.innerHTML = `
                <p class="text-xs mb-1" style="color:#6C7B8A">Clases impartidas en el rango: <strong>${r.sesiones}</strong></p>
                <div style="overflow-x:auto"><table class="w-full text-xs"><thead><tr style="color:#6C7B8A; text-align:left"><th>Alumno</th><th>Asist.</th><th>Faltas</th><th>Justif.</th><th>Calif.</th></tr></thead><tbody>
                ${r.filas.map(f => `<tr style="border-top:1px solid #E1DED5"><td>${escHtml(f.nombre)}</td><td>${f.asistencias}</td><td>${f.faltas}</td><td>${f.justificadas}</td><td><strong>${f.calif == null ? "—" : f.calif}</strong></td></tr>`).join("")}
                </tbody></table></div>
                <div id="asMsg" class="mt-2"></div>
                <button id="asAplicar" type="button" class="mt-1 px-3 py-1.5 rounded-lg text-xs font-bold" style="background:#3F7A5E; color:#fff">Aplicar calificaciones al criterio "${escHtml(crit.nombre)}"</button>`;
              document.getElementById("asAplicar").addEventListener("click", async () => {
                const conCalif = r.filas.filter(f => f.calif != null);
                const filas = conCalif.filter(f => !estaBloqueada(f.alumno_id, crit.id)).map(f => ({ criterio_id: crit.id, alumno_id: f.alumno_id, valor: f.calif }));
                const omitidas = conCalif.length - filas.length;
                if (filas.length === 0) { document.getElementById("asMsg").innerHTML = errBox("Todas las calificaciones de este criterio ya están guardadas y bloqueadas. Para modificarlas solicita autorización al director."); return; }
                const { error } = await sb.from("calificaciones").upsert(filas, { onConflict: "criterio_id,alumno_id" });
                if (error) { document.getElementById("asMsg").innerHTML = errBox(escHtml(error.message)); return; }
                filas.forEach(f => { valoresCache[f.alumno_id] = valoresCache[f.alumno_id] || {}; valoresCache[f.alumno_id][crit.id] = f.valor; guardadasBD.add(f.alumno_id + "|" + crit.id); });
                pintar();
                document.getElementById("calGuardarMsg") && (document.getElementById("calGuardarMsg").innerHTML = okBox("Calificación de asistencia calculada y guardada." + (omitidas ? ` Se respetaron ${omitidas} calificación(es) ya guardadas (bloqueadas).` : "")));
              });
            } catch (e) { res.innerHTML = errBox(escHtml(e.message)); }
          });
          if (per) document.getElementById("asCalcular").click(); // con fechas definidas por la Dirección, calcula de inmediato
        });

        const btnGuardar = document.getElementById("calGuardarBtn");
        if (btnGuardar) btnGuardar.addEventListener("click", async () => {
          const msg = document.getElementById("calGuardarMsg");
          msg.innerHTML = "";
          const inputs = [...document.querySelectorAll(".calValorInput")].filter(i => i.value !== "" && !i.disabled);
          if (inputs.some(i => isNaN(Number(i.value)) || Number(i.value) > 10)) {
            msg.innerHTML = errBox("Todas las calificaciones deben ser números del 5 al 10."); return;
          }
          // Completitud: si un alumno ya tiene alguna calificación, debe tener todos los criterios; sin ninguna, se pide confirmación.
          const todos = [...document.querySelectorAll(".calValorInput")];
          todos.forEach(i => { i.style.borderColor = ""; });
          const nomAl = id => { const al = alumnos.find(x => x.id === id); return al ? `${al.apellido_paterno || ""} ${al.apellido_materno || ""} ${al.nombres || ""}`.replace(/\s+/g, " ").trim() : "Alumno"; };
          const porAlumno = {};
          todos.forEach(i => { (porAlumno[i.dataset.alumno] = porAlumno[i.dataset.alumno] || []).push(i); });
          const incompletos = [], vacios = [];
          Object.entries(porAlumno).forEach(([id, lst]) => {
            const llenos = lst.filter(i => i.value !== "").length;
            if (llenos === 0) vacios.push(id);
            else if (llenos < lst.length) { incompletos.push(id); lst.filter(i => i.value === "").forEach(i => { i.style.borderColor = "#B91C1C"; }); }
          });
          if (incompletos.length) {
            msg.innerHTML = errBox("Faltan calificaciones de algún criterio (marcados en rojo) de: " + incompletos.map(nomAl).join("; ") + ". Si un alumno ya tiene una calificación, todos sus criterios deben capturarse.");
            const primero = document.querySelector(".calValorInput[style*='B91C1C']"); if (primero) primero.focus();
            return;
          }
          if (vacios.length && !(await confirmarGuardarSinCaptura(vacios.map(nomAl)))) return;
          // Reglas de Normatividad: mínimo 5 y sin decimales (si hay decimal, el profesor elige el entero correcto).
          let subidasA5 = 0;
          btnGuardar.disabled = true;
          for (const i of inputs) {
            let v = Number(i.value);
            if (v < 5) { v = 5; subidasA5++; }
            else if (Math.abs(v - Math.round(v)) > 1e-9) {
              const al = alumnos.find(x => x.id === i.dataset.alumno), cr = criteriosPeriodo.find(x => x.id === i.dataset.criterio);
              const el = await elegirCalificacionEntera(`${al ? al.nombres + " " + al.apellido_paterno : "Alumno"} · ${cr ? cr.nombre : "criterio"}`, i.value, Math.floor(v), Math.ceil(v));
              if (el === null) { btnGuardar.disabled = false; msg.innerHTML = errBox("Guardado cancelado: no se asentó ninguna calificación. Corrige los decimales y vuelve a guardar."); return; }
              v = el;
            }
            i.value = String(v);
            valoresCache[i.dataset.alumno] = valoresCache[i.dataset.alumno] || {};
            valoresCache[i.dataset.alumno][i.dataset.criterio] = v;
            const elF = document.getElementById(`calFinal_${i.dataset.alumno}`); if (elF) elF.textContent = finalMostrar(i.dataset.alumno, criteriosPeriodo);
          }
          const filas = inputs.map(i => ({ criterio_id: i.dataset.criterio, alumno_id: i.dataset.alumno, valor: Number(i.value) }));
          if (filas.length === 0) { btnGuardar.disabled = false; msg.innerHTML = errBox("No hay calificaciones nuevas para guardar."); return; }
          const { error } = await sb.from("calificaciones").upsert(filas, { onConflict: "criterio_id,alumno_id" });
          btnGuardar.disabled = false;
          if (error) { msg.innerHTML = errBox(error.message); return; }
          const alAplicados = [...new Set(inputs.map(i => i.dataset.alumno))].filter(id => solCalAut.has(periodoActivo + "|" + id));
          for (const id of alAplicados) {
            const k = periodoActivo + "|" + id;
            await sb.from("solicitudes_calificaciones").update({ estado: "Aplicada" }).eq("id", solCalAut.get(k));
            solCalAut.delete(k);
          }
          inputs.forEach(i => { guardadasBD.add(i.dataset.alumno + "|" + i.dataset.criterio); });
          if (alAplicados.length) { pintar(); }
          else inputs.forEach(i => { i.disabled = true; i.style.background = "#F4F1EB"; i.title = "Calificación guardada: solo se modifica con autorización del director"; });
          const msg2 = document.getElementById("calGuardarMsg");
          if (msg2) msg2.innerHTML = okBox("Calificaciones guardadas. Las calificaciones guardadas quedaron bloqueadas; para cambiarlas se requiere autorización del director." + (subidasA5 ? ` ${subidasA5} calificación(es) menor(es) a 5 se asentaron como 5, conforme a la normatividad.` : ""));
        });

        document.querySelectorAll(".calValorInput").forEach(inp => inp.addEventListener("input", () => {
          if (inp.value !== "") {
            const n = Number(inp.value);
            if (n > 10) inp.value = "10";
            else if (n < 0) inp.value = "0";
          }
          const alumnoId = inp.dataset.alumno;
          valoresCache[alumnoId] = valoresCache[alumnoId] || {};
          if (inp.value === "") delete valoresCache[alumnoId][inp.dataset.criterio]; else valoresCache[alumnoId][inp.dataset.criterio] = Number(inp.value) || 0;
          const elFinal = document.getElementById(`calFinal_${alumnoId}`);
          if (elFinal) elFinal.textContent = finalMostrar(alumnoId, criteriosPeriodo);
        }));

        // Normatividad en tiempo real: al salir de la casilla (Tab, Enter o tocar otra) se corrige de inmediato.
        let validandoCal = false;
        document.querySelectorAll(".calValorInput").forEach(inp => inp.addEventListener("change", async () => {
          if (validandoCal || inp.value === "") return;
          let v = Number(inp.value);
          if (isNaN(v)) { inp.value = ""; return; }
          validandoCal = true;
          try {
            if (v < 5) v = 5;
            else if (Math.abs(v - Math.round(v)) > 1e-9) {
              const al = alumnos.find(x => x.id === inp.dataset.alumno), cr = criteriosPeriodo.find(x => x.id === inp.dataset.criterio);
              const el = await elegirCalificacionEntera(`${al ? al.nombres + " " + al.apellido_paterno : "Alumno"} · ${cr ? cr.nombre : "criterio"}`, inp.value, Math.floor(v), Math.ceil(v));
              if (el === null) {
                inp.value = "";
                const ac = inp.dataset.alumno; if (valoresCache[ac]) delete valoresCache[ac][inp.dataset.criterio];
                const ef = document.getElementById(`calFinal_${ac}`); if (ef) ef.textContent = finalMostrar(ac, criteriosPeriodo);
                inp.focus(); return;
              }
              v = el;
            }
            inp.value = String(v);
            const ac = inp.dataset.alumno;
            valoresCache[ac] = valoresCache[ac] || {};
            valoresCache[ac][inp.dataset.criterio] = v;
            const ef = document.getElementById(`calFinal_${ac}`); if (ef) ef.textContent = finalMostrar(ac, criteriosPeriodo);
          } finally { validandoCal = false; }
        }));
      }
    }

    pintar();
  }
}

// Módulo Bitácora (solo lectura: quién hizo qué y cuándo)

const BITACORA_TABLAS = {
  alumnos: "Alumnos", tutores: "Tutores", alumno_tutores: "Alumno-tutor", inscripciones: "Inscripciones",
  grupos: "Grupos", grados: "Grados", ciclos_escolares: "Ciclos escolares", materias: "Materias",
  perfiles: "Usuarios/Personal", profesor_materias_grupos: "Asignaciones", criterios_evaluacion: "Criterios de evaluación",
  calificaciones: "Calificaciones", periodos_criterios: "Estado de criterios", solicitudes_criterios: "Solicitudes de criterios", solicitudes_calificaciones: "Solicitudes de calificaciones",
  asistencia_clase: "Asistencia de clase", registros_acceso: "Entradas y salidas", rostros: "Rostros registrados",
  datos_institucion: "Datos del instituto", categorias_mobiliario: "Categorías de mobiliario", mobiliario: "Mobiliario",
};
const BITACORA_OPS = { INSERT: "Alta", UPDATE: "Modificación", DELETE: "Baja" };

function renderBitacora(main) {
  const hoy = new Date();
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const hace7 = new Date(hoy.getTime() - 6 * 86400000);

  main.innerHTML = `
    <h2 class="text-lg font-bold mb-1" style="color:#1E3A8A">Bitácora</h2>
    <p class="text-xs mb-4" style="color:#6C7B8A">Registro de solo lectura de las altas, modificaciones y bajas hechas en el sistema. Nadie puede editarlo ni borrarlo.</p>
    <div class="max-w-4xl">
      <div class="p-3 rounded-xl bg-white border mb-3 flex flex-wrap gap-2 items-end" style="border-color:#E1DED5">
        <div><label class="block text-xs mb-1" style="color:#6C7B8A">Desde</label><input id="btDesde" type="date" value="${iso(hace7)}" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5" /></div>
        <div><label class="block text-xs mb-1" style="color:#6C7B8A">Hasta</label><input id="btHasta" type="date" value="${iso(hoy)}" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5" /></div>
        <div><label class="block text-xs mb-1" style="color:#6C7B8A">Módulo</label>
          <select id="btTabla" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5">
            <option value="">Todos</option>
            ${Object.entries(BITACORA_TABLAS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
          </select></div>
        <div><label class="block text-xs mb-1" style="color:#6C7B8A">Acción</label>
          <select id="btOp" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5">
            <option value="">Todas</option><option value="INSERT">Altas</option><option value="UPDATE">Modificaciones</option><option value="DELETE">Bajas</option>
          </select></div>
        <button id="btBuscar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Consultar</button>
      </div>
      <div id="btResultado"></div>
    </div>`;

  document.getElementById("btBuscar").addEventListener("click", consultar);
  consultar();

  function resumenCambios(r) {
    const antes = r.datos_antes || {}, despues = r.datos_despues || {};
    if (r.operacion === "UPDATE") {
      const campos = Object.keys(despues).filter(k => JSON.stringify(antes[k]) !== JSON.stringify(despues[k]));
      return campos.map(k => `<div><strong>${escHtml(k)}:</strong> ${escHtml(JSON.stringify(antes[k]) ?? "∅")} → ${escHtml(JSON.stringify(despues[k]) ?? "∅")}</div>`).join("");
    }
    const datos = r.operacion === "INSERT" ? despues : antes;
    return Object.entries(datos).map(([k, v]) => `<div><strong>${escHtml(k)}:</strong> ${escHtml(typeof v === "object" ? JSON.stringify(v) : v)}</div>`).join("");
  }

  async function consultar() {
    const cont = document.getElementById("btResultado");
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Consultando…</p>`;
    const desde = document.getElementById("btDesde").value;
    const hasta = document.getElementById("btHasta").value;
    const tabla = document.getElementById("btTabla").value;
    const op = document.getElementById("btOp").value;

    let q = sb.from("bitacora").select("*").order("fecha", { ascending: false }).limit(300);
    if (desde) q = q.gte("fecha", new Date(desde + "T00:00:00").toISOString());
    if (hasta) q = q.lte("fecha", new Date(hasta + "T23:59:59").toISOString());
    if (tabla) q = q.eq("tabla", tabla);
    if (op) q = q.eq("operacion", op);
    const { data, error } = await q;
    if (error) { cont.innerHTML = errBox(escHtml(error.message)); return; }
    const filas = data || [];
    if (filas.length === 0) { cont.innerHTML = `<p class="text-sm" style="color:#6C7B8A">Sin movimientos en ese rango.</p>`; return; }

    cont.innerHTML = `
      <p class="text-xs mb-2" style="color:#6C7B8A">${filas.length} movimientos${filas.length === 300 ? " (se muestran los 300 más recientes; acota las fechas para ver otros)" : ""}</p>
      <div class="rounded-xl bg-white border overflow-x-auto" style="border-color:#E1DED5">
        <table class="text-xs w-full">
          <thead><tr style="color:#6C7B8A" class="text-left"><th class="p-2">Fecha y hora</th><th class="p-2">Usuario</th><th class="p-2">Acción</th><th class="p-2">Módulo</th><th class="p-2"></th></tr></thead>
          <tbody>
            ${filas.map((r, i) => `
              <tr style="color:#1C2B3A; border-top:1px solid #F0EDE5">
                <td class="p-2 whitespace-nowrap">${new Date(r.fecha).toLocaleString("es-MX", { dateStyle: "short", timeStyle: "medium" })}</td>
                <td class="p-2">${escHtml(r.usuario_nombre || "Sistema")} <span style="color:#6C7B8A">${escHtml(r.usuario_rol || "")}</span></td>
                <td class="p-2">${BITACORA_OPS[r.operacion] || r.operacion}</td>
                <td class="p-2">${escHtml(BITACORA_TABLAS[r.tabla] || r.tabla)}</td>
                <td class="p-2"><button class="btDetalle font-semibold" data-i="${i}" style="color:#1E3A8A">Ver detalle</button></td>
              </tr>
              <tr id="btDet_${i}" style="display:none; background:#FAF8F3"><td colspan="5" class="p-2" style="color:#1C2B3A; word-break:break-word">${resumenCambios(r)}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>`;
    cont.querySelectorAll(".btDetalle").forEach(b => b.addEventListener("click", () => {
      const fila = document.getElementById("btDet_" + b.dataset.i);
      fila.style.display = fila.style.display === "none" ? "" : "none";
    }));
  }
}

// Módulo Boletas de calificaciones (solo consulta e impresión)
// ============================================================
function renderBoletas(main) {
  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1E3A8A">Boletas de Calificaciones</h2>
    <div class="max-w-3xl">
      <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <div class="flex gap-2">
          <input id="boBuscarInput" placeholder="Buscar alumno por nombre o matrícula…" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          <button id="boBuscarBtn" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Buscar</button>
        </div>
        <div id="boResultados" class="mt-2"></div>
      </div>
      <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Imprimir boletas por nivel, grado o grupo</p>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <div><label class="block text-xs mb-1" style="color:#6C7B8A">Ciclo escolar</label><select id="boLoteCiclo" class="w-full px-2 py-2 rounded-lg text-sm border" style="border-color:#E1DED5"></select></div>
          <div><label class="block text-xs mb-1" style="color:#6C7B8A">Nivel académico</label><select id="boLoteNivel" class="w-full px-2 py-2 rounded-lg text-sm border" style="border-color:#E1DED5"><option value="">Todos</option><option>Secundaria</option><option>Preparatoria</option></select></div>
          <div><label class="block text-xs mb-1" style="color:#6C7B8A">Grado</label><select id="boLoteGrado" class="w-full px-2 py-2 rounded-lg text-sm border" style="border-color:#E1DED5"><option value="">Todos</option></select></div>
          <div><label class="block text-xs mb-1" style="color:#6C7B8A">Grupo</label><select id="boLoteGrupo" class="w-full px-2 py-2 rounded-lg text-sm border" style="border-color:#E1DED5"><option value="">Todos</option></select></div>
        </div>
        <button id="boLoteBtn" type="button" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Generar boletas</button>
        <div id="boLoteMsg" class="mt-2"></div>
      </div>
      <div id="boBoleta"></div>
      <div id="boLote"></div>
    </div>`;

  // ---- Impresión por nivel / grado / grupo ----
  let gruposLote = [], ciclosLote = [];
  (async () => {
    const [g, c] = await Promise.all([
      sb.from("grupos").select("id, letra, grados(id, nombre, nivel)"),
      sb.from("ciclos_escolares").select("id, nombre, nivel, activo, fecha_inicio").order("fecha_inicio", { ascending: false }),
    ]);
    gruposLote = (g.data || []).filter(x => x.grados);
    ciclosLote = c.data || [];
    const selC = document.getElementById("boLoteCiclo");
    if (!selC) return;
    selC.innerHTML = `<option value="activo">Ciclo activo de cada nivel</option>` + ciclosLote.map(x => `<option value="${x.id}">${escHtml(x.nombre)} — ${escHtml(x.nivel || "")}</option>`).join("");
    llenarGrados();
  })();
  function gruposFiltrados(nivel, gradoId) {
    return gruposLote.filter(g => (!nivel || g.grados.nivel === nivel) && (!gradoId || g.grados.id === gradoId));
  }
  function llenarGrados() {
    const nivel = document.getElementById("boLoteNivel").value;
    const mapa = new Map();
    gruposFiltrados(nivel, "").forEach(g => mapa.set(g.grados.id, g.grados));
    const grados = [...mapa.values()].sort((a, b) => (a.nivel + a.nombre).localeCompare(b.nivel + b.nombre, "es"));
    document.getElementById("boLoteGrado").innerHTML = `<option value="">Todos</option>` + grados.map(g => `<option value="${g.id}">${escHtml(g.nombre)}${nivel ? "" : " (" + escHtml(g.nivel) + ")"}</option>`).join("");
    llenarGrupos();
  }
  function llenarGrupos() {
    const nivel = document.getElementById("boLoteNivel").value, gradoId = document.getElementById("boLoteGrado").value;
    const letras = [...new Set(gruposFiltrados(nivel, gradoId).map(g => g.letra))].sort((a, b) => String(a).localeCompare(String(b), "es"));
    document.getElementById("boLoteGrupo").innerHTML = `<option value="">Todos</option>` + letras.map(l => `<option value="${escHtml(l)}">${escHtml(l)}</option>`).join("");
  }
  document.getElementById("boLoteNivel").addEventListener("change", llenarGrados);
  document.getElementById("boLoteGrado").addEventListener("change", llenarGrupos);
  document.getElementById("boLoteBtn").addEventListener("click", generarLote);

  async function generarLote() {
    const msg = document.getElementById("boLoteMsg"), caja = document.getElementById("boLote");
    const btn = document.getElementById("boLoteBtn");
    document.getElementById("boBoleta").innerHTML = ""; caja.innerHTML = ""; msg.innerHTML = "";
    const nivel = document.getElementById("boLoteNivel").value, gradoId = document.getElementById("boLoteGrado").value, letra = document.getElementById("boLoteGrupo").value;
    const cicloSel = document.getElementById("boLoteCiclo").value;
    const grupos = gruposFiltrados(nivel, gradoId).filter(g => !letra || g.letra === letra);
    if (grupos.length === 0) { msg.innerHTML = errBox("No hay grupos con ese filtro."); return; }
    const cicloIds = cicloSel === "activo" ? ciclosLote.filter(c => c.activo).map(c => c.id) : [cicloSel];
    if (cicloIds.length === 0) { msg.innerHTML = errBox("No hay ciclo escolar activo."); return; }
    btn.disabled = true; msg.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando alumnos…</p>`;
    try {
      const grupoIds = grupos.map(g => g.id);
      const { data: insc, error: e0 } = await sb.from("inscripciones")
        .select("grupo_id, ciclo_escolar_id, alumnos(id, nombres, apellido_paterno, apellido_materno, matricula, curp), grupos(letra, grados(nombre, nivel)), ciclos_escolares(nombre)")
        .eq("estado", "Inscrito").in("grupo_id", grupoIds).in("ciclo_escolar_id", cicloIds);
      if (e0) throw e0;
      const lista = (insc || []).filter(i => i.alumnos && i.grupos && i.grupos.grados && i.ciclos_escolares);
      if (lista.length === 0) { msg.innerHTML = errBox("No hay alumnos inscritos con ese filtro."); return; }
      lista.sort((a, b) => (a.grupos.grados.nivel + a.grupos.grados.nombre + a.grupos.letra).localeCompare(b.grupos.grados.nivel + b.grupos.grados.nombre + b.grupos.letra, "es")
        || (a.alumnos.apellido_paterno + " " + (a.alumnos.apellido_materno || "") + a.alumnos.nombres).localeCompare(b.alumnos.apellido_paterno + " " + (b.alumnos.apellido_materno || "") + b.alumnos.nombres, "es"));

      msg.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando materias y calificaciones…</p>`;
      const { data: asigs, error: e1 } = await sb.from("profesor_materias_grupos").select("id, grupo_id, ciclo_escolar_id, materias(nombre)").in("grupo_id", grupoIds).in("ciclo_escolar_id", cicloIds);
      if (e1) throw e1;
      const asignaciones = (asigs || []).filter(a => a.materias);
      let criterios = [];
      for (let k = 0; k < asignaciones.length; k += 100) {
        const { data, error } = await sb.from("criterios_evaluacion").select("id, asignacion_id, periodo, ponderacion").in("asignacion_id", asignaciones.slice(k, k + 100).map(a => a.id));
        if (error) throw error; criterios = criterios.concat(data || []);
      }
      const alumnoIds = [...new Set(lista.map(i => i.alumnos.id))];
      const critIds = criterios.map(c => c.id);
      const valoresPorAlumno = new Map();
      const alSet = new Set(alumnoIds);
      for (let k = 0; k < critIds.length; k += 100) {
        const trozo = critIds.slice(k, k + 100);
        for (let desde = 0; ; desde += 1000) {
          const { data, error } = await sb.from("calificaciones").select("alumno_id, criterio_id, valor").in("criterio_id", trozo).order("criterio_id").order("alumno_id").range(desde, desde + 999);
          if (error) throw error;
          (data || []).forEach(r => { if (!alSet.has(r.alumno_id)) return; if (!valoresPorAlumno.has(r.alumno_id)) valoresPorAlumno.set(r.alumno_id, new Map()); valoresPorAlumno.get(r.alumno_id).set(r.criterio_id, Number(r.valor)); });
          if (!data || data.length < 1000) break;
        }
      }
      const { data: inst } = await sb.from("datos_institucion").select("nombre_oficial, domicilio, ciudad, director_nombre, director_secundaria, director_preparatoria").eq("id", 1).maybeSingle();
      const logo = document.getElementById("headerLogo")?.src || "";
      const html = lista.map((i, k) => boletaHTML({
        alumno: i.alumnos, insc: i,
        asignaciones: asignaciones.filter(a => a.grupo_id === i.grupo_id && a.ciclo_escolar_id === i.ciclo_escolar_id),
        criterios, valores: valoresPorAlumno.get(i.alumnos.id) || new Map(), inst: inst || {}, logo,
        clases: "mb-3 " + (k < lista.length - 1 ? "ib-salto" : ""),
      })).join("");
      msg.innerHTML = okBox(`${lista.length} boleta(s) generada(s).`);
      caja.innerHTML = `<button id="boLoteImprimir" type="button" class="w-64 mx-auto block mb-3 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Imprimir / PDF de ${lista.length} boleta(s)</button>${html}`;
      document.getElementById("boLoteImprimir").addEventListener("click", () => imprimirElementos([...document.querySelectorAll("#boLote .ib-imprimible")]));
    } catch (e) {
      msg.innerHTML = errBox(escHtml(e.message || String(e)));
    } finally { btn.disabled = false; }
  }

  document.getElementById("boBuscarBtn").addEventListener("click", buscar);

  async function buscar() {

    if (!criterio) { res.innerHTML = ""; return; }

    const { data, error } = await sb.from("alumnos").select("id, nombres, apellido_paterno, apellido_materno, matricula, curp")
      .or(`nombres.ilike.%${criterio}%,apellido_paterno.ilike.%${criterio}%,apellido_materno.ilike.%${criterio}%,matricula.ilike.%${criterio}%`)
      .order("apellido_paterno").limit(20);
