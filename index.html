          restablecerBotones("");
          document.getElementById("rfResultado").innerHTML = errBox("Todavía no hay rostros registrados. Ve a la pestaña \"Registrar rostros\".");
          return;
        }
        est.textContent = "Activando cámara…";
        await iniciarCamara(document.getElementById("rfVideo"));
      } catch (err) {
        detenerCamara();
        restablecerBotones("");
        document.getElementById("rfResultado").innerHTML = errBox(escHtml(err.message || "No se pudo iniciar el reconocimiento."));
        return;
      }

      const sesion = ++kioskSesion;
      mantenerPantallaEncendida();
      ini.style.display = "none";
      bloquearModo(true);
      document.getElementById("rfDetener").style.display = "";
      est.textContent = `Modo ${modoLectura === "Entrada" ? "ENTRADAS" : "SALIDAS"} · Reconocimiento activo (${personas.length} rostros registrados). Acércate a la cámara.`;
      bucle(sesion);
    }

    async function bucle(sesion) {
      const candidatos = new Map(); // clave -> cuadros seguidos
      const bloqueados = new Map(); // clave -> { registradoEn, ultimaVez }
      let desconocidos = 0;
      let ultimoAviso = 0;
      let ultimoKeepAlive = 0;

      while (sesion === kioskSesion && camStream) {
        const video = document.getElementById("rfVideo");
        if (!video) break;
        const ahora = Date.now();

        // Mantiene viva la sesión mientras el reconocimiento está activo en esta pantalla.
        if (ahora - ultimoKeepAlive > 30000) { reiniciarTimerInactividad(); ultimoKeepAlive = ahora; }

        // Vuelve a leer los rostros por si se registraron o dieron de baja personas.
        if (ahora - ultimaCarga > FACE_RECARGA_MS) {
          try { personas = await cargarRostros(); matcher = crearMatcher(personas) || matcher; ultimaCarga = Date.now(); } catch (e) { ultimaCarga = Date.now(); }
        }

        try {
          const detecciones = await faceapi.detectAllFaces(video, opcionesDetector()).withFaceLandmarks().withFaceDescriptors();
          const vistos = new Set();
          let hayDesconocido = false;

          for (const det of detecciones) {
            if (det.detection.box.width / video.videoWidth < FACE_MIN_ANCHO) continue;
            const mejor = matcher.findBestMatch(det.descriptor);
            if (mejor.label === "unknown") { hayDesconocido = true; continue; }

            vistos.add(mejor.label);
            const bloqueo = bloqueados.get(mejor.label);
            if (bloqueo) { bloqueo.ultimaVez = ahora; continue; }

            const frames = (candidatos.get(mejor.label) || 0) + 1;
            candidatos.set(mejor.label, frames);
            if (frames >= FACE_FRAMES_CONFIRMACION) {
              candidatos.delete(mejor.label);
              bloqueados.set(mejor.label, { registradoEn: ahora, ultimaVez: ahora });
              const persona = personas.find(p => p.clave === mejor.label);
              if (persona) {
                try {
                  const r = await registrarMovimiento(persona, "Rostro", mejor.distance, modoLectura);
                  mostrarBanner(bannerRegistro(persona, r, "Rostro"));
                  cargarHoy();
                } catch (e) {
                  bloqueados.delete(mejor.label);
                  mostrarBanner(errBox("No se pudo registrar a " + escHtml(persona.nombre) + ": " + escHtml(e.message)));
                }
              }
            }
          }

          for (const clave of [...candidatos.keys()]) if (!vistos.has(clave)) candidatos.delete(clave);
          for (const [clave, b] of [...bloqueados.entries()]) {
            if (ahora - b.ultimaVez >= FACE_BLOQUEO_AUSENCIA_MS && ahora - b.registradoEn >= FACE_BLOQUEO_MIN_MS) bloqueados.delete(clave);
          }

          if (hayDesconocido && vistos.size === 0) desconocidos++; else desconocidos = 0;
          if (desconocidos >= 8 && ahora - ultimoAviso > 6000) {
            ultimoAviso = ahora;
            desconocidos = 0;
            mostrarBanner(errBox("Rostro no reconocido. Intenta de frente y con buena luz, o usa el registro manual."));
          }
        } catch (e) {
          // un cuadro fallido no detiene el reconocimiento
        }
        await esperar(200);
      }
    }

    async function buscarManual() {
      const criterio = document.getElementById("rfManualInput").value.trim();

          const personas = await cargarRostros();
          const otras = personas.filter(p => p.clave !== clave);
          const matcher = crearMatcher(otras);
          if (matcher) {
            const mejor = matcher.findBestMatch(muestras[0]);
            if (mejor.label !== "unknown") {
              const otra = otras.find(p => p.clave === mejor.label);
              if (!confirm(`Este rostro se parece mucho al de ${otra ? otra.nombre : "otra persona"}. ¿Guardar de todas formas?`)) {

async function copiarTexto(texto) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(texto); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = texto;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

// Grupos de los ciclos escolares activos, ordenados por nivel, grado y letra.
async function cargarGruposActivos() {
  const { data: ciclos, error: e1 } = await sb.from("ciclos_escolares").select("id").eq("activo", true);
  if (e1) throw e1;
  const ids = (ciclos || []).map(c => c.id);
  if (ids.length === 0) return [];
  const { data, error } = await sb.from("grupos").select("id, letra, grados(nombre, nivel)").in("ciclo_escolar_id", ids);
  if (error) throw error;
  return (data || []).filter(g => g.grados).map(g => ({
    id: g.id, letra: g.letra, grado: g.grados.nombre, nivel: g.grados.nivel,
    etiqueta: `${g.grados.nombre} "${g.letra}" (${g.grados.nivel})`,
  })).sort((a, b) => a.nivel.localeCompare(b.nivel) || a.grado.localeCompare(b.grado, "es", { numeric: true }) || a.letra.localeCompare(b.letra));
}

function fechaLocalISO(d) {
  const f = d || new Date();
  const p = n => String(n).padStart(2, "0");
  return `${f.getFullYear()}-${p(f.getMonth() + 1)}-${p(f.getDate())}`;
}

// Primera fecha (AAAA-MM-DD) desde la que el alumno existe en el sistema: la más tardía entre su ingreso e inscripción.
function fechaDesdeAlumno(insc) {
  const a = String(insc?.alumnos?.fecha_ingreso || "").slice(0, 10), b = String(insc?.fecha_inscripcion || "").slice(0, 10);
  return a > b ? a : b;   // vacío ("") se considera sin restricción
}
// Alumnos inscritos de varios grupos y su primera entrada / última salida de un día.
async function asistenciaDelDia(grupoIds, fechaISO) {
  const inicio = new Date(fechaISO + "T00:00:00");
  const fin = new Date(inicio.getTime() + 86400000);
  const { data: insc, error } = await sb.from("inscripciones")
    .select("grupo_id, fecha_inscripcion, alumnos(id, nombres, apellido_paterno, apellido_materno, activo, fecha_ingreso)")
    .in("grupo_id", grupoIds).eq("estado", "Inscrito");
  if (error) throw error;
  // Solo cuentan los alumnos que a esa fecha ya estaban dados de alta en el sistema.
  const alumnos = (insc || []).filter(i => i.alumnos && i.alumnos.activo !== false && fechaDesdeAlumno(i) <= fechaISO);
  const alumnoIds = [...new Set(alumnos.map(i => i.alumnos.id))];
  const regs = [];
  for (let i = 0; i < alumnoIds.length; i += 150) {
    const { data, error: e2 } = await sb.from("registros_acceso")
      .select("alumno_id, tipo_evento, fecha_hora")
      .eq("tipo_persona", "Alumno").in("alumno_id", alumnoIds.slice(i, i + 150))
      .gte("fecha_hora", inicio.toISOString()).lt("fecha_hora", fin.toISOString())
      .order("fecha_hora");
    if (e2) throw e2;
    regs.push(...(data || []));
  }
  const porAlumno = new Map();
  regs.forEach(r => {
    const x = porAlumno.get(r.alumno_id) || { entrada: null, salida: null };
    if (r.tipo_evento === "Entrada" && !x.entrada) x.entrada = r.fecha_hora;
    if (r.tipo_evento === "Salida") x.salida = r.fecha_hora;
    porAlumno.set(r.alumno_id, x);
  });
  return alumnos.map(i => ({
    grupo_id: i.grupo_id, alumno: i.alumnos, nombre: nombreCompletoAlumno(i.alumnos),
    orden: `${i.alumnos.apellido_paterno} ${i.alumnos.apellido_materno || ""} ${i.alumnos.nombres}`,
    entrada: porAlumno.get(i.alumnos.id)?.entrada || null, salida: porAlumno.get(i.alumnos.id)?.salida || null,
  })).sort((a, b) => a.orden.localeCompare(b.orden, "es"));
}

    $("jrOk").addEventListener("click", async () => {
      const d = $("jrDesde").value, h = $("jrHasta").value, mot = $("jrMotivo").value.trim();
      if (!alumno) { $("jrMsg").innerHTML = errBox("Selecciona al alumno."); return; }
      if (!d || !h || d > h) { $("jrMsg").innerHTML = errBox("Revisa las fechas."); return; }
      if (!mot) { $("jrMsg").innerHTML = errBox("Escribe el motivo."); return; }
      const lista = dias(d, h);
      if (!lista.length) { $("jrMsg").innerHTML = errBox("En ese rango no hay días de lunes a viernes."); return; }
      if (lista.length > 60) { $("jrMsg").innerHTML = errBox("El rango no puede pasar de 60 días hábiles."); return; }
      if (!confirm(`¿Justificar ${lista.length} día(s) de ${nombreCompletoAlumno(alumno)}?`)) return;
      $("jrOk").disabled = true;
      try { await guardarAusenciasDia(lista.map(f => ({ alumno_id: alumno.id, fecha: f, justificada: true, motivo: mot }))); $("jrMsg").innerHTML = okBox(`Listo: ${lista.length} día(s) justificado(s).`); }
      catch (e) { $("jrMsg").innerHTML = errBox(escHtml(e.message)); }
      $("jrOk").disabled = false;
    });
  }

  async function tabHistorial(cont) {
    const hoy = fechaLocalISO(), ini = new Date(); ini.setDate(ini.getDate() - 30);
    cont.innerHTML = `
      <div class="p-4 rounded-xl bg-white border mb-3 flex gap-2 flex-wrap items-end" style="border-color:#E1DED5">
        <div><label class="block text-xs" style="color:#6C7B8A">Desde</label><input id="jhDesde" type="date" value="${fechaLocalISO(ini)}" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5" /></div>
        <div><label class="block text-xs" style="color:#6C7B8A">Hasta</label><input id="jhHasta" type="date" value="${hoy}" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5" /></div>
        <button id="jhVer" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Consultar</button>
      </div><div id="jhRes"></div>`;
    async function ver() {
      const res = $("jhRes"); res.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Consultando…</p>`;
      const r = await sb.from("ausencias_dia").select("alumno_id, fecha, motivo").eq("justificada", true).gte("fecha", $("jhDesde").value).lte("fecha", $("jhHasta").value).order("fecha", { ascending: false }).limit(500);
      if (r.error) { res.innerHTML = errBox(escHtml(r.error.message)); return; }
      const filas = r.data || [];
      if (!filas.length) { res.innerHTML = `<p class="text-sm" style="color:#6C7B8A">No hay faltas justificadas en ese periodo.</p>`; return; }
      const ids = [...new Set(filas.map(f => f.alumno_id))], nombres = new Map();
      for (let i = 0; i < ids.length; i += 100) { const a = await sb.from("alumnos").select("id, nombres, apellido_paterno, apellido_materno").in("id", ids.slice(i, i + 100)); (a.data || []).forEach(x => nombres.set(x.id, nombreCompletoAlumno(x))); }
      res.innerHTML = `<p class="text-xs mb-2" style="color:#6C7B8A">${filas.length} falta(s) justificada(s).</p>` + filas.map((f, i) => `
        <div class="flex items-center gap-2 py-2 flex-wrap" style="border-top:1px solid #F0EDE5">
          <span class="text-xs" style="width:90px; color:#6C7B8A">${fechaLarga(f.fecha + "T00:00:00")}</span>
          <span class="flex-1 text-sm min-w-40">${escHtml(nombres.get(f.alumno_id) || "Alumno")}<br><span class="text-xs" style="color:#6C7B8A">${escHtml(f.motivo || "")}</span></span>
          <button class="jhQuitar px-2 py-1 rounded-lg text-xs font-semibold" data-i="${i}" style="background:#FBEAE8; color:#B5453A">Quitar justificación</button>
        </div>`).join("");
      res.querySelectorAll(".jhQuitar").forEach(b => b.addEventListener("click", async () => {
        const f = filas[Number(b.dataset.i)];
        if (!confirm("¿Quitar la justificación? La falta volverá a contar como inasistencia.")) return;
        try { await guardarAusenciasDia([{ alumno_id: f.alumno_id, fecha: f.fecha, justificada: false, motivo: null }]); ver(); } catch (e) { res.insertAdjacentHTML("afterbegin", errBox(escHtml(e.message))); }
      }));
    }
    $("jhVer").addEventListener("click", ver); ver();
  }
  tabRango($("jvForm"));
  tabHistorial($("jvHist"));
}

// ---------- Pestaña: consultar asistencia por día ----------
async function renderConsultaAsistencia(cont) {
  cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando grupos…</p>`;
  let grupos;
  try { grupos = await cargarGruposActivos(); } catch (e) { cont.innerHTML = errBox(escHtml(e.message)); return; }
  if (grupos.length === 0) { cont.innerHTML = errBox("No hay grupos en un ciclo escolar activo."); return; }

  cont.innerHTML = `
    <div class="max-w-2xl">
      <div class="p-3 rounded-xl bg-white border mb-3 flex flex-wrap gap-2 items-end" style="border-color:#E1DED5">
        <div><label class="block text-xs mb-1" style="color:#6C7B8A">Fecha</label>
          <input id="caFecha" type="date" value="${fechaLocalISO()}" max="${fechaLocalISO()}" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5" /></div>
        <div class="flex-1 min-w-40"><label class="block text-xs mb-1" style="color:#6C7B8A">Grado y grupo</label>
          <select id="caGrupo" class="w-full px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5">
            ${grupos.map(g => `<option value="${g.id}">${escHtml(g.etiqueta)}</option>`).join("")}
          </select></div>
        <button id="caConsultar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Consultar</button>
      </div>
      <div id="caResultado"></div>
    </div>`;
  document.getElementById("caConsultar").addEventListener("click", consultar);
  consultar();

  async function consultar() {
    const res = document.getElementById("caResultado");
    const fecha = document.getElementById("caFecha").value;
    const grupoId = document.getElementById("caGrupo").value;
    if (!fecha) { res.innerHTML = errBox("Selecciona la fecha."); return; }
    res.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Consultando…</p>`;
    try {
      const filas = await asistenciaDelDia([grupoId], fecha);
      const presentes = filas.filter(f => f.entrada).length;
      let ausMap = new Map();
      try { ausMap = await cargarAusenciasDia(filas.filter(f => !f.entrada).map(f => f.alumno.id), fecha); } catch (e) { /* tabla aún no creada */ }
      res.innerHTML = filas.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Este grupo no tiene alumnos inscritos.</p>` : `
        <p class="text-xs mb-2" style="color:#6C7B8A">${fechaLarga(fecha + "T00:00:00")} · Presentes: <strong>${presentes}</strong> de ${filas.length} · Ausentes: <strong>${filas.length - presentes}</strong></p>
        <div class="rounded-xl bg-white border overflow-x-auto" style="border-color:#E1DED5">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs" style="color:#6C7B8A"><th class="p-2">Alumno</th><th class="p-2">Entrada</th><th class="p-2">Salida</th><th class="p-2">Estado</th></tr></thead>
            <tbody>${filas.map(f => `
              <tr style="border-top:1px solid #F0EDE5; color:#1C2B3A">
                <td class="p-2">${escHtml(f.nombre)}</td>
                <td class="p-2">${f.entrada ? horaCorta(f.entrada) : "—"}</td>
                <td class="p-2">${f.salida ? horaCorta(f.salida) : "—"}</td>
                <td class="p-2 font-semibold" style="color:${f.entrada ? "#3F7A5E" : "#B5453A"}">${f.entrada ? "Presente" : `Ausente<br><select class="caJust text-xs px-1 py-1 rounded border font-normal" data-id="${f.alumno.id}" style="border-color:#E1DED5"><option value="0">Injustificada</option><option value="1" ${ausMap.get(f.alumno.id)?.justificada ? "selected" : ""}>Justificada</option></select>`}</td>
              </tr>`).join("")}</tbody>
          </table>
        </div><div id="caJustMsg" class="mt-2"></div>`;
      res.querySelectorAll(".caJust").forEach(sel => {
        sel.dataset.previo = sel.value;
        if (state.perfil.rol === "Secretaria") sel.disabled = true;   // solo Dirección y Administración justifican
        sel.addEventListener("change", async () => {
          const msg = document.getElementById("caJustMsg");
          const previo = sel.dataset.previo;
          try {
            let motivo = null;
            if (sel.value === "1") {
              const t = prompt("Motivo de la justificación (obligatorio):");
              if (t === null || !t.trim()) { sel.value = previo; msg.innerHTML = errBox("No se justificó: el motivo es obligatorio."); return; }
              motivo = t.trim();
            }
            await guardarAusenciasDia([{ alumno_id: sel.dataset.id, fecha, justificada: sel.value === "1", motivo }]);
            sel.dataset.previo = sel.value;
            msg.innerHTML = okBox("Guardado.");
          } catch (e) { sel.value = previo; msg.innerHTML = errBox(escHtml(e.message)); }
        });
      });
    } catch (e) { res.innerHTML = errBox(escHtml(e.message)); }
  }
}

// ---------- Pestaña: reporte de ausencias (9:30) ----------
const HORA_REPORTE_AUSENCIAS = { h: 9, m: 30 };   // ⚠️ CONFIGURABLE
let timerReporte930 = null;
let timerCuentaRegresiva = null;
let timerAviso930 = null;

function limpiarTimersReporte() {
  if (timerReporte930) clearTimeout(timerReporte930);
  if (timerCuentaRegresiva) clearInterval(timerCuentaRegresiva);
  timerReporte930 = null; timerCuentaRegresiva = null;
}
function limpiarTodosTimersReporte() {
  limpiarTimersReporte();
  if (timerAviso930) clearTimeout(timerAviso930);
  timerAviso930 = null;
}
function horaLimiteHoy() {
  const d = new Date();
  d.setHours(HORA_REPORTE_AUSENCIAS.h, HORA_REPORTE_AUSENCIAS.m, 0, 0);
  return d;
}
function mensajeAusencias(ausentes, fecha) {
  if (ausentes.length === 0) {
    return `Buenos días Padres de familia.\n\nLes informamos que el día de hoy se cuenta con el grupo completo.\n\nSaludos y excelente día.\nInstituto Juan Bosco.`;
  }
  return `Buenos días Padres de familia.\n\nLes informamos que el día de hoy ${fechaLarga(fecha + "T00:00:00")}\n\nse tiene la ausencia de:\n${ausentes.map(n => "• " + n).join("\n")}\n\nSaludos y excelente día.\nInstituto Juan Bosco.`;
}

async function renderReporteAusencias(cont) {
  limpiarTimersReporte();
  const limite = horaLimiteHoy();
  let forzado = false;
  let revisado = false;

  function pintarEspera() {
    const falta = limite - new Date();
    cont.innerHTML = `
      <div class="max-w-2xl p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
        <p class="text-sm font-semibold" style="color:#1E3A8A">Reporte de ausencias</p>
        <p class="text-sm mt-1" style="color:#1C2B3A">Se genera automáticamente a las <strong>${String(HORA_REPORTE_AUSENCIAS.h).padStart(2, "0")}:${String(HORA_REPORTE_AUSENCIAS.m).padStart(2, "0")}</strong>. Faltan <strong id="rpCuenta">${Math.ceil(falta / 60000)} min</strong>.</p>
        <p class="text-xs mt-1" style="color:#6C7B8A">Deja esta pantalla abierta; al llegar la hora se mostrarán los mensajes por grupo.</p>
        <button id="rpAhora" class="mt-3 px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Generar ahora (vista previa)</button>
      </div>`;
    document.getElementById("rpAhora").addEventListener("click", () => { forzado = true; limpiarTimersReporte(); generar(); });
    timerCuentaRegresiva = setInterval(() => {
      const el = document.getElementById("rpCuenta");
      if (el) el.textContent = Math.max(0, Math.ceil((limite - new Date()) / 60000)) + " min";
    }, 20000);
    timerReporte930 = setTimeout(() => { limpiarTimersReporte(); if (document.getElementById("rpAhora")) generar(); }, Math.max(0, limite - new Date()));
  }

  async function generar() {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Generando reportes…</p>`;
    try {
      const hoy = fechaLocalISO();
      const grupos = await cargarGruposActivos();
      if (grupos.length === 0) { cont.innerHTML = errBox("No hay grupos en un ciclo escolar activo."); return; }
      const filas = await asistenciaDelDia(grupos.map(g => g.id), hoy);
      const ahoraTxt = horaCorta(new Date());

      // Paso 1: revisar ausencias (justificada / injustificada) antes de generar los mensajes
      const ausentesTodos = filas.filter(f => !f.entrada);
      if (ausentesTodos.length && !revisado) {
        let ausMap = new Map();
        try { ausMap = await cargarAusenciasDia(ausentesTodos.map(f => f.alumno.id), hoy); } catch (e) { /* tabla aún no creada */ }
        cont.innerHTML = `
          <div class="max-w-2xl">
            <p class="text-sm font-bold mb-1" style="color:#1E3A8A">Revisa las ausencias de hoy</p>
            <p class="text-xs mb-3" style="color:#6C7B8A">${fechaLarga(hoy + "T00:00:00")}. ${state.perfil.rol === "Secretaria" ? "Solo Dirección o Administración pueden justificar faltas (sección Justificar faltas)." : "Marca si cada ausencia es justificada o no."} Las justificadas no afectan la calificación del criterio de asistencia. Las demás cuentan como inasistencia aunque el profesor haya marcado asistencia.</p>
            ${grupos.map(g => {
              const aus = ausentesTodos.filter(f => f.grupo_id === g.id);
              if (!aus.length) return "";
              return `<div class="p-3 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
                <p class="text-sm font-bold mb-2" style="color:#1E3A8A">${escHtml(g.etiqueta)}</p>
                ${aus.map(f => `<div class="flex items-center gap-2 py-1.5 flex-wrap" style="border-top:1px solid #F0EDE5">
                  <span class="flex-1 text-sm min-w-40">${escHtml(f.nombre)}</span>
                  <select class="rvJust px-2 py-1 rounded-lg text-xs border" data-id="${f.alumno.id}" ${state.perfil.rol === "Secretaria" ? "disabled" : ""} style="border-color:#E1DED5"><option value="0">Injustificada</option><option value="1" ${ausMap.get(f.alumno.id)?.justificada ? "selected" : ""}>Justificada</option></select>
                  <input class="rvMotivo px-2 py-1 rounded-lg text-xs border" data-id="${f.alumno.id}" ${state.perfil.rol === "Secretaria" ? "disabled" : ""} placeholder="Motivo (obligatorio si es justificada)" value="${escHtml(ausMap.get(f.alumno.id)?.motivo || "")}" style="border-color:#E1DED5" />
                </div>`).join("")}
              </div>`;
            }).join("")}
            <div id="rvMsg"></div>
            <button id="rvContinuar" class="px-4 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar y generar mensajes</button>
          </div>`;
        document.getElementById("rvContinuar").addEventListener("click", async () => {
          const btn = document.getElementById("rvContinuar");
          btn.disabled = true;
          try {
            const motivos = {};
            cont.querySelectorAll(".rvMotivo").forEach(i => { motivos[i.dataset.id] = i.value.trim() || null; });
            const sinMotivo = [...cont.querySelectorAll(".rvJust")].filter(sel => !sel.disabled && sel.value === "1" && !motivos[sel.dataset.id]);
            if (sinMotivo.length) {
              sinMotivo.forEach(sel => { const m = cont.querySelector(`.rvMotivo[data-id="${sel.dataset.id}"]`); if (m) m.style.borderColor = "#B5453A"; });
              btn.disabled = false;
              document.getElementById("rvMsg").innerHTML = errBox("Escribe el motivo de cada falta justificada (marcados en rojo).");
              return;
            }
            await guardarAusenciasDia([...cont.querySelectorAll(".rvJust")].filter(sel => state.perfil.rol !== "Secretaria" || !ausMap.get(sel.dataset.id)?.justificada).map(sel => ({ alumno_id: sel.dataset.id, fecha: hoy, justificada: sel.value === "1", motivo: sel.value === "1" ? motivos[sel.dataset.id] : null })));
            revisado = true;
            generar();
          } catch (e) { btn.disabled = false; document.getElementById("rvMsg").innerHTML = errBox(escHtml(e.message)); }
        });
        return;
      }

      const tarjetas = grupos.map((g, i) => {
        const delGrupo = filas.filter(f => f.grupo_id === g.id);
        if (delGrupo.length === 0) return "";
        const ausentes = delGrupo.filter(f => !f.entrada).map(f => f.nombre);
        return { g, i, ausentes, total: delGrupo.length, texto: mensajeAusencias(ausentes, hoy) };
      }).filter(Boolean);

      cont.innerHTML = `
        <div class="max-w-2xl">
          <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
            <p class="text-xs" style="color:#6C7B8A">${fechaLarga(hoy + "T00:00:00")} · generado a las ${ahoraTxt}${forzado && new Date() < limite ? " (vista previa antes de la hora)" : ""}</p>
            <span class="flex gap-2"><button id="rpRevisar" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:#1E3A8A">Revisar ausencias</button>
            <button id="rpActualizar" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:#1E3A8A">Actualizar</button></span>
          </div>
          ${tarjetas.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">No hay alumnos inscritos en los grupos activos.</p>` : tarjetas.map((t, k) => `
            <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
              <div class="flex justify-between gap-2 mb-2">
                <p class="text-sm font-bold" style="color:#1E3A8A">${escHtml(t.g.etiqueta)}</p>
                <span class="text-xs font-semibold" style="color:${t.ausentes.length ? "#B5453A" : "#3F7A5E"}">${t.ausentes.length ? t.ausentes.length + " ausente(s) de " + t.total : "Grupo completo"}</span>
              </div>
              <textarea id="rpTxt_${k}" rows="${Math.min(14, 7 + t.ausentes.length)}" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">${escHtml(t.texto)}</textarea>
              <div class="flex gap-2 flex-wrap mt-2">
                <button class="rpCopiar px-3 py-2 rounded-lg text-sm font-bold" data-k="${k}" style="background:#1E3A8A; color:#fff">Copiar mensaje</button>
                <button class="rpWa px-3 py-2 rounded-lg text-sm font-semibold" data-k="${k}" style="background:#E6F0EA; color:#25804B">Abrir WhatsApp</button>
              </div>
            </div>`).join("")}
        </div>`;

      document.getElementById("rpActualizar").addEventListener("click", generar);
      document.getElementById("rpRevisar").addEventListener("click", () => { revisado = false; generar(); });
      cont.querySelectorAll(".rpCopiar").forEach(b => b.addEventListener("click", async () => {
        const ok = await copiarTexto(document.getElementById("rpTxt_" + b.dataset.k).value);
        const orig = "Copiar mensaje";
        b.textContent = ok ? "¡Copiado!" : "No se pudo copiar";
        setTimeout(() => { b.textContent = orig; }, 1800);
      }));
      cont.querySelectorAll(".rpWa").forEach(b => b.addEventListener("click", () => {
        window.open("https://wa.me/?text=" + encodeURIComponent(document.getElementById("rpTxt_" + b.dataset.k).value), "_blank");
      }));
    } catch (e) { cont.innerHTML = errBox(escHtml(e.message)); }
  }

  if (new Date() >= limite) generar(); else pintarEspera();
}

// ---------- Reglamento escolar ----------
// Texto base propuesto. Se puede editar en Oficios y Documentos > Reglamento escolar (queda guardado en la base de datos).
// Formato: líneas que empiezan con "## " son títulos; el resto son párrafos.
function reglamentoPorDefecto(nivel) {
  const alumnoTxt = nivel === "Preparatoria" ? "estudiantes de Preparatoria" : "alumnos de Secundaria";
  return `## I. Disposiciones generales
El presente reglamento tiene por objeto regular la convivencia, el orden y el buen funcionamiento de ${nivel === "Preparatoria" ? "Preparatoria Juan Bosco" : "Juan Bosco " + (nivel || "")}. Es de observancia obligatoria para todos los ${alumnoTxt} y para sus padres, madres o tutores desde el momento de la inscripción.
La inscripción implica el conocimiento y la aceptación de este reglamento. La Dirección podrá actualizarlo y lo dará a conocer oportunamente a los padres de familia.

## II. Asistencia y puntualidad
El alumno debe asistir puntualmente a todas sus clases y actividades escolares. La entrada y salida de las instalaciones se registra en el control de acceso del plantel.
Las inasistencias deberán justificarse por el padre, madre o tutor ante la Dirección o Secretaría, de preferencia el mismo día o a más tardar al reincorporarse.
Los retardos y las inasistencias reiteradas podrán afectar la evaluación y serán comunicados a los padres de familia.

## III. Uniforme y presentación personal
El alumno debe presentarse aseado y con el uniforme completo que establezca el plantel, tanto en clases como en actividades oficiales.
Cualquier excepción deberá ser autorizada por la Dirección.

## IV. Conducta y disciplina
Se espera un trato respetuoso hacia compañeros, docentes, personal y visitantes, así como el cuidado de las instalaciones, el mobiliario y los materiales.
Están prohibidos: las agresiones físicas o verbales, el acoso o intimidación (incluso por medios digitales), el robo, el daño a bienes del plantel o de terceros, la introducción o consumo de tabaco, alcohol o sustancias ilegales, y portar objetos que pongan en riesgo la seguridad de las personas.
Las faltas se atenderán de forma progresiva: aviso a los padres de familia en faltas leves; citatorio y reunión con acuerdos en faltas graves, que quedarán por escrito y firmados por el tutor, la Dirección y un testigo. Las faltas graves o reiteradas podrán dar lugar a las sanciones que determine la Dirección, hasta la suspensión o baja del plantel, respetando siempre el derecho del alumno y de su familia a ser escuchados.

## V. Evaluación académica
La evaluación se realiza conforme a los criterios que cada docente da a conocer al inicio de cada periodo. Las calificaciones se expresan en números enteros, con mínimo de 5 y máximo de 10.
El alumno debe cumplir con tareas, trabajos y evaluaciones en las fechas indicadas. Cualquier conducta deshonesta (copia, plagio o suplantación) será sancionada.

## VI. Uso de teléfonos celulares y tecnología
El uso de celulares y dispositivos electrónicos durante las clases solo se permite con autorización del docente y con fines académicos. El plantel no se responsabiliza por la pérdida o daño de objetos personales.

## VII. Seguridad y salidas
Ningún alumno podrá salir de las instalaciones durante el horario escolar sin autorización de la Dirección y, de ser necesario, la presencia o autorización del padre, madre o tutor. Al finalizar la jornada, los alumnos serán entregados a las personas autorizadas por la familia.

## X. Casos no previstos
Cualquier situación no prevista en este reglamento será resuelta por la Dirección del plantel.`;
}
async function cargarReglamento(nivel) {
  try {
    const { data } = await sb.from("reglamento_escolar").select("contenido, version").eq("nivel", nivel || "").maybeSingle();
    if (data && data.contenido && data.contenido.trim()) return { contenido: data.contenido, version: data.version || 1, personalizado: true };
  } catch (e) { /* tabla aún no creada: se usa el texto base */ }
  return { contenido: reglamentoPorDefecto(nivel), version: 0, personalizado: false };
}
function reglamentoHtml(texto) {
  return String(texto).split("\n").map(l => l.trim()).filter(Boolean).map(l =>
    l.startsWith("## ") ? `<p class="text-xs font-bold mt-3" style="color:#1E3A8A">${escHtml(l.slice(3))}</p>` : `<p class="text-xs" style="text-align:justify; margin-top:3px">${escHtml(l)}</p>`).join("");
}

// Toma varias muestras del rostro (una sola persona, de frente y suficientemente cerca).
async function capturarMuestras(video, estadoEl, cantidad) {
  const muestras = [];
  let intentos = 0;
  while (muestras.length < cantidad && intentos < 80) {
    if (!camStream) throw new Error("La cámara se detuvo.");
    intentos++;
    const dets = await faceapi.detectAllFaces(video, opcionesDetector()).withFaceLandmarks().withFaceDescriptors();
    if (dets.length === 1 && dets[0].detection.score >= 0.7 && dets[0].detection.box.width / video.videoWidth >= 0.25) {
      muestras.push(dets[0].descriptor);
      estadoEl.textContent = `Muestra ${muestras.length} de ${cantidad}… mantén la mirada al frente.`;
      await esperar(500);
    } else {
      estadoEl.textContent = dets.length > 1 ? "Debe aparecer solo una persona en la cámara." : "Acerca el rostro y mira de frente a la cámara…";
      await esperar(250);
    }
  }
  if (muestras.length < cantidad) throw new Error("No se logró capturar el rostro. Intenta de nuevo con mejor luz y mirando de frente.");
  return muestras;
}

      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nivel</label>
      <select id="matNivel" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
        <option ${estado.nivel === "Secundaria" ? "selected" : ""}>Secundaria</option>
        <option ${estado.nivel === "Preparatoria" ? "selected" : ""}>Preparatoria</option>
      </select>`;
    const enlazarNivel = () => document.getElementById("matNivel").addEventListener("change", e => { estado.nivel = e.target.value; estado.ciclo = null; estado.grado = null; renderMaterias(cont, estado); });

    if (!estado.ciclo) {
      cont.innerHTML = `<div class="max-w-lg"><div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">${selNivel}
        <p class="text-sm" style="color:#6C7B8A">No hay ningún ciclo escolar de ${estado.nivel}. Las materias pertenecen a un ciclo y a un grado: crea primero el ciclo en "Alumnos y Grupos → Ciclos Escolares".</p></div></div>`;
      enlazarNivel(); return;
    }
    const gradosCiclo = todosGrados.filter(g => g.ciclo_escolar_id === estado.ciclo).sort((a, b) => a.numero - b.numero);
    const selCiclo = `
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Ciclo escolar</label>
      <select id="matCiclo" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
        ${ciclos.map(c => `<option value="${c.id}" ${c.id === estado.ciclo ? "selected" : ""}>${escHtml(c.nombre)}${c.activo ? " (Activo)" : ""}</option>`).join("")}
      </select>`;
    const enlazarCiclo = () => document.getElementById("matCiclo").addEventListener("change", e => { estado.ciclo = e.target.value; estado.grado = null; renderMaterias(cont, estado); });
    if (gradosCiclo.length === 0) {
      cont.innerHTML = `<div class="max-w-lg"><div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">${selNivel}${selCiclo}
        <p class="text-sm" style="color:#B5453A">Este ciclo no tiene grados. Primero agrégalos en "Alumnos y Grupos → Grados" para poder registrar materias.</p></div></div>`;
      enlazarNivel(); enlazarCiclo(); return;
    }
    if (!estado.grado || !gradosCiclo.find(g => g.id === estado.grado)) estado.grado = gradosCiclo[0].id;
    const grado = gradosCiclo.find(g => g.id === estado.grado);
    const delGrado = materias.filter(m => m.grado_id === grado.id).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
    const contar = g => materias.filter(m => m.grado_id === g.id).length;

    // Ciclos que ya tienen materias (para copiar). Preparatoria repite cada 2 ciclos; Secundaria, el inmediato anterior.
    const otrosCiclos = ciclos.filter(c => c.id !== estado.ciclo && materias.some(m => m.ciclo_escolar_id === c.id));
    const cicloActual = ciclos.find(c => c.id === estado.ciclo);
    let sugerido = null;
    const mm = /^(\d{4})-(\d{4})(?: ([AB]))?$/.exec(String(cicloActual.nombre).trim());
    if (mm) {
      const objetivo = `${Number(mm[1]) - 1}-${Number(mm[2]) - 1}` + (mm[3] ? " " + mm[3] : "");
      const c = otrosCiclos.find(x => String(x.nombre).trim() === objetivo);
      if (c) sugerido = c.id;
    }
    if (!sugerido && estado.nivel === "Secundaria") { const c = otrosCiclos.find(x => x.fecha_inicio < cicloActual.fecha_inicio); if (c) sugerido = c.id; }

    cont.innerHTML = `
      <div class="max-w-lg">
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Materias por grado</p>
          ${selNivel}${selCiclo}
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">${estado.nivel === "Preparatoria" ? "Semestre" : "Grado"}</label>
          <select id="matGrado" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${gradosCiclo.map(g => `<option value="${g.id}" ${g.id === estado.grado ? "selected" : ""}>${escHtml(g.nombre)} (${contar(g)} materias)</option>`).join("")}
          </select>
          <div class="flex gap-2">
            <input id="matNombre" placeholder="Nombre de la materia de ${escHtml(grado.nombre)}" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <button id="matGuardar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Agregar</button>
          </div>
          <div id="matMsg" class="mt-2"></div>
        </div>

        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-1" style="color:#1E3A8A">Cargar materias rápidamente</p>
          <p class="text-xs mb-2" style="color:#6C7B8A">${estado.nivel === "Preparatoria"
            ? "En Preparatoria las materias se repiten cada 2 ciclos: el ciclo A repite las del ciclo A del año escolar anterior, y el B las del B."
            : "En Secundaria las materias son las mismas cada ciclo, salvo que haya una reforma (después de copiarlas puedes agregar o quitar)."} No duplica las que ya existen.</p>
          ${estado.nivel === "Preparatoria" ? `
          <div class="flex gap-2 flex-wrap mb-2">
            <button id="matPlanUno" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#EEF2FB; color:#1E3A8A">Plan de ${escHtml(grado.nombre)}</button>
            <button id="matPlanTodos" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#EEF2FB; color:#1E3A8A">Plan de todos los semestres del ciclo (${gradosCiclo.map(g => g.numero + "º").join(", ")})</button>
          </div>` : ""}
          ${otrosCiclos.length ? `
          <div class="flex gap-2 items-center flex-wrap">
            <select id="matOrigen" class="px-2 py-1.5 rounded-lg text-xs border" style="border-color:#E1DED5">${otrosCiclos.map(c => `<option value="${c.id}" ${c.id === sugerido ? "selected" : ""}>${escHtml(c.nombre)}${c.id === sugerido ? " (sugerido)" : ""}</option>`).join("")}</select>
            <button id="matCopiar" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#EEF2FB; color:#1E3A8A">Copiar materias de este ciclo (todos los grados)</button>
          </div>` : ""}
        </div>

        <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">${escHtml(grado.nombre)}: ${delGrado.length} materia(s)</p>
        ${delGrado.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Este grado aún no tiene materias.</p>` : delGrado.map(m => `
          <div class="flex items-center justify-between p-2 rounded-lg bg-white border mb-1 text-sm" style="border-color:#E1DED5; color:#1E3A8A">
            <span>${escHtml(m.nombre)}</span>
            <button class="matDel px-2 py-1 rounded-lg text-xs font-semibold" data-id="${m.id}" style="background:#F5E4E1; color:#B5453A">Quitar</button>
          </div>`).join("")}
      </div>`;

    enlazarNivel(); enlazarCiclo();
    document.getElementById("matGrado").addEventListener("change", e => { estado.grado = e.target.value; renderMaterias(cont, estado); });
    const msg = () => document.getElementById("matMsg");
    // filas: [{ grado, nombre }]
    async function insertar(filas) {
      const ya = new Set(materias.filter(m => m.ciclo_escolar_id === estado.ciclo).map(m => m.grado_id + "|" + m.nombre.trim().toUpperCase()));
      const nuevas = []; const vistos = new Set();
      filas.forEach(f => { const n = f.nombre.trim().toUpperCase(); const k = f.grado.id + "|" + n; if (n && !ya.has(k) && !vistos.has(k)) { vistos.add(k); nuevas.push({ nombre: n, nivel: estado.nivel, ciclo_escolar_id: estado.ciclo, grado_id: f.grado.id }); } });
      if (nuevas.length === 0) { msg().innerHTML = errBox("No hay materias nuevas que agregar: ya existen."); return; }
      const { error } = await sb.from("materias").insert(nuevas);
      if (error) { msg().innerHTML = errBox(escHtml(error.message)); return; }
      renderMaterias(cont, estado);
    }
    document.getElementById("matGuardar").addEventListener("click", () => {
      const nombre = document.getElementById("matNombre").value.trim();
      msg().innerHTML = "";
      if (!nombre) { msg().innerHTML = errBox("Escribe el nombre de la materia."); return; }
      if (delGrado.some(m => m.nombre.trim().toUpperCase() === nombre.toUpperCase())) { msg().innerHTML = errBox("Esa materia ya existe en este grado."); return; }
      insertar([{ grado, nombre }]);
    });
    const b1 = document.getElementById("matPlanUno");
    if (b1) b1.addEventListener("click", () => {
      const lista = PLAN_PREPA[grado.numero];
      if (!lista) { msg().innerHTML = errBox("No hay plan de estudios cargado para este semestre."); return; }
      insertar(lista.map(nombre => ({ grado, nombre })));
    });
    const b2 = document.getElementById("matPlanTodos");
    if (b2) b2.addEventListener("click", () => insertar(gradosCiclo.flatMap(g => (PLAN_PREPA[g.numero] || []).map(nombre => ({ grado: g, nombre })))));
    const bc = document.getElementById("matCopiar");
    if (bc) bc.addEventListener("click", () => {
      const origen = document.getElementById("matOrigen").value;
      const numPorGrado = new Map(todosGrados.filter(g => g.ciclo_escolar_id === origen).map(g => [g.id, g.numero]));
      const filas = [];
      materias.filter(m => m.ciclo_escolar_id === origen).forEach(m => {
        const destino = gradosCiclo.find(g => g.numero === numPorGrado.get(m.grado_id));
        if (destino) filas.push({ grado: destino, nombre: m.nombre });
      });
      if (filas.length === 0) { msg().innerHTML = errBox("Ese ciclo no tiene materias en grados equivalentes a los de este ciclo."); return; }
      insertar(filas);
    });
    document.querySelectorAll(".matDel").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("¿Quitar esta materia?")) return;
      const { error } = await sb.from("materias").delete().eq("id", b.dataset.id);
      if (error) { msg().innerHTML = errBox(/foreign key|violates/i.test(error.message) ? "No se puede quitar: ya está asignada a un grupo." : escHtml(error.message)); return; }
      renderMaterias(cont, estado);
    }));
  }

  // ---------- Asignaciones ----------
  async function renderAsignaciones(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;

    const [ciclosRes, materiasRes, profesRes] = await Promise.all([
      sb.from("ciclos_escolares").select("*").order("fecha_inicio", { ascending: false }),
      sb.from("materias").select("*").order("nombre"),
      sb.from("perfiles").select("id, nombre_completo").or("rol.eq.Profesor,es_catedratico.eq.true").eq("activo", true).order("nombre_completo"),
    ]);
    if (ciclosRes.error) { cont.innerHTML = errBox(ciclosRes.error.message); return; }

    const todosCiclos = ciclosRes.data || [];
    const todasMaterias = materiasRes.data || [];
    const profesores = profesRes.data || [];

    let nivelSel = "Secundaria";
    let cicloSel = null;
    let grupoSel = null;

    async function pintar() {
      const ciclosNivel = todosCiclos.filter(c => c.nivel === nivelSel);
      const cicloActivo = ciclosNivel.find(c => c.activo) || ciclosNivel[0];
      if (!cicloSel || !ciclosNivel.find(c => c.id === cicloSel)) cicloSel = cicloActivo ? cicloActivo.id : null;

      if (!cicloSel) {
        cont.innerHTML = `
          <div class="max-w-lg">${nivelSelectHtml()}
            <p class="text-sm mt-3" style="color:#6C7B8A">No hay ciclos de ${nivelSel} capturados.</p>
          </div>`;
        document.getElementById("asNivelSel").addEventListener("change", e => { nivelSel = e.target.value; cicloSel = null; grupoSel = null; pintar(); });
        return;
      }

      const { data: grupos, error: errGrupos } = await sb.from("grupos").select("id, letra, grado_id, grados(nombre)").eq("ciclo_escolar_id", cicloSel).order("letra");
      if (errGrupos) { cont.innerHTML = errBox(errGrupos.message); return; }

      if (!grupoSel || !(grupos || []).find(g => g.id === grupoSel)) grupoSel = grupos && grupos[0] ? grupos[0].id : null;

      const gradoDelGrupo = (grupos || []).find(g => g.id === grupoSel)?.grado_id;
      const materiasNivel = todasMaterias.filter(m => m.nivel === nivelSel && m.ciclo_escolar_id === cicloSel && m.grado_id === gradoDelGrupo);

      let asignaciones = [];
      if (grupoSel) {
        const { data } = await sb
          .from("profesor_materias_grupos")
          .select("id, perfiles(nombre_completo), materias(nombre)")
          .eq("grupo_id", grupoSel)
          .eq("ciclo_escolar_id", cicloSel);
        asignaciones = data || [];
      }

      cont.innerHTML = `
        <div class="max-w-lg">
          ${nivelSelectHtml()}

          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Ciclo escolar (${nivelSel})</label>
          <select id="asCicloSel" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${ciclosNivel.map(c => `<option value="${c.id}" ${c.id === cicloSel ? "selected" : ""}>${c.nombre}${c.activo ? " (Activo)" : ""}</option>`).join("")}
          </select>

          ${(grupos || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">No hay grupos capturados para este ciclo.</p>` : `
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Grupo</label>
          <select id="asGrupoSel" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${grupos.map(g => `<option value="${g.id}" ${g.id === grupoSel ? "selected" : ""}>${g.grados.nombre} "${g.letra}"</option>`).join("")}
          </select>

          <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
            <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Nueva asignación</p>
            ${materiasNivel.length === 0 ? `<p class="text-sm mb-2" style="color:#B5453A">Este grado no tiene materias en este ciclo. Primero agrégalas en la pestaña "Materias" para poder asignarlas.</p>` : ""}
            <div class="grid grid-cols-2 gap-2 mb-2">
              <select id="asProfesorSel" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                ${profesores.map(p => `<option value="${p.id}">${p.nombre_completo}</option>`).join("")}
              </select>
              <select id="asMateriaSel" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                ${materiasNivel.map(m => `<option value="${m.id}">${m.nombre}</option>`).join("")}
              </select>
            </div>
            <div id="asMsg"></div>
            <button id="asAsignarBtn" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Asignar</button>
          </div>

          <div class="space-y-2">
            ${asignaciones.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin asignaciones para este grupo.</p>` : asignaciones.map(a => `
              <div class="p-3 rounded-xl bg-white border flex items-center justify-between" style="border-color:#E1DED5">
                <div>
                  <p class="text-sm font-semibold" style="color:#1E3A8A">${a.materias.nombre}</p>
                  <p class="text-xs" style="color:#6C7B8A">${a.perfiles.nombre_completo}</p>
                </div>
                <button class="asQuitarBtn px-2 py-1 rounded-lg text-xs font-semibold" data-id="${a.id}" style="background:#F5E4E1; color:#B5453A">Quitar</button>
              </div>`).join("")}
          </div>
          `}
        </div>`;

      document.getElementById("asNivelSel").addEventListener("change", e => { nivelSel = e.target.value; cicloSel = null; grupoSel = null; pintar(); });
      document.getElementById("asCicloSel").addEventListener("change", e => { cicloSel = e.target.value; grupoSel = null; pintar(); });

      const grupoSelEl = document.getElementById("asGrupoSel");
      if (grupoSelEl) {
        grupoSelEl.addEventListener("change", e => { grupoSel = e.target.value; pintar(); });

        document.getElementById("asAsignarBtn").addEventListener("click", async () => {
          const msg = document.getElementById("asMsg");
          msg.innerHTML = "";
          const profesor_id = document.getElementById("asProfesorSel").value;
          const materia_id = document.getElementById("asMateriaSel").value;
          if (!profesor_id || !materia_id) { msg.innerHTML = errBox("Selecciona profesor y materia."); return; }
          const { error } = await sb.from("profesor_materias_grupos").insert({
            profesor_id, materia_id, grupo_id: grupoSel, ciclo_escolar_id: cicloSel,
          });
          if (error) { msg.innerHTML = errBox(error.message); return; }
          pintar();
        });

        cont.querySelectorAll(".asQuitarBtn").forEach(b => b.addEventListener("click", async () => {
          await sb.from("profesor_materias_grupos").delete().eq("id", b.dataset.id);
          pintar();
        }));
      }
    }

    function nivelSelectHtml() {
      return `
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nivel</label>
        <select id="asNivelSel" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
          <option value="Secundaria" ${nivelSel === "Secundaria" ? "selected" : ""}>Secundaria</option>
          <option value="Preparatoria" ${nivelSel === "Preparatoria" ? "selected" : ""}>Preparatoria</option>
        </select>`;
    }

    pintar();
  }
}

// ============================================================
// Módulo Aviso de Privacidad
// ============================================================
async function renderAvisoPrivacidad(main) {
  const esAdmin = state.perfil.rol === "Administrador";
  main.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;

  const { data: datos, error } = await sb.from("datos_institucion").select("*").eq("id", 1).single();
  if (error) { main.innerHTML = errBox(error.message); return; }

  function val(campo, textoVacio) {
    return datos[campo] && datos[campo].trim() ? datos[campo] : `<span style="color:#B5453A">[${textoVacio}]</span>`;
  }

  let docTipo = "Secundaria"; // Secundaria | Preparatoria | Docentes
  let docenteId = "";
  let docentes = [];
  try {
    const { data: perfs } = await sb.rpc("personal_para_acceso");
    docentes = (perfs || []).filter(p => p.rol === "Profesor" && p.activo !== false).sort((a, b) => (a.nombre_completo || "").localeCompare(b.nombre_completo || "", "es"));
  } catch (e) { docentes = []; }

  function pintar() {
    const esDoc = docTipo === "Docentes";
    const nomPlantel = esDoc ? (datos.nombre_oficial && datos.nombre_oficial.trim() ? datos.nombre_oficial : "Juan Bosco Instituto") : PLANTEL_NOMBRE[docTipo];
    const logoSrc = document.getElementById("headerLogo")?.src || "";
    const docente = docentes.find(d => d.id === docenteId);
    const rsp = `<strong>${escHtml(nomPlantel)}</strong>`;
    main.innerHTML = `
      <h2 class="text-lg font-bold mb-4" style="color:#1E3A8A">Aviso de Privacidad</h2>
      <div class="max-w-2xl">
        <div class="p-4 rounded-xl bg-white border mb-4" style="border-color:#E1DED5">
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Aviso a mostrar</label>
          <select id="avTipoSel" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
            <option value="Secundaria" ${docTipo === "Secundaria" ? "selected" : ""}>Alumnos de Secundaria (Juan Bosco Secundaria)</option>
            <option value="Preparatoria" ${docTipo === "Preparatoria" ? "selected" : ""}>Alumnos de Preparatoria (Preparatoria Juan Bosco)</option>
            <option value="Docentes" ${esDoc ? "selected" : ""}>Docentes (general, ambos niveles)</option>
          </select>
          ${esDoc ? `<label class="block text-xs font-semibold mt-3 mb-1" style="color:#6C7B8A">Docente (opcional: si no eliges, el nombre queda en blanco para llenarlo a mano)</label>
          <select id="avDocenteSel" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
            <option value="">— En blanco —</option>
            ${docentes.map(d => `<option value="${d.id}" ${d.id === docenteId ? "selected" : ""}>${escHtml(d.nombre_completo)}</option>`).join("")}
          </select>` : ""}
        </div>
        ${esAdmin ? `
        <div class="p-4 rounded-xl bg-white border mb-4" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Datos del instituto (se usan en el aviso y en futuros documentos)</p>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <textarea id="diNombre" rows="2" placeholder="Nombre / razón social oficial (puedes usar 2 líneas)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">${datos.nombre_oficial || ""}</textarea>
            <input id="diRfc" placeholder="RFC (opcional)" value="${datos.rfc || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          </div>
          <input id="diDomicilio" placeholder="Domicilio completo" value="${datos.domicilio || ""}" class="w-full px-2 py-1.5 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
          <div class="grid grid-cols-3 gap-2 mb-2">
            <input id="diCiudad" placeholder="Ciudad" value="${datos.ciudad || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="diTelefono" placeholder="Teléfono" value="${datos.telefono || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />

const COL_CONCEPTOS = ["Inscripción", "Cuota inicial", "Colegiatura mensual", "Colegiatura bimestral", "Ciclo completo"];
const COL_DIA_VENCIMIENTO = 10; // día del mes en que vence cada colegiatura
const COL_FORMAS = ["Efectivo", "Transferencia", "Depósito", "Tarjeta", "Cheque"];
const COL_MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const mxn = n => Number(n || 0).toLocaleString("es-MX", { style: "currency", currency: "MXN" });

function colMesesDelCiclo(ciclo) {
  const [y1, m1] = ciclo.fecha_inicio.split("-").map(Number);
  const [y2, m2] = ciclo.fecha_fin.split("-").map(Number);
  const out = [];
  let y = y1, m = m1;
  while (y < y2 || (y === y2 && m <= m2)) { out.push({ y, m }); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
const colFecha = (y, m, d) => `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

// Porcentaje de exención que aplica a un concepto (el mayor de las vigentes). "Otro" nunca se exenta automáticamente.
function colPorcentaje(exenciones, concepto, cicloId) {
  if (concepto === "Otro") return 0;
  const grupo = concepto.startsWith("Colegiatura") || concepto === "Ciclo completo" ? "Colegiatura" : concepto;
  let max = 0;
  (exenciones || []).forEach(e => {
    if (e.activo === false) return;
    if (e.ciclo_escolar_id && e.ciclo_escolar_id !== cicloId) return;
    if (e.concepto && e.concepto !== grupo) return;
    max = Math.max(max, Number(e.porcentaje));
  });
  return max;
}

// Construye los cargos de un alumno para un ciclo. tarifas: { concepto: monto }.
function colConstruirCargos(alumnoId, ciclo, modalidad, tarifas, exenciones) {
  const filas = [];
  const meses = colMesesDelCiclo(ciclo);
  const [y0, m0] = ciclo.fecha_inicio.split("-").map(Number);
  const agregar = (concepto, descripcion, venc, orden) => {
    const base = Number(tarifas[concepto]);
    if (!(base > 0)) return;
    const pct = colPorcentaje(exenciones, concepto, ciclo.id);
    const desc = Math.round(base * pct) / 100;
    filas.push({ alumno_id: alumnoId, ciclo_escolar_id: ciclo.id, concepto, descripcion, orden, fecha_vencimiento: venc,
      monto_original: base, descuento: desc, monto: Math.round((base - desc) * 100) / 100 });
  };
  agregar("Inscripción", "Inscripción", colFecha(y0, m0, 1), 0);
  agregar("Cuota inicial", "Cuota inicial", colFecha(y0, m0, 1), 1);
  if (modalidad === "Mensual") {
    meses.forEach((x, i) => agregar("Colegiatura mensual", `Colegiatura ${COL_MESES[x.m - 1]} ${x.y}`, colFecha(x.y, x.m, COL_DIA_VENCIMIENTO), 10 + i));
  } else if (modalidad === "Bimestral") {
    for (let i = 0; i < meses.length; i += 2) {
      const a = meses[i], b = meses[i + 1];
      const rango = b ? `${COL_MESES[a.m - 1]}–${COL_MESES[b.m - 1]} ${b.y}` : `${COL_MESES[a.m - 1]} ${a.y}`;
      agregar("Colegiatura bimestral", `Colegiatura bimestre ${i / 2 + 1} (${rango})`, colFecha(a.y, a.m, COL_DIA_VENCIMIENTO), 10 + i / 2);
    }
  } else {
    agregar("Ciclo completo", "Colegiatura del ciclo completo", colFecha(y0, m0, COL_DIA_VENCIMIENTO), 10);
  }
  return filas;
}

// Imprime solo lo indicado: copia los bloques a un contenedor de impresión y oculta el resto de la app
// (así no salen hojas en blanco y el documento ocupa toda la hoja carta).
function imprimirElementos(els) {
  const visibles = els.filter(e => e && e.offsetParent !== null);
  if (!visibles.length) { window.print(); return; }
  document.getElementById("ibPrintHost")?.remove();
  const host = document.createElement("div");
  host.id = "ibPrintHost";
  visibles.forEach(e => { const c = e.cloneNode(true); c.removeAttribute("id"); host.appendChild(c); });
  document.body.appendChild(host);
  document.body.classList.add("ib-imprimiendo");
  const limpiar = () => { document.body.classList.remove("ib-imprimiendo"); host.remove(); };
  window.addEventListener("afterprint", limpiar, { once: true });
  setTimeout(() => window.print(), 50);
  setTimeout(limpiar, 120000);
}
function imprimirSolo(id) {
  const el = id ? document.getElementById(id) : null;
  imprimirElementos(el ? [el] : [...document.querySelectorAll(".ib-imprimible")]);
}

// Fechas dd/mm/aaaa <-> ISO (aaaa-mm-dd)
function fechaDMY(iso) { if (!iso) return ""; const [y, m, d] = String(iso).slice(0, 10).split("-"); return `${d}/${m}/${y}`; }
function fechaDesdeDMY(txt) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(txt || "").trim());
  if (!m) return null;
  const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
  const f = new Date(y, mo - 1, d);
  if (y < 2000 || f.getFullYear() !== y || f.getMonth() !== mo - 1 || f.getDate() !== d) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function colALetras(n) {
  const U = ["", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez", "once", "doce", "trece", "catorce", "quince",
    "dieciséis", "diecisiete", "dieciocho", "diecinueve", "veinte", "veintiuno", "veintidós", "veintitrés", "veinticuatro", "veinticinco", "veintiséis", "veintisiete", "veintiocho", "veintinueve"];
  const D = ["", "", "", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
  const C = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
  const menor1000 = x => {
    if (x === 100) return "cien";
    let t = "";
    const c = Math.floor(x / 100), r = x % 100;
    if (c) t += C[c] + " ";
    if (r < 30) t += U[r];
    else { t += D[Math.floor(r / 10)]; if (r % 10) t += " y " + U[r % 10]; }
    return t.trim();
  };
  const entero = Math.floor(n);
  const cent = Math.round((n - entero) * 100);
  let txt;
  if (entero === 0) txt = "cero";
  else {
    const mill = Math.floor(entero / 1000000), mil = Math.floor((entero % 1000000) / 1000), resto = entero % 1000;
    const partes = [];
    if (mill) partes.push(mill === 1 ? "un millón" : menor1000(mill) + " millones");
    if (mil) partes.push(mil === 1 ? "mil" : menor1000(mil).replace(/uno$/, "un").replace(/veintiun$/, "veintiún") + " mil");
    if (resto) partes.push(menor1000(resto));
    txt = partes.join(" ");
  }
  if (entero >= 1000000 && entero % 1000000 === 0) txt += " de";
  return (txt.charAt(0).toUpperCase() + txt.slice(1)) + ` pesos ${String(cent).padStart(2, "0")}/100 M.N.`;
}

async function colTraerTodo(mk) {
  const out = [];
  for (let i = 0; ; i += 1000) {
    const { data, error } = await mk().range(i, i + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return out;
}
