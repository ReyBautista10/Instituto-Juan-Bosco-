  async function abrirPanel(alumnoId, cicloIdInicial, tipoInicial) {
    const panel = document.getElementById("ofPanel");
    panel.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando datos del alumno…</p>`;
    let ctx;
    try { ctx = await cargarContextoOficio(alumnoId, cicloIdInicial); } catch (e) { panel.innerHTML = errBox(escHtml(e.message)); return; }
    if (!ctx.insc) { panel.innerHTML = errBox("Este alumno no tiene inscripción registrada; no se pueden generar documentos."); return; }

    panel.innerHTML = `
      <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <p class="text-sm font-semibold" style="color:#1E3A8A">${escHtml(nombreCompletoAlumno(ctx.alumno))} <span class="text-xs font-normal" style="color:#6C7B8A">(${escHtml(ctx.alumno.matricula || "")})</span></p>
        <label class="block text-xs font-semibold mt-3 mb-1" style="color:#6C7B8A">Documento</label>
        <select id="ofTipo" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">
          ${OFICIOS_TIPOS.map(t => `<option ${t.id === tipoInicial ? "selected" : ""}>${t.id}</option>`).join("")}
        </select>
        ${ctx.inscripciones.length > 1 ? `
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Ciclo escolar</label>
        <select id="ofCiclo" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">
          ${ctx.inscripciones.map(i => `<option value="${i.ciclo_escolar_id}" ${i.ciclo_escolar_id === ctx.insc.ciclo_escolar_id ? "selected" : ""}>${escHtml(i.ciclos_escolares.nombre)} — ${escHtml(i.grupos.grados.nombre)} "${escHtml(i.grupos.letra)}"</option>`).join("")}
        </select>` : ""}
        <div id="ofOpciones"></div>
        <div id="ofAvisos"></div>
      </div>
      <div id="ofVista"></div>`;

    const selTipo = document.getElementById("ofTipo");
    const selCiclo = document.getElementById("ofCiclo");
    if (selCiclo) selCiclo.addEventListener("change", () => abrirPanel(alumnoId, selCiclo.value, selTipo.value));
    selTipo.addEventListener("change", () => { pintarOpciones(); pintarVista(); });
    pintarOpciones();
    pintarVista();

    function opcionesActuales() {
      const v = id => document.getElementById(id)?.value.trim() || "";
      return {
        dirigidoA: v("opDirigido"), fin: v("opFin"), fechaBaja: v("opFechaBaja"), motivo: v("opMotivo"),
        marcarInactivo: !!document.getElementById("opInactivo")?.checked,
      };
    }

    function pintarOpciones() {
      const tipo = selTipo.value;
      const o = document.getElementById("ofOpciones");
      const input = "px-3 py-2 rounded-lg text-sm mb-2 outline-none border w-full";
      if (["Carta de buena conducta", "Constancia de estudios", "Constancia de estudios con calificaciones"].includes(tipo)) {
        o.innerHTML = `
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Dirigida a</label>
          <input id="opDirigido" value="A quien corresponda" class="${input}" style="border-color:#E1DED5" />
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Finalidad (opcional, se agrega al final del texto)</label>
          <input id="opFin" placeholder="Ej. para trámite de beca" class="${input}" style="border-color:#E1DED5" />`;
      } else if (tipo === "Formato de baja") {
        o.innerHTML = `
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Fecha de la baja</label>
          <input id="opFechaBaja" type="date" value="${fechaLocalISO()}" class="${input}" style="border-color:#E1DED5; width:auto" />
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Motivo de la baja</label>
          <textarea id="opMotivo" rows="3" class="${input}" style="border-color:#E1DED5"></textarea>
          <label class="flex items-center gap-2 text-xs mb-2" style="color:#B5453A"><input type="checkbox" id="opInactivo" /> Al emitir, marcar al alumno como inactivo en el sistema</label>`;
      } else o.innerHTML = "";
      o.querySelectorAll("input,textarea").forEach(el => el.addEventListener("input", pintarVista));
    }

    async function pintarVista() {
      const tipo = selTipo.value;
      const vista = document.getElementById("ofVista");
      const avisos = document.getElementById("ofAvisos");
      const ctxActual = ctx;
      let calif = null;
      let avisosHtml = "";
      if (!directorDelNivel(ctxActual.plantel, ctxActual.insc?.grupos?.grados?.nivel) && !["Formato de inscripción"].includes(tipo)) avisosHtml += errBox('Falta el nombre del director. Captúralo en la pestaña "Datos del plantel".');
      if (ctxActual.insc.estado && ctxActual.insc.estado !== "Inscrito" && ["Constancia de estudios", "Constancia de estudios con calificaciones", "Formato de inscripción"].includes(tipo)) avisosHtml += errBox(`La inscripción de este alumno está en estado "${escHtml(ctxActual.insc.estado)}". Verifica antes de emitir la constancia.`);
      if (ctxActual.alumno.activo === false && ["Constancia de estudios", "Constancia de estudios con calificaciones"].includes(tipo)) avisosHtml += errBox("Este alumno está marcado como inactivo.");
      if (tipo === "Carta de buena conducta" && ctxActual.reportes.total > 0) {
        avisosHtml += `<div class="text-xs mb-3 p-2 rounded-lg" style="background:${ctxActual.reportes.graves ? "#F5E4E1" : "#FDF3DC"}; color:${ctxActual.reportes.graves ? "#B5453A" : "#8A5A12"}">
          Este alumno tiene <strong>${ctxActual.reportes.total}</strong> reporte(s) de disciplina${ctxActual.reportes.graves ? `, de los cuales <strong>${ctxActual.reportes.graves}</strong> son graves o muy graves` : " (todos leves)"}. Revísalo en el módulo Disciplina antes de emitir la carta.</div>`;
      }
      avisos.innerHTML = avisosHtml;

      if (tipo === "Constancia de estudios con calificaciones") {
        try { calif = await calificacionesDeAlumno(alumnoId, ctxActual.insc); } catch (e) { vista.innerHTML = errBox(escHtml(e.message)); return; }
      }
      if (selTipo.value !== tipo) return; // el usuario cambió de opción mientras cargaba
      const op = opcionesActuales();
      vista.innerHTML = `
        <div id="ibOficioImprimible" class="ib-imprimible p-6 rounded-xl bg-white border" style="border-color:#E1DED5; width:100%; max-width:760px">${htmlOficio(tipo, ctxActual, op, null, new Date(), calif)}</div>
        <div id="ofMsg" class="mt-3"></div>
        <button id="ofEmitir" class="w-56 mx-auto block mt-2 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Emitir e imprimir</button>
        <p class="text-xs text-center mt-1" style="color:#6C7B8A">Al emitir se asigna un folio y queda registrado en "Emitidos".</p>`;
      let emitiendo = false;
      let yaEmitido = false;
      document.getElementById("ofEmitir").addEventListener("click", async () => {
        if (yaEmitido) { imprimirSolo(null); return; }
        if (emitiendo) return;
        const op2 = opcionesActuales();
        if (tipo === "Formato de baja" && op2.marcarInactivo && !confirm("Se marcará al alumno como INACTIVO en el sistema. ¿Continuar?")) return;
        emitiendo = true;
        const { data: nuevo, error } = await sb.from("oficios_emitidos").insert({
          tipo, alumno_id: alumnoId, grupo_id: ctxActual.insc.grupo_id, ciclo_escolar_id: ctxActual.insc.ciclo_escolar_id, opciones: op2,
        }).select("numero, creado_en").single();
        if (error) { emitiendo = false; document.getElementById("ofMsg").innerHTML = errBox(escHtml(error.message)); return; }
        if (tipo === "Formato de baja" && op2.marcarInactivo) await sb.from("alumnos").update({ activo: false }).eq("id", alumnoId);
        document.getElementById("ibOficioImprimible").innerHTML = htmlOficio(tipo, ctxActual, op2, folioOficio(nuevo.numero, nuevo.creado_en), nuevo.creado_en, calif);
        document.getElementById("ofEmitir").textContent = "Imprimir de nuevo";
        document.getElementById("ofMsg").innerHTML = okBox(`Documento emitido con folio ${folioOficio(nuevo.numero, nuevo.creado_en)}.`);
        emitiendo = false;
        yaEmitido = true;
        setTimeout(() => imprimirSolo(null), 200);
      }, { once: false });
    }
  }

  // ---------- Emitidos ----------
  async function renderEmitidos(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const { data, error } = await sb.from("oficios_emitidos")
      .select("id, numero, tipo, alumno_id, grupo_id, ciclo_escolar_id, opciones, creado_en, alumnos(nombres, apellido_paterno, apellido_materno, matricula)")
      .order("creado_en", { ascending: false }).limit(200);
    if (error) { cont.innerHTML = errBox(escHtml(error.message)); return; }
    const lista = data || [];
    cont.innerHTML = (lista.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Aún no se han emitido documentos.</p>` : lista.map((o, i) => `
      <div class="p-3 rounded-xl bg-white border mb-2 flex justify-between items-center gap-2" style="border-color:#E1DED5">
        <div class="min-w-0">
          <div class="text-sm font-semibold" style="color:#1E3A8A">${escHtml(o.tipo)}</div>
          <div class="text-xs" style="color:#6C7B8A">${folioOficio(o.numero, o.creado_en)} · ${escHtml(o.alumnos ? nombreCompletoAlumno(o.alumnos) : "")} · ${fechaLarga(o.creado_en)}</div>
        </div>
        <button class="ofReimp px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap" data-i="${i}" style="background:#F4F1EB; color:#1E3A8A">Ver / reimprimir</button>
      </div>`).join("")) + `<div id="ofReimpVista"></div>`;
    cont.querySelectorAll(".ofReimp").forEach(b => b.addEventListener("click", async () => {
      const o = lista[Number(b.dataset.i)];
      const caja = document.getElementById("ofReimpVista");
      caja.innerHTML = `<p class="text-xs mt-3" style="color:#6C7B8A">Generando…</p>`;
      try {
        const ctx = await cargarContextoOficio(o.alumno_id, o.ciclo_escolar_id);
        const calif = o.tipo === "Constancia de estudios con calificaciones" && ctx.insc ? await calificacionesDeAlumno(o.alumno_id, ctx.insc) : null;
        caja.innerHTML = `<div id="ibOficioImprimible" class="ib-imprimible p-6 rounded-xl bg-white border mt-4" style="border-color:#E1DED5; width:100%; max-width:760px">${htmlOficio(o.tipo, ctx, o.opciones || {}, folioOficio(o.numero, o.creado_en), o.creado_en, calif)}</div>
          <p class="text-xs mt-2" style="color:#6C7B8A">Se regenera con los datos actuales del alumno; el folio y la fecha son los de la emisión original.</p>
          <button id="ofReimpBtn" class="w-48 mx-auto block mt-2 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Imprimir</button>`;
        document.getElementById("ofReimpBtn").addEventListener("click", () => imprimirSolo(null));
        caja.scrollIntoView({ behavior: "smooth" });
      } catch (e) { caja.innerHTML = errBox(escHtml(e.message)); }
    }));
  }
}

// ============================================================
// Módulo Asistencia (por materia asignada, lista manual)
// ============================================================
function renderAsistencia(main) {
  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1E3A8A">Asistencia</h2>
    <div class="max-w-md">
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Selecciona tu clase</label>
      <select id="asiClaseSel" class="w-full px-3 py-2 rounded-lg text-sm mb-4 outline-none border" style="border-color:#E1DED5">
        <option value="">Cargando…</option>
      </select>
      <div id="asiContenido"></div>
    </div>`;

  cargarClases();

  async function cargarClases() {
    const { data, error } = await sb
      .from("profesor_materias_grupos")
      .select("id, grupo_id, ciclo_escolar_id, materias(nombre), grupos(letra, grados(nombre, nivel)), ciclos_escolares(nombre)")
      .eq("profesor_id", state.perfil.id);

    const sel = document.getElementById("asiClaseSel");
    if (error) { sel.innerHTML = `<option>Error al cargar</option>`; return; }
    const clases = (data || []).filter(c => c.materias && c.grupos && c.grupos.grados && c.ciclos_escolares);
    if (clases.length === 0) {
      sel.innerHTML = `<option value="">No tienes materias asignadas</option>`;
      return;
    }
    sel.innerHTML = `<option value="">Selecciona…</option>` + clases.map(c => `
      <option value="${c.id}">${c.materias.nombre} — ${c.grupos.grados.nombre} "${c.grupos.letra}" (${c.grupos.grados.nivel})</option>
    `).join("");
    sel.addEventListener("change", () => {
      const clase = clases.find(c => c.id === sel.value);
      if (clase) iniciarPaseLista(clase); else document.getElementById("asiContenido").innerHTML = "";
    });
  }

  async function iniciarPaseLista(clase) {
    const cont = document.getElementById("asiContenido");
    const d = new Date();
    const hoy = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando lista…</p>`;

    const [inscRes, asisRes] = await Promise.all([
      sb.from("inscripciones").select("alumno_id, alumnos(id, nombres, apellido_paterno, apellido_materno, matricula)")
        .eq("grupo_id", clase.grupo_id).eq("ciclo_escolar_id", clase.ciclo_escolar_id).eq("estado", "Inscrito"),
      sb.from("asistencia_clase").select("alumno_id").eq("asignacion_id", clase.id).eq("fecha", hoy),
    ]);
    if (inscRes.error || asisRes.error) { cont.innerHTML = errBox(((inscRes.error || asisRes.error).message)); return; }

    const alumnos = (inscRes.data || []).map(i => i.alumnos).filter(Boolean)
      .sort((a, b) => (a.apellido_paterno + a.apellido_materno + a.nombres).localeCompare(b.apellido_paterno + b.apellido_materno + b.nombres, "es"));
    const yaPresentes = new Set((asisRes.data || []).map(r => r.alumno_id));

    if (alumnos.length === 0) { cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Este grupo no tiene alumnos inscritos.</p>`; return; }

    cont.innerHTML = `
      <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
        <div class="flex justify-between items-center mb-2">
          <p class="text-xs" style="color:#6C7B8A">Pase de lista de hoy (${hoy})</p>
          <button id="asiTodosBtn" class="text-xs font-semibold px-2 py-1 rounded-lg" style="background:#F4F1EB; color:#1E3A8A">Marcar todos</button>
        </div>
        <div id="asiLista">
          ${alumnos.map(a => `
            <label class="flex items-center gap-3 py-2 border-b" style="border-color:#F0EDE5; color:#1C2B3A">
              <input type="checkbox" class="asiChk" data-id="${a.id}" ${yaPresentes.has(a.id) ? "checked" : ""} style="width:20px;height:20px" />
              <span class="text-sm">${a.apellido_paterno} ${a.apellido_materno || ""} ${a.nombres} <span class="text-xs" style="color:#6C7B8A">(${a.matricula})</span></span>
            </label>`).join("")}
        </div>
        <div id="asiMsg" class="mt-3"></div>
        <button id="asiGuardarBtn" class="w-full py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar asistencia</button>
      </div>`;

    document.getElementById("asiTodosBtn").addEventListener("click", () => {
      const chks = [...document.querySelectorAll(".asiChk")];
      const marcar = chks.some(c => !c.checked);
      chks.forEach(c => { c.checked = marcar; });
    });

    document.getElementById("asiGuardarBtn").addEventListener("click", async () => {
      const msg = document.getElementById("asiMsg");
      const btn = document.getElementById("asiGuardarBtn");
      msg.innerHTML = "";
      btn.disabled = true;
      const marcados = new Set([...document.querySelectorAll(".asiChk:checked")].map(c => c.dataset.id));
      const nuevos = [...marcados].filter(id => !yaPresentes.has(id));
      const quitados = [...yaPresentes].filter(id => !marcados.has(id));
      try {
        { // deja constancia de que la clase se impartió ese día (aunque nadie haya asistido)
          const { error: eS } = await sb.from("asistencia_sesiones").upsert({ asignacion_id: clase.id, fecha: hoy }, { onConflict: "asignacion_id,fecha", ignoreDuplicates: true });
          if (eS && eS.code !== "42P01") throw eS;
        }
        if (nuevos.length) {
          const { error } = await sb.from("asistencia_clase").insert(
            nuevos.map(id => ({ asignacion_id: clase.id, alumno_id: id, fecha: hoy, registrado_por: state.perfil.id }))
          );
          if (error && error.code !== "23505") throw error;
        }
        if (quitados.length) {
          const { error } = await sb.from("asistencia_clase").delete()
            .eq("asignacion_id", clase.id).eq("fecha", hoy).in("alumno_id", quitados);
          if (error) throw error;
        }
        yaPresentes.clear();
        marcados.forEach(id => yaPresentes.add(id));
        msg.innerHTML = okBox(`Asistencia guardada: ${marcados.size} presentes de ${alumnos.length}.`);
      } catch (e) {
        msg.innerHTML = errBox("No se pudo guardar: " + e.message);
      }
      btn.disabled = false;
    });
  }
}


init();
</script>
