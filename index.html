  // Construye el HTML de una boleta (sin botones) a partir de los datos ya cargados.
  function boletaHTML({ alumno, insc, asignaciones, criterios, valores, inst, logo, idDiv, clases }) {
    const nivel = insc.grupos.grados.nivel;
    const prefijo = nivel === "Preparatoria" ? "Bimestre" : "Parcial";
    const periodos = [1, 2, 3, 4, 5].map(n => `${prefijo} ${n}`);

    // Calificación del periodo = suma(valor × ponderación / 100). Solo se muestra si el periodo
    // ya tiene capturada al menos una calificación de este alumno.
    function calificacionPeriodo(asigId, periodo) {
      const crits = criterios.filter(c => c.asignacion_id === asigId && c.periodo === periodo);
      const conValor = crits.filter(c => valores.has(c.id));
      if (conValor.length === 0) return null;
      return calOficial(crits.reduce((t, c) => t + (valores.has(c.id) ? valores.get(c.id) * Number(c.ponderacion) / 100 : 0), 0));
    }

    const filas = asignaciones.map(a => {
      const notas = periodos.map(p => calificacionPeriodo(a.id, p));
      const capturadas = notas.filter(n => n != null);
      const promedio = capturadas.length ? calOficial(capturadas.reduce((s, n) => s + n, 0) / capturadas.length) : null;
      return { materia: a.materias.nombre, notas, promedio };
    }).sort((x, y) => x.materia.localeCompare(y.materia, "es"));

    const conPromedio = filas.filter(f => f.promedio != null);
    const general = conPromedio.length ? conPromedio.reduce((s, f) => s + f.promedio, 0) / conPromedio.length : null;
    const fmt = n => n == null ? "—" : n.toFixed(1);
    const nombreAlumno = `${alumno.apellido_paterno} ${alumno.apellido_materno || ""} ${alumno.nombres}`.trim();

    return `
      <div ${idDiv ? `id="${idDiv}"` : ""} class="ib-imprimible ib-hoja ${clases || ""} p-6 rounded-xl bg-white border" style="border-color:#E1DED5; width:100%; max-width:760px">
        <div class="flex items-center gap-3 mb-3">
          ${logo ? `<img src="${logo}" style="height:56px" alt="" />` : ""}
          <div class="flex-1 text-center">
            <div class="text-base font-semibold" style="color:#1E3A8A; white-space:pre-line">${escHtml(PLANTEL_NOMBRE[insc.grupos?.grados?.nivel] || inst.nombre_oficial || "Juan Bosco Instituto")}</div>
            <div class="text-xs" style="color:#6C7B8A">${escHtml(inst.domicilio || "")}${inst.ciudad ? ", " + escHtml(inst.ciudad) : ""}</div>
          </div>
        </div>
        <h3 class="text-sm font-bold text-center mb-3" style="color:#1E3A8A">BOLETA DE CALIFICACIONES</h3>
        <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs mb-3" style="color:#1C2B3A">
          <div><strong>Alumno:</strong> ${escHtml(nombreAlumno)}</div>
          <div><strong>Matrícula:</strong> ${escHtml(alumno.matricula || "")}</div>
          <div><strong>CURP:</strong> ${escHtml(alumno.curp || "")}</div>
          <div><strong>Ciclo escolar:</strong> ${escHtml(insc.ciclos_escolares.nombre)}</div>
          <div><strong>Nivel:</strong> ${escHtml(nivel)}</div>
          <div><strong>Grado y grupo:</strong> ${escHtml(insc.grupos.grados.nombre)} "${escHtml(insc.grupos.letra)}"</div>
        </div>
        ${filas.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Este grupo no tiene materias asignadas todavía.</p>` : `
        <table class="w-full text-xs" style="border-collapse:collapse; color:#1C2B3A">
          <thead>
            <tr style="background:#EEF2FB; color:#1E3A8A">
              <th class="text-left p-2" style="border:1px solid #D5DAE8">Materia</th>
              ${periodos.map(p => `<th class="p-2" style="border:1px solid #D5DAE8">${p.replace(prefijo + " ", prefijo.slice(0, 1) + "")}</th>`).join("")}
              <th class="p-2" style="border:1px solid #D5DAE8">Promedio</th>
            </tr>
          </thead>
          <tbody>
            ${filas.map(f => `
              <tr>
                <td class="p-2" style="border:1px solid #D5DAE8">${escHtml(f.materia)}</td>
                ${f.notas.map(n => `<td class="p-2 text-center" style="border:1px solid #D5DAE8">${fmtEntero(n)}</td>`).join("")}
                <td class="p-2 text-center font-bold" style="border:1px solid #D5DAE8">${fmtEntero(f.promedio)}</td>
              </tr>`).join("")}
            <tr style="background:#F4F1EB">
              <td class="p-2 font-bold" style="border:1px solid #D5DAE8" colspan="${periodos.length + 1}">Promedio general</td>
              <td class="p-2 text-center font-bold" style="border:1px solid #D5DAE8">${fmt(general)}</td>
            </tr>
          </tbody>
        </table>
        <p class="text-xs mt-2" style="color:#6C7B8A">${prefijo === "Parcial" ? "P1–P5: parciales" : "B1–B5: bimestres"}. Escala de 5 a 10. "—" indica que aún no hay calificación capturada.</p>`}
        <div class="ib-pie"><div class="flex justify-around mt-10 text-xs text-center" style="color:#1C2B3A">
          <div style="border-top:1px solid #1C2B3A; padding-top:4px; width:40%">${escHtml((nivel === "Preparatoria" ? inst.director_preparatoria : inst.director_secundaria) || inst.director_nombre || "")}<br>Dirección</div>
          <div style="border-top:1px solid #1C2B3A; padding-top:4px; width:40%">Sello del plantel</div>
        </div>
        <p class="text-xs mt-4" style="color:#6C7B8A">Expedida el ${new Date().toLocaleDateString("es-MX", { year: "numeric", month: "long", day: "numeric" })}.</p>
      </div>
`;
  }

  async function pintarBoleta(alumno, insc) {
    const cont = document.getElementById("boContenido");
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Generando boleta…</p>`;

    const [asigRes, instRes] = await Promise.all([
      sb.from("profesor_materias_grupos").select("id, materias(nombre)").eq("grupo_id", insc.grupo_id).eq("ciclo_escolar_id", insc.ciclo_escolar_id),
      sb.from("datos_institucion").select("nombre_oficial, domicilio, ciudad, director_nombre, director_secundaria, director_preparatoria").eq("id", 1).maybeSingle(),
    ]);
    if (asigRes.error) { cont.innerHTML = errBox(escHtml(asigRes.error.message)); return; }
    const asignaciones = (asigRes.data || []).filter(a => a.materias);
    const ids = asignaciones.map(a => a.id);

    let criterios = [];
    let califs = [];
    if (ids.length > 0) {
      const { data: crit, error: e1 } = await sb.from("criterios_evaluacion").select("id, asignacion_id, periodo, ponderacion").in("asignacion_id", ids);
      if (e1) { cont.innerHTML = errBox(escHtml(e1.message)); return; }
      criterios = crit || [];
      if (criterios.length > 0) {
        const { data: cal, error: e2 } = await sb.from("calificaciones").select("criterio_id, valor").eq("alumno_id", alumno.id).in("criterio_id", criterios.map(c => c.id));
        if (e2) { cont.innerHTML = errBox(escHtml(e2.message)); return; }
        califs = cal || [];
      }
    }

    const valores = new Map(califs.map(c => [c.criterio_id, Number(c.valor)]));
    const inst = instRes.data || {};
    const logo = document.getElementById("headerLogo")?.src || "";
    cont.innerHTML = boletaHTML({ alumno, insc, asignaciones, criterios, valores, inst, logo, idDiv: "ibBoletaImprimible" }) + `
      <button id="boImprimirBtn" class="w-48 mx-auto block mt-4 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Imprimir / Descargar PDF</button>`;
    document.getElementById("boImprimirBtn").addEventListener("click", () => imprimirSolo(null));
  }
}

function normalizarTelefonoWA(tel) {
  const d = String(tel || "").replace(/\D/g, "");
  if (d.length === 10) return "52" + d;
  if (d.length === 12 && d.startsWith("52")) return d;
  if (d.length === 13 && d.startsWith("521")) return "52" + d.slice(3);
  return d.length >= 11 ? d : null;
}
function abrirWhatsApp(tel, texto) {
  const n = normalizarTelefonoWA(tel);
  if (!n) return false;
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(texto)}`, "_blank");
  return true;
}
const PLANTEL_NOMBRE = { Secundaria: "Juan Bosco Secundaria", Preparatoria: "Preparatoria Juan Bosco" };
// Con nivel: "Juan Bosco Secundaria" / "Preparatoria Juan Bosco". Sin nivel: nombre general (solo docentes y avisos a todos).
async function cargarMembrete(nivel) {

  const d = data || {};
  const dirSec = (d.director_secundaria || d.director_nombre || "").trim(), dirPrep = (d.director_preparatoria || "").trim();
  return {
    director: nivel === "Preparatoria" ? dirPrep : nivel === "Secundaria" ? dirSec : "",
    directores: [dirSec, dirPrep].filter(Boolean),
    nombre: PLANTEL_NOMBRE[nivel] || d.nombre_oficial || "Juan Bosco Instituto",
    nivel: nivel || null,
    domicilio: d.domicilio || "",
    ciudad: d.ciudad || "",
    telefono: d.telefono || "",
    logo: document.getElementById("headerLogo")?.src || "",
  };
}

function fechaLarga(d) {
  return new Date(d).toLocaleDateString("es-MX", { year: "numeric", month: "long", day: "numeric" });
}
function fechaHoraLarga(d) {
  const f = new Date(d);
  return `${fechaLarga(f)} a las ${f.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" })} horas`;
}
function aInputDatetime(d) {

  return `${f.getFullYear()}-${p(f.getMonth() + 1)}-${p(f.getDate())}T${p(f.getHours())}:${p(f.getMinutes())}`;
}

    function pintarLista() {
      const q = normalizarTexto(document.getElementById("dsFiltroTexto").value);
      const est = document.getElementById("dsFiltroEstado").value;
      const f = reportes.filter(r => (!est || r.estado === est) && (!q || normalizarTexto(nombreCompletoAlumno(r.alumnos)).includes(q)));
      document.getElementById("dsLista").innerHTML = f.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin reportes.</p>` : f.map(r => `
        <button class="dsAbrir w-full text-left p-3 rounded-xl bg-white border mb-2" data-id="${r.id}" style="border-color:#E1DED5">
          <div class="flex justify-between gap-2">
            <span class="text-sm font-semibold" style="color:#1E3A8A">${escHtml(nombreCompletoAlumno(r.alumnos))}</span>
            <span class="text-xs font-bold" style="color:${DISC_COLOR_GRAVEDAD[r.gravedad]}">${r.gravedad}</span>
          </div>
          <div class="text-xs" style="color:#6C7B8A">DISC-${String(r.numero).padStart(5, "0")} · ${escHtml(r.tipos_incidencia?.nombre || "")} · ${new Date(r.fecha_hecho + "T00:00:00").toLocaleDateString("es-MX")}</div>
          <div class="text-xs mt-1 font-semibold" style="color:#1C2B3A">Estado: ${r.estado}</div>
        </button>`).join("");
      document.querySelectorAll(".dsAbrir").forEach(b => b.addEventListener("click", () => renderDetalleReporte(cont, b.dataset.id)));
    }
    document.getElementById("dsFiltroTexto").addEventListener("input", pintarLista);
    document.getElementById("dsFiltroEstado").addEventListener("change", pintarLista);
    pintarLista();
  }

  // ---------- Nuevo reporte ----------
  async function renderNuevoReporte(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const { data: tipos, error } = await sb.from("tipos_incidencia").select("id, nombre, gravedad").eq("activo", true).order("gravedad").order("nombre");
    if (error) { cont.innerHTML = errBox(escHtml(error.message)); return; }
    let alumnoSel = null;
    const hoy = aInputDatetime().slice(0, 10);

    cont.innerHTML = `
      <button id="dsVolver" class="text-xs font-semibold mb-3" style="color:#1E3A8A">← Volver a reportes</button>
      <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Nuevo reporte de disciplina</p>
        <div class="flex gap-2 mb-1">
          <input id="nrBuscar" placeholder="Buscar alumno por nombre o matrícula…" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          <button id="nrBuscarBtn" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Buscar</button>
        </div>
        <div id="nrResultados" class="mb-2"></div>
        <p id="nrAlumno" class="text-sm font-semibold mb-2" style="color:#3F7A5E"></p>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Incidencia</label>
        <select id="nrTipo" class="w-full px-3 py-2 rounded-lg text-sm mb-1 outline-none border" style="border-color:#E1DED5">
          <option value="">Selecciona…</option>
          ${["Leve", "Grave", "Muy grave"].map(g => `<optgroup label="${g}">${tipos.filter(t => t.gravedad === g).map(t => `<option value="${t.id}">${escHtml(t.nombre)}</option>`).join("")}</optgroup>`).join("")}
        </select>
        <p id="nrProcedimiento" class="text-xs mb-2" style="color:#6C7B8A"></p>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Fecha del hecho</label>
        <input id="nrFecha" type="date" value="${hoy}" max="${hoy}" class="px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Descripción de lo ocurrido</label>
        <textarea id="nrDescripcion" rows="4" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" placeholder="Describe el hecho con claridad: qué pasó, dónde y quiénes estuvieron presentes."></textarea>
        <div id="nrMsg"></div>
        <button id="nrGuardar" class="w-full py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Registrar reporte</button>
      </div>`;

    document.getElementById("dsVolver").addEventListener("click", () => renderListaReportes(cont));
    document.getElementById("nrTipo").addEventListener("change", e => {
      const t = tipos.find(x => x.id === e.target.value);
      document.getElementById("nrProcedimiento").textContent = !t ? "" : t.gravedad === "Leve"
        ? "Procedimiento: aviso al padre de familia."
        : "Procedimiento: citatorio al padre de familia, reunión y firma de acuerdos.";
    });

    async function buscar() {
      const criterio = document.getElementById("nrBuscar").value.trim().replace(/[,()%*]/g, " ").trim();
      const res = document.getElementById("nrResultados");
      if (!criterio) { res.innerHTML = ""; return; }
      const { data: al, error: e } = await sb.from("alumnos").select("id, nombres, apellido_paterno, apellido_materno, matricula")
        .eq("activo", true)
        .or(`nombres.ilike.%${criterio}%,apellido_paterno.ilike.%${criterio}%,apellido_materno.ilike.%${criterio}%,matricula.ilike.%${criterio}%`)
        .order("apellido_paterno").limit(15);
      if (e) { res.innerHTML = errBox(escHtml(e.message)); return; }
      const lista = al || [];
      res.innerHTML = lista.length === 0 ? `<p class="text-xs" style="color:#6C7B8A">Sin resultados.</p>` : lista.map((a, i) => `
        <button class="nrSel w-full text-left px-3 py-2 rounded-lg text-sm bg-white border mb-1" data-i="${i}" style="border-color:#E1DED5; color:#1E3A8A">${escHtml(nombreCompletoAlumno(a))} <span class="text-xs" style="color:#6C7B8A">(${escHtml(a.matricula || "")})</span></button>`).join("");
      res.querySelectorAll(".nrSel").forEach(b => b.addEventListener("click", () => {
        alumnoSel = lista[Number(b.dataset.i)];
        document.getElementById("nrAlumno").textContent = "Alumno: " + nombreCompletoAlumno(alumnoSel);
        res.innerHTML = "";
      }));
    }
    document.getElementById("nrBuscarBtn").addEventListener("click", buscar);
    document.getElementById("nrBuscar").addEventListener("keydown", e => { if (e.key === "Enter") buscar(); });

    let guardando = false;
    document.getElementById("nrGuardar").addEventListener("click", async () => {
      const msg = document.getElementById("nrMsg");
      const tipo = tipos.find(t => t.id === document.getElementById("nrTipo").value);
      const descripcion = document.getElementById("nrDescripcion").value.trim();
      if (guardando) return;
      if (!alumnoSel) { msg.innerHTML = errBox("Selecciona al alumno."); return; }
      if (!tipo) { msg.innerHTML = errBox("Selecciona la incidencia."); return; }
      if (descripcion.length < 10) { msg.innerHTML = errBox("Describe lo ocurrido (mínimo 10 caracteres)."); return; }
      guardando = true;
      const { data: nuevo, error: e } = await sb.from("reportes_disciplina").insert({
        alumno_id: alumnoSel.id, tipo_incidencia_id: tipo.id, gravedad: tipo.gravedad,
        fecha_hecho: document.getElementById("nrFecha").value, descripcion,
      }).select("id").single();
      guardando = false;
      if (e) { msg.innerHTML = errBox(escHtml(e.message)); return; }
      renderListaReportes(cont).then(() => renderDetalleReporte(cont, nuevo.id));
    });
  }

  // ---------- Detalle y pasos ----------
  async function renderDetalleReporte(cont, id) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const [repRes, membreteGen] = await Promise.all([
      sb.from("reportes_disciplina").select("*, alumnos(id, nombres, apellido_paterno, apellido_materno, matricula), tipos_incidencia(nombre)").eq("id", id).single(),
      cargarMembrete(),
    ]);
    let membrete = membreteGen;
    if (repRes.error) { cont.innerHTML = errBox(escHtml(repRes.error.message)); return; }
    let r = repRes.data;
    const alumno = r.alumnos;
    const folio = `DISC-${String(r.numero).padStart(5, "0")}`;

    const [tutRes, inscRes] = await Promise.all([
      sb.from("alumno_tutores").select("es_contacto_principal, tutores(id, nombre_completo, parentesco, telefono)").eq("alumno_id", alumno.id).order("es_contacto_principal", { ascending: false }),
      sb.from("inscripciones").select("grupos(letra, grados(nombre, nivel))").eq("alumno_id", alumno.id).order("fecha_inscripcion", { ascending: false }).limit(1).maybeSingle(),
    ]);
    const tutores = (tutRes.data || []).map(t => t.tutores).filter(Boolean);
    const tutor = tutores.find(t => t.id === r.tutor_id) || tutores[0] || null;
    if (inscRes.data?.grupos?.grados?.nivel) membrete = await cargarMembrete(inscRes.data.grupos.grados.nivel);
    const grupoTxt = inscRes.data?.grupos ? `${inscRes.data.grupos.grados.nombre} "${inscRes.data.grupos.letra}" (${inscRes.data.grupos.grados.nivel})` : "";
    const nombreAl = nombreCompletoAlumno(alumno);
    const esLeve = r.gravedad === "Leve";

    async function actualizar(campos) {
      const { error } = await sb.from("reportes_disciplina").update(campos).eq("id", r.id);
      if (error) { document.getElementById("rdMsg").innerHTML = errBox(escHtml(error.message)); return false; }
      return true;
    }
    const recargar = () => renderDetalleReporte(cont, id);

    function pasoHtml() {
      const est = r.estado;
      let html = "";

      // PASO 1
      html += `<div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <p class="text-sm font-bold mb-2" style="color:#1E3A8A">Paso 1 · ${esLeve ? "Aviso al padre de familia" : "Citatorio al padre de familia"}</p>`;
      if (tutores.length > 1 && est === "Registrado") {
        html += `<label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Dirigir a</label>
          <select id="rdTutorSel" class="px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">
            ${tutores.map(t => `<option value="${t.id}" ${tutor && t.id === tutor.id ? "selected" : ""}>${escHtml(t.nombre_completo)}${t.parentesco ? " (" + escHtml(t.parentesco) + ")" : ""}</option>`).join("")}
          </select>`;
      }
      if (tutor) html += `<p class="text-xs mb-2" style="color:#6C7B8A">Contacto: ${escHtml(tutor.nombre_completo)} ${tutor.parentesco ? "(" + escHtml(tutor.parentesco) + ")" : ""} · ${escHtml(tutor.telefono || "sin teléfono")}</p>`;
      else html += errBox("Este alumno no tiene tutor registrado. Agrégalo en Alumnos y Grupos.");

      if (esLeve && est === "Registrado") {
        const msgDef = `Estimado(a) ${tutor?.nombre_completo || "padre de familia"}: le informamos que su hijo(a) ${nombreAl} (${grupoTxt}) presentó la siguiente situación el ${fechaLarga(r.fecha_hecho + "T00:00:00")}: ${r.tipos_incidencia?.nombre || ""}. ${r.descripcion} Le agradecemos su apoyo para dialogar con su hijo(a). Atentamente, ${membrete.nombre.replace(/\n/g, " ")}.`;
        html += `<textarea id="rdMensajeAviso" rows="5" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">${escHtml(msgDef)}</textarea>
          <div class="flex gap-2 flex-wrap">
            <button id="rdWaAviso" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#25804B; color:#fff" ${tutor?.telefono ? "" : "disabled"}>Enviar por WhatsApp</button>
            <button id="rdAvisoHecho" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Marcar aviso como enviado</button>
            <button id="rdEscalar" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#FDEBD0; color:#8A5A12">Girar citatorio</button>
          </div>`;
      } else if (!esLeve && est === "Registrado") {
        html += `<label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Fecha y hora de la cita con el padre de familia</label>
          <input id="rdCita" type="datetime-local" value="${aInputDatetime(new Date(Date.now() + 86400000))}" class="px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
          <div><button id="rdEmitir" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Emitir citatorio</button></div>`;
      } else {
        html += `<p class="text-xs" style="color:#3F7A5E">✔ ${est === "Aviso enviado" || esLeve && !r.citatorio_emitido_en ? `Aviso enviado${r.aviso_enviado_en ? " el " + fechaLarga(r.aviso_enviado_en) : ""}.` : `Citatorio emitido${r.cita_fecha ? " para el " + fechaHoraLarga(r.cita_fecha) : ""}.`}</p>`;
        if (r.citatorio_emitido_en) {
          html += `<div class="flex gap-2 flex-wrap mt-2">
            <button id="rdWaCitatorio" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#25804B; color:#fff" ${tutor?.telefono ? "" : "disabled"}>Enviar citatorio por WhatsApp</button>
            <button id="rdImprimirCitatorio" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Imprimir citatorio</button>
          </div>`;
        }
      }
      html += `</div>`;

      // PASO 2
      if (r.citatorio_emitido_en) {
        html += `<div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-bold mb-2" style="color:#1E3A8A">Paso 2 · Reunión, acuerdos y sanciones</p>`;
        if (est === "Citatorio emitido" || est === "Reunión realizada") {
          const editable = est === "Citatorio emitido";
          html += `
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Fecha y hora de la reunión</label>
          <input id="rdReunion" type="datetime-local" value="${aInputDatetime(r.reunion_fecha || r.cita_fecha)}" ${editable ? "" : "disabled"} class="px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Padre, madre o tutor que asiste</label>
          <input id="rdAsistente" value="${escHtml(r.asistente_tutor || tutor?.nombre_completo || "")}" ${editable ? "" : "disabled"} class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Testigo</label>
          <input id="rdTestigo" value="${escHtml(r.testigo || "")}" ${editable ? "" : "disabled"} placeholder="Nombre del testigo" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Acuerdos</label>
          <textarea id="rdAcuerdos" rows="3" ${editable ? "" : "disabled"} class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">${escHtml(r.acuerdos || "")}</textarea>
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Sanciones (si aplican)</label>
          <textarea id="rdSanciones" rows="2" ${editable ? "" : "disabled"} class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">${escHtml(r.sanciones || "")}</textarea>
          <div class="flex gap-2 flex-wrap">
            ${editable ? `<button id="rdGuardarReunion" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar reunión</button>` : `<button id="rdImprimirActa" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Imprimir reporte para firma</button>`}
          </div>`;
        } else {
          html += `<p class="text-xs" style="color:#3F7A5E">✔ Reunión realizada el ${fechaHoraLarga(r.reunion_fecha)}.</p>
            <button id="rdImprimirActa" class="mt-2 px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Imprimir reporte para firma</button>`;
        }
        html += `</div>`;
      }

      // CIERRE
      if (est === "Aviso enviado" || est === "Reunión realizada") {
        html += `<button id="rdCerrar" class="w-full py-2 rounded-lg text-sm font-bold" style="background:#3F7A5E; color:#fff">Cerrar reporte</button>`;
      }
      return html;
    }

    cont.innerHTML = `
      <button id="rdVolver" class="text-xs font-semibold mb-3" style="color:#1E3A8A">← Volver a reportes</button>
      <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <div class="flex justify-between gap-2">
          <p class="text-sm font-bold" style="color:#1E3A8A">${folio} · ${escHtml(nombreAl)}</p>
          <span class="text-xs font-bold" style="color:${DISC_COLOR_GRAVEDAD[r.gravedad]}">${r.gravedad}</span>
        </div>
        <p class="text-xs" style="color:#6C7B8A">${escHtml(grupoTxt)} · ${escHtml(r.tipos_incidencia?.nombre || "")} · Hecho del ${fechaLarga(r.fecha_hecho + "T00:00:00")}</p>
        <p class="text-sm mt-2" style="color:#1C2B3A; white-space:pre-line">${escHtml(r.descripcion)}</p>
        <p class="text-xs mt-2 font-semibold" style="color:#1C2B3A">Estado: ${r.estado}</p>
      </div>
      <div id="rdMsg"></div>
      ${pasoHtml()}
      <div id="rdDoc" class="mt-4"></div>`;

    document.getElementById("rdVolver").addEventListener("click", () => renderListaReportes(cont));
    const on = (idEl, fn) => { const el = document.getElementById(idEl); if (el) el.addEventListener("click", fn); };

    function waTexto(tipo) {
      if (tipo === "citatorio") {
        return `Estimado(a) ${tutor?.nombre_completo || "padre de familia"}: se le cita a una reunión en ${membrete.nombre.replace(/\n/g, " ")} el ${fechaHoraLarga(r.cita_fecha)}, para tratar un asunto relacionado con su hijo(a) ${nombreAl} (${grupoTxt}): ${r.tipos_incidencia?.nombre || ""}. Su asistencia es importante. Si no puede asistir, favor de comunicarse con nosotros. Atentamente, la Dirección.`;
      }
    }

    const selTutor = document.getElementById("rdTutorSel");
    if (selTutor) selTutor.addEventListener("change", async () => { if (await actualizar({ tutor_id: selTutor.value })) recargar(); });

    on("rdWaAviso", async () => {
      const texto = document.getElementById("rdMensajeAviso").value;
      if (abrirWhatsApp(tutor.telefono, texto)) {
        if (await actualizar({ estado: "Aviso enviado", aviso_enviado_en: new Date().toISOString(), tutor_id: tutor.id })) recargar();
      } else document.getElementById("rdMsg").innerHTML = errBox("El teléfono del tutor no es válido para WhatsApp (se requieren 10 dígitos).");
    });
    on("rdAvisoHecho", async () => { if (await actualizar({ estado: "Aviso enviado", aviso_enviado_en: new Date().toISOString(), tutor_id: tutor?.id || null })) recargar(); });
    on("rdEscalar", () => {
      if (!confirm("¿Girar citatorio en lugar de solo avisar? El reporte pasará al procedimiento de reunión con acuerdos.")) return;
      r.gravedad = "Grave";
      actualizar({ gravedad: "Grave" }).then(ok => { if (ok) recargar(); });
    });
    on("rdEmitir", async () => {
      const cita = document.getElementById("rdCita").value;
      if (!cita) { document.getElementById("rdMsg").innerHTML = errBox("Indica la fecha y hora de la cita."); return; }
      if (await actualizar({ estado: "Citatorio emitido", cita_fecha: new Date(cita).toISOString(), citatorio_emitido_en: new Date().toISOString(), tutor_id: tutor?.id || null })) recargar();
    });
    on("rdWaCitatorio", () => {
      if (!abrirWhatsApp(tutor.telefono, waTexto("citatorio"))) document.getElementById("rdMsg").innerHTML = errBox("El teléfono del tutor no es válido para WhatsApp (se requieren 10 dígitos).");
    });
    on("rdImprimirCitatorio", () => mostrarDocumento(citatorioHtml()));
    on("rdGuardarReunion", async () => {
      const acuerdos = document.getElementById("rdAcuerdos").value.trim();
      const testigo = document.getElementById("rdTestigo").value.trim();
      if (!acuerdos) { document.getElementById("rdMsg").innerHTML = errBox("Captura los acuerdos de la reunión."); return; }
      if (!testigo) { document.getElementById("rdMsg").innerHTML = errBox("Captura el nombre del testigo."); return; }
      const ok = await actualizar({
        estado: "Reunión realizada", reunion_fecha: new Date(document.getElementById("rdReunion").value).toISOString(),
        asistente_tutor: document.getElementById("rdAsistente").value.trim(), testigo, acuerdos,
        sanciones: document.getElementById("rdSanciones").value.trim() || null,
      });
      if (ok) recargar();
    });
    on("rdImprimirActa", () => mostrarDocumento(actaHtml()));
    on("rdCerrar", async () => {
      if (!confirm("¿Cerrar este reporte? Ya no podrá modificarse.")) return;
      if (await actualizar({ estado: "Cerrado", cerrado_en: new Date().toISOString() })) recargar();
    });

    function mostrarDocumento(html) {
      const doc = document.getElementById("rdDoc");
      doc.innerHTML = `<div id="ibDisciplinaImprimible" class="ib-imprimible ib-hoja p-6 rounded-xl bg-white border" style="border-color:#E1DED5; width:100%; max-width:760px">${html}</div>
        <button id="rdImprimirBtn" class="w-48 mx-auto block mt-4 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Imprimir / Descargar PDF</button>`;
      document.getElementById("rdImprimirBtn").addEventListener("click", () => imprimirSolo(null));
      doc.scrollIntoView({ behavior: "smooth" });
    }

    function firmaHtml(rotulo, nombre) {
      return `<div style="text-align:center; width:30%"><div style="border-top:1px solid #1C2B3A; padding-top:4px" class="text-xs">${escHtml(rotulo)}${nombre ? `<br><span style="color:#6C7B8A">${escHtml(nombre)}</span>` : ""}</div></div>`;
    }

    function citatorioHtml() {
      return `${membreteHtml(membrete)}
        <h3 class="text-sm font-bold text-center mb-1" style="color:#1E3A8A">CITATORIO</h3>
        <p class="text-xs text-center mb-4" style="color:#6C7B8A">Folio ${folio}</p>
        ${cierreFecha(r.citatorio_emitido_en, "0.5cm")}

// Vista de solo lectura de los avisos para el profesorado.
async function renderAvisosLectura(caja) {
  caja.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
  const { data, error } = await sb.from("avisos").select("titulo, mensaje, creado_en, audiencia, nivel, creado_por").or(`creado_por.is.null,creado_por.neq.${state.perfil.id}`).order("creado_en", { ascending: false }).limit(100);
  if (error) { caja.innerHTML = errBox(escHtml(error.message)); return; }
  const lista = data || [];
  caja.innerHTML = `<p class="text-xs mb-3" style="color:#6C7B8A">Avisos emitidos por la Dirección. Solo lectura.</p>` + (lista.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Aún no hay avisos.</p>` : lista.map(a => `
    <div class="p-3 rounded-xl bg-white border mb-2" style="border-color:#E1DED5">
      <div class="text-sm font-semibold" style="color:#1E3A8A">${escHtml(a.titulo)}</div>
      <div class="text-xs mb-1" style="color:#6C7B8A">${fechaLarga(a.creado_en)} · ${a.audiencia === "Todos" ? "Todos" : a.audiencia === "Nivel" ? escHtml(a.nivel || "") : "Un grupo"}</div>
      <div class="text-sm" style="color:#1C2B3A; white-space:pre-line">${escHtml(a.mensaje)}</div>
    </div>`).join(""));
}

function renderAvisos(main) {
  const esProf = state.perfil.rol === "Profesor";
  let tabActivo = "nuevo";
  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1E3A8A">Avisos</h2>
    <div class="flex gap-1 mb-4">
      <button class="avTabBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="nuevo">Nuevo aviso</button>
      <button class="avTabBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="historial">${esProf ? "Mis avisos" : "Historial"}</button>
      ${esProf ? `<button class="avTabBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="direccion">Avisos de la Dirección</button>` : ""}
    </div>
    <div id="avContenido" class="max-w-3xl"></div>`;
  function pintarTabs() {
    document.querySelectorAll(".avTabBtn").forEach(b => {
      const activo = b.dataset.tab === tabActivo;
      b.style.background = activo ? "#1E3A8A" : "#F4F1EB";
      b.style.color = activo ? "#fff" : "#1E3A8A";
    });
  }
  document.querySelectorAll(".avTabBtn").forEach(b => b.addEventListener("click", () => { tabActivo = b.dataset.tab; pintarTabs(); cargarTab(); }));
  pintarTabs();
  cargarTab();

  function cargarTab() {
    const cont = document.getElementById("avContenido");
    if (tabActivo === "nuevo") renderNuevoAviso(cont); else if (tabActivo === "direccion") renderAvisosLectura(cont, true); else renderHistorial(cont);
  }

  async function renderNuevoAviso(cont) {
    let gruposOk;
    if (esProf) {
      // Solo los grupos en los que el profesor imparte alguna materia.
      const { data: asg } = await sb.from("profesor_materias_grupos").select("grupo_id, grupos(id, letra, grados(nombre, nivel))").eq("profesor_id", state.perfil.id);
      const vistos = new Set();
      gruposOk = (asg || []).map(a => a.grupos).filter(g => g && g.grados && !vistos.has(g.id) && vistos.add(g.id));
      if (gruposOk.length === 0) { cont.innerHTML = `<p class="text-sm" style="color:#6C7B8A">No tienes grupos asignados, por lo que no puedes enviar avisos.</p>`; return; }
    } else {
      const { data: grupos } = await sb.from("grupos").select("id, letra, grados(nombre, nivel)").order("letra");
      gruposOk = (grupos || []).filter(g => g.grados);
    }
    cont.innerHTML = `
      <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Título</label>
        <input id="avTitulo" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" placeholder="Ej. Suspensión de clases" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Mensaje</label>
        <textarea id="avMensaje" rows="5" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" placeholder="Escribe el comunicado para los padres de familia."></textarea>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">¿A quién va dirigido?</label>
        <div class="flex gap-2 flex-wrap mb-2">
          <select id="avAudiencia" class="px-3 py-2 rounded-lg text-sm border" style="border-color:#E1DED5; ${esProf ? "display:none" : ""}">
            ${esProf ? `<option value="Grupo" selected>Un grupo</option>` : `<option value="Todos">Todos los padres de familia</option><option value="Nivel">Un nivel</option><option value="Grupo">Un grupo</option>`}
          </select>
          <select id="avNivel" class="px-3 py-2 rounded-lg text-sm border" style="border-color:#E1DED5; display:none"><option>Secundaria</option><option>Preparatoria</option></select>
          <select id="avGrupo" class="px-3 py-2 rounded-lg text-sm border" style="border-color:#E1DED5; ${esProf ? "" : "display:none"}">
            ${gruposOk.map(g => `<option value="${g.id}">${escHtml(g.grados.nombre)} "${escHtml(g.letra)}" (${escHtml(g.grados.nivel)})</option>`).join("")}
          </select>
        </div>
        <div id="avMsg"></div>
        <button id="avPreparar" class="w-full py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar y preparar envíos</button>
      </div>
      <div id="avEnvios"></div>`;
    const aud = document.getElementById("avAudiencia");
    aud.addEventListener("change", () => {
      document.getElementById("avNivel").style.display = aud.value === "Nivel" ? "" : "none";
      document.getElementById("avGrupo").style.display = aud.value === "Grupo" ? "" : "none";
    });
    let guardando = false;
    document.getElementById("avPreparar").addEventListener("click", async () => {
      const msg = document.getElementById("avMsg");
      const titulo = document.getElementById("avTitulo").value.trim();
      const mensaje = document.getElementById("avMensaje").value.trim();
      if (guardando) return;
      if (!titulo || mensaje.length < 5) { msg.innerHTML = errBox("Escribe el título y el mensaje."); return; }
      if (aud.value === "Grupo" && !document.getElementById("avGrupo").value) { msg.innerHTML = errBox("Selecciona el grupo."); return; }
      guardando = true;
      const { data, error } = await sb.from("avisos").insert({
        titulo, mensaje, audiencia: aud.value,
        nivel: aud.value === "Nivel" ? document.getElementById("avNivel").value : null,
        grupo_id: aud.value === "Grupo" ? document.getElementById("avGrupo").value : null,
      }).select().single();
      guardando = false;
      if (error) { msg.innerHTML = errBox(escHtml(error.message)); return; }
      msg.innerHTML = "";
      mostrarEnvios(document.getElementById("avEnvios"), data);
    });
  }

  async function renderHistorial(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    let qa = sb.from("avisos").select("*").order("creado_en", { ascending: false }).limit(100);
    if (esProf) qa = qa.eq("creado_por", state.perfil.id);
    const { data, error } = await qa;
    if (error) { cont.innerHTML = errBox(escHtml(error.message)); return; }
    const lista = data || [];
    cont.innerHTML = (lista.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Aún no hay avisos.</p>` : lista.map((a, i) => `
      <button class="avAbrir w-full text-left p-3 rounded-xl bg-white border mb-2" data-i="${i}" style="border-color:#E1DED5">
        <div class="text-sm font-semibold" style="color:#1E3A8A">${escHtml(a.titulo)}</div>
        <div class="text-xs" style="color:#6C7B8A">${fechaLarga(a.creado_en)} · ${a.audiencia === "Todos" ? "Todos" : a.audiencia === "Nivel" ? a.nivel : "Un grupo"}</div>
      </button>`).join("")) + `<div id="avEnvios"></div>`;
    cont.querySelectorAll(".avAbrir").forEach(b => b.addEventListener("click", () => mostrarEnvios(document.getElementById("avEnvios"), lista[Number(b.dataset.i)])));
  }

  async function mostrarEnvios(caja, aviso, incluirTodos = false) {
    const textoGeneral = `*${aviso.titulo}*\n\n${aviso.mensaje}\n\nSaludos y excelente día.\nInstituto Juan Bosco.`;
    const bloqueGeneral = `
      <div class="p-4 rounded-xl bg-white border mt-4" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-1" style="color:#1E3A8A">Mensaje general (para grupos de WhatsApp)</p>
        <textarea id="avTextoGeneral" rows="7" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">${escHtml(textoGeneral)}</textarea>
        <div class="flex gap-2 flex-wrap mt-2">
          <button id="avCopiar" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Copiar mensaje</button>
          <button id="avAbrirWa" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#E6F0EA; color:#25804B">Abrir WhatsApp</button>
        </div>
      </div>`;
    function enlazarGeneral() {
      document.getElementById("avCopiar").addEventListener("click", async e => {
        const ok = await copiarTexto(document.getElementById("avTextoGeneral").value);
        e.target.textContent = ok ? "¡Copiado!" : "No se pudo copiar";
        setTimeout(() => { e.target.textContent = "Copiar mensaje"; }, 1800);
      });
      document.getElementById("avAbrirWa").addEventListener("click", () => {
        window.open("https://wa.me/?text=" + encodeURIComponent(document.getElementById("avTextoGeneral").value), "_blank");
      });
    }
    caja.innerHTML = `<p class="text-xs mt-3" style="color:#6C7B8A">Preparando destinatarios…</p>`;
    let q = sb.from("inscripciones").select("grupo_id, alumnos(id, nombres, apellido_paterno, apellido_materno, activo), grupos(grados(nivel))").eq("estado", "Inscrito");
    if (aviso.audiencia === "Grupo") q = q.eq("grupo_id", aviso.grupo_id);
    const [inscRes, envRes, membreteGen] = await Promise.all([q, sb.from("avisos_envios").select("tutor_id").eq("aviso_id", aviso.id), cargarMembrete()]);
    if (inscRes.error) { caja.innerHTML = errBox(escHtml(inscRes.error.message)); return; }
    let insc = (inscRes.data || []).filter(i => i.alumnos && i.alumnos.activo !== false);
    if (aviso.audiencia === "Nivel") insc = insc.filter(i => i.grupos?.grados?.nivel === aviso.nivel);
    const nivelAviso = aviso.audiencia === "Nivel" ? aviso.nivel : (aviso.audiencia === "Grupo" ? insc[0]?.grupos?.grados?.nivel : null);
    const membrete = nivelAviso ? await cargarMembrete(nivelAviso) : membreteGen;
    const alumnoIds = [...new Set(insc.map(i => i.alumnos.id))];
    if (alumnoIds.length === 0) { caja.innerHTML = bloqueGeneral + `<div class="mt-3">${errBox("No hay alumnos inscritos para esa audiencia (el envío uno por uno no está disponible).")}</div>`; enlazarGeneral(); return; }

    const { data: rel, error } = await sb.from("alumno_tutores").select("alumno_id, es_contacto_principal, tutores(id, nombre_completo, telefono)").in("alumno_id", alumnoIds);
    if (error) { caja.innerHTML = bloqueGeneral + errBox(escHtml(error.message)); enlazarGeneral(); return; }

    // Un solo mensaje por tutor (aunque tenga varios hijos); se usa el contacto principal de cada alumno.
    const porTutor = new Map();
    const alumnoPorId = new Map(insc.map(i => [i.alumnos.id, i.alumnos]));
    const principalPorAlumno = new Map();
    (rel || []).forEach(r => { if (r.tutores && (r.es_contacto_principal || !principalPorAlumno.has(r.alumno_id))) principalPorAlumno.set(r.alumno_id, r.tutores); });
    const agregar = (t, alumnoId) => {
      if (!porTutor.has(t.id)) porTutor.set(t.id, { tutor: t, hijos: [] });
      porTutor.get(t.id).hijos.push(nombreCompletoAlumno(alumnoPorId.get(alumnoId)));
    };
    if (incluirTodos) (rel || []).forEach(r => { if (r.tutores) agregar(r.tutores, r.alumno_id); });
    else principalPorAlumno.forEach((t, alumnoId) => agregar(t, alumnoId));
    const sinTutor = alumnoIds.filter(id => !principalPorAlumno.has(id)).length;
    const enviados = new Set((envRes.data || []).map(e => e.tutor_id));
    const destinatarios = [...porTutor.values()].sort((a, b) => a.tutor.nombre_completo.localeCompare(b.tutor.nombre_completo, "es"));
    const textoPara = t => `Estimado(a) ${t.nombre_completo}:\n\n*${aviso.titulo}*\n\n${aviso.mensaje}\n\nAtentamente,\n${membrete.nombre.replace(/\n/g, " ")}`;

    caja.innerHTML = `
      ${bloqueGeneral}
      <details class="p-4 rounded-xl bg-white border mt-3" style="border-color:#E1DED5">
        <summary class="text-sm font-semibold cursor-pointer" style="color:#1E3A8A">Enviar de forma personalizada, uno por uno (${destinatarios.length} familias)</summary>
        <p class="text-sm font-semibold mt-3" style="color:#1E3A8A">${escHtml(aviso.titulo)}</p>
        <p class="text-xs mb-2" style="color:#6C7B8A">${destinatarios.length} familias${sinTutor ? ` · ${sinTutor} alumno(s) sin tutor registrado` : ""}. Toca "WhatsApp" para abrir el mensaje listo; solo falta presionar enviar.</p>
        <button id="avImprimir" class="mb-2 px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:#1E3A8A">Imprimir aviso</button>
        <label class="flex items-center gap-2 text-xs mb-2" style="color:#1E3A8A"><input type="checkbox" id="avTodosTutores" ${incluirTodos ? "checked" : ""} /> Incluir también al segundo tutor de cada alumno</label>
        <div id="avMsg2"></div>
        ${destinatarios.map(d => `
          <div class="flex items-center justify-between gap-2 py-2 border-t" style="border-color:#F0EDE5">
            <div class="min-w-0">
              <div class="text-sm" style="color:#1C2B3A">${escHtml(d.tutor.nombre_completo)}</div>
              <div class="text-xs" style="color:#6C7B8A">${escHtml(d.hijos.join(", "))} · ${escHtml(d.tutor.telefono || "sin teléfono")}</div>
            </div>
            <button class="avWa px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap" data-id="${d.tutor.id}" style="background:${enviados.has(d.tutor.id) ? "#E6F0EA" : "#25804B"}; color:${enviados.has(d.tutor.id) ? "#3F7A5E" : "#fff"}" ${d.tutor.telefono ? "" : "disabled"}>${enviados.has(d.tutor.id) ? "Enviado ✓" : "WhatsApp"}</button>
          </div>`).join("")}
      </details>
      <div id="avDoc"></div>`;
    enlazarGeneral();

    caja.querySelectorAll(".avWa").forEach(b => b.addEventListener("click", async () => {
      const d = porTutor.get(b.dataset.id);
      if (!abrirWhatsApp(d.tutor.telefono, textoPara(d.tutor))) {
        document.getElementById("avMsg2").innerHTML = errBox("El teléfono de " + escHtml(d.tutor.nombre_completo) + " no es válido para WhatsApp (se requieren 10 dígitos)."); return;
      }
      await sb.from("avisos_envios").upsert({ aviso_id: aviso.id, tutor_id: d.tutor.id }, { onConflict: "aviso_id,tutor_id" });
      b.textContent = "Enviado ✓"; b.style.background = "#E6F0EA"; b.style.color = "#3F7A5E";
    }));

    document.getElementById("avTodosTutores").addEventListener("change", e => mostrarEnvios(caja, aviso, e.target.checked));
    document.getElementById("avImprimir").addEventListener("click", () => {
      const doc = document.getElementById("avDoc");
      doc.innerHTML = `<div id="ibAvisoCircular" class="ib-imprimible ib-hoja p-6 rounded-xl bg-white border mt-4" style="border-color:#E1DED5; width:100%; max-width:760px">
          ${membreteHtml(membrete)}
          <h3 class="text-sm font-bold text-center mb-1" style="color:#1E3A8A">AVISO A PADRES DE FAMILIA</h3>
          ${cierreFecha(aviso.creado_en, "0.4cm")}
          <p class="text-sm font-bold mb-2" style="color:#1E3A8A">${escHtml(aviso.titulo)}</p>
          <p class="text-sm mb-8" style="color:#1C2B3A; white-space:pre-line; text-align:justify">${escHtml(aviso.mensaje)}</p>
          <div class="ib-pie text-center" style="color:#1C2B3A"><p class="text-sm mb-10">Atentamente</p>
            <div style="display:inline-block; min-width:50%; border-top:1px solid #1C2B3A; padding-top:4px" class="text-xs">${escHtml(membrete.director || membrete.directores.join(" / ") || "La Dirección")}<br><span style="color:#6C7B8A">Dirección</span></div></div>
        </div>
        <button id="avImprimirBtn" class="w-48 mx-auto block mt-4 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Imprimir / Descargar PDF</button>`;
      document.getElementById("avImprimirBtn").addEventListener("click", () => imprimirSolo(null));
      doc.scrollIntoView({ behavior: "smooth" });
    });
  }
}

// Módulo Oficios y Documentos (constancias, cartas y formatos)
// ============================================================
const OFICIOS_TIPOS = [
  { id: "Carta de buena conducta", corto: "CBC" },
  { id: "Constancia de estudios", corto: "CE" },
  { id: "Constancia de estudios con calificaciones", corto: "CEC" },
  { id: "Formato de inscripción", corto: "FI" },
  { id: "Formato de baja", corto: "FB" },
];

function generoAlumno(a) {
  if (a.sexo === "Femenino") return { art: "la", alu: "alumna", del: "de la alumna", inscrito: "inscrita", regular: "alumna regular" };
  if (a.sexo === "Masculino") return { art: "el", alu: "alumno", del: "del alumno", inscrito: "inscrito", regular: "alumno regular" };
  return { art: "el(la)", alu: "alumno(a)", del: "del(la) alumno(a)", inscrito: "inscrito(a)", regular: "alumno(a) regular" };
}
const folioOficio = (numero, fechaISO) => `OF-${new Date(fechaISO).getFullYear()}-${String(numero).padStart(5, "0")}`;

// Carga todo lo que necesitan los documentos de un alumno para un ciclo.
async function cargarContextoOficio(alumnoId, cicloId) {
  const [alRes, inscRes, tutRes, repRes, plantelRes] = await Promise.all([
    sb.from("alumnos").select("*").eq("id", alumnoId).single(),
    sb.from("inscripciones").select("grupo_id, ciclo_escolar_id, estado, fecha_inscripcion, grupos(letra, grados(nombre, nivel)), ciclos_escolares(nombre, fecha_inicio, fecha_fin)")
      .eq("alumno_id", alumnoId).order("fecha_inscripcion", { ascending: false }),
    sb.from("alumno_tutores").select("es_contacto_principal, tutores(nombre_completo, parentesco, telefono, correo, direccion)").eq("alumno_id", alumnoId).order("es_contacto_principal", { ascending: false }),
    sb.from("reportes_disciplina").select("gravedad").eq("alumno_id", alumnoId),
    sb.from("datos_institucion").select("*").eq("id", 1).maybeSingle(),
  ]);
  if (alRes.error) throw alRes.error;
  const inscripciones = (inscRes.data || []).filter(i => i.grupos && i.grupos.grados && i.ciclos_escolares);
  const insc = (cicloId && inscripciones.find(i => i.ciclo_escolar_id === cicloId)) || inscripciones[0] || null;
  const reportes = repRes.data || [];
  const membrete = await cargarMembrete(insc?.grupos?.grados?.nivel);
  return {
    alumno: alRes.data, inscripciones, insc,
    tutores: (tutRes.data || []).map(t => t.tutores).filter(Boolean),
    reportes: { total: reportes.length, graves: reportes.filter(r => r.gravedad !== "Leve").length },
    plantel: plantelRes.data || {}, membrete,
  };
}

// Calificaciones por materia y periodo (misma regla que la boleta).
async function calificacionesDeAlumno(alumnoId, insc) {
  const nivel = insc.grupos.grados.nivel;
  const prefijo = nivel === "Preparatoria" ? "Bimestre" : "Parcial";
  const periodos = [1, 2, 3, 4, 5].map(n => `${prefijo} ${n}`);
  const { data: asig, error } = await sb.from("profesor_materias_grupos").select("id, materias(nombre)")
    .eq("grupo_id", insc.grupo_id).eq("ciclo_escolar_id", insc.ciclo_escolar_id);
  if (error) throw error;
  const asignaciones = (asig || []).filter(a => a.materias);
  const ids = asignaciones.map(a => a.id);
  let criterios = [], califs = [];
  if (ids.length) {
    const { data: crit, error: e1 } = await sb.from("criterios_evaluacion").select("id, asignacion_id, periodo, ponderacion").in("asignacion_id", ids);
    if (e1) throw e1;
    criterios = crit || [];
    if (criterios.length) {
      const { data: cal, error: e2 } = await sb.from("calificaciones").select("criterio_id, valor").eq("alumno_id", alumnoId).in("criterio_id", criterios.map(c => c.id));
      if (e2) throw e2;
      califs = cal || [];
    }
  }
  const valores = new Map(califs.map(c => [c.criterio_id, Number(c.valor)]));
  const notaPeriodo = (asigId, p) => {
    const cr = criterios.filter(c => c.asignacion_id === asigId && c.periodo === p);
    if (!cr.some(c => valores.has(c.id))) return null;
    return calOficial(cr.reduce((t, c) => t + (valores.has(c.id) ? valores.get(c.id) * Number(c.ponderacion) / 100 : 0), 0));
  };
  const filas = asignaciones.map(a => {
    const notas = periodos.map(p => notaPeriodo(a.id, p));
    const cap = notas.filter(n => n != null);
    return { materia: a.materias.nombre, notas, promedio: cap.length ? calOficial(cap.reduce((s, n) => s + n, 0) / cap.length) : null };
  }).sort((x, y) => x.materia.localeCompare(y.materia, "es"));
  const conProm = filas.filter(f => f.promedio != null);
  return { prefijo, periodos, filas, general: conProm.length ? conProm.reduce((s, f) => s + f.promedio, 0) / conProm.length : null };
}

function directorDelNivel(plantel, nivel) {
  const p = plantel || {};
  const d = nivel === "Preparatoria" ? p.director_preparatoria : nivel === "Secundaria" ? p.director_secundaria : "";
  return (d || p.director_nombre || "").trim();
}

function lineaOficialPlantel(ctx) {
  const nivel = ctx.insc?.grupos?.grados?.nivel;
  const p = ctx.plantel || {};
  const cct = nivel === "Preparatoria" ? p.cct_preparatoria : p.cct_secundaria;
  const rvoe = nivel === "Preparatoria" ? p.rvoe_preparatoria : p.rvoe_secundaria;
  const partes = [];
  if (cct) partes.push("C.C.T. " + cct);
  if (rvoe) partes.push("RVOE " + rvoe);
  return partes.join(" · ");
}

function firmaOficio(rotulo, sub) {
  return `<div style="text-align:center; width:42%"><div style="border-top:1px solid #1C2B3A; padding-top:4px" class="text-xs">${escHtml(rotulo)}${sub ? `<br><span style="color:#6C7B8A">${escHtml(sub)}</span>` : ""}</div></div>`;
}

const LUGAR_EMISION = "Tlacolula de Matamoros, Oaxaca";
const MESES_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
// "Tlacolula de Matamoros, Oaxaca. A 19 del mes de octubre del año 2026." alineado a la derecha.
// `abajo` = espacio libre debajo (para que no invada el lugar de la firma).
function cierreFecha(f, abajo) {
  const d = f instanceof Date ? f : (typeof f === "string" && /^\d{4}-\d{2}-\d{2}$/.test(f) ? new Date(f + "T00:00:00") : new Date(f || Date.now()));
  return `<p class="ib-fecha" style="text-align:right; margin:0 0 ${abajo || "1.6cm"} 0; font-size:13px; color:#1C2B3A">${LUGAR_EMISION}. A ${d.getDate()} del mes de ${MESES_ES[d.getMonth()]} del año ${d.getFullYear()}.</p>`;
}

const NORM_CATEGORIAS = ["Reglamento", "Ley o norma oficial", "Acuerdo", "Circular", "Manual", "Protocolo", "Formato", "Otro"];
function renderNormatividad(main) {
  const puedeEditar = ["Administrador", "Director"].includes(state.perfil.rol);
  let tab = "docs";
  const $ = id => document.getElementById(id);
  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1E3A8A">Normatividad</h2>
    <div class="flex gap-1 mb-4">
      <button class="nmTab px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="docs">Documentos</button>
      <button class="nmTab px-3 py-1.5 rounded-lg text-sm font-semibold" data-tab="reglamento">Reglamento escolar</button>
    </div>
    <div id="nmCont" class="max-w-3xl"></div>`;
  function pintarTabs() {
    document.querySelectorAll(".nmTab").forEach(b => { const a = b.dataset.tab === tab; b.style.background = a ? "#1E3A8A" : "#F4F1EB"; b.style.color = a ? "#fff" : "#1E3A8A"; });
  }
  document.querySelectorAll(".nmTab").forEach(b => b.addEventListener("click", () => {
    if (!confirmarSalidaSinGuardar()) return;
    tab = b.dataset.tab; pintarTabs(); cargar();
  }));
  pintarTabs(); cargar();
  function cargar() { const c = $("nmCont"); if (tab === "docs") tabDocs(c); else tabReglamento(c); }

  const fmtTam = n => !n ? "" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const limpiarNombre = n => n.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_");

  // ---------- Documentos ----------
  async function tabDocs(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const { data, error } = await sb.from("normatividad_docs").select("*").order("categoria").order("titulo");

      const w = window.open("", "_blank");
      try { const u = await conProgreso(url(doc(b.dataset.id), false)); if (w) w.location.href = u; else descargarUrl(u, doc(b.dataset.id).archivo_nombre || "documento"); }
      catch (e) { if (w) w.close(); msg(errBox(escHtml(e.message))); }
    }));
    cont.querySelectorAll(".nmDesc").forEach(b => b.addEventListener("click", async () => {
      try { const d = doc(b.dataset.id); descargarUrl(await conProgreso(url(d, true)), d.archivo_nombre || "documento"); }
      catch (e) { msg(errBox(escHtml(e.message))); }
    }));
    if (!puedeEditar) return;
    $("nmNuevo").addEventListener("click", () => formulario(null));
    cont.querySelectorAll(".nmEd").forEach(b => b.addEventListener("click", () => formulario(doc(b.dataset.id))));
    cont.querySelectorAll(".nmDel").forEach(b => b.addEventListener("click", async () => {
      const d = doc(b.dataset.id);
      if (!confirm(`¿Eliminar definitivamente "${d.titulo}"? Esta acción no se puede deshacer.`)) return;
      const { error: e1 } = await sb.from("normatividad_docs").delete().eq("id", d.id);
      if (e1) { msg(errBox(escHtml(e1.message))); return; }
      await conProgreso(sb.storage.from("normatividad").remove([d.archivo_path]));
      tabDocs(cont);
    }));

    function formulario(d) {
      $("nmForm").innerHTML = `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">${d ? "Modificar documento" : "Nuevo documento"}</p>
          <input id="nmTitulo" value="${escHtml(d?.titulo || "")}" placeholder="Título del documento" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
          <div class="grid grid-cols-2 gap-2 mb-2">
            <select id="nmCat" class="px-3 py-2 rounded-lg text-sm border" style="border-color:#E1DED5">${NORM_CATEGORIAS.map(c => `<option ${d?.categoria === c ? "selected" : ""}>${c}</option>`).join("")}</select>
            <select id="nmNivel" class="px-3 py-2 rounded-lg text-sm border" style="border-color:#E1DED5">${["Todos", "Secundaria", "Preparatoria"].map(c => `<option ${(d?.nivel || "Todos") === c ? "selected" : ""}>${c}</option>`).join("")}</select>
          </div>
          <textarea id="nmDescr" rows="2" placeholder="Descripción (opcional)" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">${escHtml(d?.descripcion || "")}</textarea>
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">${d ? "Reemplazar archivo (opcional; actual: " + escHtml(d.archivo_nombre || "") + ")" : "Archivo"}</label>
          <input id="nmArchivo" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png" class="w-full text-sm mb-2" />
          <div id="nmFormMsg"></div>
          <div class="flex gap-2">
            <button id="nmCancelar" class="px-3 py-1.5 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Cancelar</button>
            <button id="nmGuardar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar</button>
          </div>
        </div>`;
      $("nmForm").scrollIntoView({ behavior: "smooth" });
      $("nmCancelar").addEventListener("click", () => { $("nmForm").innerHTML = ""; });
      $("nmGuardar").addEventListener("click", async () => {
        const fm = h => { $("nmFormMsg").innerHTML = h; };
        const titulo = $("nmTitulo").value.trim();
        const archivo = $("nmArchivo").files[0] || null;
        if (!titulo) { fm(errBox("Escribe el título del documento.")); return; }
        if (!d && !archivo) { fm(errBox("Selecciona el archivo.")); return; }
        if (archivo && archivo.size > 20 * 1048576) { fm(errBox("El archivo pesa más de 20 MB.")); return; }
        const btn = $("nmGuardar"); btn.disabled = true;
        let nuevoPath = null;
        try {
          const fila = { titulo, categoria: $("nmCat").value, nivel: $("nmNivel").value, descripcion: $("nmDescr").value.trim() || null, actualizado_por: state.perfil.id, actualizado_en: new Date().toISOString() };
          if (archivo) {
            nuevoPath = `${crypto.randomUUID()}-${limpiarNombre(archivo.name)}`;
            const up = await conProgreso(sb.storage.from("normatividad").upload(nuevoPath, archivo, { contentType: archivo.type || "application/octet-stream" }));
            if (up.error) throw new Error(up.error.message);
            Object.assign(fila, { archivo_path: nuevoPath, archivo_nombre: archivo.name, archivo_tipo: archivo.type || null, archivo_tam: archivo.size });
          }
          const r = d ? await sb.from("normatividad_docs").update(fila).eq("id", d.id) : await sb.from("normatividad_docs").insert({ ...fila, creado_por: state.perfil.id });
          if (r.error) throw new Error(r.error.message);
          if (archivo && d && d.archivo_path) await conProgreso(sb.storage.from("normatividad").remove([d.archivo_path]));
          tabDocs(cont);
        } catch (e) {
          if (nuevoPath) { try { await sb.storage.from("normatividad").remove([nuevoPath]); } catch (x) { /* nada */ } }
          btn.disabled = false; fm(errBox(escHtml(e.message)));
        }
      });
    }
  }

        <textarea id="rgTexto" data-nomayus="1" rows="22" ${puedeEditar ? "" : "readonly"} class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">${escHtml(reg.contenido)}</textarea>
        <div id="rgMsg" class="mt-2"></div>

        if (error) { g.disabled = false; $("rgMsg").innerHTML = errBox(escHtml(error.message)); return; }
        pintar();
      });

    pintar();

}

        <div id="rgMsg" class="mt-2"></div>

  // ---------- Generar ----------
  function renderGenerar(cont) {
    cont.innerHTML = `
      <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <div class="flex gap-2">
          <input id="ofBuscar" placeholder="Buscar alumno por nombre o matrícula…" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />

      </div>

    async function buscar() {
      const criterio = document.getElementById("ofBuscar").value.trim().replace(/[,()%*]/g, " ").trim();
      const res = document.getElementById("ofResultados");
      if (!criterio) { res.innerHTML = ""; return; }
      res.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Buscando…</p>`;
      const { data, error } = await sb.from("alumnos").select("id, nombres, apellido_paterno, apellido_materno, matricula, activo")
        .or(`nombres.ilike.%${criterio}%,apellido_paterno.ilike.%${criterio}%,apellido_materno.ilike.%${criterio}%,matricula.ilike.%${criterio}%`)
        .order("apellido_paterno").limit(15);
      if (error) { res.innerHTML = errBox(escHtml(error.message)); return; }
      const lista = data || [];
      res.innerHTML = lista.length === 0 ? `<p class="text-xs" style="color:#6C7B8A">Sin resultados.</p>` : lista.map((a, i) => `

      res.querySelectorAll(".ofSel").forEach(b => b.addEventListener("click", () => { res.innerHTML = ""; abrirPanel(lista[Number(b.dataset.i)].id); }));
