function errBox(texto) {
  return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${texto}</div>`;
}
function okBox(texto) {
  return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">${texto}</div>`;
}

// ============================================================
// Arranque: revisa si ya hay sesión activa de Supabase Auth
// ============================================================
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.sesion = session;
    await cargarPerfil();
  } else {
    renderLogin();
  }

  sb.auth.onAuthStateChange((_event, session) => {
    state.sesion = session;
    if (!session) {
      state.perfil = null;
      renderLogin();
    }
  });
}

async function cargarPerfil() {
  const { data, error } = await sb
    .from("perfiles")
    .select("nombre_completo, rol, activo")
    .eq("id", state.sesion.user.id)
    .single();

  if (error || !data) {
    renderLogin(errBox("No se encontró tu perfil en el sistema. Contacta al Administrador."));
    return;
  }
  if (!data.activo) {
    await sb.auth.signOut();
    renderLogin(errBox("Tu cuenta está desactivada. Contacta al Administrador."));
    return;
  }
  state.perfil = data;
  renderApp();
}

async function iniciarSesion() {
  const correo = document.getElementById("loginCorreo").value.trim();
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMsg");
  msg.innerHTML = "";

  if (!correo || !password) { msg.innerHTML = errBox("Escribe tu correo y contraseña."); return; }

  const { data, error } = await sb.auth.signInWithPassword({ email: correo, password });
  if (error) { msg.innerHTML = errBox("Correo o contraseña incorrectos."); return; }

  state.sesion = data.session;
  await cargarPerfil();
}

async function cerrarSesion() {
  await sb.auth.signOut();
  state.perfil = null;
  renderLogin();
}

          <div>
            <div class="ib-brand text-base font-semibold" style="color:#F4F1EB">Instituto Juan Bosco</div>

          <button class="menuBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-id="${m.id}"

            ${m.label}
          </button>`).join("")}
      </div>

      <div id="main" class="p-5"></div>
    </div>`;

  document.getElementById("logoutBtn").addEventListener("click", cerrarSesion);
  document.querySelectorAll(".menuBtn").forEach(b => b.addEventListener("click", () => {
    state.seccion = b.dataset.id;
    renderApp();
  }));

  renderSeccion();
}

function renderSeccion() {
  const main = document.getElementById("main");
  if (state.seccion === "inicio") return renderInicio(main);

  const modulo = MENU.find(m => m.id === state.seccion);
  if (modulo && !modulo.construido) return renderEnConstruccion(main, modulo.label);
}

function renderInicio(main) {
  main.innerHTML = `
    <h2 class="text-lg font-bold mb-2" style="color:#1C2B3A">Bienvenido/a, ${state.perfil.nombre_completo}</h2>
    <p class="text-sm" style="color:#6C7B8A">Tu rol actual es: <strong>${state.perfil.rol}</strong></p>
    <div class="mt-4 p-4 rounded-xl bg-white border max-w-md" style="border-color:#E1DED5">
      <p class="text-sm" style="color:#1C2B3A">Este es el punto de partida del sistema. Los módulos se irán habilitando conforme se construyan:</p>
      <ol class="text-sm mt-2 list-decimal list-inside" style="color:#6C7B8A">
        <li>Alumnos y Grupos</li>
        <li>Oficios y Documentos</li>
        <li>Calificaciones y Evaluación</li>
        <li>Catedráticos</li>
      </ol>
    </div>`;
}

function renderEnConstruccion(main, nombreModulo) {
  main.innerHTML = `
    <div class="p-6 rounded-xl bg-white border max-w-md text-center" style="border-color:#E1DED5">
      <p class="text-sm font-semibold mb-1" style="color:#1C2B3A">${nombreModulo}</p>
      <p class="text-xs" style="color:#6C7B8A">Este módulo está en construcción.</p>
    </div>`;
}

init();
</script>
