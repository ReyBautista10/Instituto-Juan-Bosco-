<style>
  body { font-family: 'Inter', sans-serif; }
  .ib-brand { font-family: 'Fraunces', serif; }
  .ib-watermark {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0.05;
    pointer-events: none;
    z-index: -1;
  }
  .ib-barra { height: 6px; border-radius: 999px; background: #E1DED5; overflow: hidden; }
  .ib-barra > div { height: 100%; width: 35%; border-radius: 999px; background: #1E3A8A; animation: ibBarra 1.1s ease-in-out infinite; }
  @keyframes ibBarra { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .ib-hoja { display: flex; flex-direction: column; min-height: 24cm; }
  .ib-hoja .ib-pie { margin-top: auto; }
  @page { size: letter; margin: 1.2cm; }
  #ibPrintHost { display: none; }
  @media print {
    body.ib-imprimiendo > *:not(#ibPrintHost) { display: none !important; }
    body.ib-imprimiendo #ibPrintHost { display: block !important; }
    #ibPrintHost .ib-imprimible { position: static !important; visibility: visible !important; width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; background: #fff !important; }
    #ibPrintHost .ib-imprimible * { visibility: visible !important; }
    #ibPrintHost .ib-hoja { min-height: 24.6cm; box-sizing: border-box; padding: 0 !important; border: none !important; border-radius: 0 !important; margin: 0 !important; }
    #ibPrintHost .ib-hoja + .ib-hoja { margin-top: 0 !important; }
    #ibPrintHost .ib-salto { break-after: page; page-break-after: always; }
    body * { visibility: hidden; }
    .ib-imprimible, .ib-imprimible * { visibility: visible; }
    .ib-imprimible { position: absolute; top: 0; left: 0; }
    .ib-imprimible .no-print { display: none !important; }
    .ib-oculto-impr { display: none !important; }
  }
</style>

<script>
// ============================================================
// ⚠️ PENDIENTE: reemplaza estos dos valores con los de TU proyecto
// de Supabase nuevo (Project Settings > API > Project URL / anon public key).
// No uses el mismo proyecto de la cafetería.
// ============================================================
const SUPABASE_URL = "https://eovlqcognikomdiwibuo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvdmxxY29nbmlrb21kaXdpYnVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTkxMjMsImV4cCI6MjEwMzUzNTEyM30.YBj1IyMm_o6fEg_m8rOg1-4Z_lbXwYcGn-i1L4dn7_s";
// La sesión se guarda en sessionStorage (no localStorage): al cerrar la
// pestaña o el navegador, el propio navegador borra ese almacenamiento y
// la sesión queda cerrada automáticamente — hay que volver a iniciar sesión.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    storage: window.sessionStorage,
    persistSession: true,
    autoRefreshToken: true,
  },
});

// ============================================================
// Infraestructura global: barra de progreso al guardar, mayúsculas
// automáticas y aviso al salir de una sección con datos sin guardar.
// ============================================================
let ibOps = 0, ibTimer = null, ibMostradaEn = 0, ibOcultarT = null;
function ibBarra() {
  let el = document.getElementById("ibGuardando");
  if (el) return el;
  if (!document.getElementById("ibGuardandoCss")) {
    const st = document.createElement("style"); st.id = "ibGuardandoCss";
    st.textContent = `#ibGuardando{position:fixed;left:0;right:0;top:0;z-index:99999;pointer-events:none;display:none}
      #ibGuardando .ibg-bar{height:5px;background:#DCE3F5;overflow:hidden}
      #ibGuardando .ibg-bar i{display:block;height:100%;width:40%;background:#1E3A8A;border-radius:3px;animation:ibgmove 1s ease-in-out infinite}
      #ibGuardando .ibg-chip{margin:8px auto 0;width:max-content;max-width:92%;padding:6px 14px;border-radius:999px;background:#1E3A8A;color:#fff;font:600 13px Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)}
      @keyframes ibgmove{0%{margin-left:-40%}100%{margin-left:100%}}`;
    document.head.appendChild(st);
  }
  el = document.createElement("div"); el.id = "ibGuardando";
  el.innerHTML = `<div class="ibg-bar"><i></i></div><div class="ibg-chip">Guardando… espera un momento</div>`;
  document.body.appendChild(el);
  return el;
}
function ibProgresoInicio() {
  ibOps++;
  if (ibOcultarT) { clearTimeout(ibOcultarT); ibOcultarT = null; }
  if (ibOps === 1 && !ibTimer) ibTimer = setTimeout(() => { ibTimer = null; if (ibOps > 0) { ibBarra().style.display = "block"; ibMostradaEn = Date.now(); } }, 120);
}
function ibProgresoFin() {
  ibOps = Math.max(0, ibOps - 1);
  if (ibOps > 0) return;
  if (ibTimer) { clearTimeout(ibTimer); ibTimer = null; return; }
  const resta = Math.max(0, 450 - (Date.now() - ibMostradaEn));
  ibOcultarT = setTimeout(() => { ibOcultarT = null; if (ibOps === 0) { const el = document.getElementById("ibGuardando"); if (el) el.style.display = "none"; } }, resta);
}
// Tras un guardado exitoso, lo capturado en pantalla ya no cuenta como "pendiente de guardar".
function ibMarcarGuardado() {
  const main = document.getElementById("main");
  if (!main) return;
  main.querySelectorAll("[data-tocado]").forEach(el => { try { if (el.type === "checkbox" || el.type === "radio") el.defaultChecked = el.checked; else el.defaultValue = el.value; } catch (e) { /* igual */ } delete el.dataset.tocado; });
}
// Envuelve cualquier promesa (subidas de archivos, etc.) con la barra de progreso.
async function conProgreso(promesa) {
  ibProgresoInicio();
  try { return await promesa; } finally { ibProgresoFin(); }
}
(function instrumentarGuardado() {
  try {
    const envolver = (b) => {
      if (!b || typeof b.then !== "function" || b.__ibw) return b;
      b.__ibw = true;
      const t = b.then;
      b.then = function (ok, ko) {
        ibProgresoInicio();
        return t.call(this, v => { ibProgresoFin(); if (!(v && v.error)) ibMarcarGuardado(); return ok ? ok(v) : v; }, e => { ibProgresoFin(); if (ko) return ko(e); throw e; });
      };
      return b;
    };
    if (typeof sb.from === "function") {
      const origFrom = sb.from.bind(sb);
      sb.from = (tabla) => {
        const q = origFrom(tabla);
        ["insert", "update", "upsert", "delete"].forEach(m => { const f = q && q[m]; if (typeof f === "function") q[m] = (...a) => envolver(f.apply(q, a)); });
        return q;
      };
    }
    if (typeof sb.rpc === "function") {
      const origRpc = sb.rpc.bind(sb);
      const LECTURAS = ["aplicar_recargos", "asistencia_dia_alumnos", "personal_para_acceso"];
      sb.rpc = (nombre, ...a) => { const r = origRpc(nombre, ...a); return LECTURAS.includes(nombre) ? r : envolver(r); };
    }
    if (sb.auth && typeof sb.auth.updateUser === "function") {
      const origUpd = sb.auth.updateUser.bind(sb.auth);
      sb.auth.updateUser = (...a) => conProgreso(origUpd(...a));
    }
  } catch (e) { /* si algo falla, el sistema funciona igual, solo sin barra */ }
})();

// --- Mayúsculas automáticas en los campos de captura de texto ---
function campoSinMayusculas(el) {
  if (el.dataset && el.dataset.nomayus) return true;
  const tipo = (el.getAttribute("type") || "text").toLowerCase();
  if (el.tagName !== "TEXTAREA" && !["text", "search"].includes(tipo)) return true;
  const pista = `${el.id} ${el.name || ""} ${el.placeholder || ""}`.toLowerCase();
  return /correo|e-?mail|mail|@|pass|contrase|url|enlace|http|usuario/.test(pista) || el.id === "rgTexto";
}
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el || !(el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;
  if (campoSinMayusculas(el)) return;
  const v = el.value, mayus = v.toLocaleUpperCase("es-MX");
  if (v !== mayus) {
    let a = null, b = null;
    try { a = el.selectionStart; b = el.selectionEnd; } catch (err) { /* algunos tipos no permiten cursor */ }
    el.value = mayus;
    try { if (a !== null) el.setSelectionRange(a, b); } catch (err) { /* igual */ }
  }
}, true);

// --- Aviso al cambiar de sección con captura sin guardar ---
document.addEventListener("input", (e) => {
  const el = e.target;
  if (e.isTrusted && el && el.closest && el.closest("#main") && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) el.dataset.tocado = "1";
}, true);
document.addEventListener("change", (e) => {
  const el = e.target;
  if (e.isTrusted && el && el.closest && el.closest("#main") && el.tagName === "INPUT" && ["checkbox", "radio"].includes(el.type)) el.dataset.tocado = "1";
}, true);
function hayCapturaSinGuardar() {
  const main = document.getElementById("main");
  if (!main) return false;
  for (const el of main.querySelectorAll("input[data-tocado], textarea[data-tocado]")) {
    if (el.disabled || el.type === "file") continue;
    if (/busc|search|filtro|criterio/i.test(`${el.id} ${el.placeholder || ""}`) || el.type === "search") continue;
    if (el.type === "checkbox" || el.type === "radio") { if (el.checked !== el.defaultChecked) return true; continue; }
    if (el.value !== el.defaultValue) return true;
  }
  return false;
}
function confirmarSalidaSinGuardar() {
  if (!hayCapturaSinGuardar()) return true;
  return confirm("Estás capturando información.\n\nSi sales de esta sección, lo que no hayas guardado se perderá.\n\n¿Quieres salir de todos modos?");
}
window.addEventListener("beforeunload", (e) => {
  if (typeof state !== "undefined" && state.perfil && hayCapturaSinGuardar()) { e.preventDefault(); e.returnValue = ""; }
});

// ============================================================
// Cierre de sesión por inactividad
// ============================================================
// ⚠️ CONFIGURABLE: cambia este número para ajustar los minutos de inactividad
// permitidos antes de cerrar la sesión automáticamente.
const INACTIVIDAD_MINUTOS = 20;

let inactividadTimer = null;
let monitorInactividadIniciado = false;

function iniciarMonitorInactividad() {
  if (monitorInactividadIniciado) return;
  monitorInactividadIniciado = true;

  const eventosActividad = ["mousemove", "keydown", "click", "touchstart", "scroll"];
  eventosActividad.forEach(ev => document.addEventListener(ev, reiniciarTimerInactividad));

  // El conteo se pausa mientras la pestaña no está visible (cambiaste de app
  // o de pestaña) y se reinicia al volver — así revisar un oficio en otra
  // aplicación no cuenta como inactividad.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      reiniciarTimerInactividad();
    } else if (inactividadTimer) {
      clearTimeout(inactividadTimer);
    }
  });

  reiniciarTimerInactividad();
}

function reiniciarTimerInactividad() {
  if (document.visibilityState !== "visible") return;
  if (inactividadTimer) clearTimeout(inactividadTimer);
  inactividadTimer = setTimeout(async () => {
    await sb.auth.signOut();
    state.perfil = null;
    renderLogin(errBox(`Tu sesión se cerró automáticamente por ${INACTIVIDAD_MINUTOS} minutos de inactividad.`));
  }, INACTIVIDAD_MINUTOS * 60 * 1000);
}

function detenerMonitorInactividad() {
  if (inactividadTimer) clearTimeout(inactividadTimer);
  inactividadTimer = null;
  monitorInactividadIniciado = false;
}

function mesAnio(fechaISO) {
  if (!fechaISO) return "";
  const [a, m] = String(fechaISO).split("-").map(Number);
  const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  return `${meses[m - 1]} ${a}`;
}
function errBox(texto) {
  return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${texto}</div>`;
}
function okBox(texto) {
  return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">${texto}</div>`;
}

// Valida la estructura oficial de una CURP mexicana (18 caracteres)
function validarCurp(curp) {
  const regex = /^[A-Z][AEIOUX][A-Z]{2}\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])[HM](AS|BC|BS|CC|CS|CH|CL|CM|DF|DG|GT|GR|HG|JC|MC|MN|MS|NT|NL|OC|PL|QO|QR|SP|SL|SR|TC|TS|TL|VZ|YN|ZS|NE)[B-DF-HJ-NP-TV-Z]{3}[A-Z0-9]\d$/;
  return regex.test(curp);
}

// Valida un formato de correo electrónico razonable
function validarCorreo(correo) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);
}

// ============================================================
// Arranque: revisa si ya hay sesión activa de Supabase Auth
// ============================================================
async function init() {
  // Si la liga viene de un correo de recuperación de contraseña, Supabase la marca
  // con "type=recovery" (en el hash o en los parámetros de la URL, según el caso).
  // Hay que registrar el listener y detectarlo ANTES de revisar la sesión normal,
  // porque si no, la app entra de una vez como si fuera un login común.
  const parametrosURL = window.location.hash + window.location.search;
  const esRecuperacion = parametrosURL.includes("type=recovery");

  sb.auth.onAuthStateChange((_event, session) => {
    state.sesion = session;
    if (_event === "PASSWORD_RECOVERY") {
      renderRestablecerPassword();
      return;
    }
    if (!session) {
      state.perfil = null;
      detenerMonitorInactividad();
      renderLogin();
    }
  });

  if (esRecuperacion) {
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-5"><p class="text-sm" style="color:#6C7B8A">Cargando…</p></div>`;
    return; // esperamos a que dispare el evento PASSWORD_RECOVERY de arriba
  }

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.sesion = session;
    await cargarPerfil();
  } else {
    renderLogin();
  }
}

async function cargarPerfil() {
  const { data, error } = await sb
    .from("perfiles")
    .select("id, nombre_completo, rol, activo")
    .eq("id", state.sesion.user.id)
    .single();

  if (error || !data) {
    renderLogin(errBox("No se encontró tu perfil en el sistema. Contacta al Administrador."));
    return;
  }
  if (!data.activo) {
    await sb.auth.signOut();
    renderLogin(errBox("Tu cuenta está desactivada. Contacta al Administrador."));
    return;
  }
  state.perfil = data;
  state.seccion = "inicio";   // cada inicio de sesión arranca en Inicio
  state.calInfo = null; state.calInfoCargando = false;
  renderApp();
}

  document.getElementById("olvideVolverBtn").addEventListener("click", () => renderLogin());

  document.getElementById("olvideEnviarBtn").addEventListener("click", async () => {

// ---------- Reglas de contraseña, checklist dinámico y botón de ojo ----------
const PASS_REGLAS = [
  { id: "len", txt: "Mínimo 6 caracteres", ok: p => p.length >= 6 },
  { id: "may", txt: "Al menos 1 mayúscula", ok: p => /[A-ZÁÉÍÓÚÑÜ]/.test(p) },
  { id: "min", txt: "Al menos 1 minúscula", ok: p => /[a-záéíóúñü]/.test(p) },
  { id: "num", txt: "Al menos 1 número", ok: p => /[0-9]/.test(p) },
  { id: "esp", txt: "Al menos 1 carácter especial (@, #, $, *, …)", ok: p => /[^A-Za-z0-9ÁÉÍÓÚÑÜáéíóúñü\s]/.test(p) },
];
function traducirErrorAuth(m) {
  const t = String(m || "");
  const mapa = [
    [/different from the old password|same as the old password/i, "La nueva contraseña debe ser diferente a la anterior."],
    [/at least \d+ characters|too short/i, "La contraseña es demasiado corta."],
    [/weak|easy to guess|pwned|compromised/i, "La contraseña es demasiado débil o aparece en filtraciones conocidas. Elige otra."],
    [/reauthentication|nonce/i, "Por seguridad, vuelve a iniciar sesión y repite el cambio de contraseña."],
    [/rate limit|too many/i, "Demasiados intentos. Espera unos minutos e inténtalo de nuevo."],
    [/session.*(missing|expired)|not logged|jwt|invalid token/i, "Tu sesión expiró. Vuelve a iniciar sesión."],
    [/network|failed to fetch/i, "No hay conexión. Revisa tu internet e inténtalo de nuevo."],
  ];
  for (const [r, txt] of mapa) if (r.test(t)) return txt;
  return t;
}
function passwordValida(p) { return PASS_REGLAS.every(r => r.ok(p || "")); }
const OJO_ABIERTO = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const OJO_CERRADO = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
// Campo de contraseña con botón de ojo (mostrar/ocultar).
function htmlCampoPassword(id, mb) {
  return `<div style="position:relative" class="${mb || "mb-3"}">
    <input id="${id}" type="password" data-nomayus="1" autocomplete="off" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5; padding-right:42px" />
    <button type="button" class="ibOjo" data-for="${id}" aria-label="Mostrar contraseña" title="Mostrar / ocultar" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:#6C7B8A; padding:4px; cursor:pointer">${OJO_ABIERTO}</button>
  </div>`;
}
function htmlChecklistPassword(id, conConfirmacion) {
  const item = (k, t) => `<li data-r="${k}" style="color:#6C7B8A; list-style:none; line-height:1.6"><span class="ibCk" style="display:inline-block; width:1.2em; font-weight:700">○</span>${t}</li>`;
  return `<ul id="${id}" class="text-xs mb-3" style="padding:0; margin:0">${PASS_REGLAS.map(r => item(r.id, r.txt)).join("")}${conConfirmacion ? item("igual", "Las contraseñas coinciden") : ""}</ul>`;
}
function enlazarPassword(idNueva, idConf, idLista) {
  const nueva = document.getElementById(idNueva), conf = idConf ? document.getElementById(idConf) : null, lista = idLista ? document.getElementById(idLista) : null;
  const marcar = (k, ok) => {
    const li = lista && lista.querySelector(`[data-r="${k}"]`); if (!li) return;
    li.style.color = ok ? "#2E7D4F" : "#6C7B8A"; li.style.fontWeight = ok ? "600" : "400";
    li.querySelector(".ibCk").textContent = ok ? "✔" : "○";
  };
  const actualizar = () => {
    PASS_REGLAS.forEach(r => marcar(r.id, r.ok(nueva.value)));
    if (conf) marcar("igual", conf.value.length > 0 && conf.value === nueva.value);
  };
  nueva.addEventListener("input", actualizar);
  if (conf) conf.addEventListener("input", actualizar);
  [nueva, conf].forEach(inp => {
    if (!inp) return;
    const btn = document.querySelector(`.ibOjo[data-for="${inp.id}"]`);
    if (btn) btn.addEventListener("click", () => {
      const ver = inp.type === "password";
      inp.type = ver ? "text" : "password";
      btn.innerHTML = ver ? OJO_CERRADO : OJO_ABIERTO;
      btn.setAttribute("aria-label", ver ? "Ocultar contraseña" : "Mostrar contraseña");
    });
  });
  actualizar();
}

    msg.innerHTML = "";
    if (!passwordValida(nueva)) { msg.innerHTML = errBox("La contraseña no cumple todos los requisitos de la lista."); return; }
    if (nueva !== confirmar) { msg.innerHTML = errBox("Las contraseñas no coinciden."); return; }

    const { error } = await sb.auth.updateUser({ password: nueva });
    if (error) { msg.innerHTML = errBox(escHtml(traducirErrorAuth(error.message))); return; }

    msg.innerHTML = okBox("Contraseña actualizada. Entrando…");
    setTimeout(async () => { await cargarPerfil(); }, 1200);
  });
}

async function iniciarSesion() {
  const correo = document.getElementById("loginCorreo").value.trim();
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMsg");
  msg.innerHTML = "";

  if (!correo || !password) { msg.innerHTML = errBox("Escribe tu correo y contraseña."); return; }

  const btn = document.getElementById("loginBtn");
  if (btn.disabled) return;
  function restaurar() {
    btn.disabled = false;
    btn.style.opacity = "1";
    btn.textContent = "Entrar";
  }
  btn.disabled = true;
  btn.style.opacity = "0.7";
  btn.textContent = "Iniciando sesión…";
  msg.innerHTML = `<div class="mb-3"><p class="text-xs mb-1" style="color:#1E3A8A">Iniciando sesión, un momento…</p><div class="ib-barra"><div></div></div></div>`;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email: correo, password });
    if (error) { msg.innerHTML = errBox("Correo o contraseña incorrectos."); restaurar(); return; }
    state.sesion = data.session;
    msg.innerHTML = `<div class="mb-3"><p class="text-xs mb-1" style="color:#1E3A8A">Cargando tu información…</p><div class="ib-barra"><div></div></div></div>`;
    await cargarPerfil();
  } catch (e) {
    msg.innerHTML = errBox("No se pudo iniciar sesión. Revisa tu conexión a internet e inténtalo de nuevo.");
    restaurar();
  }
}

async function cerrarSesion() {
  await sb.auth.signOut();
  state.perfil = null; state.calInfo = null; state.calInfoCargando = false; state.seccion = "inicio";
  detenerMonitorInactividad();
  renderLogin();
}

function menuDelUsuario() {
  const ci = state.calInfo;
  return MENU.filter(m => m.roles.includes(state.perfil.rol) && (m.id !== "calificaciones" || state.perfil.rol === "Profesor" || (ci && (ci.propias > 0 || ci.pend > 0))));
}

      </div>

      <div id="main" class="p-5"></div>
    </div>`;

  document.getElementById("logoutBtn").addEventListener("click", () => { if (confirmarSalidaSinGuardar()) cerrarSesion(); });
  document.getElementById("cambiarPassBtn").addEventListener("click", abrirModalCambiarPassword);
  document.querySelectorAll(".menuBtn").forEach(b => b.addEventListener("click", () => {
    if (!confirmarSalidaSinGuardar()) return;
    state.seccion = b.dataset.id;
    renderApp();
  }));

  renderSeccion();
  cargarCalInfo();
}

// Cuántas clases tiene asignadas la persona en sesión y cuántas solicitudes de modificación hay pendientes.
async function cargarCalInfo() {
  if (!state.perfil || state.calInfoCargando) return;
  state.calInfoCargando = true;
  try {
    const rol = state.perfil.rol;
    const r1 = await sb.from("profesor_materias_grupos").select("id", { count: "exact", head: true }).eq("profesor_id", state.perfil.id);
    let pend = 0;
    if (rol !== "Profesor") {
      const r2 = await sb.from("solicitudes_criterios").select("id", { count: "exact", head: true }).eq("estado", "Pendiente");
      const r3 = await sb.from("solicitudes_calificaciones").select("id", { count: "exact", head: true }).eq("estado", "Pendiente");
      pend = (r2.count || 0) + (r3.count || 0);
    }
    const nuevo = { propias: r1.count || 0, pend };
    const ant = state.calInfo;
    state.calInfo = nuevo;
    if (!ant || ant.propias !== nuevo.propias || ant.pend !== nuevo.pend) { state.calInfoCargando = false; renderApp(); return; }
  } catch (e) { if (!state.calInfo) state.calInfo = { propias: 0, pend: 0 }; }
  state.calInfoCargando = false;
}

function abrirModalCambiarPassword() {
  const modal = document.createElement("div");
  modal.className = "fixed inset-0 z-50 flex items-center justify-center p-4";
  modal.style.background = "rgba(28,43,58,0.6)";
  modal.innerHTML = `
    <div class="rounded-2xl p-5 bg-white w-full max-w-sm">
      <p class="text-sm font-semibold mb-3" style="color:#1E3A8A">Cambiar mi contraseña</p>
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nueva contraseña</label>
      ${htmlCampoPassword("cpNueva", "mb-2")}${htmlChecklistPassword("cpLista", true)}
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Confirmar contraseña</label>
      ${htmlCampoPassword("cpConfirmar", "mb-3")}
      <div id="cpMsg"></div>
      <div class="flex gap-2">
        <button id="cpCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Cancelar</button>
        <button id="cpGuardar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  enlazarPassword("cpNueva", "cpConfirmar", "cpLista");
  document.getElementById("cpCancelar").addEventListener("click", () => modal.remove());

  document.getElementById("cpGuardar").addEventListener("click", async () => {
    const nueva = document.getElementById("cpNueva").value;
    const confirmar = document.getElementById("cpConfirmar").value;
    const msg = document.getElementById("cpMsg");
    msg.innerHTML = "";
    if (!passwordValida(nueva)) { msg.innerHTML = errBox("La contraseña no cumple todos los requisitos de la lista."); return; }
    if (nueva !== confirmar) { msg.innerHTML = errBox("Las contraseñas no coinciden."); return; }

    const { error } = await sb.auth.updateUser({ password: nueva });
    if (error) { msg.innerHTML = errBox(escHtml(traducirErrorAuth(error.message))); return; }
    msg.innerHTML = okBox("Contraseña actualizada correctamente.");
    setTimeout(() => modal.remove(), 1500);
  });
}

    const urls = [];

        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <div class="grid grid-cols-2 gap-2 mb-2">

              <a href="${pdfUrl}" target="_blank" class="inline-block px-4 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Abrir para imprimir</a>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${hojas.map((hj, i) => {
            const url = URL.createObjectURL(hj.blob); urls.push({ url, nombre: `hoja_${i + 1}.jpg` });
            return `<div class="p-1 rounded-lg bg-white border" style="border-color:#E1DED5"><img src="${url}" alt="Hoja ${i + 1}" style="width:100%" /><p class="text-xs text-center" style="color:#6C7B8A">Hoja ${i + 1} · ${hj.n}</p></div>`; }).join("")}</div>`;
      } catch (e) { salida.innerHTML = errBox(escHtml(e.message)); }
      btn.disabled = false;
    }

  function mostrarEtiquetas(lista) {
    const modal = document.createElement("div");
    modal.className = "fixed inset-0 z-50 flex items-center justify-center p-4";
    modal.style.background = "rgba(28,43,58,0.7)";
    modal.innerHTML = `
      <div class="bg-white rounded-xl p-4 max-w-lg w-full max-h-[85vh] overflow-y-auto">
        <p class="text-sm font-semibold mb-1" style="color:#1E3A8A">Etiquetas con QR</p>
        <p class="text-xs mb-3" style="color:#6C7B8A">Se descargan como imagen PNG de 5 cm × 3 cm (alta resolución), con el ID del mobiliario como nombre del archivo. Puedes juntarlas en una hoja carta para imprimir en papel adherible.</p>
        <div id="etqLista" class="grid grid-cols-1 gap-3"><p class="text-xs" style="color:#6C7B8A">Generando etiquetas…</p></div>
        <div class="flex gap-2 mt-4">
          <button id="etiquetasCerrar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Cerrar</button>
          <button id="etiquetasTodas" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff" disabled>Descargar ${lista.length > 1 ? "todas" : "imagen"}</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    const urls = [];
    document.getElementById("etiquetasCerrar").addEventListener("click", () => { urls.forEach(u => URL.revokeObjectURL(u.url)); modal.remove(); });
    (async () => {
      const caja = document.getElementById("etqLista");
      try {
        caja.innerHTML = "";
        for (const it of lista) {
          const blob = await generarEtiquetaPNG(it);
          const url = URL.createObjectURL(blob);
          urls.push({ url, nombre: it.id_etiqueta + ".png" });
          const fila = document.createElement("div");
          fila.className = "flex items-center gap-3";
          fila.innerHTML = `<img src="${url}" alt="${escHtml(it.id_etiqueta)}" style="width:150px; height:90px; border:1px solid #E1DED5" />
            <a href="${url}" download="${escHtml(it.id_etiqueta)}.png" class="px-3 py-1.5 rounded-lg text-xs font-bold" style="background:#F4F1EB; color:#1E3A8A">Descargar ${escHtml(it.id_etiqueta)}.png</a>`;
          caja.appendChild(fila);
        }
        const btn = document.getElementById("etiquetasTodas");
        btn.disabled = false;
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          for (const u of urls) { descargarUrl(u.url, u.nombre); await esperar(500); }
          btn.disabled = false;
        });
      } catch (e) { caja.innerHTML = errBox(escHtml(e.message)); }
    })();
  }

  // ---------- Revisar inventario (escaneo de etiquetas) ----------
  async function renderRevisarInventario(cont) {
    detenerEscaneoInv();
    const escaneados = [];
    cont.innerHTML = `
      <div class="max-w-md">
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <video id="invVideo" class="w-full rounded-lg bg-black" style="max-height:300px; object-fit:cover" playsinline muted></video>
          <p id="invEstado" class="text-xs mt-2" style="color:#6C7B8A">La cámara está apagada.</p>
          <div class="flex gap-2 mt-2">
            <button id="invIniciar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Escanear etiqueta</button>
            <button id="invDetener" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A; display:none">Detener</button>
          </div>
          <div class="flex gap-2 mt-3">
            <input id="invManual" placeholder="o escribe el ID (ej. BUT-001)" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border uppercase" style="border-color:#E1DED5" />
            <button id="invBuscar" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Buscar</button>
          </div>
        </div>
        <div id="invFicha"></div>
        <div id="invHistorial"></div>
      </div>`;
    const $i = id => document.getElementById(id);
    const estado = t => { const e = $i("invEstado"); if (e) e.textContent = t; };
    $i("invIniciar").addEventListener("click", iniciar);
    $i("invDetener").addEventListener("click", () => { detenerEscaneoInv(); botones(false); estado("La cámara está apagada."); });
    $i("invBuscar").addEventListener("click", () => buscarCodigo($i("invManual").value));
    $i("invManual").addEventListener("keydown", e => { if (e.key === "Enter") buscarCodigo($i("invManual").value); });
    function botones(activo) { $i("invIniciar").style.display = activo ? "none" : ""; $i("invDetener").style.display = activo ? "" : "none"; }

    async function iniciar() {
      detenerEscaneoInv();
      $i("invFicha").innerHTML = "";
      estado("Abriendo cámara…");
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error("Este navegador no permite usar la cámara (se requiere conexión segura https).");
        invStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
        const video = $i("invVideo");
        video.srcObject = invStream;
        await video.play();
        let detector = null;
        if ("BarcodeDetector" in window) { try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { detector = null; } }
        if (!detector) await cargarLibQR(INV_QR_LIBS, () => typeof window.jsQR === "function", "el lector de QR");
        botones(true);
        estado("Apunta la cámara al código QR de la etiqueta.");
        const sesion = ++invSesion;
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        while (sesion === invSesion && invStream) {
          let codigo = null;
          try {
            if (video.readyState >= 2 && video.videoWidth) {
              if (detector) { const r = await detector.detect(video); if (r.length) codigo = r[0].rawValue; }
              else {
                const w = Math.min(640, video.videoWidth), h = Math.round(w * video.videoHeight / video.videoWidth);
                canvas.width = w; canvas.height = h;
                ctx.drawImage(video, 0, 0, w, h);
                const q = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h);
                if (q) codigo = q.data;
              }
            }
          } catch (e) { /* reintenta */ }
          if (codigo) { detenerEscaneoInv(); botones(false); estado("Etiqueta leída."); await buscarCodigo(codigo); return; }
          await esperar(250);
        }
      } catch (e) {
        detenerEscaneoInv(); botones(false);
        estado("");
        $i("invFicha").innerHTML = errBox(escHtml(e.message || "No se pudo abrir la cámara."));
      }
    }

    async function buscarCodigo(texto) {
      const codigo = String(texto || "").trim().toUpperCase();
      if (!codigo) return;
      const ficha = $i("invFicha");
      ficha.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Buscando ${escHtml(codigo)}…</p>`;
      const [itRes, catRes] = await Promise.all([
        sb.from("mobiliario").select("*").eq("id_etiqueta", codigo).maybeSingle(),
        sb.from("categorias_mobiliario").select("id, nombre"),
      ]);
      if (itRes.error) { ficha.innerHTML = errBox(escHtml(itRes.error.message)); return; }
      if (!itRes.data) { ficha.innerHTML = errBox(`No existe un mobiliario con el ID "${escHtml(codigo)}".`); return; }
      const cat = (catRes.data || []).find(c => c.id === itRes.data.categoria_id);
      await pintarFicha(itRes.data, cat?.nombre || "");
    }

      const ficha = $i("invFicha");
      let movs = [];
      try {
        const { data } = await sb.from("mobiliario_movimientos").select("*").eq("mobiliario_id", item.id).order("creado_en", { ascending: false }).limit(5);
        movs = data || [];
      } catch (e) { /* tabla aún no creada */ }
      const i = escaneados.findIndex(x => x.id_etiqueta === item.id_etiqueta);
      const reg = { id_etiqueta: item.id_etiqueta, ubicacion: item.ubicacion, estado: item.estado, activo: item.activo };
      if (i >= 0) escaneados[i] = reg; else escaneados.unshift(reg);
      pintarHistorial();
      const colorEstado = item.estado === "Bueno" ? "#3F7A5E" : item.estado === "Regular" ? "#B7791F" : "#B5453A";
      ficha.innerHTML = `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5; ${item.activo ? "" : "opacity:.85"}">
          <p class="text-lg font-bold" style="color:#1E3A8A">${escHtml(item.id_etiqueta)}${item.activo ? "" : ' <span class="text-xs" style="color:#B5453A">DADO DE BAJA</span>'}</p>
          <p class="text-sm" style="color:#1C2B3A">${escHtml(catNombre)}${item.descripcion ? " — " + escHtml(item.descripcion) : ""}</p>
          <div class="text-xs mt-2 space-y-1" style="color:#1C2B3A">
            <p><strong>Ubicación:</strong> ${escHtml(item.ubicacion || "Sin ubicación")}</p>
            <p><strong>Estado:</strong> <span style="color:${colorEstado}; font-weight:700">${escHtml(item.estado)}</span></p>
            ${item.numero_serie ? `<p><strong>No. de serie:</strong> ${escHtml(item.numero_serie)}</p>` : ""}
            ${item.fecha_adquisicion ? `<p><strong>Adquisición:</strong> ${escHtml(item.fecha_adquisicion)}</p>` : ""}
            ${item.observaciones ? `<p><strong>Observaciones:</strong> ${escHtml(item.observaciones)}</p>` : ""}
            ${!item.activo && item.motivo_baja ? `<p style="color:#B5453A"><strong>Motivo de baja:</strong> ${escHtml(item.motivo_baja)}${item.fecha_baja ? " (" + escHtml(item.fecha_baja) + ")" : ""}</p>` : ""}
          </div>
          <div class="flex gap-2 flex-wrap mt-3">
            ${item.activo ? `<button class="invAcc px-3 py-1.5 rounded-lg text-xs font-bold" data-a="mover" style="background:#EEF2FB; color:#1E3A8A">Mover de salón</button>
            <button class="invAcc px-3 py-1.5 rounded-lg text-xs font-bold" data-a="estado" style="background:#EEF2FB; color:#1E3A8A">Estado / observación</button>

      if (tipo === "reactivar") caja.innerHTML = `<p class="text-xs mb-1" style="color:#6C7B8A">El mobiliario volverá a estar activo.</p>${botonesAcc}`;
      $i("invAccCancelar").addEventListener("click", () => { caja.innerHTML = ""; });
      $i("invAccOk").addEventListener("click", async () => {
        const msg = $i("invAccMsg"), ok = $i("invAccOk");
        try {
          ok.disabled = true;
          if (tipo === "mover") {
            const nueva = $i("invNuevaUbic").value.trim();
            if (!nueva) { msg.innerHTML = errBox("Escribe la nueva ubicación."); ok.disabled = false; return; }
            await guardarCambio(item, { ubicacion: nueva }, "Cambio de ubicación", `${item.ubicacion || "Sin ubicación"} → ${nueva}`, { ubicacion_anterior: item.ubicacion || null, ubicacion_nueva: nueva });
          } else if (tipo === "estado") {
            const nuevo = $i("invNuevoEstado").value, obs = $i("invObs").value.trim();
            const cambios = { estado: nuevo }; if (obs) cambios.observaciones = obs;
            await guardarCambio(item, cambios, "Cambio de estado", `${item.estado} → ${nuevo}${obs ? ". " + obs : ""}`, { estado_anterior: item.estado, estado_nuevo: nuevo });
          } else if (tipo === "baja") {
            const motivo = $i("invMotivoBaja").value.trim();
            if (!motivo) { msg.innerHTML = errBox("Escribe el motivo de la baja."); ok.disabled = false; return; }
            await guardarCambio(item, { activo: false, motivo_baja: motivo, fecha_baja: fechaLocalISO(new Date()) }, "Baja", motivo, {});
          } else {
            await guardarCambio(item, { activo: true, motivo_baja: null, fecha_baja: null }, "Reactivación", null, {});
          }
          await buscarCodigo(item.id_etiqueta);
        } catch (e) { ok.disabled = false; msg.innerHTML = errBox(escHtml(e.message)); }
      });
    }
  }
}

const QR_GEN_LIBS = ["https://unpkg.com/qrcode@1.5.0/build/qrcode.js", "https://cdn.jsdelivr.net/npm/qrcode@1.5.0/build/qrcode.js"];
const INV_QR_LIBS = ["https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js", "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"];
let invStream = null;
let invSesion = 0;
function detenerEscaneoInv() {
  invSesion++;
  if (invStream) { invStream.getTracks().forEach(t => t.stop()); invStream = null; }
}
async function cargarLibQR(urls, listo, nombre) {
  if (listo()) return;
  for (const u of urls) { try { await cargarScriptExterno(u); if (listo()) return; } catch (e) { /* prueba la siguiente */ } }
  throw new Error(`No se pudo cargar ${nombre || "la librería de QR"}. Revisa la conexión a internet.`);
}
const CRC_TABLA = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (const b of bytes) c = CRC_TABLA[(c ^ b) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
// Inserta la resolución (dpi) en el PNG para que al abrirlo en un editor mida exactamente lo planeado (5 × 3 cm).
async function pngConDpi(blob, dpi) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  const ppm = Math.round(dpi / 0.0254);
  const chunk = new Uint8Array(21);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, 9);
  chunk.set([0x70, 0x48, 0x59, 0x73], 4);
  dv.setUint32(8, ppm); dv.setUint32(12, ppm); chunk[16] = 1;
  dv.setUint32(17, crc32(chunk.subarray(4, 17)));
  const out = new Uint8Array(buf.length + 21);
  out.set(buf.subarray(0, 33), 0); out.set(chunk, 33); out.set(buf.subarray(33), 54);
  return new Blob([out], { type: "image/png" });
}
// PDF tamaño carta (612 × 792 pt) con una imagen JPEG a página completa por hoja. Sin librerías externas.
function pdfDeImagenesJpeg(paginas) {
  const enc = new TextEncoder(), partes = [], offs = [];
  let largo = 0;
  const push = x => { const b = typeof x === "string" ? enc.encode(x) : x; partes.push(b); largo += b.length; };
  const obj = (n, cuerpo, binario) => {
    offs[n] = largo; push(`${n} 0 obj\n${cuerpo}`);
    if (binario) { push("\nstream\n"); push(binario); push("\nendstream"); }
    push("\nendobj\n");
  };
  push("%PDF-1.4\n");
  const total = 2 + paginas.length * 3;
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, `<< /Type /Pages /Kids [${paginas.map((_, i) => `${3 + i * 3} 0 R`).join(" ")}] /Count ${paginas.length} >>`);
  paginas.forEach((pg, i) => {
    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
    const contenido = "q 612 0 0 792 0 0 cm /Im0 Do Q";
    obj(pid, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cid} 0 R >>`);
    obj(cid, `<< /Length ${contenido.length} >>`, contenido);
    obj(iid, `<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpeg.length} >>`, pg.jpeg);
  });
  const xref = largo;
  push(`xref\n0 ${total + 1}\n0000000000 65535 f \n`);
  for (let n = 1; n <= total; n++) push(`${String(offs[n]).padStart(10, "0")} 00000 n \n`);
  push(`trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(partes, { type: "application/pdf" });
}
// Etiqueta de 5 cm × 3 cm a 600 dpi (1181 × 709 px): QR a la izquierda; categoría e ID a la derecha.
async function generarEtiquetaPNG(item) {
  const canvas = await dibujarEtiquetaCanvas(item);
  const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
  return pngConDpi(blob, 600);
}
async function dibujarEtiquetaCanvas(item) {
  await cargarLibQR(QR_GEN_LIBS, () => window.QRCode && typeof window.QRCode.toCanvas === "function", "el generador de QR");
  const W = 1181, H = 709;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#1E3A8A"; ctx.lineWidth = 6; ctx.strokeRect(6, 6, W - 12, H - 12);
  const qc = document.createElement("canvas");
  await window.QRCode.toCanvas(qc, item.id_etiqueta, { errorCorrectionLevel: "M", margin: 1, width: 560, color: { dark: "#000000", light: "#ffffff" } });
  ctx.drawImage(qc, 40, (H - 560) / 2, 560, 560);
  const x = 640, ancho = W - x - 40;
  const ajustar = (txt, peso, max, min) => { let px = max; do { ctx.font = `${peso} ${px}px Arial, Helvetica, sans-serif`; px -= 4; } while (ctx.measureText(txt).width > ancho && px > min); };
  ctx.fillStyle = "#1E3A8A"; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ajustar("Juan Bosco Instituto", "bold", 44, 24); ctx.fillText("Juan Bosco Instituto", x, 150);
  ctx.fillStyle = "#1C2B3A";
  ajustar(item.categoria_nombre || "", "normal", 54, 24); ctx.fillText(item.categoria_nombre || "", x, 270);
  ctx.fillStyle = "#1E3A8A";
  ajustar(item.id_etiqueta, "bold", 150, 40); ctx.fillText(item.id_etiqueta, x, 450);
  ctx.fillStyle = "#6C7B8A"; ctx.font = "normal 34px Arial, Helvetica, sans-serif"; ctx.fillText("Inventario", x, 560);
  return canvas;
}

  const a = document.createElement("a");
  a.href = url; a.download = nombre;

      const ini = fechaDesdeDMY(document.getElementById("ccIni").value);
      if (!ini) return null;
      const [y, m] = ini.split("-").map(Number);
      const a = m >= 7 ? y : y - 1;   // año escolar que arranca en julio-diciembre
      return `${a}-${a + 1}` + (nivel === "Preparatoria" ? " " + document.getElementById("ccSem").value : "");
    };
    function vista() {
      const nivel = document.getElementById("ccNivel").value;
      document.getElementById("ccSemWrap").style.display = nivel === "Preparatoria" ? "block" : "none";
      document.getElementById("ccAyuda").textContent = nivel === "Preparatoria"
        ? "Un año escolar de Preparatoria son 2 ciclos: A y B (por ejemplo 2026-2027 A y 2026-2027 B). Las materias se repiten cada 2 ciclos: A con A del año siguiente."
        : "Un ciclo de Secundaria es un año escolar completo (por ejemplo 2026-2027).";
      document.getElementById("ccNombreVista").textContent = nombreCiclo() || "— (escribe la fecha de inicio)";
    }
    document.getElementById("ccNivel").addEventListener("change", vista);
    document.getElementById("ccSem").addEventListener("change", vista);
    vista();

    document.getElementById("ccGuardar").addEventListener("click", async () => {
      const nivel = document.getElementById("ccNivel").value;
      const inicio = fechaDesdeDMY(document.getElementById("ccIni").value);
      const fin = fechaDesdeDMY(document.getElementById("ccFin").value);
      const msg = document.getElementById("ccMsg");
      msg.innerHTML = "";
      if (!inicio || !fin) { msg.innerHTML = errBox("Escribe fechas válidas de inicio y final con el formato dd/mm/aaaa."); return; }
      if (fin <= inicio) { msg.innerHTML = errBox("La fecha final debe ser posterior a la fecha de inicio."); return; }
      const nombre = nombreCiclo();
      if (ciclos.some(c => c.nivel === nivel && String(c.nombre).trim().toUpperCase() === nombre.toUpperCase())) { msg.innerHTML = errBox(`Ya existe el ciclo ${nombre} de ${nivel}.`); return; }
      const { error } = await sb.from("ciclos_escolares").insert({ nivel, nombre, fecha_inicio: inicio, fecha_fin: fin });
      if (error) { msg.innerHTML = errBox(error.message); return; }
      renderCiclos(cont);
    });

    cont.querySelectorAll(".ccActivarBtn").forEach(b => b.addEventListener("click", async () => {
      // Solo se desactivan los ciclos del MISMO nivel — Secundaria y Preparatoria
      // llevan cada quien su propio ciclo activo, sin pisarse entre sí.
      await sb.from("ciclos_escolares").update({ activo: false }).eq("nivel", b.dataset.nivel);
      await sb.from("ciclos_escolares").update({ activo: true }).eq("id", b.dataset.id);
      renderCiclos(cont);
    }));
  }

  // ---------- Grados ----------
  // Catálogo fijo: el usuario solo elige de esta lista, así los nombres nunca se escriben a mano.
  const CATALOGO_GRADOS = {
    Secundaria: [
      { nombre: "1ER GRADO", numero: 1 }, { nombre: "2º GRADO", numero: 2 }, { nombre: "3ER GRADO", numero: 3 },
    ],
    Preparatoria: [
      { nombre: "1ER SEMESTRE", numero: 1 }, { nombre: "2º SEMESTRE", numero: 2 }, { nombre: "3ER SEMESTRE", numero: 3 },
      { nombre: "4º SEMESTRE", numero: 4 }, { nombre: "5º SEMESTRE", numero: 5 }, { nombre: "6º SEMESTRE", numero: 6 },
    ],
  };
  async function renderGrados(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const [gRes, cRes] = await Promise.all([
      sb.from("grados").select("*").order("numero"),
      sb.from("ciclos_escolares").select("id, nombre, nivel, activo, fecha_inicio").order("fecha_inicio", { ascending: false }),
    ]);
    if (gRes.error) { cont.innerHTML = errBox(escHtml(gRes.error.message)); return; }
    const existentes = gRes.data || [];
    const todosCiclos = cRes.data || [];
    let nivel = "Secundaria";
    let cicloId = null;
    const clave = (c, nombre) => c + "|" + String(nombre).trim().toUpperCase();
    const ya = new Set(existentes.map(g => clave(g.ciclo_escolar_id, g.nombre)));

    function pintar() {
      const cat = CATALOGO_GRADOS[nivel];
      const ciclos = todosCiclos.filter(c => c.nivel === nivel);
      if (!cicloId || !ciclos.find(c => c.id === cicloId)) { const a = ciclos.find(c => c.activo) || ciclos[0]; cicloId = a ? a.id : null; }
      const selNivel = `
            <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nivel</label>
            <select id="gdNivel" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
              <option ${nivel === "Secundaria" ? "selected" : ""}>Secundaria</option>
              <option ${nivel === "Preparatoria" ? "selected" : ""}>Preparatoria</option>
            </select>`;
      if (!cicloId) {
        cont.innerHTML = `<div class="max-w-lg"><div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">${selNivel}
          <p class="text-sm" style="color:#6C7B8A">No hay ningún ciclo escolar de ${nivel}. Los grados pertenecen a un ciclo: créalo primero en la pestaña "Ciclos Escolares".</p></div></div>`;
        document.getElementById("gdNivel").addEventListener("change", e => { nivel = e.target.value; cicloId = null; pintar(); });
        return;
      }
      const delCiclo = existentes.filter(g => g.ciclo_escolar_id === cicloId);
      cont.innerHTML = `
        <div class="max-w-lg">
          <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
            <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Agregar grados al ciclo</p>
            ${selNivel}
            <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Ciclo escolar</label>
            <select id="gdCiclo" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
              ${ciclos.map(c => `<option value="${c.id}" ${c.id === cicloId ? "selected" : ""}>${escHtml(c.nombre)}${c.activo ? " (Activo)" : ""}</option>`).join("")}
            </select>
            ${nivel === "Preparatoria" ? `
            <p class="text-xs mb-1" style="color:#6C7B8A">Selecciona el juego de grados que se usa en el ciclo:</p>
            <div class="flex gap-2 flex-wrap mb-2">
              <button type="button" id="gdNones" class="px-2 py-1 rounded-lg text-xs font-semibold" style="background:#EEF2FB; color:#1E3A8A">Ciclo: 1ER, 3ER y 5º semestre</button>
              <button type="button" id="gdPares" class="px-2 py-1 rounded-lg text-xs font-semibold" style="background:#EEF2FB; color:#1E3A8A">Intersemestral: 2º, 4º y 6º semestre</button>
            </div>` : ""}
            <div class="space-y-1 mb-2">
              ${cat.map(c => { const existe = ya.has(clave(cicloId, c.nombre)); return `
              <label class="flex items-center gap-2 text-sm" style="color:${existe ? "#6C7B8A" : "#1C2B3A"}">
                <input type="checkbox" class="gdChk" value="${c.numero}" ${existe ? "checked disabled" : ""} /> ${c.nombre}${existe ? " (ya registrado)" : ""}
              </label>`; }).join("")}
            </div>
            <div id="gdMsg" class="mb-2"></div>
            <button id="gdAgregar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Agregar grados seleccionados</button>
          </div>

          <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Grados de este ciclo</p>
          ${delCiclo.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Este ciclo aún no tiene grados registrados.</p>` : [nivel].map(nv => {
            const lst = delCiclo;
            return lst.length ? lst.map(g => `
              <div class="flex items-center justify-between p-2 rounded-lg bg-white border mb-1 text-sm" style="border-color:#E1DED5; color:#1E3A8A">
                <span>${escHtml(g.nombre)}</span>
                <button class="gdDel px-2 py-1 rounded-lg text-xs font-semibold" data-id="${g.id}" style="background:#F5E4E1; color:#B5453A">Quitar</button>
              </div>`).join("") : "";
          }).join("")}
        </div>`;

      document.getElementById("gdNivel").addEventListener("change", e => { nivel = e.target.value; cicloId = null; pintar(); });
      document.getElementById("gdCiclo").addEventListener("change", e => { cicloId = e.target.value; pintar(); });
      const marcar = nums => document.querySelectorAll(".gdChk").forEach(c => { if (!c.disabled) c.checked = nums.includes(Number(c.value)); });
      const bn = document.getElementById("gdNones"), bp = document.getElementById("gdPares");
      if (bn) bn.addEventListener("click", () => marcar([1, 3, 5]));
      if (bp) bp.addEventListener("click", () => marcar([2, 4, 6]));

      document.getElementById("gdAgregar").addEventListener("click", async () => {
        const msg = document.getElementById("gdMsg");
        const nums = [...document.querySelectorAll(".gdChk")].filter(c => c.checked && !c.disabled).map(c => Number(c.value));
        if (nums.length === 0) { msg.innerHTML = errBox("Selecciona al menos un grado que aún no esté registrado."); return; }
        const filas = CATALOGO_GRADOS[nivel].filter(c => nums.includes(c.numero)).map(c => ({ nombre: c.nombre, nivel, numero: c.numero, ciclo_escolar_id: cicloId }));
        const { error: e } = await sb.from("grados").insert(filas);
        if (e) { msg.innerHTML = errBox(escHtml(e.message)); return; }
        const sel = cicloId; await renderGrados(cont);
        void sel;
      });

      document.querySelectorAll(".gdDel").forEach(b => b.addEventListener("click", async () => {
        if (!confirm("¿Quitar este grado?")) return;
        const { error: e } = await sb.from("grados").delete().eq("id", b.dataset.id);
        if (e) { document.getElementById("gdMsg").innerHTML = errBox(/foreign key|violates/i.test(e.message) ? "No se puede quitar: ya tiene grupos creados." : escHtml(e.message)); return; }
        renderGrados(cont);
      }));
    }
    pintar();
  }

  // ---------- Grupos ----------
  async function renderGrupos(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const [ciclosRes, gradosRes, profesRes] = await Promise.all([
      sb.from("ciclos_escolares").select("*").order("fecha_inicio", { ascending: false }),
      sb.from("grados").select("*").order("nivel").order("numero"),
      sb.from("perfiles").select("id, nombre_completo").or("rol.eq.Profesor,es_catedratico.eq.true").eq("activo", true).order("nombre_completo"),
    ]);
    if (ciclosRes.error) { cont.innerHTML = errBox(ciclosRes.error.message); return; }

    const todosCiclos = ciclosRes.data || [];
    const todosGrados = gradosRes.data || [];
    const profesores = profesRes.data || [];

    let nivelSeleccionado = "Secundaria";
    let cicloSeleccionado = null;

    function ciclosDelNivel() { return todosCiclos.filter(c => c.nivel === nivelSeleccionado); }
    function gradosDelCiclo() { return todosGrados.filter(g => g.nivel === nivelSeleccionado && g.ciclo_escolar_id === cicloSeleccionado); }

    async function pintarGrupos() {
      const ciclos = ciclosDelNivel();
      const cicloActivo = ciclos.find(c => c.activo) || ciclos[0];
      if (!cicloSeleccionado || !ciclos.find(c => c.id === cicloSeleccionado)) {
        cicloSeleccionado = cicloActivo ? cicloActivo.id : null;
      }

      if (!cicloSeleccionado) {
        cont.innerHTML = `
          <div class="max-w-lg">
            ${selectorNivelHtml()}
            <p class="text-sm mt-3" style="color:#6C7B8A">No hay ningún ciclo escolar de ${nivelSeleccionado} capturado. Créalo primero en la pestaña "Ciclos Escolares".</p>
          </div>`;
        document.getElementById("grNivelSel").addEventListener("change", (e) => { nivelSeleccionado = e.target.value; cicloSeleccionado = null; pintarGrupos(); });
        return;
      }

      const grados = gradosDelCiclo();
      const { data, error } = await sb
        .from("grupos")
        .select("id, letra, grado_id, profesor_titular_id, grados(nombre, nivel), perfiles(nombre_completo)")
        .eq("ciclo_escolar_id", cicloSeleccionado)
        .order("letra");
      if (error) { cont.innerHTML = errBox(error.message); return; }

      cont.innerHTML = `
        <div class="max-w-lg">
          ${selectorNivelHtml()}

          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Ciclo escolar (${nivelSeleccionado})</label>
          <select id="grCicloSel" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${ciclos.map(c => `<option value="${c.id}" ${c.id === cicloSeleccionado ? "selected" : ""}>${c.nombre}${c.activo ? " (Activo)" : ""}</option>`).join("")}
          </select>

          <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
            <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Nuevo grupo de ${nivelSeleccionado}</p>
            ${grados.length === 0 ? `<p class="text-sm" style="color:#B5453A">Este ciclo no tiene grados. Primero agrégalos en la pestaña "Grados" para poder crear grupos.</p>` : `
            <div class="grid grid-cols-3 gap-2 mb-2">
              <select id="grGradoSel" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                ${grados.map(g => `<option value="${g.id}">${g.nombre}</option>`).join("")}
              </select>
              <input id="grLetra" placeholder="Letra (A, B…)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
              <select id="grProfesorSel" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                <option value="">Sin profesor titular</option>
                ${profesores.map(p => `<option value="${p.id}">${p.nombre_completo}</option>`).join("")}
              </select>
            </div>
            <div id="grMsg"></div>
            <button id="grGuardar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Agregar grupo</button>`}
          </div>

          <div class="space-y-2">
            ${(data || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin grupos capturados para este ciclo.</p>` : data.map(g => `
              <div class="p-3 rounded-xl bg-white border" style="border-color:#E1DED5">
                <p class="text-sm font-semibold" style="color:#1E3A8A">${g.grados.nombre} "${g.letra}"</p>
                <p class="text-xs" style="color:#6C7B8A">Titular: ${g.perfiles?.nombre_completo || "Sin asignar"}</p>
              </div>`).join("")}
          </div>
        </div>`;

      document.getElementById("grNivelSel").addEventListener("change", (e) => { nivelSeleccionado = e.target.value; cicloSeleccionado = null; pintarGrupos(); });

      document.getElementById("grCicloSel").addEventListener("change", (e) => {
        cicloSeleccionado = e.target.value;
        pintarGrupos();
      });

      const btnGrGuardar = document.getElementById("grGuardar");
      if (btnGrGuardar) btnGrGuardar.addEventListener("click", async () => {
        const grado_id = document.getElementById("grGradoSel").value;
        const letra = document.getElementById("grLetra").value.trim().toUpperCase();
        const profesor_titular_id = document.getElementById("grProfesorSel").value || null;
        const msg = document.getElementById("grMsg");
        msg.innerHTML = "";
        if (!letra) { msg.innerHTML = errBox("Escribe la letra del grupo."); return; }
        const { error } = await sb.from("grupos").insert({ ciclo_escolar_id: cicloSeleccionado, grado_id, letra, profesor_titular_id });
        if (error) { msg.innerHTML = errBox(error.message); return; }
        pintarGrupos();
      });
    }

    function selectorNivelHtml() {
      return `
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nivel</label>
        <select id="grNivelSel" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
          <option value="Secundaria" ${nivelSeleccionado === "Secundaria" ? "selected" : ""}>Secundaria</option>
          <option value="Preparatoria" ${nivelSeleccionado === "Preparatoria" ? "selected" : ""}>Preparatoria</option>
        </select>`;
    }

    pintarGrupos();
  }

  // ---------- Alumnos ----------
  async function renderAlumnosTab(cont) {
    cont.innerHTML = `
      <div class="max-w-2xl">
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <div class="flex gap-2">
            <input id="alBuscarInput" placeholder="Buscar por nombre o matrícula…" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <button id="alBuscarBtn" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Buscar</button>
            <button id="alNuevoBtn" class="px-3 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">+ Nuevo alumno</button>
          </div>
        </div>
        <div id="alFormWrap"></div>
        <div id="alListaResultados"></div>
      </div>`;

    document.getElementById("alBuscarBtn").addEventListener("click", buscarAlumnos);
    document.getElementById("alBuscarInput").addEventListener("keydown", e => { if (e.key === "Enter") buscarAlumnos(); });
    document.getElementById("alNuevoBtn").addEventListener("click", () => mostrarFormularioAlumno(null));

    buscarAlumnos();

    async function buscarAlumnos() {
      const criterio = document.getElementById("alBuscarInput").value.trim();
      const lista = document.getElementById("alListaResultados");
      lista.innerHTML = `<p class="text-xs mt-2" style="color:#6C7B8A">Buscando…</p>`;

      let query = sb.from("alumnos").select("*").order("apellido_paterno");
      if (criterio) {
        query = query.or(`nombres.ilike.%${criterio}%,apellido_paterno.ilike.%${criterio}%,apellido_materno.ilike.%${criterio}%,matricula.ilike.%${criterio}%`);
      }
      const { data, error } = await query;
      if (error) { lista.innerHTML = errBox(error.message); return; }

      lista.innerHTML = (!data || data.length === 0)
        ? `<p class="text-sm mt-3" style="color:#6C7B8A">Sin resultados.</p>`
        : `<div class="mt-3 space-y-2">${data.map((a, i) => `
            <button class="alEditarBtn w-full text-left p-3 rounded-xl bg-white border" data-idx="${i}" style="border-color:#E1DED5; ${!a.activo ? "opacity:0.5" : ""}">
              <p class="text-sm font-semibold" style="color:#1E3A8A">${a.nombres} ${a.apellido_paterno} ${a.apellido_materno || ""} <span class="text-xs font-normal" style="color:#6C7B8A">(${a.matricula})</span></p>
              <p class="text-xs" style="color:#6C7B8A">${a.curp || "Sin CURP"} · Ingreso: ${a.fecha_ingreso}${!a.activo ? " · INACTIVO" : ""}</p>
            </button>`).join("")}</div>`;

      lista.querySelectorAll(".alEditarBtn").forEach(b => b.addEventListener("click", () => mostrarFormularioAlumno(data[Number(b.dataset.idx)])));
    }

    async function mostrarFormularioAlumno(alumnoExistente) {
      const wrap = document.getElementById("alFormWrap");
      const esEdicion = !!alumnoExistente;
      wrap.innerHTML = `<p class="text-xs mt-2" style="color:#6C7B8A">Cargando…</p>`;

      let tutorExistente = null;
      let tutor2Existente = null;
      let inscripcionExistente = null;

      if (esEdicion) {
        const [tutorRes, inscRes] = await Promise.all([
          sb.from("alumno_tutores").select("tutor_id, es_contacto_principal, tutores(*)").eq("alumno_id", alumnoExistente.id).order("es_contacto_principal", { ascending: false }),
          sb.from("inscripciones").select("*, grupos(letra, grado_id, grados(nombre, nivel))").eq("alumno_id", alumnoExistente.id).order("fecha_inscripcion", { ascending: false }).limit(1).maybeSingle(),
        ]);
        const listaTut = (tutorRes.data || []).map(t => t.tutores).filter(Boolean);
        tutorExistente = listaTut[0] || null;
        tutor2Existente = listaTut[1] || null;
        inscripcionExistente = inscRes.data || null;
      }

      const nivelInicial = inscripcionExistente?.grupos?.grados?.nivel || "Secundaria";

      wrap.innerHTML = `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <div class="flex items-center justify-between mb-3">
            <p class="text-sm font-semibold" style="color:#1E3A8A">${esEdicion ? "Editar alumno: " + alumnoExistente.matricula : "Nuevo alumno"}</p>
            ${esEdicion ? `<label class="flex items-center gap-1 text-xs" style="color:#1E3A8A"><input type="checkbox" id="naActivo" ${alumnoExistente.activo ? "checked" : ""} /> Activo</label>` : ""}
          </div>

          <div class="grid grid-cols-3 gap-2 mb-3">
            <input id="naNombres" placeholder="Nombre(s)" value="${alumnoExistente?.nombres || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="naApPat" placeholder="Apellido paterno" value="${alumnoExistente?.apellido_paterno || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="naApMat" placeholder="Apellido materno" value="${alumnoExistente?.apellido_materno || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          </div>

          <div class="grid grid-cols-3 gap-2 mb-3">
            <input id="naCurp" placeholder="CURP (18 caracteres, opcional)" maxlength="18" value="${alumnoExistente?.curp || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="naFechaNac" type="date" value="${alumnoExistente?.fecha_nacimiento || ""}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <select id="naSexo" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
              <option value="">Sexo</option>
              <option value="Femenino" ${alumnoExistente?.sexo === "Femenino" ? "selected" : ""}>Femenino</option>
              <option value="Masculino" ${alumnoExistente?.sexo === "Masculino" ? "selected" : ""}>Masculino</option>
            </select>
          </div>

          matriculaNueva = alumnoData.matricula || "";

        // Guarda (o actualiza) cada tutor y lo liga al alumno. El primero queda como contacto principal.
        async function guardarTutor(datos, existente, principal) {
          const fila = {
            nombre_completo: datos.nombre_completo, parentesco: datos.parentesco || null,
            telefono: datos.telefono || null, correo: datos.correo || null, direccion: datos.direccion || null,
          };

            const { error: eU } = await sb.from("tutores").update(fila).eq("id", existente.id);

          const { data: tNuevo, error: eT } = await sb.from("tutores").insert(fila).select().single();
          if (eT) return eT;
          const { error: eR } = await sb.from("alumno_tutores").insert({ alumno_id: alumnoId, tutor_id: tNuevo.id, es_contacto_principal: principal });
          return eR;

        if (t2Capturado) {

        const grupoSel = document.getElementById("naGrupoSel");
        if (grupoSel && grupoSel.value) {

          const { data: existeInsc } = await sb.from("inscripciones").select("id").eq("alumno_id", alumnoId).eq("ciclo_escolar_id", cicloId).maybeSingle();
          if (existeInsc) {

          } else {
            await sb.from("inscripciones").insert({ alumno_id: alumnoId, ciclo_escolar_id: cicloId, grupo_id: grupoSel.value });
          }
        }

        if (!esEdicion) {
          const opcGrupo = grupoSel && grupoSel.value ? grupoSel.options[grupoSel.selectedIndex].text : "";
          const nivelTxt = document.getElementById("naNivelSel")?.value || "";
          buscarAlumnos();
          await mostrarConsentimientoFacial(wrap, {
            alumnoNombre: nombreCompletoAlumno({ nombres, apellido_paterno: apPat, apellido_materno: datosAlumno.apellido_materno }),
            matricula: matriculaNueva,
            grupoTxt: opcGrupo ? `${opcGrupo}${nivelTxt ? " (" + nivelTxt + ")" : ""}` : "", nivel: nivelTxt, alumnoId,
            tutorNombre: t1.nombre_completo, tutorParentesco: t1.parentesco,
          });
          return;
        }
        wrap.innerHTML = "";
        buscarAlumnos();
      });
    }

    async function cargarGruposParaInscripcion(nivel, grupoIdPreseleccionar) {
      const wrapSel = document.getElementById("naGrupoSelWrap");
      wrapSel.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando grupos…</p>`;

        return;
      }
      const { data: grupos } = await sb
        .from("grupos")
        .select("id, letra, grados(nombre)")
        .eq("ciclo_escolar_id", cicloActivo.id)
        .order("letra");

      wrapSel.innerHTML = `
        <select id="naGrupoSel" data-ciclo="${cicloActivo.id}" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
          <option value="">Sin asignar por ahora</option>
          ${(grupos || []).map(g => `<option value="${g.id}" ${g.id === grupoIdPreseleccionar ? "selected" : ""}>${g.grados.nombre} "${g.letra}"</option>`).join("")}
        </select>`;
    }
  }
}

// ============================================================
// Módulo Entradas y Salidas (reconocimiento facial)
// Alumnos y personal. El reconocimiento se hace en el navegador con
// face-api; en la base solo se guarda una representación numérica del
// rostro (128 números por muestra), nunca la fotografía.
// ============================================================

// ⚠️ CONFIGURABLE ─ ajustes del reconocimiento
const FACE_LIB_URLS = [
  "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js",
  "https://unpkg.com/@vladmandic/face-api/dist/face-api.js",
];
const FACE_MODEL_URLS = [
  "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/",
  "https://vladmandic.github.io/face-api/model/",
];
const FACE_DIST_UMBRAL = 0.5;          // más bajo = más estricto (0.45–0.55 es un rango razonable)
const FACE_FRAMES_CONFIRMACION = 3;    // cuadros seguidos con la misma persona antes de registrar
const FACE_MIN_ANCHO = 0.2;            // el rostro debe ocupar al menos este % del ancho de la imagen
const FACE_MUESTRAS_REGISTRO = 5;      // muestras que se guardan por persona
const FACE_BLOQUEO_MIN_MS = 15000;     // tiempo mínimo antes de poder registrar otra vez a la misma persona
const FACE_BLOQUEO_AUSENCIA_MS = 5000; // y debe haber salido de la imagen al menos este tiempo
const FACE_RECARGA_MS = 5 * 60 * 1000; // cada cuánto se vuelven a leer los rostros registrados

let faceListo = null;
let camStream = null;
let kioskSesion = 0;
let wakeLockRef = null;
let cachePersonalAcceso = null;

// "Juan Bosco Preparatoria" siempre se muestra como "Preparatoria Juan Bosco" (también en mayúsculas).
function corregirNombrePlantel(t) {
  return String(t ?? "").replace(/juan\s+bosco\s+preparatoria/gi, m => m === m.toUpperCase() ? "PREPARATORIA JUAN BOSCO" : "Preparatoria Juan Bosco");
}
function escHtml(texto) {
  return corregirNombrePlantel(texto).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function normalizarTexto(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}
function esperar(ms) { return new Promise(r => setTimeout(r, ms)); }

function detenerCamara() {
  kioskSesion++;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  if (wakeLockRef) { try { wakeLockRef.release(); } catch (e) {} wakeLockRef = null; }
}

async function mantenerPantallaEncendida() {
  try { if (navigator.wakeLock) wakeLockRef = await navigator.wakeLock.request("screen"); } catch (e) {}
}

async function iniciarCamara(videoEl) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Este navegador no permite usar la cámara (se requiere conexión segura https).");
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false,
  });
  camStream = stream;
  videoEl.srcObject = stream;
  await videoEl.play();
}

function cargarScriptExterno(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error("No se pudo cargar " + src)); };
    document.head.appendChild(s);
  });
}

// Carga la librería y los modelos solo la primera vez que se necesitan.
async function cargarReconocimientoFacial() {
  if (faceListo) return faceListo;
  faceListo = (async () => {
    if (!window.faceapi) {
      let ok = false;
      for (const url of FACE_LIB_URLS) {
        try { await cargarScriptExterno(url); if (window.faceapi) { ok = true; break; } } catch (e) {}
      }
      if (!ok) throw new Error("No se pudo cargar la librería de reconocimiento facial. Revisa la conexión a internet.");
    }
    let cargados = false;
    for (const base of FACE_MODEL_URLS) {
      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(base),
          faceapi.nets.faceLandmark68Net.loadFromUri(base),
          faceapi.nets.faceRecognitionNet.loadFromUri(base),
        ]);
        cargados = true;
        break;
      } catch (e) {}
    }
    if (!cargados) throw new Error("No se pudieron cargar los modelos de reconocimiento facial. Revisa la conexión a internet.");
  })();
  faceListo.catch(() => { faceListo = null; });
  return faceListo;
}

function opcionesDetector() {
  return new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
}

// El personal se consulta por una función de la base: así la Secretaria puede
// ver nombres sin tener acceso al resto de los datos de los perfiles.
async function cargarPersonalAcceso(forzar) {
  if (cachePersonalAcceso && !forzar) return cachePersonalAcceso;
  const { data, error } = await sb.rpc("personal_para_acceso");
  if (error) throw error;
  cachePersonalAcceso = data || [];
  return cachePersonalAcceso;
}

function nombreAlumno(a) {
  return `${a.nombres} ${a.apellido_paterno} ${a.apellido_materno || ""}`.trim();
}

// Lee los rostros registrados de alumnos y personal activos.
async function cargarRostros() {
  const [rostrosRes, personal] = await Promise.all([
    sb.from("rostros").select("id, tipo_persona, alumno_id, perfil_id, descriptores, alumnos(nombres, apellido_paterno, apellido_materno, matricula, activo)"),
    cargarPersonalAcceso(true),
  ]);
  if (rostrosRes.error) throw rostrosRes.error;
  const mapaPersonal = new Map(personal.map(p => [p.id, p]));
  const personas = [];
  (rostrosRes.data || []).forEach(r => {
    const esAlumno = r.tipo_persona === "Alumno";
    const info = esAlumno ? r.alumnos : mapaPersonal.get(r.perfil_id);
    if (!info || info.activo === false) return;
    personas.push({
      clave: esAlumno ? "A:" + r.alumno_id : "P:" + r.perfil_id,
      tipo: r.tipo_persona,
      alumno_id: r.alumno_id,
      perfil_id: r.perfil_id,
      nombre: esAlumno ? nombreAlumno(info) : info.nombre_completo,
      detalle: esAlumno ? info.matricula : info.rol,
      descriptores: (r.descriptores || []).map(d => new Float32Array(d)),
    });
  });
  return personas;
}

function crearMatcher(personas) {
  const validas = personas.filter(p => p.descriptores.length > 0);
  if (validas.length === 0) return null;
  return new faceapi.FaceMatcher(
    validas.map(p => new faceapi.LabeledFaceDescriptors(p.clave, p.descriptores)),
    FACE_DIST_UMBRAL
  );
}

// Registra la siguiente marca de la persona: Entrada si no tiene una entrada hoy,
// Salida si ya entró hoy. Si su último movimiento es de un día anterior, empieza con Entrada.
async function registrarMovimiento(persona, metodo, distancia, modo) {
  const esAlumno = persona.tipo === "Alumno";
  const inicioDia = new Date();
  inicioDia.setHours(0, 0, 0, 0);

  const { data: ultimo, error: errUltimo } = await sb
    .from("registros_acceso")
    .select("tipo_evento, fecha_hora")
    .eq(esAlumno ? "alumno_id" : "perfil_id", esAlumno ? persona.alumno_id : persona.perfil_id)
    .gte("fecha_hora", inicioDia.toISOString())
    .order("fecha_hora", { ascending: false })
    .limit(1)
    .maybeSingle();
  if (errUltimo) throw errUltimo;

  // El tipo de lectura lo elige el usuario (Entrada o Salida). Si el último movimiento de hoy
  // ya es del mismo tipo, es un duplicado y NO se registra.
  const evento = modo === "Salida" ? "Salida" : "Entrada";
  if (ultimo && ultimo.tipo_evento === evento) {
    return { evento, duplicado: true, hora: ultimo.fecha_hora, sinEntrada: false };
  }
  const sinEntrada = evento === "Salida" && !ultimo;

  const { error } = await sb.from("registros_acceso").insert({
    tipo_persona: persona.tipo,
    alumno_id: esAlumno ? persona.alumno_id : null,
    perfil_id: esAlumno ? null : persona.perfil_id,
    tipo_evento: evento,
    registrado_por: state.perfil.id,
    metodo,
    distancia: distancia != null ? Number(distancia.toFixed(3)) : null,
  });
  if (error) throw error;
  return { evento, duplicado: false, hora: new Date().toISOString(), sinEntrada };
}

        personas = await cargarRostros();

        matcher = crearMatcher(personas);
