          <div id="rfHoy"><p class="text-xs" style="color:#6C7B8A">Cargando…</p></div>
        </div>
      </div>`;

    document.getElementById("rfIniciar").disabled = true;
    function pintarModo() {
      document.querySelectorAll(".rfModoBtn").forEach(b => {
        const act = b.dataset.modo === modoLectura;
        b.style.background = act ? (b.dataset.modo === "Entrada" ? "#3F7A5E" : "#1E3A8A") : "#fff";
        b.style.color = act ? "#fff" : "#1E3A8A";
      });
      const ini = document.getElementById("rfIniciar");
      if (ini && ini.style.display !== "none") ini.disabled = !modoLectura;
      const est = document.getElementById("rfEstado");
      if (est && !camStream) est.textContent = modoLectura ? `Modo: ${modoLectura === "Entrada" ? "ENTRADAS" : "SALIDAS"}. La cámara está apagada.` : "Elige primero si vas a registrar entradas o salidas.";
    }
    function bloquearModo(bloq) { document.querySelectorAll(".rfModoBtn").forEach(b => { b.disabled = bloq; b.style.opacity = bloq ? "0.6" : "1"; }); }
    document.querySelectorAll(".rfModoBtn").forEach(b => b.addEventListener("click", () => { modoLectura = b.dataset.modo; pintarModo(); }));
    pintarModo();
    document.getElementById("rfIniciar").addEventListener("click", iniciar);
    document.getElementById("rfDetener").addEventListener("click", () => { detenerCamara(); restablecerBotones("La cámara está apagada."); });
    document.getElementById("rfManualBtn").addEventListener("click", buscarManual);
    document.getElementById("rfManualInput").addEventListener("keydown", e => { if (e.key === "Enter") buscarManual(); });
    cargarHoy();

    function restablecerBotones(textoEstado) {
      const ini = document.getElementById("rfIniciar");
      const det = document.getElementById("rfDetener");
      const est = document.getElementById("rfEstado");
      if (!ini) return;
      ini.style.display = "";
      ini.disabled = !modoLectura;
      det.style.display = "none";
      bloquearModo(false);
      est.textContent = textoEstado || "";
    }

    function mostrarBanner(html) {
      const cont2 = document.getElementById("rfResultado");
      if (!cont2) return;
      cont2.innerHTML = html;
      if (bannerTimer) clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => { const c = document.getElementById("rfResultado"); if (c) c.innerHTML = ""; }, 6000);
    }

    function bannerRegistro(persona, r, metodo) {
      const evento = r.evento;
      const hora = new Date(r.hora).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
      const dup = r.duplicado;
      const colorFondo = dup ? "#FBF1DC" : (evento === "Entrada" ? "#E6F0EA" : "#E8EDF7");
      const colorBorde = dup ? "#B7791F" : (evento === "Entrada" ? "#3F7A5E" : "#1E3A8A");
      const titulo = dup
        ? `Ya registró su ${evento.toLowerCase()} hoy a las ${hora} (no se duplicó)`
        : `${evento} registrada — ${hora}${metodo === "Manual" ? " (manual)" : ""}`;
      return `
        <div class="p-4 rounded-xl" style="background:${colorFondo}; border:1px solid ${colorBorde}">
          <p class="text-base font-bold" style="color:#1E3A8A">${escHtml(persona.nombre)}</p>
          <p class="text-xs" style="color:#6C7B8A">${persona.tipo === "Alumno" ? "Alumno · " : "Personal · "}${escHtml(persona.detalle || "")}</p>
          <p class="text-lg font-bold mt-1" style="color:${colorBorde}">${titulo}</p>
          ${r.sinEntrada ? `<p class="text-xs mt-1" style="color:#B7791F">Aviso: no tenía entrada registrada hoy.</p>` : ""}
        </div>`;
    }

    async function iniciar() {
      const ini = document.getElementById("rfIniciar");
      const est = document.getElementById("rfEstado");
      ini.disabled = true;
      document.getElementById("rfResultado").innerHTML = "";
      try {
        est.textContent = "Cargando reconocimiento facial (la primera vez puede tardar)…";
        await cargarReconocimientoFacial();
        est.textContent = "Cargando rostros registrados…";
        personas = await cargarRostros();
        ultimaCarga = Date.now();
        matcher = crearMatcher(personas);
        if (!matcher) {
          restablecerBotones("");
          document.getElementById("rfResultado").innerHTML = errBox("Todavía no hay rostros registrados. Ve a la pestaña \"Registrar rostros\".");
          return;
        }
        est.textContent = "Activando cámara…";
        await iniciarCamara(document.getElementById("rfVideo"));
      } catch (err) {
        detenerCamara();
        restablecerBotones("");
        document.getElementById("rfResultado").innerHTML = errBox(escHtml(err.message || "No se pudo iniciar el reconocimiento."));
        return;
      }

      const sesion = ++kioskSesion;
      mantenerPantallaEncendida();
      ini.style.display = "none";
      bloquearModo(true);
      document.getElementById("rfDetener").style.display = "";
      est.textContent = `Modo ${modoLectura === "Entrada" ? "ENTRADAS" : "SALIDAS"} · Reconocimiento activo (${personas.length} rostros registrados). Acércate a la cámara.`;
      bucle(sesion);
    }

    async function bucle(sesion) {
      const candidatos = new Map(); // clave -> cuadros seguidos
      const bloqueados = new Map(); // clave -> { registradoEn, ultimaVez }
      let desconocidos = 0;
      let ultimoAviso = 0;
      let ultimoKeepAlive = 0;

      while (sesion === kioskSesion && camStream) {
        const video = document.getElementById("rfVideo");
        if (!video) break;
        const ahora = Date.now();

        // Mantiene viva la sesión mientras el reconocimiento está activo en esta pantalla.
        if (ahora - ultimoKeepAlive > 30000) { reiniciarTimerInactividad(); ultimoKeepAlive = ahora; }

        // Vuelve a leer los rostros por si se registraron o dieron de baja personas.
        if (ahora - ultimaCarga > FACE_RECARGA_MS) {
          try { personas = await cargarRostros(); matcher = crearMatcher(personas) || matcher; ultimaCarga = Date.now(); } catch (e) { ultimaCarga = Date.now(); }
        }

        try {
          const detecciones = await faceapi.detectAllFaces(video, opcionesDetector()).withFaceLandmarks().withFaceDescriptors();
          const vistos = new Set();
          let hayDesconocido = false;

          for (const det of detecciones) {
            if (det.detection.box.width / video.videoWidth < FACE_MIN_ANCHO) continue;
            const mejor = matcher.findBestMatch(det.descriptor);
            if (mejor.label === "unknown") { hayDesconocido = true; continue; }

            vistos.add(mejor.label);
            const bloqueo = bloqueados.get(mejor.label);
            if (bloqueo) { bloqueo.ultimaVez = ahora; continue; }

            const frames = (candidatos.get(mejor.label) || 0) + 1;
            candidatos.set(mejor.label, frames);
            if (frames >= FACE_FRAMES_CONFIRMACION) {
              candidatos.delete(mejor.label);
              bloqueados.set(mejor.label, { registradoEn: ahora, ultimaVez: ahora });
              const persona = personas.find(p => p.clave === mejor.label);
              if (persona) {
                try {
                  const r = await registrarMovimiento(persona, "Rostro", mejor.distance, modoLectura);
                  mostrarBanner(bannerRegistro(persona, r, "Rostro"));
                  cargarHoy();
                } catch (e) {
                  bloqueados.delete(mejor.label);
                  mostrarBanner(errBox("No se pudo registrar a " + escHtml(persona.nombre) + ": " + escHtml(e.message)));
                }
              }
            }
          }

          for (const clave of [...candidatos.keys()]) if (!vistos.has(clave)) candidatos.delete(clave);
          for (const [clave, b] of [...bloqueados.entries()]) {
            if (ahora - b.ultimaVez >= FACE_BLOQUEO_AUSENCIA_MS && ahora - b.registradoEn >= FACE_BLOQUEO_MIN_MS) bloqueados.delete(clave);
          }

          if (hayDesconocido && vistos.size === 0) desconocidos++; else desconocidos = 0;
          if (desconocidos >= 8 && ahora - ultimoAviso > 6000) {
            ultimoAviso = ahora;
            desconocidos = 0;
            mostrarBanner(errBox("Rostro no reconocido. Intenta de frente y con buena luz, o usa el registro manual."));
          }
        } catch (e) {
          // un cuadro fallido no detiene el reconocimiento
        }
        await esperar(200);
      }
    }

    // ----- Registro manual -----
    async function buscarManual() {
      const criterio = document.getElementById("rfManualInput").value.trim();
      const res = document.getElementById("rfManualResultados");
      if (!criterio) { res.innerHTML = ""; return; }
      res.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Buscando…</p>`;
      try {
        const limpio = criterio.replace(/[,()%*]/g, " ").trim();
        const [alumnosRes, personal] = await Promise.all([
          sb.from("alumnos").select("id, nombres, apellido_paterno, apellido_materno, matricula")
            .eq("activo", true)
            .or(`nombres.ilike.%${limpio}%,apellido_paterno.ilike.%${limpio}%,apellido_materno.ilike.%${limpio}%,matricula.ilike.%${limpio}%`)
            .limit(15),
          cargarPersonalAcceso(),
        ]);
        if (alumnosRes.error) throw alumnosRes.error;

        const q = normalizarTexto(limpio);
        const encontrados = [
          ...(alumnosRes.data || []).map(a => ({ tipo: "Alumno", alumno_id: a.id, perfil_id: null, nombre: nombreAlumno(a), detalle: a.matricula })),
          ...personal.filter(p => p.activo && normalizarTexto(p.nombre_completo).includes(q))
            .slice(0, 15).map(p => ({ tipo: "Personal", alumno_id: null, perfil_id: p.id, nombre: p.nombre_completo, detalle: p.rol })),
        ];

        res.innerHTML = encontrados.length === 0
          ? `<p class="text-xs" style="color:#6C7B8A">Sin resultados.</p>`
          : encontrados.map((p, i) => `
              <button class="rfManualSel w-full text-left px-3 py-2 rounded-lg text-sm bg-white border mb-1" data-idx="${i}" style="border-color:#E1DED5; color:#1E3A8A">
                ${escHtml(p.nombre)} <span class="text-xs" style="color:#6C7B8A">(${p.tipo} · ${escHtml(p.detalle || "")})</span>
              </button>`).join("");

        res.querySelectorAll(".rfManualSel").forEach(b => b.addEventListener("click", async () => {
          const persona = encontrados[Number(b.dataset.idx)];
          try {
            if (!modoLectura) { mostrarBanner(errBox("Elige primero el tipo de lectura (Entradas o Salidas).")); return; }
            const r = await registrarMovimiento(persona, "Manual", null, modoLectura);
            mostrarBanner(bannerRegistro(persona, r, "Manual"));
            document.getElementById("rfManualResultados").innerHTML = "";
            document.getElementById("rfManualInput").value = "";
            cargarHoy();
          } catch (e) {
            mostrarBanner(errBox(escHtml(e.message)));
          }
        }));
      } catch (e) {
        res.innerHTML = errBox(escHtml(e.message));
      }
    }

    // ----- Movimientos de hoy -----
    async function cargarHoy() {
      const caja = document.getElementById("rfHoy");
      if (!caja) return;
      try {
        const inicio = new Date();
        inicio.setHours(0, 0, 0, 0);
        const [regRes, personal] = await Promise.all([
          sb.from("registros_acceso")
            .select("tipo_persona, tipo_evento, fecha_hora, metodo, perfil_id, alumnos(nombres, apellido_paterno, apellido_materno)")
            .gte("fecha_hora", inicio.toISOString())
            .order("fecha_hora", { ascending: false })
            .limit(100),
          cargarPersonalAcceso(),
        ]);
        if (regRes.error) throw regRes.error;
        const mapaPersonal = new Map(personal.map(p => [p.id, p.nombre_completo]));
        const lista = regRes.data || [];
        const caja2 = document.getElementById("rfHoy");
        if (!caja2) return;
        caja2.innerHTML = lista.length === 0
          ? `<p class="text-xs" style="color:#6C7B8A">Sin movimientos hoy.</p>`
          : lista.map(r => {
              const nombre = r.tipo_persona === "Alumno" ? (r.alumnos ? nombreAlumno(r.alumnos) : "Alumno") : (mapaPersonal.get(r.perfil_id) || "Personal");
              const hora = new Date(r.fecha_hora).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
              const color = r.tipo_evento === "Entrada" ? "#3F7A5E" : "#1E3A8A";
              return `<div class="text-sm py-1 flex justify-between gap-2" style="color:#1C2B3A">
                <span>${escHtml(nombre)} <span class="text-xs" style="color:#6C7B8A">${r.tipo_persona === "Personal" ? "(personal)" : ""}${r.metodo === "Manual" ? " · manual" : ""}</span></span>
                <span class="text-xs font-semibold whitespace-nowrap" style="color:${color}">${r.tipo_evento} ${hora}</span>
              </div>`;
            }).join("");
      } catch (e) {
        caja.innerHTML = errBox(escHtml(e.message));
      }
    }
  }

  // ---------- Registrar rostros ----------
  function renderRegistrarRostros(cont) {
    cont.innerHTML = `
      <div class="max-w-md">
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <div class="flex gap-2 mb-2">
            <select id="rrTipoSel" class="px-2 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
              <option value="Alumno">Alumno</option>
              <option value="Personal">Personal</option>
            </select>
            <input id="rrBuscarInput" placeholder="Buscar por nombre…" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <button id="rrBuscarBtn" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Buscar</button>
          </div>
          <div id="rrResultados"></div>
        </div>
        <div id="rrPanel"></div>
      </div>`;

    document.getElementById("rrBuscarBtn").addEventListener("click", buscar);
    document.getElementById("rrBuscarInput").addEventListener("keydown", e => { if (e.key === "Enter") buscar(); });

    async function buscar() {
      const tipo = document.getElementById("rrTipoSel").value;
      const criterio = document.getElementById("rrBuscarInput").value.trim();
      const res = document.getElementById("rrResultados");
      if (!criterio) { res.innerHTML = ""; return; }
      res.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Buscando…</p>`;
      try {
        let lista = [];
        if (tipo === "Alumno") {
          const limpio = criterio.replace(/[,()%*]/g, " ").trim();
          const { data, error } = await sb.from("alumnos").select("id, nombres, apellido_paterno, apellido_materno, matricula")
            .eq("activo", true)
            .or(`nombres.ilike.%${limpio}%,apellido_paterno.ilike.%${limpio}%,apellido_materno.ilike.%${limpio}%,matricula.ilike.%${limpio}%`)
            .order("apellido_paterno")
            .limit(20);
          if (error) throw error;
          lista = (data || []).map(a => ({ tipo: "Alumno", alumno_id: a.id, perfil_id: null, nombre: nombreAlumno(a), detalle: a.matricula }));
        } else {
          const personal = await cargarPersonalAcceso(true);
          const q = normalizarTexto(criterio);
          lista = personal.filter(p => p.activo && normalizarTexto(p.nombre_completo).includes(q))
            .slice(0, 20).map(p => ({ tipo: "Personal", alumno_id: null, perfil_id: p.id, nombre: p.nombre_completo, detalle: p.rol }));
        }
        res.innerHTML = lista.length === 0
          ? `<p class="text-xs" style="color:#6C7B8A">Sin resultados.</p>`
          : lista.map((p, i) => `
              <button class="rrSel w-full text-left px-3 py-2 rounded-lg text-sm bg-white border mb-1" data-idx="${i}" style="border-color:#E1DED5; color:#1E3A8A">
                ${escHtml(p.nombre)} <span class="text-xs" style="color:#6C7B8A">(${escHtml(p.detalle || "")})</span>
              </button>`).join("");
        res.querySelectorAll(".rrSel").forEach(b => b.addEventListener("click", () => abrirPanel(lista[Number(b.dataset.idx)])));
      } catch (e) {
        res.innerHTML = errBox(escHtml(e.message));
      }
    }

    async function abrirPanel(persona) {
      detenerCamara();
      const panel = document.getElementById("rrPanel");
      const esAlumno = persona.tipo === "Alumno";
      const columna = esAlumno ? "alumno_id" : "perfil_id";
      const idPersona = esAlumno ? persona.alumno_id : persona.perfil_id;
      const clave = (esAlumno ? "A:" : "P:") + idPersona;

      panel.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
      const { data: existente, error: errExist } = await sb.from("rostros").select("id, creado_en").eq(columna, idPersona).maybeSingle();
      if (errExist) { panel.innerHTML = errBox(escHtml(errExist.message)); return; }

      panel.innerHTML = `
        <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
          <p class="text-sm font-semibold" style="color:#1E3A8A">${escHtml(persona.nombre)}</p>
          <p class="text-xs mb-2" style="color:#6C7B8A">${persona.tipo} · ${escHtml(persona.detalle || "")}</p>
          <p class="text-xs mb-3" style="color:${existente ? "#3F7A5E" : "#B5453A"}">${existente ? "Rostro registrado el " + new Date(existente.creado_en).toLocaleDateString("es-MX") + ". Si capturas de nuevo, se reemplaza." : "Aún no tiene rostro registrado."}</p>

          <label class="flex items-start gap-2 text-xs mb-3" style="color:#1E3A8A">
            <input type="checkbox" id="rrConsentimiento" class="mt-0.5" />
            <span>${esAlumno
              ? "Confirmo que el padre, madre o tutor de este alumno otorgó su consentimiento expreso y por escrito para el tratamiento de sus datos biométricos (rasgos faciales)."
              : "Confirmo que esta persona otorgó su consentimiento expreso y por escrito para el tratamiento de sus datos biométricos (rasgos faciales)."}</span>
          </label>

          <video id="rrVideo" class="w-full rounded-lg bg-black mb-2" style="max-height:260px; object-fit:cover; transform:scaleX(-1)" playsinline muted></video>
          <p id="rrEstado" class="text-xs mb-2" style="color:#6C7B8A">La cámara está apagada.</p>
          <div id="rrMsg"></div>
          <div class="flex gap-2">
            <button id="rrCamBtn" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Activar cámara</button>
            <button id="rrCapturarBtn" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff; opacity:0.5" disabled>Capturar rostro</button>
          </div>
          ${existente ? `<button id="rrEliminarBtn" class="w-full mt-2 py-2 rounded-lg text-sm font-semibold" style="background:#F5E4E1; color:#B5453A">Eliminar rostro registrado</button>` : ""}
        </div>`;

      const chk = document.getElementById("rrConsentimiento");
      const btnCam = document.getElementById("rrCamBtn");
      const btnCap = document.getElementById("rrCapturarBtn");
      const estado = document.getElementById("rrEstado");
      const msg = document.getElementById("rrMsg");
      let ocupado = false;

      function actualizarBotonCaptura() {
        const puede = chk.checked && !!camStream && !ocupado;
        btnCap.disabled = !puede;
        btnCap.style.opacity = puede ? "1" : "0.5";
      }
      chk.addEventListener("change", actualizarBotonCaptura);

      btnCam.addEventListener("click", async () => {
        msg.innerHTML = "";
        btnCam.disabled = true;
        try {
          estado.textContent = "Cargando reconocimiento facial (la primera vez puede tardar)…";
          await cargarReconocimientoFacial();
          await iniciarCamara(document.getElementById("rrVideo"));
          estado.textContent = "Cámara lista. Marca el consentimiento y pulsa \"Capturar rostro\".";
          btnCam.style.display = "none";
        } catch (e) {
          detenerCamara();
          estado.textContent = "La cámara está apagada.";
          msg.innerHTML = errBox(escHtml(e.message));
          btnCam.disabled = false;
        }
        actualizarBotonCaptura();
      });

      btnCap.addEventListener("click", async () => {
        msg.innerHTML = "";
        ocupado = true;
        actualizarBotonCaptura();
        try {
          const muestras = await capturarMuestras(document.getElementById("rrVideo"), estado, FACE_MUESTRAS_REGISTRO);

          // Revisa que ese rostro no esté ya registrado a nombre de otra persona.
          estado.textContent = "Verificando que no esté duplicado…";
          const personas = await cargarRostros();
          const otras = personas.filter(p => p.clave !== clave);
          const matcher = crearMatcher(otras);
          if (matcher) {
            const mejor = matcher.findBestMatch(muestras[0]);
            if (mejor.label !== "unknown") {
              const otra = otras.find(p => p.clave === mejor.label);
              if (!confirm(`Este rostro se parece mucho al de ${otra ? otra.nombre : "otra persona"}. ¿Guardar de todas formas?`)) {
                estado.textContent = "Captura cancelada.";
                ocupado = false;
                actualizarBotonCaptura();
                return;
              }
            }
          }

          estado.textContent = "Guardando…";
          const { error: errDel } = await sb.from("rostros").delete().eq(columna, idPersona);
          if (errDel) throw errDel;
          const { error: errIns } = await sb.from("rostros").insert({
            tipo_persona: persona.tipo,
            alumno_id: esAlumno ? idPersona : null,
            perfil_id: esAlumno ? null : idPersona,
            descriptores: muestras.map(d => Array.from(d).map(x => Number(x.toFixed(4)))),
            consentimiento: true,
            registrado_por: state.perfil.id,
          });
          if (errIns) throw errIns;

          detenerCamara();
          abrirPanel(persona);
          const nuevoMsg = document.getElementById("rrMsg");
          if (nuevoMsg) nuevoMsg.innerHTML = okBox("Rostro registrado correctamente.");
        } catch (e) {
          msg.innerHTML = errBox(escHtml(e.message));
          estado.textContent = "Cámara lista.";
          ocupado = false;
          actualizarBotonCaptura();
        }
      });

      const btnEliminar = document.getElementById("rrEliminarBtn");
      if (btnEliminar) btnEliminar.addEventListener("click", async () => {
        if (!confirm(`¿Eliminar el rostro registrado de ${persona.nombre}? Ya no podrá registrarse con la cámara.`)) return;
        const { error } = await sb.from("rostros").delete().eq(columna, idPersona);
        if (error) { msg.innerHTML = errBox(escHtml(error.message)); return; }
        detenerCamara();
        abrirPanel(persona);
      });
    }
  }
}

// ============================================================
// Utilidades: portapapeles y grupos del ciclo activo

async function copiarTexto(texto) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(texto); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = texto;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

// Grupos de los ciclos escolares activos, ordenados por nivel, grado y letra.
async function cargarGruposActivos() {
  const { data: ciclos, error: e1 } = await sb.from("ciclos_escolares").select("id").eq("activo", true);
  if (e1) throw e1;
  const ids = (ciclos || []).map(c => c.id);
  if (ids.length === 0) return [];
  const { data, error } = await sb.from("grupos").select("id, letra, grados(nombre, nivel)").in("ciclo_escolar_id", ids);
  if (error) throw error;
  return (data || []).filter(g => g.grados).map(g => ({
    id: g.id, letra: g.letra, grado: g.grados.nombre, nivel: g.grados.nivel,
    etiqueta: `${g.grados.nombre} "${g.letra}" (${g.grados.nivel})`,
  })).sort((a, b) => a.nivel.localeCompare(b.nivel) || a.grado.localeCompare(b.grado, "es", { numeric: true }) || a.letra.localeCompare(b.letra));
}

function fechaLocalISO(d) {
  const f = d || new Date();
  const p = n => String(n).padStart(2, "0");
  return `${f.getFullYear()}-${p(f.getMonth() + 1)}-${p(f.getDate())}`;
}

// Alumnos inscritos de varios grupos y su primera entrada / última salida de un día.
async function asistenciaDelDia(grupoIds, fechaISO) {
  const inicio = new Date(fechaISO + "T00:00:00");
  const fin = new Date(inicio.getTime() + 86400000);
  const { data: insc, error } = await sb.from("inscripciones")
    .select("grupo_id, alumnos(id, nombres, apellido_paterno, apellido_materno, activo)")
    .in("grupo_id", grupoIds).eq("estado", "Inscrito");
  if (error) throw error;
  const alumnos = (insc || []).filter(i => i.alumnos && i.alumnos.activo !== false);
  const alumnoIds = [...new Set(alumnos.map(i => i.alumnos.id))];
  const regs = [];
  for (let i = 0; i < alumnoIds.length; i += 150) {
    const { data, error: e2 } = await sb.from("registros_acceso")
      .select("alumno_id, tipo_evento, fecha_hora")
      .eq("tipo_persona", "Alumno").in("alumno_id", alumnoIds.slice(i, i + 150))
      .gte("fecha_hora", inicio.toISOString()).lt("fecha_hora", fin.toISOString())
      .order("fecha_hora");
    if (e2) throw e2;
    regs.push(...(data || []));
  }
  const porAlumno = new Map();
  regs.forEach(r => {
    const x = porAlumno.get(r.alumno_id) || { entrada: null, salida: null };
    if (r.tipo_evento === "Entrada" && !x.entrada) x.entrada = r.fecha_hora;
    if (r.tipo_evento === "Salida") x.salida = r.fecha_hora;
    porAlumno.set(r.alumno_id, x);
  });
  return alumnos.map(i => ({
    grupo_id: i.grupo_id, alumno: i.alumnos, nombre: nombreCompletoAlumno(i.alumnos),
    orden: `${i.alumnos.apellido_paterno} ${i.alumnos.apellido_materno || ""} ${i.alumnos.nombres}`,
    entrada: porAlumno.get(i.alumnos.id)?.entrada || null, salida: porAlumno.get(i.alumnos.id)?.salida || null,
  })).sort((a, b) => a.orden.localeCompare(b.orden, "es"));
}
const horaCorta = d => new Date(d).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });

// ---------- Pestaña: reporte de ausencias (9:30) ----------
const HORA_REPORTE_AUSENCIAS = { h: 9, m: 30 };   // ⚠️ CONFIGURABLE
let timerReporte930 = null;
let timerCuentaRegresiva = null;
let timerAviso930 = null;

function limpiarTimersReporte() {
  if (timerReporte930) clearTimeout(timerReporte930);
  if (timerCuentaRegresiva) clearInterval(timerCuentaRegresiva);
  timerReporte930 = null; timerCuentaRegresiva = null;
}
function limpiarTodosTimersReporte() {
  limpiarTimersReporte();
  if (timerAviso930) clearTimeout(timerAviso930);
  timerAviso930 = null;
}
function horaLimiteHoy() {
  const d = new Date();
  d.setHours(HORA_REPORTE_AUSENCIAS.h, HORA_REPORTE_AUSENCIAS.m, 0, 0);
  return d;
}
function mensajeAusencias(ausentes, fecha) {
  if (ausentes.length === 0) {
    return `Buenos días Padres de familia.\n\nLes informamos que el día de hoy se cuenta con el grupo completo.\n\nSaludos y excelente día.\nInstituto Juan Bosco.`;
  }
  return `Buenos días Padres de familia.\n\nLes informamos que el día de hoy ${fechaLarga(fecha + "T00:00:00")}\n\nse tiene la ausencia de:\n${ausentes.map(n => "• " + n).join("\n")}\n\nSaludos y excelente día.\nInstituto Juan Bosco.`;
}

async function renderReporteAusencias(cont) {
  limpiarTimersReporte();
  const limite = horaLimiteHoy();
  let forzado = false;

  function pintarEspera() {
    const falta = limite - new Date();
    cont.innerHTML = `
      <div class="max-w-2xl p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
        <p class="text-sm font-semibold" style="color:#1E3A8A">Reporte de ausencias</p>
        <p class="text-sm mt-1" style="color:#1C2B3A">Se genera automáticamente a las <strong>${String(HORA_REPORTE_AUSENCIAS.h).padStart(2, "0")}:${String(HORA_REPORTE_AUSENCIAS.m).padStart(2, "0")}</strong>. Faltan <strong id="rpCuenta">${Math.ceil(falta / 60000)} min</strong>.</p>
        <p class="text-xs mt-1" style="color:#6C7B8A">Deja esta pantalla abierta; al llegar la hora se mostrarán los mensajes por grupo.</p>
        <button id="rpAhora" class="mt-3 px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1E3A8A">Generar ahora (vista previa)</button>
      </div>`;
    document.getElementById("rpAhora").addEventListener("click", () => { forzado = true; limpiarTimersReporte(); generar(); });
    timerCuentaRegresiva = setInterval(() => {
      const el = document.getElementById("rpCuenta");
      if (el) el.textContent = Math.max(0, Math.ceil((limite - new Date()) / 60000)) + " min";
    }, 20000);
    timerReporte930 = setTimeout(() => { limpiarTimersReporte(); if (document.getElementById("rpAhora")) generar(); }, Math.max(0, limite - new Date()));
  }

  async function generar() {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Generando reportes…</p>`;
    try {
      const hoy = fechaLocalISO();
      const grupos = await cargarGruposActivos();
      if (grupos.length === 0) { cont.innerHTML = errBox("No hay grupos en un ciclo escolar activo."); return; }
      const filas = await asistenciaDelDia(grupos.map(g => g.id), hoy);
      const ahoraTxt = horaCorta(new Date());

      const tarjetas = grupos.map((g, i) => {
        const delGrupo = filas.filter(f => f.grupo_id === g.id);
        if (delGrupo.length === 0) return "";
        const ausentes = delGrupo.filter(f => !f.entrada).map(f => f.nombre);
        return { g, i, ausentes, total: delGrupo.length, texto: mensajeAusencias(ausentes, hoy) };
      }).filter(Boolean);

      cont.innerHTML = `
        <div class="max-w-2xl">
          <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
            <p class="text-xs" style="color:#6C7B8A">${fechaLarga(hoy + "T00:00:00")} · generado a las ${ahoraTxt}${forzado && new Date() < limite ? " (vista previa antes de la hora)" : ""}</p>
            <button id="rpActualizar" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:#1E3A8A">Actualizar</button>
          </div>
          ${tarjetas.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">No hay alumnos inscritos en los grupos activos.</p>` : tarjetas.map((t, k) => `
            <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
              <div class="flex justify-between gap-2 mb-2">
                <p class="text-sm font-bold" style="color:#1E3A8A">${escHtml(t.g.etiqueta)}</p>
                <span class="text-xs font-semibold" style="color:${t.ausentes.length ? "#B5453A" : "#3F7A5E"}">${t.ausentes.length ? t.ausentes.length + " ausente(s) de " + t.total : "Grupo completo"}</span>
              </div>
              <textarea id="rpTxt_${k}" rows="${Math.min(14, 7 + t.ausentes.length)}" class="w-full px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">${escHtml(t.texto)}</textarea>
              <div class="flex gap-2 flex-wrap mt-2">
                <button class="rpCopiar px-3 py-2 rounded-lg text-sm font-bold" data-k="${k}" style="background:#1E3A8A; color:#fff">Copiar mensaje</button>
                <button class="rpWa px-3 py-2 rounded-lg text-sm font-semibold" data-k="${k}" style="background:#E6F0EA; color:#25804B">Abrir WhatsApp</button>
              </div>
            </div>`).join("")}
        </div>`;

      document.getElementById("rpActualizar").addEventListener("click", generar);
      cont.querySelectorAll(".rpCopiar").forEach(b => b.addEventListener("click", async () => {
        const ok = await copiarTexto(document.getElementById("rpTxt_" + b.dataset.k).value);
        const orig = "Copiar mensaje";
        b.textContent = ok ? "¡Copiado!" : "No se pudo copiar";
        setTimeout(() => { b.textContent = orig; }, 1800);
      }));
      cont.querySelectorAll(".rpWa").forEach(b => b.addEventListener("click", () => {
        window.open("https://wa.me/?text=" + encodeURIComponent(document.getElementById("rpTxt_" + b.dataset.k).value), "_blank");
      }));
    } catch (e) { cont.innerHTML = errBox(escHtml(e.message)); }
  }

  if (new Date() >= limite) generar(); else pintarEspera();
}

// Toma varias muestras del rostro (una sola persona, de frente y suficientemente cerca).
async function capturarMuestras(video, estadoEl, cantidad) {
  const muestras = [];
  let intentos = 0;
  while (muestras.length < cantidad && intentos < 80) {
    if (!camStream) throw new Error("La cámara se detuvo.");
    intentos++;
    const dets = await faceapi.detectAllFaces(video, opcionesDetector()).withFaceLandmarks().withFaceDescriptors();
    if (dets.length === 1 && dets[0].detection.score >= 0.7 && dets[0].detection.box.width / video.videoWidth >= 0.25) {
      muestras.push(dets[0].descriptor);
      estadoEl.textContent = `Muestra ${muestras.length} de ${cantidad}… mantén la mirada al frente.`;
      await esperar(500);
    } else {
      estadoEl.textContent = dets.length > 1 ? "Debe aparecer solo una persona en la cámara." : "Acerca el rostro y mira de frente a la cámara…";
      await esperar(250);
    }
  }
  if (muestras.length < cantidad) throw new Error("No se logró capturar el rostro. Intenta de nuevo con mejor luz y mirando de frente.");
  return muestras;
}

            </button>`).join("")}</div>`;
      resCont.querySelectorAll(".prfSelBtn").forEach(b => b.addEventListener("click", () => mostrarFormularioProfesor(data[Number(b.dataset.idx)])));
    }

    function mostrarFormularioProfesor(perfil) {
      const wrap = document.getElementById("prfFormWrap");
      wrap.innerHTML = `
        <div class="p-4 rounded-xl bg-white border mt-3" style="border-color:#E1DED5">
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nombre completo</label>
          <input id="prfNombre" value="${perfil.nombre_completo}" ${esAdmin ? "" : "disabled"} class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">CURP (opcional)</label>
          <input id="prfCurp" value="${perfil.curp || ""}" maxlength="18" placeholder="CURP (18 caracteres)" ${esAdmin ? "" : "disabled"} class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Rol</label>
          <select id="prfRol" ${esAdmin ? "" : "disabled"} class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${["Administrador", "Director", "Secretaria", "Profesor"].map(r => `<option value="${r}" ${perfil.rol === r ? "selected" : ""}>${r}</option>`).join("")}
          </select>
          <label class="flex items-center gap-2 text-sm mb-3" style="color:#1E3A8A">
            <input type="checkbox" id="prfActivo" ${perfil.activo ? "checked" : ""} ${esAdmin ? "" : "disabled"} /> Cuenta activa
          </label>
          <label class="flex items-center gap-2 text-sm mb-3" style="color:#1E3A8A">
            <input type="checkbox" id="prfCatedratico" ${perfil.es_catedratico ? "checked" : ""} ${esAdmin ? "" : "disabled"} /> También es catedrático (puede tener materias asignadas aunque su rol sea otro)
          </label>
          <div id="prfMsg"></div>
          ${esAdmin ? `<button id="prfGuardar" class="w-full py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar cambios</button>` : `<p class="text-xs" style="color:#B5453A">Solo el Administrador puede editar estos datos.</p>`}
        </div>`;

      if (esAdmin) {
        ["prfNombre", "prfCurp"].forEach(id => {
          const el = document.getElementById(id);
          el.addEventListener("input", () => {
            const cursor = el.selectionStart;
            el.value = el.value.toUpperCase();
            el.setSelectionRange(cursor, cursor);
          });
        });

        document.getElementById("prfGuardar").addEventListener("click", async () => {
          const msg = document.getElementById("prfMsg");
          msg.innerHTML = "";

          const curp = document.getElementById("prfCurp").value.trim();
          if (curp && !validarCurp(curp)) {
            msg.innerHTML = errBox("El CURP no tiene un formato válido (18 caracteres con la estructura oficial).");
            return;
          }

          const { error } = await sb.from("perfiles").update({
            nombre_completo: document.getElementById("prfNombre").value.trim(),
            curp: curp || null,
            rol: document.getElementById("prfRol").value,
            activo: document.getElementById("prfActivo").checked,
            es_catedratico: document.getElementById("prfCatedratico").checked,
          }).eq("id", perfil.id);
          if (error) { msg.innerHTML = errBox(error.message); return; }
          msg.innerHTML = okBox("Cambios guardados.");
        });
      }
    }
  }

  // ---------- Materias ----------
  async function renderMaterias(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
    const { data, error } = await sb.from("materias").select("*").order("nivel").order("nombre");
    if (error) { cont.innerHTML = errBox(error.message); return; }

    const materias = data || [];

    cont.innerHTML = `
      <div class="max-w-lg">
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Nueva materia</p>

          </div>
          <div>
            <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Preparatoria</p>
            ${materias.filter(m => m.nivel === "Preparatoria").map(m => `<div class="p-2 rounded-lg bg-white border mb-1 text-sm" style="border-color:#E1DED5; color:#1E3A8A">${m.nombre}</div>`).join("") || `<p class="text-xs" style="color:#6C7B8A">Sin materias.</p>`}
          </div>
        </div>
      </div>`;

    document.getElementById("matGuardar").addEventListener("click", async () => {
      const nombre = document.getElementById("matNombre").value.trim();
      const nivel = document.getElementById("matNivel").value;
      const msg = document.getElementById("matMsg");
      msg.innerHTML = "";
      if (!nombre) { msg.innerHTML = errBox("Escribe el nombre de la materia."); return; }
      const { error } = await sb.from("materias").insert({ nombre, nivel });
      if (error) { msg.innerHTML = errBox(error.message); return; }
      renderMaterias(cont);
    });
  }

  // ---------- Asignaciones ----------
  async function renderAsignaciones(cont) {
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;

    const [ciclosRes, materiasRes, profesRes] = await Promise.all([
      sb.from("ciclos_escolares").select("*").order("fecha_inicio", { ascending: false }),
      sb.from("materias").select("*").order("nombre"),
      sb.from("perfiles").select("id, nombre_completo").or("rol.eq.Profesor,es_catedratico.eq.true").eq("activo", true).order("nombre_completo"),
    ]);
    if (ciclosRes.error) { cont.innerHTML = errBox(ciclosRes.error.message); return; }

    const todosCiclos = ciclosRes.data || [];
    const todasMaterias = materiasRes.data || [];
    const profesores = profesRes.data || [];

    let nivelSel = "Secundaria";
    let cicloSel = null;
    let grupoSel = null;

    async function pintar() {
      const ciclosNivel = todosCiclos.filter(c => c.nivel === nivelSel);
      const cicloActivo = ciclosNivel.find(c => c.activo) || ciclosNivel[0];
      if (!cicloSel || !ciclosNivel.find(c => c.id === cicloSel)) cicloSel = cicloActivo ? cicloActivo.id : null;

      if (!cicloSel) {
        cont.innerHTML = `
          <div class="max-w-lg">${nivelSelectHtml()}
            <p class="text-sm mt-3" style="color:#6C7B8A">No hay ciclos de ${nivelSel} capturados.</p>
          </div>`;
        document.getElementById("asNivelSel").addEventListener("change", e => { nivelSel = e.target.value; cicloSel = null; grupoSel = null; pintar(); });
        return;
      }

      const { data: grupos, error: errGrupos } = await sb.from("grupos").select("id, letra, grados(nombre)").eq("ciclo_escolar_id", cicloSel).order("letra");
      if (errGrupos) { cont.innerHTML = errBox(errGrupos.message); return; }

      if (!grupoSel || !(grupos || []).find(g => g.id === grupoSel)) grupoSel = grupos && grupos[0] ? grupos[0].id : null;

      const materiasNivel = todasMaterias.filter(m => m.nivel === nivelSel);

      let asignaciones = [];
      if (grupoSel) {
        const { data } = await sb
          .from("profesor_materias_grupos")
          .select("id, perfiles(nombre_completo), materias(nombre)")
          .eq("grupo_id", grupoSel)
          .eq("ciclo_escolar_id", cicloSel);
        asignaciones = data || [];
      }

      cont.innerHTML = `
        <div class="max-w-lg">
          ${nivelSelectHtml()}

          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Ciclo escolar (${nivelSel})</label>
          <select id="asCicloSel" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${ciclosNivel.map(c => `<option value="${c.id}" ${c.id === cicloSel ? "selected" : ""}>${c.nombre}${c.activo ? " (Activo)" : ""}</option>`).join("")}
          </select>

          ${(grupos || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">No hay grupos capturados para este ciclo.</p>` : `
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Grupo</label>
          <select id="asGrupoSel" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            ${grupos.map(g => `<option value="${g.id}" ${g.id === grupoSel ? "selected" : ""}>${g.grados.nombre} "${g.letra}"</option>`).join("")}
          </select>

          <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
            <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Nueva asignación</p>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <select id="asProfesorSel" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                ${profesores.map(p => `<option value="${p.id}">${p.nombre_completo}</option>`).join("")}
              </select>
              <select id="asMateriaSel" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                ${materiasNivel.map(m => `<option value="${m.id}">${m.nombre}</option>`).join("")}
              </select>
            </div>
            <div id="asMsg"></div>
            <button id="asAsignarBtn" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Asignar</button>
          </div>

          <div class="space-y-2">
            ${asignaciones.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin asignaciones para este grupo.</p>` : asignaciones.map(a => `
              <div class="p-3 rounded-xl bg-white border flex items-center justify-between" style="border-color:#E1DED5">
                <div>
                  <p class="text-sm font-semibold" style="color:#1E3A8A">${a.materias.nombre}</p>
                  <p class="text-xs" style="color:#6C7B8A">${a.perfiles.nombre_completo}</p>
                </div>
                <button class="asQuitarBtn px-2 py-1 rounded-lg text-xs font-semibold" data-id="${a.id}" style="background:#F5E4E1; color:#B5453A">Quitar</button>
              </div>`).join("")}
          </div>
          `}
        </div>`;

      document.getElementById("asNivelSel").addEventListener("change", e => { nivelSel = e.target.value; cicloSel = null; grupoSel = null; pintar(); });
      document.getElementById("asCicloSel").addEventListener("change", e => { cicloSel = e.target.value; grupoSel = null; pintar(); });

      const grupoSelEl = document.getElementById("asGrupoSel");
      if (grupoSelEl) {
        grupoSelEl.addEventListener("change", e => { grupoSel = e.target.value; pintar(); });

        document.getElementById("asAsignarBtn").addEventListener("click", async () => {
          const msg = document.getElementById("asMsg");
          msg.innerHTML = "";
          const profesor_id = document.getElementById("asProfesorSel").value;
          const materia_id = document.getElementById("asMateriaSel").value;
          if (!profesor_id || !materia_id) { msg.innerHTML = errBox("Selecciona profesor y materia."); return; }
          const { error } = await sb.from("profesor_materias_grupos").insert({
            profesor_id, materia_id, grupo_id: grupoSel, ciclo_escolar_id: cicloSel,
          });
          if (error) { msg.innerHTML = errBox(error.message); return; }
          pintar();
        });

        cont.querySelectorAll(".asQuitarBtn").forEach(b => b.addEventListener("click", async () => {
          await sb.from("profesor_materias_grupos").delete().eq("id", b.dataset.id);
          pintar();
        }));
      }
    }

    function nivelSelectHtml() {
      return `
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nivel</label>
        <select id="asNivelSel" class="px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
          <option value="Secundaria" ${nivelSel === "Secundaria" ? "selected" : ""}>Secundaria</option>
          <option value="Preparatoria" ${nivelSel === "Preparatoria" ? "selected" : ""}>Preparatoria</option>
        </select>`;
    }

    pintar();
  }
}

          <div class="text-xs space-y-3" style="color:#1E3A8A">
            <p>${rsp} (en adelante "el Plantel"), con domicilio en ${val("domicilio", "domicilio pendiente")}, es responsable del tratamiento de los datos personales que se recaben de sus alumnos, así como de los padres, madres o tutores legales que los representan, de conformidad con lo dispuesto por la Ley Federal de Protección de Datos Personales en Posesión de los Particulares y su Reglamento.</p>

            <p><strong>Datos personales que se recaban.</strong> Datos de identificación del alumno (nombre, CURP, fecha de nacimiento, sexo, matrícula), datos de contacto de los padres, madres o tutores (nombre, parentesco, teléfono, correo electrónico, domicilio), información académica (calificaciones, asistencia, grupo y nivel escolar), información relacionada con el pago de colegiaturas y demás cuotas escolares cuando aplique, así como, únicamente cuando el padre, madre o tutor lo autorice por escrito, datos biométricos (representación numérica de los rasgos faciales) utilizados para registrar la entrada y salida de las instalaciones. No se almacena fotografía del rostro con esta finalidad.</p>

            <p>Dado que la mayoría de los alumnos son menores de edad, sus datos personales son proporcionados y su tratamiento consentido por sus padres, madres o tutores legales.</p>

            <p><strong>Finalidades del tratamiento.</strong> Los datos se utilizan para: la inscripción y control administrativo y escolar del alumno; la evaluación académica; la comunicación con padres, madres o tutores; el control de asistencia y de entradas y salidas de las instalaciones mediante reconocimiento facial (el cual requiere consentimiento expreso y por escrito, puede revocarse en cualquier momento y cuenta con un registro manual alternativo para quien no lo otorgue); la expedición de constancias, certificados y demás documentos oficiales; y, cuando aplique, el cobro de colegiaturas y demás cuotas escolares.</p>

            <p>De manera adicional, los datos de contacto podrán utilizarse para el envío de comunicados, avisos y circulares relacionados con la vida escolar del alumno. Si usted no desea que sus datos se utilicen para esta finalidad secundaria, puede manifestarlo a través de los medios de contacto señalados en este aviso.</p>

            <p><strong>Transferencia de datos.</strong> El Plantel no transferirá sus datos personales a terceros no relacionados con las finalidades aquí descritas, salvo que exista una obligación legal o así lo requiera una autoridad educativa competente.</p>

            <p><strong>Derechos ARCO.</strong> Usted tiene derecho a Acceder, Rectificar, Cancelar u Oponerse al tratamiento de sus datos personales (derechos ARCO), así como a revocar el consentimiento otorgado. Para ejercerlos, puede comunicarse al correo ${val("correo", "correo pendiente")} o al teléfono ${val("telefono", "teléfono pendiente")}.</p>

            <p><strong>Cambios al aviso de privacidad.</strong> El presente aviso de privacidad puede sufrir modificaciones. Cualquier cambio será comunicado oportunamente a través de los medios de contacto que el Plantel tenga registrados.</p>

            <p><strong>Consentimiento.</strong> Al momento de realizar el trámite de inscripción, el padre, madre o tutor legal manifiesta haber leído y aceptado el contenido del presente aviso de privacidad.</p>

            <p class="text-right mt-4">${val("ciudad", "ciudad pendiente")}, a ${new Date().toLocaleDateString("es-MX", { year: "numeric", month: "long", day: "numeric" })}.</p>
          </div>`}
        </div>

        <button id="avImprimirBtn" class="w-48 mx-auto block mt-4 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Imprimir / Descargar PDF</button>
      </div>`;

    document.getElementById("avImprimirBtn").addEventListener("click", () => window.print());
    document.getElementById("avTipoSel").addEventListener("change", e => { docTipo = e.target.value; pintar(); });
    const dSel = document.getElementById("avDocenteSel");
    if (dSel) dSel.addEventListener("change", e => { docenteId = e.target.value; pintar(); });

    if (esAdmin) {
      document.getElementById("diGuardar").addEventListener("click", async () => {
        const msg = document.getElementById("diMsg");
        msg.innerHTML = "";
        const { error: errUpd } = await sb.from("datos_institucion").update({
          nombre_oficial: document.getElementById("diNombre").value.trim() || null,
          rfc: document.getElementById("diRfc").value.trim() || null,
          domicilio: document.getElementById("diDomicilio").value.trim() || null,
          ciudad: document.getElementById("diCiudad").value.trim() || null,
          telefono: document.getElementById("diTelefono").value.trim() || null,
          correo: document.getElementById("diCorreo").value.trim() || null,
          actualizado_en: new Date().toISOString(),
        }).eq("id", 1);
        if (errUpd) { msg.innerHTML = errBox(errUpd.message); return; }
        renderAvisoPrivacidad(main);
      });
    }
  }

  pintar();
}

// ============================================================
// Módulo Calificaciones y Evaluación
// ============================================================
function renderCalificaciones(main) {
  const esAdmin = state.perfil.rol === "Administrador";
  const esProfesor = state.perfil.rol === "Profesor";

  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1E3A8A">Calificaciones y Evaluación</h2>
    <div class="max-w-3xl">
      <div id="calSolicitudes"></div>
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Selecciona clase</label>
      <select id="calAsigSel" class="w-full px-3 py-2 rounded-lg text-sm mb-4 outline-none border" style="border-color:#E1DED5">
        <option value="">Cargando…</option>
      </select>
      <div id="calContenido"></div>
    </div>`;

  cargarAsignaciones();
  if (["Administrador", "Director", "Secretaria"].includes(state.perfil.rol)) cargarSolicitudes();

  async function cargarSolicitudes() {
    const caja = document.getElementById("calSolicitudes");
    const { data, error } = await sb.from("solicitudes_criterios")
      .select("id, asignacion_id, periodo, motivo, creado_en, solicitado_por, profesor_materias_grupos(materias(nombre), grupos(letra, grados(nombre)))")
      .eq("estado", "Pendiente").order("creado_en");
    if (error || !data || data.length === 0) { caja.innerHTML = ""; return; }
    const { data: perfs } = await sb.rpc("personal_para_acceso");
    const nombres = new Map((perfs || []).map(p => [p.id, p.nombre_completo]));
    caja.innerHTML = `
      <div class="p-4 rounded-xl border mb-4" style="background:#FFF8E6; border-color:#E8D49A">
        <p class="text-sm font-semibold mb-2" style="color:#1E3A8A">Solicitudes para modificar criterios (${data.length})</p>
        ${data.map(s => {
          const a = s.profesor_materias_grupos;
          const clase = a && a.materias && a.grupos ? `${a.materias.nombre} — ${a.grupos.grados?.nombre || ""} "${a.grupos.letra}"` : "Clase";
          return `<div class="py-2 border-t" style="border-color:#E8D49A; color:#1C2B3A">
            <p class="text-sm"><strong>${escHtml(nombres.get(s.solicitado_por) || "Profesor")}</strong> · ${escHtml(clase)} · ${escHtml(s.periodo)}</p>
            <p class="text-xs mb-1" style="color:#6C7B8A">${new Date(s.creado_en).toLocaleDateString("es-MX")} — Motivo: ${escHtml(s.motivo)}</p>
            <button class="solRes px-3 py-1 rounded-lg text-xs font-bold" data-id="${s.id}" data-ok="1" style="background:#3F7A5E; color:#fff">Autorizar</button>
            <button class="solRes px-3 py-1 rounded-lg text-xs font-semibold" data-id="${s.id}" data-ok="0" style="background:#F5E4E1; color:#B5453A">Rechazar</button>
          </div>`;
        }).join("")}
        <div id="solMsg"></div>
      </div>`;
    caja.querySelectorAll(".solRes").forEach(b => b.addEventListener("click", async () => {
      const s = data.find(x => x.id === b.dataset.id);
      const autorizar = b.dataset.ok === "1";
      if (!confirm(autorizar ? "¿Autorizar al profesor a modificar estos criterios?" : "¿Rechazar la solicitud?")) return;
      const { error: e1 } = await sb.from("solicitudes_criterios").update({
        estado: autorizar ? "Autorizada" : "Rechazada", resuelto_por: state.perfil.id, resuelto_en: new Date().toISOString(),
      }).eq("id", s.id);
      if (e1) { document.getElementById("solMsg").innerHTML = errBox(escHtml(e1.message)); return; }
      if (autorizar) {
        const { error: e2 } = await sb.from("periodos_criterios").update({ estado: "Autorizado" })
          .eq("asignacion_id", s.asignacion_id).eq("periodo", s.periodo);
        if (e2) { document.getElementById("solMsg").innerHTML = errBox(escHtml(e2.message)); return; }
      }
      cargarSolicitudes();
    }));
  }

  async function cargarAsignaciones() {
    let query = sb.from("profesor_materias_grupos").select("id, profesor_id, grupo_id, ciclo_escolar_id, materias(nombre), grupos(letra, grados(nombre, nivel)), ciclos_escolares(nombre), perfiles(nombre_completo)");
    if (esProfesor) query = query.eq("profesor_id", state.perfil.id);
    const { data, error } = await query;
    const sel = document.getElementById("calAsigSel");
    if (error) { sel.innerHTML = `<option>Error al cargar</option>`; return; }
    // Filtramos cualquier fila con datos incompletos (ej. por permisos faltantes
    // en alguna tabla relacionada), para no tronar al construir la lista.
    const asignaciones = (data || []).filter(a => a.materias && a.grupos && a.grupos.grados && a.ciclos_escolares);
    if (asignaciones.length === 0) {
      sel.innerHTML = `<option value="">Sin clases asignadas</option>`;
      return;
    }
    sel.innerHTML = `<option value="">Selecciona…</option>` + asignaciones.map(a => `
      <option value="${a.id}">${a.materias.nombre} — ${a.grupos.grados.nombre} "${a.grupos.letra}" (${a.grupos.grados.nivel}) — ${a.ciclos_escolares.nombre}${!esProfesor ? " — " + (a.perfiles?.nombre_completo || "") : ""}</option>
    `).join("");
    sel.addEventListener("change", () => {
      const asignacion = asignaciones.find(a => a.id === sel.value);
      if (asignacion) cargarClase(asignacion); else document.getElementById("calContenido").innerHTML = "";
    });
  }

  async function cargarClase(asignacion) {
    const cont = document.getElementById("calContenido");
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;

    // Solo quien imparte la clase captura criterios y calificaciones; los demás roles solo consultan.
    const puedeEditar = asignacion.profesor_id === state.perfil.id;

    const [criteriosRes, alumnosRes] = await Promise.all([
      sb.from("criterios_evaluacion").select("*").eq("asignacion_id", asignacion.id).order("periodo").order("orden"),
      sb.from("inscripciones").select("alumno_id, alumnos(id, nombres, apellido_paterno, apellido_materno, matricula)").eq("grupo_id", asignacion.grupo_id).eq("ciclo_escolar_id", asignacion.ciclo_escolar_id).eq("estado", "Inscrito"),
    ]);

    if (criteriosRes.error) { cont.innerHTML = errBox(criteriosRes.error.message); return; }
    const [periodosRes, solRes] = await Promise.all([
      sb.from("periodos_criterios").select("periodo, estado").eq("asignacion_id", asignacion.id),
      sb.from("solicitudes_criterios").select("periodo").eq("asignacion_id", asignacion.id).eq("estado", "Pendiente"),
    ]);
    const estadosPeriodo = {};
    (periodosRes.data || []).forEach(p => { estadosPeriodo[p.periodo] = p.estado; });
    const solicitudesPend = new Set((solRes.data || []).map(r => r.periodo));
    const criterios = criteriosRes.data || [];
    const alumnos = (alumnosRes.data || []).map(i => i.alumnos).filter(Boolean).sort((a, b) => a.apellido_paterno.localeCompare(b.apellido_paterno));

    const idsCriterios = criterios.map(c => c.id);
    const valoresCache = {};
    if (idsCriterios.length > 0) {
      const { data: calsExistentes } = await sb.from("calificaciones").select("alumno_id, criterio_id, valor").in("criterio_id", idsCriterios);
      (calsExistentes || []).forEach(c => {
        valoresCache[c.alumno_id] = valoresCache[c.alumno_id] || {};
        valoresCache[c.alumno_id][c.criterio_id] = Number(c.valor);
      });
    }

    function obtenerValor(alumnoId, criterioId) {
      return valoresCache[alumnoId]?.[criterioId] ?? null;
    }
    function calcularFinal(alumnoId, criteriosPeriodo) {
      let total = 0;
      criteriosPeriodo.forEach(c => {
        const v = valoresCache[alumnoId]?.[c.id];
        if (v != null) total += v * (Number(c.ponderacion) / 100);
      });
      return total;
    }

    // Secundaria: 5 parciales. Preparatoria: 5 bimestres. (Se conservan periodos antiguos con otro nombre.)
    const nivelClase = asignacion.grupos?.grados?.nivel;
    const prefijoPeriodo = nivelClase === "Preparatoria" ? "Bimestre" : "Parcial";
    const periodos = [...new Set([
      ...[1, 2, 3, 4, 5].map(n => `${prefijoPeriodo} ${n}`),
      ...criterios.map(c => c.periodo),
    ])];
    let periodoActivo = periodos[0] || null;
    let guardandoCriterio = false;

    function pintar() {
      const criteriosPeriodo = criterios.filter(c => c.periodo === periodoActivo);
      const sumaPonderacion = criteriosPeriodo.reduce((s, c) => s + Number(c.ponderacion), 0);
      const confirmado = estadosPeriodo[periodoActivo] === "Confirmado";
      const puedeEditarCriterios = puedeEditar && !confirmado;
      const puedeCapturar = puedeEditar && confirmado;

      cont.innerHTML = `
        ${!puedeEditar ? `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#EEF2FB; color:#1E3A8A">Solo consulta: los criterios y las calificaciones los captura el profesor de la clase.${confirmado ? "" : " Los criterios de este periodo aún no están confirmados."}</div>` : ""}
        <div class="flex gap-1 mb-3 flex-wrap">
          ${periodos.map(p => `<button class="calPeriodoBtn px-3 py-1.5 rounded-lg text-xs font-semibold" data-p="${p}" style="background:${p === periodoActivo ? "#1E3A8A" : "#F4F1EB"}; color:${p === periodoActivo ? "#fff" : "#1E3A8A"}">${p}</button>`).join("")}
        </div>

        ${periodoActivo ? `
        <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          <div class="flex items-center justify-between mb-2">
            <p class="text-sm font-semibold" style="color:#1E3A8A">Criterios de ${periodoActivo}</p>
            <span class="text-xs font-semibold" style="color:${sumaPonderacion === 100 ? "#3F7A5E" : "#B5453A"}">Suma: ${sumaPonderacion}%</span>
          </div>
          ${criteriosPeriodo.map(c => `<div class="flex justify-between text-sm py-1" style="color:#1C2B3A"><span>${c.nombre}</span><span>${c.ponderacion}%${puedeEditarCriterios ? ` <button class="calDelCriterio ml-2 font-bold" data-id="${c.id}" style="color:#B5453A" title="Quitar">✕</button>` : ""}</span></div>`).join("") || `<p class="text-xs" style="color:#6C7B8A">Sin criterios aún.</p>`}
          ${puedeEditarCriterios ? `
          <div class="flex gap-2 mt-2">
            <input id="calCriterioNombre" placeholder="Nombre (ej. Examen)" class="flex-1 px-2 py-1.5 rounded-lg text-xs outline-none border" style="border-color:#E1DED5" />
            <input id="calCriterioPond" type="number" min="1" max="100" placeholder="%" class="w-16 px-2 py-1.5 rounded-lg text-xs outline-none border" style="border-color:#E1DED5" />
            <button id="calAgregarCriterioBtn" class="px-2 py-1.5 rounded-lg text-xs font-semibold" style="background:#1E3A8A; color:#fff">+</button>
          </div>
          <div id="calCriterioMsg" class="mt-1"></div>
          ${puedeEditar && criteriosPeriodo.length > 0 ? `
          <button id="calConfirmarBtn" class="mt-2 px-3 py-1.5 rounded-lg text-xs font-bold" style="background:#3F7A5E; color:#fff">Confirmar criterios</button>
          <p class="text-xs mt-1" style="color:#6C7B8A">Debes confirmar los criterios (suma 100%) para capturar calificaciones. Después solo se pueden cambiar con autorización de un supervisor.</p>` : ""}` : (puedeEditar ? `
          <div class="mt-2 p-2 rounded-lg text-xs" style="background:#F4F1EB; color:#1E3A8A">
            🔒 Criterios confirmados.
            ${solicitudesPend.has(periodoActivo) ? "Hay una solicitud de modificación pendiente de autorización." : `<button id="calSolicitarBtn" class="ml-1 px-2 py-1 rounded-lg font-semibold" style="background:#1E3A8A; color:#fff">Solicitar modificación</button>`}
          </div>
          <div id="calCriterioMsg" class="mt-1"></div>` : "")}
        </div>

        ${criteriosPeriodo.length > 0 && alumnos.length > 0 ? `
        <div class="p-4 rounded-xl bg-white border overflow-x-auto" style="border-color:#E1DED5">
          <div class="text-xs mb-3 p-2 rounded-lg" style="background:#EEF2FB; color:#1E3A8A">
            <strong>¿Cómo capturar?</strong> Escribe la calificación que obtuvo el alumno en cada criterio en <strong>escala de 0 a 10</strong>.
            El sistema aplica automáticamente el porcentaje de cada criterio y calcula la calificación final del periodo.
            Ejemplo: si en "Examen" (40%) el alumno sacó 8, aporta 3.2 puntos a la final.
          </div>
          <table class="text-sm w-full">
            <thead>
              <tr style="color:#6C7B8A">
                <th class="text-left pb-2">Alumno</th>
                ${criteriosPeriodo.map(c => `<th class="text-center pb-2 px-1">${c.nombre}<br><span class="text-xs font-normal">(${c.ponderacion}%)</span></th>`).join("")}
                <th class="text-center pb-2">Final</th>
              </tr>
            </thead>
            <tbody>
              ${alumnos.map(a => `
                <tr style="color:#1C2B3A">
                  <td class="py-1 pr-2">${a.nombres} ${a.apellido_paterno}</td>
                  ${criteriosPeriodo.map(c => `<td class="text-center py-1"><input type="number" inputmode="decimal" min="0" max="10" step="0.1" class="calValorInput w-14 px-1 py-1 rounded text-xs border text-center" data-alumno="${a.id}" data-criterio="${c.id}" value="${obtenerValor(a.id, c.id) ?? ""}" ${puedeCapturar ? "" : "disabled"} /></td>`).join("")}
                  <td class="text-center font-semibold" id="calFinal_${a.id}">${calcularFinal(a.id, criteriosPeriodo).toFixed(1)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
          ${puedeCapturar ? `<div id="calGuardarMsg" class="mt-2"></div><button id="calGuardarBtn" class="mt-3 px-4 py-2 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Guardar calificaciones</button>` : (puedeEditar ? `<p class="text-xs mt-2" style="color:#B5453A">Confirma los criterios de este periodo para poder capturar calificaciones.</p>` : "")}
        </div>` : criteriosPeriodo.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Agrega al menos un criterio para poder capturar calificaciones.</p>` : `<p class="text-sm" style="color:#6C7B8A">No hay alumnos inscritos en este grupo.</p>`}
        ` : `<p class="text-sm" style="color:#6C7B8A">${puedeEditar ? 'Crea un periodo para empezar (ej. "Parcial 1").' : "Aún no hay periodos capturados para esta clase."}</p>`}
      `;

      document.querySelectorAll(".calPeriodoBtn").forEach(b => b.addEventListener("click", () => { periodoActivo = b.dataset.p; pintar(); }));

      if (puedeEditar && periodoActivo) {
        const btnAgregar = document.getElementById("calAgregarCriterioBtn");
        if (btnAgregar) btnAgregar.addEventListener("click", async () => {
          const nombre = document.getElementById("calCriterioNombre").value.trim();
          const pond = Number(document.getElementById("calCriterioPond").value);
          const msg = document.getElementById("calCriterioMsg");
          msg.innerHTML = "";
          if (guardandoCriterio) return;
          if (!nombre || !pond || pond <= 0 || pond > 100) { msg.innerHTML = errBox("Escribe un nombre y un porcentaje válido (1-100)."); return; }
          if (criteriosPeriodo.some(c => c.nombre.trim().toLowerCase() === nombre.toLowerCase())) {
            msg.innerHTML = errBox(`Ya existe un criterio llamado "${escHtml(nombre)}" en este periodo.`); return;
          }
          if (sumaPonderacion + pond > 100) {
            msg.innerHTML = errBox(`No se puede agregar: la suma sería ${sumaPonderacion + pond}% y el máximo es 100%. Solo quedan ${100 - sumaPonderacion}% disponibles.`); return;
          }
          guardandoCriterio = true;
          btnAgregar.disabled = true;
          btnAgregar.style.opacity = "0.5";
          const { data, error } = await sb.from("criterios_evaluacion").insert({
            asignacion_id: asignacion.id, periodo: periodoActivo, nombre, ponderacion: pond, orden: criteriosPeriodo.length,
          }).select().single();
          guardandoCriterio = false;
          if (error) { btnAgregar.disabled = false; btnAgregar.style.opacity = "1"; msg.innerHTML = errBox(escHtml(error.message)); return; }
          criterios.push(data);
          pintar();
        });

        document.querySelectorAll(".calDelCriterio").forEach(b => b.addEventListener("click", async () => {
          if (!confirm("¿Quitar este criterio?")) return;
          const { error } = await sb.from("criterios_evaluacion").delete().eq("id", b.dataset.id);
          if (error) { document.getElementById("calCriterioMsg").innerHTML = errBox(error.message); return; }
          const i = criterios.findIndex(c => c.id === b.dataset.id);
          if (i >= 0) criterios.splice(i, 1);
          pintar();
        }));

        const btnSolicitar = document.getElementById("calSolicitarBtn");
        if (btnSolicitar) btnSolicitar.addEventListener("click", async () => {
          const motivo = prompt("Explica por qué necesitas modificar los criterios de " + periodoActivo + ":");
          if (!motivo || !motivo.trim()) return;
          const { error } = await sb.from("solicitudes_criterios").insert({ asignacion_id: asignacion.id, periodo: periodoActivo, motivo: motivo.trim() });
          if (error) { document.getElementById("calCriterioMsg").innerHTML = errBox(error.message); return; }
          solicitudesPend.add(periodoActivo);
          pintar();
        });

        const btnConfirmar = document.getElementById("calConfirmarBtn");
        if (btnConfirmar) btnConfirmar.addEventListener("click", async () => {
          const msg = document.getElementById("calCriterioMsg");
          if (sumaPonderacion !== 100) { msg.innerHTML = errBox("Los criterios deben sumar exactamente 100% para confirmarlos."); return; }
          if (!confirm(`¿Confirmar los criterios de ${periodoActivo}? Ya no podrás modificarlos sin autorización de un supervisor.`)) return;
          const { error } = await sb.from("periodos_criterios").upsert(
            { asignacion_id: asignacion.id, periodo: periodoActivo, estado: "Confirmado", confirmado_en: new Date().toISOString() },
            { onConflict: "asignacion_id,periodo" });
          if (error) { msg.innerHTML = errBox(error.message); return; }
          estadosPeriodo[periodoActivo] = "Confirmado";
          pintar();
        });

        const btnGuardar = document.getElementById("calGuardarBtn");
        if (btnGuardar) btnGuardar.addEventListener("click", async () => {
          const msg = document.getElementById("calGuardarMsg");
          msg.innerHTML = "";
          const inputs = document.querySelectorAll(".calValorInput");
          if ([...inputs].some(i => i.value !== "" && (Number(i.value) < 0 || Number(i.value) > 10))) {
            msg.innerHTML = errBox("Todas las calificaciones deben estar entre 0 y 10."); return;
          }
          const filas = [...inputs].filter(i => i.value !== "").map(i => ({
            criterio_id: i.dataset.criterio, alumno_id: i.dataset.alumno, valor: Number(i.value),
          }));
          if (filas.length === 0) { msg.innerHTML = errBox("No hay calificaciones para guardar."); return; }
          const { error } = await sb.from("calificaciones").upsert(filas, { onConflict: "criterio_id,alumno_id" });
          if (error) { msg.innerHTML = errBox(error.message); return; }
          msg.innerHTML = okBox("Calificaciones guardadas.");
        });

        document.querySelectorAll(".calValorInput").forEach(inp => inp.addEventListener("input", () => {
          if (inp.value !== "") {
            const n = Number(inp.value);
            if (n > 10) inp.value = "10";
            else if (n < 0) inp.value = "0";
          }
          const alumnoId = inp.dataset.alumno;
          valoresCache[alumnoId] = valoresCache[alumnoId] || {};
          valoresCache[alumnoId][inp.dataset.criterio] = Number(inp.value) || 0;
          const elFinal = document.getElementById(`calFinal_${alumnoId}`);
          if (elFinal) elFinal.textContent = calcularFinal(alumnoId, criteriosPeriodo).toFixed(1);
        }));
      }
    }

    pintar();
  }
}

const BITACORA_TABLAS = {

  grupos: "Grupos", grados: "Grados", ciclos_escolares: "Ciclos escolares", materias: "Materias",
  perfiles: "Usuarios/Personal", profesor_materias_grupos: "Asignaciones", criterios_evaluacion: "Criterios de evaluación",
  calificaciones: "Calificaciones", periodos_criterios: "Estado de criterios", solicitudes_criterios: "Solicitudes de criterios",
  asistencia_clase: "Asistencia de clase", registros_acceso: "Entradas y salidas", rostros: "Rostros registrados",
  datos_institucion: "Datos del instituto", categorias_mobiliario: "Categorías de mobiliario", mobiliario: "Mobiliario",
};
const BITACORA_OPS = { INSERT: "Alta", UPDATE: "Modificación", DELETE: "Baja" };

function renderBitacora(main) {
  const hoy = new Date();
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const hace7 = new Date(hoy.getTime() - 6 * 86400000);

  main.innerHTML = `
    <h2 class="text-lg font-bold mb-1" style="color:#1E3A8A">Bitácora</h2>
    <p class="text-xs mb-4" style="color:#6C7B8A">Registro de solo lectura de las altas, modificaciones y bajas hechas en el sistema. Nadie puede editarlo ni borrarlo.</p>
    <div class="max-w-4xl">
      <div class="p-3 rounded-xl bg-white border mb-3 flex flex-wrap gap-2 items-end" style="border-color:#E1DED5">
        <div><label class="block text-xs mb-1" style="color:#6C7B8A">Desde</label><input id="btDesde" type="date" value="${iso(hace7)}" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5" /></div>
        <div><label class="block text-xs mb-1" style="color:#6C7B8A">Hasta</label><input id="btHasta" type="date" value="${iso(hoy)}" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5" /></div>
        <div><label class="block text-xs mb-1" style="color:#6C7B8A">Módulo</label>
          <select id="btTabla" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5">
            <option value="">Todos</option>
            ${Object.entries(BITACORA_TABLAS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
          </select></div>
        <div><label class="block text-xs mb-1" style="color:#6C7B8A">Acción</label>
          <select id="btOp" class="px-2 py-1.5 rounded-lg text-sm border" style="border-color:#E1DED5">
            <option value="">Todas</option><option value="INSERT">Altas</option><option value="UPDATE">Modificaciones</option><option value="DELETE">Bajas</option>
          </select></div>
        <button id="btBuscar" class="px-3 py-1.5 rounded-lg text-sm font-bold" style="background:#1E3A8A; color:#fff">Consultar</button>
      </div>
      <div id="btResultado"></div>
    </div>`;

  document.getElementById("btBuscar").addEventListener("click", consultar);
  consultar();

  function resumenCambios(r) {
    const antes = r.datos_antes || {}, despues = r.datos_despues || {};
    if (r.operacion === "UPDATE") {
      const campos = Object.keys(despues).filter(k => JSON.stringify(antes[k]) !== JSON.stringify(despues[k]));
      return campos.map(k => `<div><strong>${escHtml(k)}:</strong> ${escHtml(JSON.stringify(antes[k]) ?? "∅")} → ${escHtml(JSON.stringify(despues[k]) ?? "∅")}</div>`).join("");
    }
    const datos = r.operacion === "INSERT" ? despues : antes;
    return Object.entries(datos).map(([k, v]) => `<div><strong>${escHtml(k)}:</strong> ${escHtml(typeof v === "object" ? JSON.stringify(v) : v)}</div>`).join("");
  }

  async function consultar() {
    const cont = document.getElementById("btResultado");
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Consultando…</p>`;
    const desde = document.getElementById("btDesde").value;
    const hasta = document.getElementById("btHasta").value;
    const tabla = document.getElementById("btTabla").value;
    const op = document.getElementById("btOp").value;

    let q = sb.from("bitacora").select("*").order("fecha", { ascending: false }).limit(300);
    if (desde) q = q.gte("fecha", new Date(desde + "T00:00:00").toISOString());
    if (hasta) q = q.lte("fecha", new Date(hasta + "T23:59:59").toISOString());
    if (tabla) q = q.eq("tabla", tabla);
    if (op) q = q.eq("operacion", op);
    const { data, error } = await q;
    if (error) { cont.innerHTML = errBox(escHtml(error.message)); return; }
    const filas = data || [];
    if (filas.length === 0) { cont.innerHTML = `<p class="text-sm" style="color:#6C7B8A">Sin movimientos en ese rango.</p>`; return; }

    cont.innerHTML = `
      <p class="text-xs mb-2" style="color:#6C7B8A">${filas.length} movimientos${filas.length === 300 ? " (se muestran los 300 más recientes; acota las fechas para ver otros)" : ""}</p>
      <div class="rounded-xl bg-white border overflow-x-auto" style="border-color:#E1DED5">
        <table class="text-xs w-full">
          <thead><tr style="color:#6C7B8A" class="text-left"><th class="p-2">Fecha y hora</th><th class="p-2">Usuario</th><th class="p-2">Acción</th><th class="p-2">Módulo</th><th class="p-2"></th></tr></thead>
          <tbody>
            ${filas.map((r, i) => `
              <tr style="color:#1C2B3A; border-top:1px solid #F0EDE5">
                <td class="p-2 whitespace-nowrap">${new Date(r.fecha).toLocaleString("es-MX", { dateStyle: "short", timeStyle: "medium" })}</td>
                <td class="p-2">${escHtml(r.usuario_nombre || "Sistema")} <span style="color:#6C7B8A">${escHtml(r.usuario_rol || "")}</span></td>
                <td class="p-2">${BITACORA_OPS[r.operacion] || r.operacion}</td>
                <td class="p-2">${escHtml(BITACORA_TABLAS[r.tabla] || r.tabla)}</td>
                <td class="p-2"><button class="btDetalle font-semibold" data-i="${i}" style="color:#1E3A8A">Ver detalle</button></td>
              </tr>
              <tr id="btDet_${i}" style="display:none; background:#FAF8F3"><td colspan="5" class="p-2" style="color:#1C2B3A; word-break:break-word">${resumenCambios(r)}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>`;
    cont.querySelectorAll(".btDetalle").forEach(b => b.addEventListener("click", () => {
      const fila = document.getElementById("btDet_" + b.dataset.i);
      fila.style.display = fila.style.display === "none" ? "" : "none";
    }));
  }
}
